name: RDP + Tailscale + RustDesk + Telegram Persistent Storage (A)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key"
        required: true
      ts_authkey:
        description: "Tailscale Auth key"
        required: true
      quick_test:
        description: "Run 5-minute test"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime (max 360; default 355)"
        required: false
        default: "355"
      do_purge:
        description: "Purge bullet* devices at start"
        required: false
        default: "true"
      cycles:
        description: "0=stop after A; N=handoffs left"
        required: false
        default: "0"
      rdp_count:
        description: "How many RDP instances (1-10)"
        required: false
        default: "1"
      crd_code:
        description: "Chrome Remote Desktop code"
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6-12 digits)"
        required: false
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  # ============================================================
  # TELEGRAM STORAGE + METADATA TEST
  # ============================================================
  telegram-test:
    runs-on: ubuntu-latest

    steps:

      - name: Install Telethon
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install telethon

      - name: Create test file
        shell: bash
        run: |
          echo "Persistent-RDP test $(date -u)" > TEST.txt

          echo "Original file:"
          cat TEST.txt

          echo "Original SHA256:"
          sha256sum TEST.txt

      - name: Upload + metadata + download + verify
        shell: bash
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import hashlib
          import json
          from datetime import datetime, timezone
          from telethon import TelegramClient

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          session_b64 = os.environ["SESSION_B64"]

          # Restore Telegram session
          with open("unlim_session.session", "wb") as f:
              f.write(base64.b64decode(session_b64))

          client = TelegramClient(
              "unlim_session",
              api_id,
              api_hash
          )

          def sha256(path):
              h = hashlib.sha256()

              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)

                      if not chunk:
                          break

                      h.update(chunk)

              return h.hexdigest()

          async def main():

              await client.start()

              print("TELEGRAM CONNECTED")

              original_file = "TEST.txt"
              downloaded_file = "TEST_DOWNLOADED.txt"

              # ------------------------------------------------
              # ORIGINAL FILE INFORMATION
              # ------------------------------------------------
              original_size = os.path.getsize(original_file)
              original_hash = sha256(original_file)

              print(f"ORIGINAL_NAME={original_file}")
              print(f"ORIGINAL_SIZE={original_size}")
              print(f"ORIGINAL_SHA256={original_hash}")

              # ------------------------------------------------
              # UPLOAD
              # ------------------------------------------------
              message = await client.send_file(
                  "me",
                  original_file,
                  caption="Persistent-RDP TEST"
              )

              message_id = message.id

              print("UPLOAD SUCCESS")
              print(f"MESSAGE_ID={message_id}")

              # ------------------------------------------------
              # CREATE METADATA
              # ------------------------------------------------
              metadata = {
                  "name": original_file,
                  "size": original_size,
                  "sha256": original_hash,
                  "telegram": {
                      "chat": "me",
                      "message_id": message_id
                  },
                  "created_at": datetime.now(
                      timezone.utc
                  ).isoformat()
              }

              with open(
                  "metadata.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      metadata,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              print("METADATA CREATED")
              print(
                  json.dumps(
                      metadata,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              # ------------------------------------------------
              # READ METADATA BACK
              # ------------------------------------------------
              with open(
                  "metadata.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  loaded_metadata = json.load(f)

              if loaded_metadata["telegram"]["message_id"] != message_id:
                  print("METADATA TEST FAILED")
                  raise SystemExit(1)

              print("METADATA READ SUCCESS")

              # ------------------------------------------------
              # FIND MESSAGE USING MESSAGE ID
              # ------------------------------------------------
              stored_message = await client.get_messages(
                  "me",
                  ids=message_id
              )

              if not stored_message:
                  print("MESSAGE LOOKUP FAILED")
                  raise SystemExit(1)

              print("MESSAGE LOOKUP SUCCESS")

              # ------------------------------------------------
              # DOWNLOAD
              # ------------------------------------------------
              await client.download_media(
                  stored_message,
                  file=downloaded_file
              )

              print("DOWNLOAD SUCCESS")

              # ------------------------------------------------
              # VERIFY DOWNLOADED FILE
              # ------------------------------------------------
              downloaded_size = os.path.getsize(
                  downloaded_file
              )

              downloaded_hash = sha256(
                  downloaded_file
              )

              print(
                  f"DOWNLOADED_SIZE={downloaded_size}"
              )

              print(
                  f"DOWNLOADED_SHA256={downloaded_hash}"
              )

              # ------------------------------------------------
              # FINAL VERIFICATION
              # ------------------------------------------------
              if original_size != downloaded_size:
                  print("SIZE VERIFICATION FAILED")
                  raise SystemExit(1)

              if original_hash != downloaded_hash:
                  print("SHA256 VERIFICATION FAILED")
                  raise SystemExit(1)

              print("SIZE VERIFICATION SUCCESS")
              print("SHA256 VERIFICATION SUCCESS")
              print("PERSISTENT STORAGE TEST SUCCESS")

          with client:
              client.loop.run_until_complete(main())
          PY

      - name: Display metadata
        shell: bash
        run: |
          echo "=============================="
          echo "METADATA"
          echo "=============================="
          cat metadata.json

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-storage-metadata
          path: |
            metadata.json
            TEST.txt
            TEST_DOWNLOADED.txt

  # ============================================================
  # SETUP
  # ============================================================
  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:

      - id: mk
        shell: pwsh
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {

            $n = [int]"${{ inputs.rdp_count }}"

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{ id = $i }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          $multi = if ($n -gt 1) {
            '1'
          }
          else {
            '0'
          }

          "multi=$multi" |
            Out-File $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

  # ============================================================
  # WINDOWS RDP
  # ============================================================
  rdp:
    needs: setup
    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif1990

    steps:

      # --------------------------------------------------------
      # CRD FLAG
      # --------------------------------------------------------
      - name: Set CRD flag early
        shell: pwsh
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File -Append $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File -Append $env:GITHUB_ENV
          }

          Write-Host "CRD_ENABLED=$([int]($crd.Length -gt 0))"

      # --------------------------------------------------------
      # INSTALL CRD
      # --------------------------------------------------------
      - name: Install Chrome Remote Desktop Host
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |

          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            $exePath = "$env:TEMP\chromeremotedesktophost.exe"

            try {

              Invoke-WebRequest `
                -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath $exePath `
                -ArgumentList "/silent","/install" `
                -Wait

              Remove-Item $exePath -Force

            }
            catch {

              Write-Host "EXE installer failed."

              $msi = "$env:TEMP\chromeremotedesktophost.msi"

              Invoke-WebRequest `
                -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                -OutFile $msi `
                -ErrorAction Stop

              Start-Process `
                msiexec.exe `
                -ArgumentList "/i","`"$msi`"","/quiet","/norestart" `
                -Wait

              Remove-Item $msi -Force
            }
          }

      # --------------------------------------------------------
      # START CRD
      # --------------------------------------------------------
      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |

          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin = "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            Write-Error "crd_pin must be 6-12 digits."
            exit 1
          }

          $starter = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            Write-Error "remoting_start_host.exe not found."
            exit 1
          }

          $code = $null

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {

            $code = ([regex]::Match(
              $raw,
              '--code\s*=\s*"?([^"\s]+)'
            )).Groups[1].Value

          }
          elseif ($raw -match '^4\/') {

            $code = $raw

          }

          if (-not $code) {
            Write-Error "Could not detect CRD code."
            exit 1
          }

          $redir = "https://remotedesktop.google.com/_/oauthredirect"
          $name = $Env:COMPUTERNAME

          $args = @(
            "--code=""$code""",
            "--redirect-url=""$redir""",
            "--name=""$name""",
            "--pin=""$pin"""
          )

          Start-Process `
            -FilePath $starter `
            -ArgumentList $args

      # --------------------------------------------------------
      # HOSTNAME + RUNTIME
      # --------------------------------------------------------
      - name: Decide hostname + runtime
        shell: pwsh
        run: |

          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File -Append $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {

            if ("$v" -match '^\d+$') {
              [int]$v
            }
            else {
              [int]$d
            }
          }

          $runtime = IntOr(
            "${{ inputs.runtime_minutes }}",
            355
          )

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 355
          }

          if ($runtime -gt 360) {
            $runtime = 355
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File -Append $env:GITHUB_ENV

      # --------------------------------------------------------
      # PURGE TAILSCALE DEVICES
      # --------------------------------------------------------
      - name: Purge bullet devices
        if: ${{ needs.setup.outputs.multi == '0' }}
        shell: pwsh
        run: |

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (Yes("${{ inputs.do_purge }}")) {

            try {

              $auth = [Convert]::ToBase64String(
                [Text.Encoding]::ASCII.GetBytes(
                  "${{ inputs.ts_api_key }}:"
                )
              )

              $tn = [uri]::EscapeDataString(
                "${{ inputs.ts_tailnet }}"
              )

              $list = Invoke-RestMethod `
                -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                -Headers @{
                  Authorization = "Basic $auth"
                }

              foreach ($d in $list.devices) {

                if ($d.hostname -match '^bullet[0-9]*$') {

                  Invoke-RestMethod `
                    -Method Delete `
                    -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" `
                    -Headers @{
                      Authorization = "Basic $auth"
                    } `
                    -ErrorAction SilentlyContinue
                }
              }
            }
            catch {

              Write-Host "Purge warning: $($_.Exception.Message)"

            }
          }

      # --------------------------------------------------------
      # TAILSCALE
      # --------------------------------------------------------
      - name: Install + Up Tailscale
        shell: pwsh
        run: |

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {

            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $dst

            Start-Process `
              msiexec.exe `
              -ArgumentList "/i","`"$dst`"","/quiet","/norestart" `
              -Wait

            Remove-Item $dst -Force
          }

          & $ts logout | Out-Null

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=true `
            --accept-routes=true

          $ip4 = & $ts ip -4 |
            Select-Object -First 1

          "TAILSCALE_IP=$ip4" |
            Out-File -Append $env:GITHUB_ENV

      # --------------------------------------------------------
      # RDP USER
      # --------------------------------------------------------
      - name: Enable RDP user + firewall
        shell: pwsh
        run: |

          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          $sec = ConvertTo-SecureString `
            $p `
            -AsPlainText `
            -Force

          if (-not (
            Get-LocalUser `
              -Name $u `
              -EA SilentlyContinue
          )) {

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

          }
          else {

            Set-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

            Enable-LocalUser -Name $u
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $u `
            -EA SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $u `
            -EA SilentlyContinue

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Out-Null

      # --------------------------------------------------------
      # PYTHON LIBRARIES
      # --------------------------------------------------------
      - name: Install Python libs
        shell: pwsh
        run: |

          python -m pip install --upgrade pip

          python -m pip install `
            --force-reinstall `
            pyautogui `
            pynput `
            pillow

      # --------------------------------------------------------
      # RUSTDESK
      # --------------------------------------------------------
      - name: Install RustDesk
        shell: pwsh
        run: |

          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rdExe)) {

            $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
            $installerPath = "$env:TEMP\rustdesk.msi"

            Invoke-WebRequest `
              -Uri $rdUrl `
              -OutFile $installerPath

            Start-Process `
              msiexec.exe `
              -ArgumentList "/i","`"$installerPath`"","/quiet","/norestart" `
              -Wait

            Remove-Item $installerPath -Force
          }

      # --------------------------------------------------------
      # RUSTDESK PORTS
      # --------------------------------------------------------
      - name: Open RustDesk ports
        shell: pwsh
        run: |

          for ($p = 21115; $p -le 21119; $p++) {

            $name = "APP-PORT-TCP-$p"

            netsh advfirewall firewall delete rule `
              name=$name 2>$null

            netsh advfirewall firewall add rule `
              name=$name `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$p
          }

      # --------------------------------------------------------
      # LAUNCH RUSTDESK
      # --------------------------------------------------------
      - name: Launch RustDesk
        shell: pwsh
        run: |

          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"

          Start-Process `
            -FilePath $rdExe `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

      # --------------------------------------------------------
      # KEEP ALIVE
      # --------------------------------------------------------
      - name: Keep alive
        shell: pwsh
        run: |

          $mins = [int]"${{ env.RUNTIME_MINUTES }}"
          $end = (Get-Date).AddMinutes($mins)

          while ((Get-Date) -lt $end) {

            Write-Host (
              "Heartbeat " +
              (Get-Date).ToString("HH:mm:ss")
            )

            Start-Sleep -Seconds 60
          }

      # --------------------------------------------------------
      # STOP / NEXT
      # --------------------------------------------------------
      - name: Dispatch next or stop
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          $cycles = [int]"${{ inputs.cycles }}"

          if ($cycles -gt 0) {

            $next = $cycles - 1

            Write-Host "Next cycle: $next"

          }
          else {

            Write-Host "No cycles configured. Done."

          }
