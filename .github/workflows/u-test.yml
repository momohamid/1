name: Persistent-RDP U Drive Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:

      - name: Install WinFSP
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress

      - name: Prepare test storage
        shell: pwsh
        run: |
          $root = "C:\Persistent-RDP-U"

          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path "$root\Test" -Force | Out-Null

          Set-Content `
            -Path "$root\Test\hello.txt" `
            -Value "Persistent-RDP U Drive Test" `
            -Encoding UTF8

          Write-Host "BACKING STORAGE READY:"
          Get-ChildItem $root -Recurse

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build WinFSP passthrough
        shell: pwsh
        run: |
          $src = "$env:RUNNER_TEMP\go-winfsp"
          $exe = "$env:RUNNER_TEMP\persistent-passthrough.exe"

          git clone --depth 1 `
            https://github.com/winfsp/go-winfsp.git `
            $src

          Set-Location $src

          go build `
            -o $exe `
            ./examples/passthrough/cmd/main.go

          if (-not (Test-Path $exe)) {
            throw "PASSTHROUGH BUILD FAILED"
          }

          Write-Host "PASSTHROUGH READY"

      - name: Mount U drive
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\persistent-passthrough.exe"
          $root = "C:\Persistent-RDP-U"

          Start-Process `
            -FilePath $exe `
            -ArgumentList @(
              "-m",
              "U:",
              $root
            ) `
            -WindowStyle Hidden

          Start-Sleep -Seconds 10

          Write-Host "===== PS DRIVES ====="
          Get-PSDrive

          Write-Host "===== U DRIVE ====="

          if (-not (Test-Path "U:\")) {
            throw "U: DRIVE DID NOT APPEAR"
          }

          Get-ChildItem "U:\" -Force

          Write-Host ""
          Write-Host "================================"
          Write-Host "U DRIVE APPEARED SUCCESSFULLY"
          Write-Host "================================"

      - name: Test write
        shell: pwsh
        run: |
          Set-Content `
            -Path "U:\Test\from-u-drive.txt" `
            -Value "WRITE FROM U DRIVE SUCCESS" `
            -Encoding UTF8

          if (-not (Test-Path "U:\Test\from-u-drive.txt")) {
            throw "U DRIVE WRITE FAILED"
          }

          Write-Host "U DRIVE WRITE SUCCESS"

          Get-ChildItem "U:\Test" -Force
