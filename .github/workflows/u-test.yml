name: Persistent-RDP U Drive Cross-Step Test

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:

  persistent-u-test:

    runs-on: windows-latest

    timeout-minutes: 20

    steps:

      - name: Install WinFSP
        run: |
          Write-Host "===== INSTALL WINFSP ====="

          $installed = Get-ItemProperty `
            "HKLM:\SOFTWARE\WOW6432Node\WinFsp" `
            -ErrorAction SilentlyContinue

          if (-not $installed) {
            choco install winfsp -y --no-progress
          }

          $paths = @(
            "$env:ProgramFiles\WinFsp\bin\winfsp-x64.dll",
            "${env:ProgramFiles(x86)}\WinFsp\bin\winfsp-x64.dll"
          )

          $found = $false

          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "WinFSP FOUND: $p"
              $found = $true
            }
          }

          if (-not $found) {
            throw "WinFSP was not found."
          }

          Write-Host "WINFSP INSTALL SUCCESS"


      - name: Prepare Go and Build Filesystem
        run: |
          Write-Host "===== GO ====="
          go version

          $src = "$env:RUNNER_TEMP\go-winfsp"
          $exe = "$env:RUNNER_TEMP\persistent-passthrough.exe"

          if (Test-Path $src) {
            Remove-Item $src -Recurse -Force
          }

          git clone `
            --depth 1 `
            https://github.com/winfsp/go-winfsp.git `
            $src

          if (-not (Test-Path $src)) {
            throw "go-winfsp source was not downloaded."
          }

          Set-Location $src

          Write-Host "===== BUILD ====="

          go build `
            -o $exe `
            ./examples/passthrough/cmd/main.go

          if (-not (Test-Path $exe)) {
            throw "persistent-passthrough.exe was not created."
          }

          Write-Host "FILESYSTEM BUILD SUCCESS"


      - name: Create Persistent Backing Storage
        run: |
          $root = "$env:RUNNER_TEMP\persistent_u_storage"

          if (Test-Path $root) {
            Remove-Item `
              $root `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Write-Host "BACKING STORAGE: $root"

          if (-not (Test-Path $root)) {
            throw "Backing storage was not created."
          }

          Write-Host "BACKING STORAGE SUCCESS"


      - name: Mount U Drive and Leave It Running
        run: |
          $exe = "$env:RUNNER_TEMP\persistent-passthrough.exe"
          $root = "$env:RUNNER_TEMP\persistent_u_storage"

          Write-Host "===== MOUNT INFORMATION ====="
          Write-Host "EXE: $exe"
          Write-Host "EXISTS: $(Test-Path $exe)"
          Write-Host "BACKING: $root"

          if (-not (Test-Path $exe)) {
            throw "persistent-passthrough.exe not found."
          }

          if (-not (Test-Path $root)) {
            throw "Backing storage not found."
          }

          Write-Host "===== START FILESYSTEM ====="

          $stdout = "$env:RUNNER_TEMP\persistent_u_stdout.log"
          $stderr = "$env:RUNNER_TEMP\persistent_u_stderr.log"

          Remove-Item `
            $stdout,
            $stderr `
            -Force `
            -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList @(
              "-m",
              "U:",
              $root
            ) `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru `
            -WindowStyle Hidden

          Write-Host "PROCESS ID: $($process.Id)"

          $mounted = $false

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 1

            if ($process.HasExited) {

              Write-Host "===== STDOUT ====="

              if (Test-Path $stdout) {
                Get-Content $stdout
              }

              Write-Host "===== STDERR ====="

              if (Test-Path $stderr) {
                Get-Content $stderr
              }

              throw "Filesystem process exited before U: mounted."
            }

            if (Test-Path "U:\") {
              $mounted = $true
              break
            }
          }

          if (-not $mounted) {
            throw "U: was not mounted."
          }

          Write-Host "===== U DRIVE ====="

          Get-PSDrive U -ErrorAction SilentlyContinue

          Write-Host "U DRIVE MOUNT SUCCESS"

          Write-Host "===== WRITE TEST ====="

          New-Item `
            -ItemType Directory `
            -Path "U:\Test" `
            -Force | Out-Null

          $content = "Persistent-RDP Cross-Step Test"

          Set-Content `
            -Path "U:\Test\cross-step.txt" `
            -Value $content `
            -Encoding UTF8

          if (-not (Test-Path "U:\Test\cross-step.txt")) {
            throw "Cross-step test file was not created."
          }

          Write-Host "WRITE SUCCESS"

          Write-Host "===== PROCESS ====="
          Write-Host "FILESYSTEM PROCESS ID: $($process.Id)"
          Write-Host "FILESYSTEM PROCESS STILL RUNNING: $(-not $process.HasExited)"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "U DRIVE MOUNTED"
          Write-Host "FILESYSTEM LEFT RUNNING"
          Write-Host "READY FOR CROSS-STEP TEST"
          Write-Host "=============================================="


      - name: Cross-Step U Drive Read Test
        run: |
          Write-Host "===== CROSS-STEP TEST ====="

          Write-Host "Testing U:\ from a completely new PowerShell step."

          if (-not (Test-Path "U:\")) {
            throw "U: is not visible in the new workflow step."
          }

          Write-Host "U DRIVE VISIBLE IN NEW STEP"

          $file = "U:\Test\cross-step.txt"

          if (-not (Test-Path $file)) {
            throw "cross-step.txt is not visible from the new step."
          }

          $content = Get-Content `
            -Path $file `
            -Raw

          Write-Host "CONTENT:"
          Write-Host $content

          if ($content.Trim() -ne "Persistent-RDP Cross-Step Test") {
            throw "Cross-step content mismatch."
          }

          Write-Host "CROSS-STEP READ SUCCESS"

          $hash = (
            Get-FileHash `
              -Path $file `
              -Algorithm SHA256
          ).Hash

          Write-Host "CROSS-STEP SHA256: $hash"

          if ($hash.Length -ne 64) {
            throw "Invalid SHA256."
          }

          Write-Host "CROSS-STEP SHA256 SUCCESS"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "CROSS-STEP U DRIVE TEST SUCCESS"
          Write-Host "U DRIVE VISIBLE"
          Write-Host "FILE VISIBLE"
          Write-Host "READ SUCCESS"
          Write-Host "SHA256 SUCCESS"
          Write-Host "=============================================="


      - name: Final Backing Storage Verification
        run: |
          $root = "$env:RUNNER_TEMP\persistent_u_storage"
          $file = "$root\Test\cross-step.txt"

          Write-Host "===== FINAL BACKING STORAGE ====="

          if (-not (Test-Path $root)) {
            throw "Backing storage disappeared."
          }

          if (-not (Test-Path $file)) {
            throw "Backing file disappeared."
          }

          Write-Host "BACKING STORAGE EXISTS"
          Write-Host "BACKING FILE EXISTS"

          Write-Host "CONTENT:"
          Get-Content $file

          Write-Host "SHA256:"

          (
            Get-FileHash `
              -Path $file `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "FINAL U DRIVE TEST SUCCESS"
          Write-Host "BACKING STORAGE SUCCESS"
          Write-Host "=============================================="
