name: U Drive Filesystem Test

"on":
  workflow_dispatch:

jobs:
  u-test:
    runs-on: windows-latest

    steps:
      - name: Install WinFsp
        shell: pwsh
        run: |
          $msi = "$env:TEMP\winfsp.msi"
          $url = "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $msi `
            -ErrorAction Stop

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i","`"$msi`"","/quiet","/norestart" `
            -Wait

          Remove-Item $msi -Force

      - name: Verify WinFsp
        shell: pwsh
        run: |
          $paths = @(
            "C:\Program Files (x86)\WinFsp",
            "C:\Program Files\WinFsp"
          )

          $found = $false

          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "FOUND: $p"
              $found = $true
            }
          }

          if (-not $found) {
            throw "WinFsp was not installed."
          }

          Write-Host "WINFSP INSTALLATION SUCCESS"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download go-winfsp
        shell: pwsh
        run: |
          git clone `
            --depth 1 `
            https://github.com/winfsp/go-winfsp.git `
            "$env:RUNNER_TEMP\go-winfsp"

      - name: Build filesystem
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\go-winfsp"

          Write-Host "===== GO VERSION ====="
          go version

          Write-Host "===== BUILD ====="

          go build `
            -o "$env:RUNNER_TEMP\persistent-passthrough.exe" `
            ./examples/passthrough/cmd/main.go

          if (-not (Test-Path "$env:RUNNER_TEMP\persistent-passthrough.exe")) {
            throw "Filesystem build failed."
          }

          Write-Host "FILESYSTEM BUILD SUCCESS"

      - name: Prepare backing storage
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\persistent_u_storage"

          New-Item `
            -ItemType Directory `
            -Path "$root\Test" `
            -Force | Out-Null

          "Persistent-RDP U Drive Test" |
            Set-Content `
              "$root\Test\source.txt" `
              -Encoding UTF8

          "U_BACKING_ROOT=$root" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "BACKING STORAGE: $root"

      - name: Inspect filesystem executable
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\persistent-passthrough.exe"

          Write-Host "===== EXECUTABLE ====="
          Write-Host "PATH: $exe"
          Write-Host "EXISTS: $(Test-Path $exe)"

          Write-Host "===== HELP ====="

          & $exe --help 2>&1 |
            Tee-Object "$env:RUNNER_TEMP\help.log"

          Write-Host "===== HELP LOG ====="

          Get-Content `
            "$env:RUNNER_TEMP\help.log" `
            -ErrorAction SilentlyContinue

      - name: Mount U drive diagnostic
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\persistent-passthrough.exe"

          Write-Host "===== MOUNT INFORMATION ====="
          Write-Host "EXE: $exe"
          Write-Host "EXISTS: $(Test-Path $exe)"
          Write-Host "BACKING: $env:U_BACKING_ROOT"

          Write-Host "===== START FILESYSTEM ====="

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList @(
              "-m",
              "U:",
              "$env:U_BACKING_ROOT"
            ) `
            -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\mount.stdout.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\mount.stderr.log"

          Start-Sleep -Seconds 8

          Write-Host "PROCESS ID: $($process.Id)"

          if ($process.HasExited) {
            Write-Host "PROCESS EXITED: YES"
            Write-Host "EXIT CODE: $($process.ExitCode)"
          }
          else {
            Write-Host "PROCESS EXITED: NO"
            Write-Host "PROCESS IS STILL RUNNING"
          }

          Write-Host ""
          Write-Host "===== STDOUT ====="

          Get-Content `
            "$env:RUNNER_TEMP\mount.stdout.log" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "===== STDERR ====="

          Get-Content `
            "$env:RUNNER_TEMP\mount.stderr.log" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "===== U DRIVE CHECK ====="

          Get-PSDrive U `
            -ErrorAction SilentlyContinue

          Get-Volume `
            -DriveLetter U `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "===== ROOT CHECK ====="

          Test-Path "U:\" -ErrorAction SilentlyContinue

          if (-not (Test-Path "U:\")) {
            Write-Host ""
            Write-Host "U: WAS NOT MOUNTED."
            Write-Host "Diagnostic information collected above."

            if ($process.HasExited) {
              throw "Filesystem process exited with code $($process.ExitCode)."
            }

            throw "Filesystem process is running but U: is not visible."
          }

          Write-Host "U DRIVE MOUNT SUCCESS"

      - name: Test read and write
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path "U:\Test" `
            -Force | Out-Null

          $content = "Hello from Persistent-RDP $(Get-Date -Format o)"

          [IO.File]::WriteAllText(
            "U:\Test\hello.txt",
            $content,
            [Text.Encoding]::UTF8
          )

          $readBack = [IO.File]::ReadAllText(
            "U:\Test\hello.txt",
            [Text.Encoding]::UTF8
          )

          if ($readBack -ne $content) {
            throw "READ/WRITE CONTENT MISMATCH"
          }

          Write-Host "U READ SUCCESS"
          Write-Host "U WRITE SUCCESS"

      - name: SHA256 verification
        shell: pwsh
        run: |
          $hash = (
            Get-FileHash `
              "U:\Test\hello.txt" `
              -Algorithm SHA256
          ).Hash

          if ($hash.Length -ne 64) {
            throw "Invalid SHA256."
          }

          Write-Host "SHA256=$hash"
          Write-Host "SHA256 SUCCESS"

      - name: Verify backing storage
        shell: pwsh
        run: |
          $path = "$env:U_BACKING_ROOT\Test\hello.txt"

          if (-not (Test-Path $path)) {
            throw "Backing storage did not receive hello.txt"
          }

          $hash2 = (
            Get-FileHash `
              $path `
              -Algorithm SHA256
          ).Hash

          Write-Host "BACKING_SHA256=$hash2"
          Write-Host "BACKING STORAGE SUCCESS"

      - name: Final
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "U DRIVE FILESYSTEM TEST SUCCESS"
          Write-Host "READ/WRITE SUCCESS"
          Write-Host "SHA256 SUCCESS"
          Write-Host "BACKING STORAGE SUCCESS"
          Write-Host "======================================"
