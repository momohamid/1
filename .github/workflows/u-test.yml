name: Persistent-RDP U Drive Test

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:

  persistent-u-test:

    runs-on: windows-latest

    timeout-minutes: 20

    steps:

      - name: Install WinFSP
        shell: pwsh
        run: |
          Write-Host "===== INSTALL WINFSP ====="

          $installed = Get-ItemProperty `
            "HKLM:\SOFTWARE\WOW6432Node\WinFsp" `
            -ErrorAction SilentlyContinue

          if (-not $installed) {
            choco install winfsp -y --no-progress
          }

          $winfspPaths = @(
            "$env:ProgramFiles\WinFsp\bin\winfsp-x64.dll",
            "${env:ProgramFiles(x86)}\WinFsp\bin\winfsp-x64.dll"
          )

          $found = $false

          foreach ($p in $winfspPaths) {
            if (Test-Path $p) {
              Write-Host "WinFSP FOUND: $p"
              $found = $true
            }
          }

          if (-not $found) {
            throw "WinFSP was not found."
          }

          Write-Host "WINFSP INSTALL SUCCESS"


      - name: Prepare Go
        shell: pwsh
        run: |
          Write-Host "===== GO ====="
          go version

          if ($LASTEXITCODE -ne 0) {
            throw "Go is not available."
          }

          Write-Host "GO AVAILABLE"


      - name: Download go-winfsp
        shell: pwsh
        run: |
          $src = "$env:RUNNER_TEMP\go-winfsp"

          if (Test-Path $src) {
            Remove-Item `
              $src `
              -Recurse `
              -Force
          }

          git clone `
            --depth 1 `
            https://github.com/winfsp/go-winfsp.git `
            $src

          if (-not (Test-Path $src)) {
            throw "go-winfsp source was not downloaded."
          }

          Write-Host "SOURCE: $src"
          Write-Host "GO-WINFSP DOWNLOAD SUCCESS"


      - name: Build persistent-passthrough.exe
        shell: pwsh
        run: |
          $src = "$env:RUNNER_TEMP\go-winfsp"
          $exe = "$env:RUNNER_TEMP\persistent-passthrough.exe"

          Set-Location $src

          Write-Host "===== GO VERSION ====="
          go version

          Write-Host "===== BUILD ====="

          go build `
            -o $exe `
            ./examples/passthrough/cmd/main.go

          if (-not (Test-Path $exe)) {
            throw "persistent-passthrough.exe was not created."
          }

          Write-Host "===== EXECUTABLE ====="
          Write-Host "PATH: $exe"
          Write-Host "EXISTS: True"

          Write-Host "FILESYSTEM BUILD SUCCESS"


      - name: Create backing storage
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\persistent_u_storage"

          if (Test-Path $root) {
            Remove-Item `
              $root `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Write-Host "BACKING STORAGE: $root"

          if (-not (Test-Path $root)) {
            throw "Backing storage was not created."
          }

          Write-Host "BACKING STORAGE SUCCESS"


      - name: Mount U and test persistence
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\persistent-passthrough.exe"
          $root = "$env:RUNNER_TEMP\persistent_u_storage"

          Write-Host "===== MOUNT INFORMATION ====="
          Write-Host "EXE: $exe"
          Write-Host "EXISTS: $(Test-Path $exe)"
          Write-Host "BACKING: $root"

          if (-not (Test-Path $exe)) {
            throw "persistent-passthrough.exe not found."
          }

          if (-not (Test-Path $root)) {
            throw "Backing storage not found."
          }

          # --------------------------------------------------------
          # CLEAN POSSIBLE OLD MAPPING
          # --------------------------------------------------------

          try {
            subst U: /D 2>$null
          }
          catch {
          }

          try {
            net use U: /delete /y 2>$null
          }
          catch {
          }

          # --------------------------------------------------------
          # START FILESYSTEM
          # --------------------------------------------------------

          Write-Host "===== START FILESYSTEM ====="

          $stdout = "$env:RUNNER_TEMP\persistent_u_stdout.log"
          $stderr = "$env:RUNNER_TEMP\persistent_u_stderr.log"

          Remove-Item `
            $stdout,
            $stderr `
            -Force `
            -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList @(
              "-m",
              "U:",
              $root
            ) `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru `
            -WindowStyle Hidden

          Write-Host "PROCESS ID: $($process.Id)"

          # --------------------------------------------------------
          # WAIT FOR U:
          # --------------------------------------------------------

          $mounted = $false

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 1

            if ($process.HasExited) {

              Write-Host "PROCESS EXITED: YES"
              Write-Host "EXIT CODE: $($process.ExitCode)"

              if (Test-Path $stdout) {
                Write-Host "===== STDOUT ====="
                Get-Content $stdout
              }

              if (Test-Path $stderr) {
                Write-Host "===== STDERR ====="
                Get-Content $stderr
              }

              throw "Filesystem process exited before U: mounted."
            }

            try {
              $drive = Get-PSDrive U -ErrorAction Stop

              if ($drive.Root -eq "U:\") {
                $mounted = $true
                break
              }
            }
            catch {
            }
          }

          if (-not $mounted) {

            Write-Host "===== STDOUT ====="

            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            Write-Host "===== STDERR ====="

            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            throw "U: was not mounted."
          }

          Write-Host "===== U DRIVE ====="
          Get-PSDrive U

          Write-Host "U DRIVE MOUNT SUCCESS"

          # --------------------------------------------------------
          # WRITE
          # --------------------------------------------------------

          Write-Host "===== WRITE TEST ====="

          New-Item `
            -ItemType Directory `
            -Path "U:\Test" `
            -Force | Out-Null

          $testFile = "U:\Test\hello.txt"

          $content = "Persistent-RDP U Drive Test $(Get-Date -Format o)"

          Set-Content `
            -Path $testFile `
            -Value $content `
            -Encoding UTF8

          if (-not (Test-Path $testFile)) {
            throw "Test file was not created."
          }

          Write-Host "WRITE SUCCESS"

          # --------------------------------------------------------
          # READ
          # --------------------------------------------------------

          Write-Host "===== READ TEST ====="

          $readContent = Get-Content `
            -Path $testFile `
            -Raw

          if ($readContent.Trim() -ne $content.Trim()) {
            throw "Read content does not match written content."
          }

          Write-Host "READ SUCCESS"

          # --------------------------------------------------------
          # SHA256
          # --------------------------------------------------------

          Write-Host "===== SHA256 TEST ====="

          $hash1 = (
            Get-FileHash `
              -Path $testFile `
              -Algorithm SHA256
          ).Hash

          Write-Host "HASH BEFORE RESTART: $hash1"

          if ($hash1.Length -ne 64) {
            throw "Invalid SHA256."
          }

          Write-Host "SHA256 SUCCESS"

          # --------------------------------------------------------
          # STOP FIRST FILESYSTEM
          # --------------------------------------------------------

          Write-Host "===== STOP FILESYSTEM ====="

          Stop-Process `
            -Id $process.Id `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          Write-Host "FILESYSTEM STOPPED"

          # --------------------------------------------------------
          # VERIFY BACKING STORAGE
          # --------------------------------------------------------

          $backingFile = "$root\Test\hello.txt"

          if (-not (Test-Path $backingFile)) {
            throw "Backing file does not exist after filesystem stop."
          }

          Write-Host "BACKING FILE STILL EXISTS"

          # --------------------------------------------------------
          # REMOUNT
          # --------------------------------------------------------

          Write-Host "===== REMOUNT ====="

          $stdout2 = "$env:RUNNER_TEMP\persistent_u_stdout_2.log"
          $stderr2 = "$env:RUNNER_TEMP\persistent_u_stderr_2.log"

          Remove-Item `
            $stdout2,
            $stderr2 `
            -Force `
            -ErrorAction SilentlyContinue

          $process2 = Start-Process `
            -FilePath $exe `
            -ArgumentList @(
              "-m",
              "U:",
              $root
            ) `
            -RedirectStandardOutput $stdout2 `
            -RedirectStandardError $stderr2 `
            -PassThru `
            -WindowStyle Hidden

          $mounted2 = $false

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 1

            if ($process2.HasExited) {

              Write-Host "===== REMOUNT STDOUT ====="

              if (Test-Path $stdout2) {
                Get-Content $stdout2
              }

              Write-Host "===== REMOUNT STDERR ====="

              if (Test-Path $stderr2) {
                Get-Content $stderr2
              }

              throw "Filesystem exited during remount."
            }

            try {
              $drive2 = Get-PSDrive U -ErrorAction Stop

              if ($drive2.Root -eq "U:\") {
                $mounted2 = $true
                break
              }
            }
            catch {
            }
          }

          if (-not $mounted2) {
            throw "U: failed to remount."
          }

          Write-Host "U DRIVE REMOUNT SUCCESS"

          # --------------------------------------------------------
          # RESTORED FILE
          # --------------------------------------------------------

          Write-Host "===== RESTORED FILE TEST ====="

          if (-not (Test-Path "U:\Test\hello.txt")) {
            throw "hello.txt was not restored after remount."
          }

          $restoredContent = Get-Content `
            -Path "U:\Test\hello.txt" `
            -Raw

          if ($restoredContent.Trim() -ne $content.Trim()) {
            throw "Restored content does not match."
          }

          $hash2 = (
            Get-FileHash `
              -Path "U:\Test\hello.txt" `
              -Algorithm SHA256
          ).Hash

          Write-Host "HASH AFTER REMOUNT: $hash2"

          if ($hash1 -ne $hash2) {
            throw "SHA256 mismatch after remount."
          }

          Write-Host "RESTORED READ SUCCESS"
          Write-Host "RESTORED SHA256 SUCCESS"

          # --------------------------------------------------------
          # SUCCESS
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "U DRIVE TEST SUCCESS"
          Write-Host "MOUNT SUCCESS"
          Write-Host "WRITE SUCCESS"
          Write-Host "READ SUCCESS"
          Write-Host "SHA256 SUCCESS"
          Write-Host "STOP SUCCESS"
          Write-Host "REMOUNT SUCCESS"
          Write-Host "PERSISTENCE TEST SUCCESS"
          Write-Host "=============================================="

          # --------------------------------------------------------
          # SAFE CLEANUP
          # --------------------------------------------------------

          try {
            if ($process2 -and -not $process2.HasExited) {
              Stop-Process `
                -Id $process2.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }
          catch {
            Write-Host "Cleanup warning ignored."
          }

          Write-Host "CLEANUP COMPLETE"
          exit 0


      - name: Display backing storage
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\persistent_u_storage"

          Write-Host "===== FINAL BACKING STORAGE ====="

          Get-ChildItem `
            -Path $root `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "===== FINAL FILE ====="

          $file = "$root\Test\hello.txt"

          if (-not (Test-Path $file)) {
            throw "Final persistence file was not found."
          }

          Write-Host "FILE EXISTS: True"

          Write-Host "CONTENT:"
          Get-Content $file

          Write-Host "SHA256:"

          (
            Get-FileHash `
              -Path $file `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "FINAL BACKING STORAGE CHECK SUCCESS"
