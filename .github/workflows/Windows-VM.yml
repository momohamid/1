name: Windows 11 VM - WHPX TEST

on:
workflow_dispatch:

permissions:
contents: read

jobs:
whpx-test:
runs-on: windows-latest
timeout-minutes: 20

steps:

  - name: Show runner resources
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Write-Host "=== RUNNER RESOURCES ==="

      $computer = Get-CimInstance Win32_ComputerSystem

      Write-Host "Logical processors: $($computer.NumberOfLogicalProcessors)"
      Write-Host "RAM bytes: $($computer.TotalPhysicalMemory)"
      Write-Host "RAM GB: $([math]::Round($computer.TotalPhysicalMemory / 1GB, 2))"

      Write-Host ""
      Write-Host "=== DISKS ==="

      Get-PSDrive -PSProvider FileSystem |
        Format-Table Name, Used, Free

  - name: Check virtualization
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Write-Host "=== VIRTUALIZATION CHECK ==="

      Get-CimInstance Win32_Processor |
        Select-Object Name,
          NumberOfCores,
          NumberOfLogicalProcessors,
          VirtualizationFirmwareEnabled,
          VMMonitorModeExtensions |
        Format-List

  - name: Install QEMU
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Write-Host "=== INSTALLING QEMU ==="

      winget install `
        --id SoftwareFreedomConservancy.QEMU `
        --exact `
        --silent `
        --accept-package-agreements `
        --accept-source-agreements

      $qemu = Get-ChildItem `
        "C:\Program Files\qemu" `
        -Filter "qemu-system-x86_64.exe" `
        -Recurse `
        -ErrorAction SilentlyContinue |
        Select-Object -First 1

      if (-not $qemu) {
        throw "QEMU was not found after installation."
      }

      $qemu.Directory.FullName |
        Out-File `
          $env:GITHUB_PATH `
          -Append `
          -Encoding utf8

      Write-Host ""
      Write-Host "QEMU executable:"
      Write-Host $qemu.FullName

      Write-Host ""
      Write-Host "QEMU version:"
      & $qemu.FullName --version

  - name: Check QEMU accelerators
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Write-Host "=== QEMU ACCELERATOR CHECK ==="

      $accelerators = qemu-system-x86_64 -accel help 2>&1

      Write-Host $accelerators

      if ($accelerators -match "(?im)^\s*whpx\s*$") {
        Write-Host ""
        Write-Host "PASS: WHPX is supported by this QEMU binary."
      }
      else {
        Write-Host ""
        Write-Host "FAIL: WHPX is not reported by QEMU."
        exit 1
      }

  - name: Create temporary test disk
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Write-Host "=== TEMPORARY VM DISK TEST ==="

      $testDir = Join-Path $env:RUNNER_TEMP "whpx-vm-test"

      if (Test-Path $testDir) {
        Remove-Item `
          $testDir `
          -Recurse `
          -Force
      }

      New-Item `
        -ItemType Directory `
        -Path $testDir `
        -Force |
        Out-Null

      $disk = Join-Path $testDir "whpx-test.qcow2"

      Write-Host "Creating temporary QCOW2:"
      Write-Host $disk

      qemu-img create `
        -f qcow2 `
        $disk `
        2G

      if (-not (Test-Path $disk)) {
        throw "Temporary QCOW2 was not created."
      }

      Write-Host ""
      Write-Host "Temporary QCOW2 created successfully."

      qemu-img info $disk

      Write-Host ""
      Write-Host "IMPORTANT:"
      Write-Host "This is a temporary test disk."
      Write-Host "The real Windows.qcow2 on the phone is NOT being accessed."

  - name: Run actual WHPX VM test
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Write-Host "=== ACTUAL WHPX VM TEST ==="

      $testDir = Join-Path $env:RUNNER_TEMP "whpx-vm-test"
      $disk = Join-Path $testDir "whpx-test.qcow2"

      if (-not (Test-Path $disk)) {
        throw "Temporary test disk does not exist."
      }

      Write-Host ""
      Write-Host "Starting QEMU with WHPX..."
      Write-Host "No Windows ISO is used."
      Write-Host "No real Windows QCOW2 is used."
      Write-Host "No cloud storage is used."
      Write-Host "QEMU will be terminated automatically after a short test."

      $stdoutFile = Join-Path $testDir "qemu-stdout.log"
      $stderrFile = Join-Path $testDir "qemu-stderr.log"

      $qemuArgs = @(
        "-accel", "whpx",
        "-machine", "q35",
        "-cpu", "max",
        "-smp", "2",
        "-m", "2048",
        "-nodefaults",
        "-display", "none",
        "-monitor", "none",
        "-serial", "none",
        "-drive", "file=$disk,if=virtio,format=qcow2",
        "-no-reboot"
      )

      Write-Host ""
      Write-Host "QEMU command arguments:"
      $qemuArgs | ForEach-Object {
        Write-Host "  $_"
      }

      Write-Host ""
      Write-Host "Launching QEMU..."

      $process = Start-Process `
        -FilePath "qemu-system-x86_64.exe" `
        -ArgumentList $qemuArgs `
        -RedirectStandardOutput $stdoutFile `
        -RedirectStandardError $stderrFile `
        -PassThru

      Write-Host ""
      Write-Host "QEMU process started."
      Write-Host "PID: $($process.Id)"

      $testSeconds = 30

      Write-Host ""
      Write-Host "Allowing QEMU to run for $testSeconds seconds..."

      $finished = $process.WaitForExit($testSeconds * 1000)

      if ($finished) {
        Write-Host ""
        Write-Host "QEMU exited by itself."
        Write-Host "Exit code: $($process.ExitCode)"
      }
      else {
        Write-Host ""
        Write-Host "QEMU is still running after $testSeconds seconds."
        Write-Host "This is acceptable for this launch test."
        Write-Host "Terminating QEMU now..."

        try {
          Stop-Process `
            -Id $process.Id `
            -Force `
            -ErrorAction Stop

          Write-Host "QEMU process terminated successfully."
        }
        catch {
          Write-Host "QEMU process termination message:"
          Write-Host $_
        }

        Start-Sleep -Seconds 2

        if (-not $process.HasExited) {
          Write-Host "QEMU still appears to be running."
          taskkill /PID $process.Id /T /F 2>&1 |
            ForEach-Object { Write-Host $_ }
        }
      }

      Write-Host ""
      Write-Host "=== QEMU STDOUT ==="

      if (Test-Path $stdoutFile) {
        Get-Content `
          $stdoutFile `
          -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host $_ }
      }
      else {
        Write-Host "(No stdout log.)"
      }

      Write-Host ""
      Write-Host "=== QEMU STDERR ==="

      if (Test-Path $stderrFile) {
        Get-Content `
          $stderrFile `
          -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host $_ }
      }
      else {
        Write-Host "(No stderr log.)"
      }

      Write-Host ""
      Write-Host "=== WHPX LAUNCH RESULT ==="

      if ($finished) {
        if ($process.ExitCode -eq 0) {
          Write-Host "PASS: QEMU launched and exited normally using WHPX."
        }
        else {
          Write-Host "INFO: QEMU launched using WHPX but exited with code $($process.ExitCode)."
          Write-Host "The stderr output above is the important diagnostic information."
        }
      }
      else {
        Write-Host "PASS: QEMU remained running for the full $testSeconds-second WHPX launch test."
        Write-Host "The process was then terminated intentionally."
        Write-Host "This confirms that QEMU successfully remained active under WHPX."
      }

      Write-Host ""
      Write-Host "=== WHPX TEST FINISHED ==="

  - name: Inspect temporary VM disk
    if: always()
    shell: pwsh
    run: |
      Write-Host "=== TEMPORARY DISK INSPECTION ==="

      $disk = Join-Path `
        $env:RUNNER_TEMP `
        "whpx-vm-test\whpx-test.qcow2"

      if (Test-Path $disk) {
        Write-Host "Temporary QCOW2 exists:"
        Write-Host $disk

        qemu-img info $disk
      }
      else {
        Write-Host "Temporary QCOW2 was not found."
      }

      $stdoutFile = Join-Path `
        $env:RUNNER_TEMP `
        "whpx-vm-test\qemu-stdout.log"

      $stderrFile = Join-Path `
        $env:RUNNER_TEMP `
        "whpx-vm-test\qemu-stderr.log"

      Write-Host ""
      Write-Host "QEMU stdout log exists: $(Test-Path $stdoutFile)"
      Write-Host "QEMU stderr log exists: $(Test-Path $stderrFile)"

  - name: Cleanup temporary VM files
    if: always()
    shell: pwsh
    run: |
      Write-Host "=== CLEANUP ==="

      $testDir = Join-Path `
        $env:RUNNER_TEMP `
        "whpx-vm-test"

      if (Test-Path $testDir) {
        Remove-Item `
          $testDir `
          -Recurse `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "Temporary WHPX test files removed."
      }
      else {
        Write-Host "Nothing to clean."
      }

      Write-Host ""
      Write-Host "Real phone files were not modified."

  - name: Final result
    if: always()
    shell: pwsh
    run: |
      Write-Host ""
      Write-Host "=============================================="
      Write-Host "      WINDOWS 11 WHPX VM TEST COMPLETED"
      Write-Host "=============================================="
      Write-Host ""
      Write-Host "Tested:"
      Write-Host "1. Runner RAM and CPU"
      Write-Host "2. Hardware virtualization information"
      Write-Host "3. QEMU installation"
      Write-Host "4. QEMU WHPX support"
      Write-Host "5. Temporary QCOW2 creation"
      Write-Host "6. Actual QEMU WHPX launch"
      Write-Host "7. Automatic QEMU timeout/termination"
      Write-Host "8. QEMU stdout/stderr diagnostics"
      Write-Host ""
      Write-Host "IMPORTANT:"
      Write-Host "- The phone Windows.qcow2 was NOT accessed."
      Write-Host "- The phone Win11.iso was NOT accessed."
      Write-Host "- No cloud storage was used."
      Write-Host "- The temporary QCOW2 exists only inside this runner."
      Write-Host "- QEMU is automatically terminated after the short launch test."
      Write-Host ""
      Write-Host "Send the complete log from:"
      Write-Host "1. RUNNER RESOURCES"
      Write-Host "2. VIRTUALIZATION CHECK"
      Write-Host "3. QEMU ACCELERATOR CHECK"
      Write-Host "4. TEMPORARY VM DISK TEST"
      Write-Host "5. ACTUAL WHPX VM TEST"
      Write-Host "6. FINAL RESULT"
      Write-Host ""
      Write-Host "=============================================="
