name: Windows 11 VM - TEST

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:

      - name: Show runner resources
        shell: pwsh
        run: |
          Write-Host "=== RUNNER ==="
          Get-CimInstance Win32_ComputerSystem |
            Select-Object NumberOfLogicalProcessors, TotalPhysicalMemory |
            Format-List

          Write-Host "=== DISKS ==="
          Get-PSDrive -PSProvider FileSystem |
            Format-Table Name, Used, Free

      - name: Check virtualization
        shell: pwsh
        run: |
          Write-Host "=== VIRTUALIZATION CHECK ==="

          Get-CimInstance Win32_Processor |
            Select-Object Name,
              NumberOfCores,
              NumberOfLogicalProcessors,
              VirtualizationFirmwareEnabled,
              VMMonitorModeExtensions |
            Format-List

      - name: Install QEMU
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          winget install `
            --id SoftwareFreedomConservancy.QEMU `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          $qemu = Get-ChildItem `
            "C:\Program Files\qemu" `
            -Filter "qemu-system-x86_64.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $qemu) {
            throw "QEMU was not found."
          }

          $qemu.Directory.FullName |
            Out-File `
              $env:GITHUB_PATH `
              -Append `
              -Encoding utf8

          Write-Host "QEMU:"
          & $qemu.FullName --version

      - name: Check QEMU acceleration
        shell: pwsh
        run: |
          Write-Host "=== QEMU ACCELERATION TEST ==="

          qemu-system-x86_64 `
            -accel help

      - name: Check ISO and QCOW2 availability
        shell: pwsh
        run: |
          Write-Host "=== VM STORAGE TEST ==="

          Write-Host "The following paths are PHONE paths:"
          Write-Host "/storage/emulated/0/myemulator/Win11.iso"
          Write-Host "/storage/emulated/0/myemulator/Windows.qcow2"

          Write-Host ""
          Write-Host "IMPORTANT:"
          Write-Host "GitHub cannot access Android filesystem paths directly."
          Write-Host "The paths above are informational only."

          Write-Host ""
          Write-Host "The next stage requires the QCOW2 to be available to the runner."
          Write-Host "No cloud-storage dependency is assumed by this test."

      - name: Verify test environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== FINAL ENVIRONMENT CHECK ==="

          $qemu = Get-Command qemu-system-x86_64 -ErrorAction SilentlyContinue

          if (-not $qemu) {
            Write-Host "FAIL: QEMU executable is not available."
            exit 1
          }

          Write-Host "PASS: QEMU executable found:"
          Write-Host $qemu.Source

          $accel = qemu-system-x86_64 -accel help 2>&1

          Write-Host ""
          Write-Host "Available QEMU accelerators:"
          $accel

          if ($accel -match "(?im)^\s*whpx\s*$") {
            Write-Host ""
            Write-Host "PASS: WHPX accelerator is available."
          }
          else {
            Write-Host ""
            Write-Host "WARNING: WHPX accelerator was not reported."
            Write-Host "QEMU TCG may still be available."
          }

          Write-Host ""
          Write-Host "Runner environment check completed successfully."

      - name: Final result
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "WINDOWS 11 VM ENVIRONMENT TEST COMPLETED"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Verified:"
          Write-Host "1. Runner CPU and RAM"
          Write-Host "2. Runner disks"
          Write-Host "3. Hardware virtualization status"
          Write-Host "4. QEMU installation"
          Write-Host "5. QEMU acceleration support"
          Write-Host "6. VM storage path requirements"
          Write-Host ""
          Write-Host "IMPORTANT:"
          Write-Host "The Android QCOW2 was NOT modified."
          Write-Host "The Android ISO/QCOW2 paths are NOT directly accessible"
          Write-Host "from the GitHub-hosted Windows runner."
          Write-Host ""
          Write-Host "Send the complete log from this run."
          Write-Host "=========================================="
