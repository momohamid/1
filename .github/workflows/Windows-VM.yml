name: Windows 11 VM - WHPX + NBD + Tailscale + RustDesk + Automatic Setup

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet"
        required: true
        type: string
      ts_authkey:
        description: "Tailscale Auth key"
        required: true
        type: string
      ts_api_key:
        description: "Tailscale API key (optional)"
        required: false
        default: ""
        type: string
      phone_tailscale_ip:
        description: "Tailscale IPv4 address of the phone running the NBD server"
        required: true
        default: "100.93.194.9"
        type: string
      nbd_port:
        description: "NBD TCP port for Windows.qcow2"
        required: false
        default: "10809"
        type: string
      iso_nbd_port:
        description: "NBD TCP port for Win11.iso"
        required: false
        default: "10810"
        type: string
      nbd_export:
        description: "NBD export name for Windows.qcow2"
        required: false
        default: ""
        type: string
      iso_nbd_export:
        description: "NBD export name for Win11.iso"
        required: false
        default: ""
        type: string
      rdp_user:
        description: "Windows local administrator username"
        required: false
        default: "Yousif190"
        type: string
      runtime_minutes:
        description: "Runtime in minutes (maximum 360)"
        required: false
        default: "360"
        type: string
      vm_ram_mb:
        description: "VM RAM in MB"
        required: false
        default: "16384"
        type: string
      vm_cpus:
        description: "VM CPU threads"
        required: false
        default: "6"
        type: string
      nbd_readonly:
        description: "NBD read-only mode (must be false)"
        required: false
        default: false
        type: boolean
      cleanup_bullet_devices:
        description: "Remove old bullet Tailscale devices"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: windows-latest
    outputs:
      runtime: ${{ steps.settings.outputs.runtime }}
      cpus: ${{ steps.settings.outputs.cpus }}
      ram: ${{ steps.settings.outputs.ram }}
      nbd_port: ${{ steps.settings.outputs.nbd_port }}
      iso_nbd_port: ${{ steps.settings.outputs.iso_nbd_port }}

    steps:
      - name: Validate VM settings
        id: settings
        run: |
          $ErrorActionPreference = "Stop"

          $runtimeRaw = "${{ inputs.runtime_minutes }}".Trim()
          $cpusRaw = "${{ inputs.vm_cpus }}".Trim()
          $ramRaw = "${{ inputs.vm_ram_mb }}".Trim()
          $portRaw = "${{ inputs.nbd_port }}".Trim()
          $isoPortRaw = "${{ inputs.iso_nbd_port }}".Trim()

          $runtime = if ($runtimeRaw -match '^\d+$') { [int]$runtimeRaw } else { 360 }
          $cpus = if ($cpusRaw -match '^\d+$') { [int]$cpusRaw } else { 4 }
          $ram = if ($ramRaw -match '^\d+$') { [int]$ramRaw } else { 16384 }
          $port = if ($portRaw -match '^\d+$') { [int]$portRaw } else { 10809 }
          $isoPort = if ($isoPortRaw -match '^\d+$') { [int]$isoPortRaw } else { 10810 }

          $runtime = [Math]::Max(1, [Math]::Min(360, $runtime))
          $cpus = [Math]::Max(1, [Math]::Min(16, $cpus))
          $ram = [Math]::Max(4096, [Math]::Min(16384, $ram))

          if ($port -lt 1 -or $port -gt 65535) { throw "Invalid NBD port." }
          if ($isoPort -lt 1 -or $isoPort -gt 65535) { throw "Invalid ISO NBD port." }
          if ($port -eq $isoPort) { throw "NBD and ISO NBD ports must be different." }

          "runtime=$runtime" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cpus=$cpus" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ram=$ram" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "nbd_port=$port" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "iso_nbd_port=$isoPort" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Runtime: $runtime minutes"
          Write-Host "CPU: $cpus"
          Write-Host "RAM: $ram MB"
          Write-Host "NBD: $port"
          Write-Host "ISO NBD: $isoPort"

  vm:
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 370

    env:
      RDP_USER: ${{ inputs.rdp_user }}
      PHONE_TS_IP: ${{ inputs.phone_tailscale_ip }}
      NBD_PORT: ${{ needs.setup.outputs.nbd_port }}
      ISO_NBD_PORT: ${{ needs.setup.outputs.iso_nbd_port }}
      NBD_EXPORT: ${{ inputs.nbd_export }}
      ISO_NBD_EXPORT: ${{ inputs.iso_nbd_export }}
      VM_RUNTIME: ${{ needs.setup.outputs.runtime }}
      VM_CPUS: ${{ needs.setup.outputs.cpus }}
      VM_RAM: ${{ needs.setup.outputs.ram }}
      VM_RDP_HOST_PORT: "3390"
      VM_RDP_GUEST_PORT: "3389"

    steps:
      - name: Verify Windows/RDP password secret
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {
            throw "GitHub Secret RDP_PASSWORD is missing or empty."
          }
          Write-Host "RDP_PASSWORD secret is available."

      - name: Runner resources
        run: |
          $ErrorActionPreference = "Stop"
          $computer = Get-CimInstance Win32_ComputerSystem
          $processor = Get-CimInstance Win32_Processor | Select-Object -First 1
          Write-Host "Computer: $($computer.Manufacturer) $($computer.Model)"
          Write-Host "Logical processors: $($computer.NumberOfLogicalProcessors)"
          Write-Host "CPU: $($processor.Name)"
          Write-Host "RAM GB: $([math]::Round($computer.TotalPhysicalMemory / 1GB,2))"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free

      - name: Check hardware virtualization
        run: |
          Get-CimInstance Win32_Processor |
            Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,
              VirtualizationFirmwareEnabled,VMMonitorModeExtensions |
            Format-List

      - name: Install QEMU
        run: |
          $ErrorActionPreference = "Stop"

          winget install --id SoftwareFreedomConservancy.QEMU --exact --silent `
            --accept-package-agreements --accept-source-agreements

          Start-Sleep -Seconds 5

          $qemuCommand = Get-Command qemu-system-x86_64.exe -ErrorAction SilentlyContinue

          if (-not $qemuCommand) {
            $found = Get-ChildItem -Path "C:\Program Files","$env:LOCALAPPDATA\Programs" `
              -Recurse -Filter "qemu-system-x86_64.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $qemuCommand = $found }
          }

          if (-not $qemuCommand) { throw "QEMU was not found." }

          $qemuPath = if ($qemuCommand.Path) { $qemuCommand.Path } else { $qemuCommand.FullName }
          $qemuDir = Split-Path $qemuPath -Parent
          $qemuImg = Join-Path $qemuDir "qemu-img.exe"

          $qemuDir | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "QEMU_EXE=$qemuPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "QEMU_IMG=$qemuImg" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Test-Path $qemuImg)) { throw "qemu-img.exe was not found." }

          & $qemuPath --version
          & $qemuImg --version

      - name: Verify WHPX
        run: |
          $ErrorActionPreference = "Stop"
          $output = & "$env:QEMU_EXE" -accel help 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch "(?im)^\s*whpx\s*$") {
            throw "WHPX is not reported by QEMU."
          }

      - name: Install Tailscale
        run: |
          $ErrorActionPreference = "Stop"

          winget install --id Tailscale.Tailscale --exact --silent `
            --accept-package-agreements --accept-source-agreements

          Start-Sleep -Seconds 8
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            $ts = "C:\Program Files\Tailscale\tailscale.exe"
          }

          if (-not (Test-Path $ts)) { throw "Tailscale executable was not found." }

          "TAILSCALE_EXE=$ts" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Connect runner to Tailscale
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:TAILSCALE_EXE" logout 2>$null | Out-Null

          & "$env:TAILSCALE_EXE" up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "windows-vm-runner" `
            --accept-dns=true `
            --accept-routes=true

          Start-Sleep -Seconds 5
          & "$env:TAILSCALE_EXE" status

          $runnerIp = (& "$env:TAILSCALE_EXE" ip -4 | Select-Object -First 1).Trim()

          if ([string]::IsNullOrWhiteSpace($runnerIp)) {
            throw "Runner did not receive a Tailscale IPv4 address."
          }

          "RUNNER_TS_IP=$runnerIp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Runner Tailscale IPv4: $runnerIp"

      - name: Check Windows disk NBD
        run: |
          $ErrorActionPreference = "Stop"
          $result = Test-NetConnection -ComputerName $env:PHONE_TS_IP `
            -Port ([int]$env:NBD_PORT) -WarningAction SilentlyContinue
          $result | Format-List
          if (-not $result.TcpTestSucceeded) {
            throw "Windows.qcow2 NBD endpoint is not reachable."
          }

      - name: Check ISO NBD
        run: |
          $ErrorActionPreference = "Stop"
          $result = Test-NetConnection -ComputerName $env:PHONE_TS_IP `
            -Port ([int]$env:ISO_NBD_PORT) -WarningAction SilentlyContinue
          $result | Format-List
          if (-not $result.TcpTestSucceeded) {
            throw "Win11.iso NBD endpoint is not reachable."
          }

      - name: Build NBD URLs
        run: |
          $ErrorActionPreference = "Stop"

          $hostIp = "$env:PHONE_TS_IP".Trim()
          $diskPort = [int]$env:NBD_PORT
          $isoPort = [int]$env:ISO_NBD_PORT
          $diskExport = "$env:NBD_EXPORT".Trim()
          $isoExport = "$env:ISO_NBD_EXPORT".Trim()

          if ([string]::IsNullOrWhiteSpace($diskExport)) {
            $diskUrl = "nbd://${hostIp}:${diskPort}"
          } else {
            $diskUrl = "nbd://${hostIp}:${diskPort}/$([uri]::EscapeDataString($diskExport))"
          }

          if ([string]::IsNullOrWhiteSpace($isoExport)) {
            $isoUrl = "nbd://${hostIp}:${isoPort}"
          } else {
            $isoUrl = "nbd://${hostIp}:${isoPort}/$([uri]::EscapeDataString($isoExport))"
          }

          "NBD_URL=$diskUrl" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISO_NBD_URL=$isoUrl" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Windows disk NBD: $diskUrl"
          Write-Host "Windows ISO NBD: $isoUrl"

      - name: Verify NBD images
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Windows disk:"
          & "$env:QEMU_IMG" info "$env:NBD_URL" 2>&1 | ForEach-Object { Write-Host $_ }

          Write-Host "ISO:"
          & "$env:QEMU_IMG" info --force-share "$env:ISO_NBD_URL" 2>&1 |
            ForEach-Object { Write-Host $_ }

      - name: Verify writable Windows disk
        run: |
          if ("${{ inputs.nbd_readonly }}" -eq "true") {
            throw "Windows.qcow2 must be writable."
          }
          Write-Host "Writable NBD mode requested."

      # This creates a small FAT floppy exposed by QEMU's FAT backend.
      # Windows Setup can discover Autounattend.xml from removable media.
      - name: Create automatic Windows Setup answer media
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $answerDir = Join-Path $env:RUNNER_TEMP "windows-answer-media"
          New-Item -ItemType Directory -Path $answerDir -Force | Out-Null

          function XmlEscape([string]$value) {
            return [System.Security.SecurityElement]::Escape($value)
          }

          $user = XmlEscape "$env:RDP_USER"
          $pass = XmlEscape "$env:RDP_PASSWORD_SECRET"

          $xml = @"
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">

            <settings pass="windowsPE">
              <component name="Microsoft-Windows-International-Core-WinPE"
                        processorArchitecture="amd64"
                        publicKeyToken="31bf3856ad364e35"
                        language="neutral"
                        versionScope="nonSxS">
                <SetupUILanguage>
                  <UILanguage>en-US</UILanguage>
                </SetupUILanguage>
                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>
              </component>

              <component name="Microsoft-Windows-Setup"
                        processorArchitecture="amd64"
                        publicKeyToken="31bf3856ad364e35"
                        language="neutral"
                        versionScope="nonSxS">

                <RunSynchronous>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>1</Order>
                    <Description>Bypass Windows 11 hardware requirement checks</Description>
                    <Path>cmd /c reg add HKLM\SYSTEM\Setup\LabConfig /v BypassTPMCheck /t REG_DWORD /d 1 /f</Path>
                  </RunSynchronousCommand>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>2</Order>
                    <Description>Bypass Secure Boot check</Description>
                    <Path>cmd /c reg add HKLM\SYSTEM\Setup\LabConfig /v BypassSecureBootCheck /t REG_DWORD /d 1 /f</Path>
                  </RunSynchronousCommand>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>3</Order>
                    <Description>Bypass RAM check</Description>
                    <Path>cmd /c reg add HKLM\SYSTEM\Setup\LabConfig /v BypassRAMCheck /t REG_DWORD /d 1 /f</Path>
                  </RunSynchronousCommand>
                </RunSynchronous>

                <DiskConfiguration>
                  <Disk wcm:action="add">
                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>
                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Type>EFI</Type>
                        <Size>100</Size>
                      </CreatePartition>
                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Type>MSR</Type>
                        <Size>16</Size>
                      </CreatePartition>
                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Type>Primary</Type>
                        <Extend>true</Extend>
                      </CreatePartition>
                    </CreatePartitions>

                    <ModifyPartitions>
                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>
                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>
                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                      </ModifyPartition>
                    </ModifyPartitions>
                  </Disk>
                </DiskConfiguration>

                <ImageInstall>
                  <OSImage>
                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>
                    </InstallTo>
                    <InstallToAvailablePartition>false</InstallToAvailablePartition>
                  </OSImage>
                </ImageInstall>

                <UserData>
                  <AcceptEula>true</AcceptEula>
                  <FullName>$user</FullName>
                  <Organization>Personal</Organization>
                  <ProductKey>
                    <Key>VK7JG-NPHTM-C97JM-9MPGT-3V66T</Key>
                    <WillShowUI>Never</WillShowUI>
                  </ProductKey>
                </UserData>
              </component>
            </settings>

            <settings pass="specialize">
              <component name="Microsoft-Windows-Deployment"
                        processorArchitecture="amd64"
                        publicKeyToken="31bf3856ad364e35"
                        language="neutral"
                        versionScope="nonSxS">
                <RunSynchronous>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>1</Order>
                    <Description>Enable Remote Desktop</Description>
                    <Path>cmd /c reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f</Path>
                  </RunSynchronousCommand>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>2</Order>
                    <Description>Enable Remote Desktop firewall rules</Description>
                    <Path>cmd /c netsh advfirewall firewall set rule group="remote desktop" new enable=Yes</Path>
                  </RunSynchronousCommand>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>3</Order>
                    <Description>Set RDP service to automatic</Description>
                    <Path>cmd /c sc config TermService start= auto</Path>
                  </RunSynchronousCommand>
                </RunSynchronous>
              </component>
            </settings>

            <settings pass="oobeSystem">
              <component name="Microsoft-Windows-International-Core"
                        processorArchitecture="amd64"
                        publicKeyToken="31bf3856ad364e35"
                        language="neutral"
                        versionScope="nonSxS">
                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>
              </component>

              <component name="Microsoft-Windows-Shell-Setup"
                        processorArchitecture="amd64"
                        publicKeyToken="31bf3856ad364e35"
                        language="neutral"
                        versionScope="nonSxS">

                <UserAccounts>
                  <LocalAccounts>
                    <LocalAccount wcm:action="add">
                      <Name>$user</Name>
                      <DisplayName>$user</DisplayName>
                      <Description>Windows administrator account</Description>
                      <Group>Administrators</Group>
                      <Password>
                        <Value>$pass</Value>
                        <PlainText>true</PlainText>
                      </Password>
                    </LocalAccount>
                  </LocalAccounts>
                </UserAccounts>

                <AutoLogon>
                  <Enabled>true</Enabled>
                  <LogonCount>1</LogonCount>
                  <Username>$user</Username>
                  <Password>
                    <Value>$pass</Value>
                    <PlainText>true</PlainText>
                  </Password>
                </AutoLogon>

                <OOBE>
                  <HideEULAPage>true</HideEULAPage>
                  <HideLocalAccountScreen>true</HideLocalAccountScreen>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
                  <NetworkLocation>Work</NetworkLocation>
                  <ProtectYourPC>1</ProtectYourPC>
                  <SkipMachineOOBE>true</SkipMachineOOBE>
                  <SkipUserOOBE>true</SkipUserOOBE>
                </OOBE>

                <FirstLogonCommands>
                  <SynchronousCommand wcm:action="add">
                    <Order>1</Order>
                    <Description>Ensure RDP is enabled</Description>
                    <CommandLine>cmd /c reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f</CommandLine>
                  </SynchronousCommand>
                  <SynchronousCommand wcm:action="add">
                    <Order>2</Order>
                    <Description>Enable Remote Desktop firewall</Description>
                    <CommandLine>cmd /c netsh advfirewall firewall set rule group="remote desktop" new enable=Yes</CommandLine>
                  </SynchronousCommand>
                </FirstLogonCommands>

              </component>
            </settings>

          </unattend>
          "@

          $xmlPath = Join-Path $answerDir "Autounattend.xml"
          Set-Content -Path $xmlPath -Value $xml -Encoding UTF8

          # QEMU's FAT directory backend exposes this folder as a small FAT volume.
          # It is attached as a virtual floppy so Windows PE can discover Autounattend.xml.
          "ANSWER_MEDIA_DIR=$answerDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANSWER_XML=$xmlPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Autounattend.xml created."
          Write-Host "Answer media directory: $answerDir"

      - name: Validate Autounattend XML
        run: |
          $ErrorActionPreference = "Stop"
          [xml](Get-Content "$env:ANSWER_XML" -Raw)
          Write-Host "Autounattend.xml XML syntax is valid."

      - name: Configure runner firewall for VM RDP
        run: |
          $port = [int]$env:VM_RDP_HOST_PORT
          $rule = "Persistent-RDP-QEMU-VM-$port"

          netsh advfirewall firewall delete rule name="$rule" 2>$null | Out-Null
          netsh advfirewall firewall add rule name="$rule" dir=in action=allow `
            protocol=TCP localport=$port | Out-Null

      - name: Install RustDesk
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            $installer = "$env:TEMP\rustdesk.msi"
            try {
              Invoke-WebRequest `
                -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi" `
                -OutFile $installer -UseBasicParsing

              Start-Process msiexec.exe `
                -ArgumentList @("/i","`"$installer`"","/quiet","/norestart") `
                -Wait

              Remove-Item $installer -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Warning $_.Exception.Message
            }
          }

          if (Test-Path $rdExe) {
            Start-Process $rdExe -ErrorAction SilentlyContinue
            Write-Host "RustDesk installed."
          } else {
            Write-Warning "RustDesk was not installed."
          }

      - name: Final NBD preflight
        run: |
          $ErrorActionPreference = "Stop"

          $diskTest = Test-NetConnection $env:PHONE_TS_IP `
            -Port ([int]$env:NBD_PORT) -WarningAction SilentlyContinue

          $isoTest = Test-NetConnection $env:PHONE_TS_IP `
            -Port ([int]$env:ISO_NBD_PORT) -WarningAction SilentlyContinue

          if (-not $diskTest.TcpTestSucceeded) {
            throw "Windows.qcow2 NBD endpoint is not reachable."
          }

          if (-not $isoTest.TcpTestSucceeded) {
            throw "Win11.iso NBD endpoint is not reachable."
          }

          Write-Host "Both NBD endpoints are ready."

      - name: Start Windows VM with automatic Setup
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $qemuLog = Join-Path $env:RUNNER_TEMP "qemu.log"
          $qemuStdout = Join-Path $env:RUNNER_TEMP "qemu.stdout.log"
          $qemuStderr = Join-Path $env:RUNNER_TEMP "qemu.stderr.log"
          $qemuPidFile = Join-Path $env:RUNNER_TEMP "qemu.pid"

          Remove-Item $qemuLog,$qemuStdout,$qemuStderr,$qemuPidFile `
            -Force -ErrorAction SilentlyContinue

          "QEMU_LOG=$qemuLog" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "QEMU_STDOUT_LOG=$qemuStdout" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "QEMU_STDERR_LOG=$qemuStderr" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "QEMU_PID_FILE=$qemuPidFile" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $diskSpec =
            "file=$env:NBD_URL,format=qcow2,if=virtio,cache=none,aio=threads,readonly=off"

          $isoSpec =
            "file=$env:ISO_NBD_URL,format=raw,media=cdrom,readonly=on"

          # QEMU FAT backend presents the directory as a removable FAT disk.
          $answerSpec =
            "file=fat:rw:$env:ANSWER_MEDIA_DIR,format=raw,if=floppy"

          $netSpec =
            "user,id=net0,hostfwd=tcp:0.0.0.0:$env:VM_RDP_HOST_PORT-:$env:VM_RDP_GUEST_PORT"

          $args = @(
            "-accel","whpx",
            "-machine","q35",
            "-cpu","max",
            "-smp","$env:VM_CPUS",
            "-m","$env:VM_RAM",

            "-drive",$diskSpec,
            "-drive",$isoSpec,
            "-drive",$answerSpec,

            "-boot","once=d",
            "-netdev",$netSpec,
            "-device","e1000,netdev=net0",

            "-display","none",
            "-monitor","none",
            "-serial","none",
            "-D",$qemuLog,
            "-d","guest_errors"
          )

          Write-Host "=============================================="
          Write-Host "AUTOMATIC WINDOWS SETUP VM"
          Write-Host "=============================================="
          Write-Host "The VM will boot the ISO and Windows Setup will"
          Write-Host "use Autounattend.xml without requiring RDP input."
          Write-Host ""

          $p = New-Object System.Diagnostics.Process
          $p.StartInfo = New-Object System.Diagnostics.ProcessStartInfo
          $p.StartInfo.FileName = "$env:QEMU_EXE"
          $p.StartInfo.UseShellExecute = $false
          $p.StartInfo.CreateNoWindow = $true
          $p.StartInfo.RedirectStandardOutput = $true
          $p.StartInfo.RedirectStandardError = $true

          foreach ($arg in $args) {
            [void]$p.StartInfo.ArgumentList.Add([string]$arg)
          }

          if (-not $p.Start()) {
            throw "Failed to start QEMU."
          }

          $p.Id | Out-File $qemuPidFile -Encoding ascii -Force
          "QEMU_PID=$($p.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "QEMU PID: $($p.Id)"

          for ($i = 1; $i -le 24; $i++) {
            Start-Sleep -Seconds 5

            if ($p.HasExited) {
              Write-Host "QEMU exited during startup. Exit code: $($p.ExitCode)"

              try {
                $out = $p.StandardOutput.ReadToEnd()
                if ($out) { Write-Host $out }
              } catch {}

              try {
                $err = $p.StandardError.ReadToEnd()
                if ($err) { Write-Host $err }
              } catch {}

              if (Test-Path $qemuLog) {
                Get-Content $qemuLog -Tail 1000 -ErrorAction SilentlyContinue
              }

              throw "QEMU exited during startup."
            }

            Write-Host "QEMU startup check $i/24: running."
          }

          Write-Host ""
          Write-Host "QEMU is running."
          Write-Host "Windows Setup should now be proceeding automatically."
          Write-Host "No RDP session is required to start the installation."

          $runtime = [Math]::Max(1,[Math]::Min(360,[int]$env:VM_RUNTIME))
          $end = (Get-Date).AddMinutes($runtime)

          while ((Get-Date) -lt $end) {
            if ($p.HasExited) {
              Write-Host ""
              Write-Host "QEMU exited. Exit code: $($p.ExitCode)"

              if (Test-Path $qemuLog) {
                Get-Content $qemuLog -Tail 1500 -ErrorAction SilentlyContinue
              }

              throw "QEMU stopped unexpectedly."
            }

            $rdp = Test-NetConnection 127.0.0.1 `
              -Port ([int]$env:VM_RDP_HOST_PORT) `
              -WarningAction SilentlyContinue

            $remaining = [math]::Round((($end-(Get-Date)).TotalMinutes),1)

            if ($rdp.TcpTestSucceeded) {
              Write-Host "VM RDP forwarding is ONLINE | Remaining $remaining min"
            } else {
              Write-Host "VM still booting / RDP not ready | Remaining $remaining min"
            }

            Start-Sleep -Seconds 30
          }

          Write-Host "Configured runtime finished."

      - name: VM connection information
        if: always()
        run: |
          Write-Host "=============================================="
          Write-Host "WINDOWS VM CONNECTION"
          Write-Host "=============================================="
          Write-Host "Tailscale IP: $env:RUNNER_TS_IP"
          Write-Host "RDP target: $env:RUNNER_TS_IP`:$env:VM_RDP_HOST_PORT"
          Write-Host "Guest port: $env:VM_RDP_GUEST_PORT"
          Write-Host "User: $env:RDP_USER"
          Write-Host ""
          Write-Host "If Windows Setup has completed, connect to the"
          Write-Host "RDP target above using the RDP_PASSWORD secret."

      - name: Stop QEMU safely
        if: always()
        run: |
          $ErrorActionPreference = "Continue"

          $pidToStop = $null

          if ($env:QEMU_PID_FILE -and (Test-Path $env:QEMU_PID_FILE)) {
            $raw = (Get-Content $env:QEMU_PID_FILE -Raw).Trim()
            if ($raw -match '^\d+$') { $pidToStop = [int]$raw }
          }

          if ($pidToStop) {
            Stop-Process -Id $pidToStop -Force -ErrorAction SilentlyContinue
          }

          Get-Process -Name qemu-system-x86_64 -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Write-Host "QEMU cleanup completed."

      - name: Upload QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-diagnostics
          path: |
            ${{ runner.temp }}/qemu.log
            ${{ runner.temp }}/qemu.stdout.log
            ${{ runner.temp }}/qemu.stderr.log
            ${{ runner.temp }}/qemu.pid
          if-no-files-found: ignore
          retention-days: 3

      - name: Final Tailscale status
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          if ($env:TAILSCALE_EXE -and (Test-Path $env:TAILSCALE_EXE)) {
            & "$env:TAILSCALE_EXE" status
            & "$env:TAILSCALE_EXE" ip -4
          }

      - name: Final diagnostics
        if: always()
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "QEMU: $env:QEMU_EXE"
          Write-Host "Phone: $env:PHONE_TS_IP"
          Write-Host "NBD port: $env:NBD_PORT"
          Write-Host "ISO NBD port: $env:ISO_NBD_PORT"
          Write-Host "NBD URL: $env:NBD_URL"
          Write-Host "ISO URL: $env:ISO_NBD_URL"

          if ($env:QEMU_LOG -and (Test-Path $env:QEMU_LOG)) {
            Write-Host ""
            Write-Host "Last QEMU log:"
            Get-Content $env:QEMU_LOG -Tail 1200 -ErrorAction SilentlyContinue
          }
