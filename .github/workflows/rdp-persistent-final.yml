name: RDP + Tailscale + RustDesk + Telegram Persistent Storage (FINAL)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet"
        required: true
        type: string

      ts_api_key:
        description: "Tailscale API key"
        required: true
        type: string

      ts_authkey:
        description: "Tailscale Auth key"
        required: true
        type: string

      quick_test:
        description: "Run 5-minute test"
        required: false
        type: boolean
        default: false

      runtime_minutes:
        description: "Runtime in minutes (maximum 360)"
        required: false
        type: string
        default: "355"

      do_purge:
        description: "Purge bullet devices at start"
        required: false
        type: boolean
        default: true

      cycles:
        description: "0 = stop after A; N = handoffs left"
        required: false
        type: string
        default: "0"

      rdp_count:
        description: "Number of RDP instances"
        required: false
        type: string
        default: "1"

      crd_code:
        description: "Chrome Remote Desktop code"
        required: false
        type: string
        default: ""

      crd_pin:
        description: "Chrome Remote Desktop PIN"
        required: false
        type: string
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  # ============================================================
  # TELEGRAM STORAGE TEST
  # ============================================================

  telegram-test:
    runs-on: ubuntu-latest

    steps:

      - name: Install Telethon
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install telethon

      - name: Create test files
        shell: bash
        run: |
          mkdir -p test_workspace/Projects/AE
          mkdir -p test_workspace/Assets/Fonts

          echo "Persistent-RDP test $(date -u)" \
            > test_workspace/Projects/AE/project.txt

          echo "Persistent-RDP asset $(date -u)" \
            > test_workspace/Assets/Fonts/test-font.txt

          echo "Created test tree:"
          find test_workspace -type f -print

      - name: Telegram persistent storage test
        shell: bash
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import hashlib
          import json
          import math
          from datetime import datetime, timezone
          from telethon import TelegramClient

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          session_b64 = os.environ["SESSION_B64"]

          with open("unlim_session.session", "wb") as f:
              f.write(base64.b64decode(session_b64))

          client = TelegramClient(
              "unlim_session",
              api_id,
              api_hash
          )

          STORAGE_ROOT = "test_workspace"
          INDEX_FILE = "file_index.json"
          CHUNK_SIZE = 1024 * 1024

          def sha256(path):
              h = hashlib.sha256()

              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)

                      if not chunk:
                          break

                      h.update(chunk)

              return h.hexdigest()

          def utc_now():
              return datetime.now(
                  timezone.utc
              ).isoformat()

          def build_file_record(local_path):
              relative_path = os.path.relpath(
                  local_path,
                  STORAGE_ROOT
              ).replace("\\", "/")

              size = os.path.getsize(local_path)
              file_hash = sha256(local_path)

              chunk_count = max(
                  1,
                  math.ceil(size / CHUNK_SIZE)
              )

              return {
                  "path": "/" + relative_path,
                  "name": os.path.basename(local_path),
                  "size": size,
                  "sha256": file_hash,
                  "chunk_size": CHUNK_SIZE,
                  "chunk_count": chunk_count,
                  "chunks": [],
                  "created_at": utc_now()
              }

          async def upload_file(file_record, local_path):
              with open(local_path, "rb") as f:
                  data = f.read()

              total_size = len(data)

              chunk_count = (
                  1
                  if total_size == 0
                  else math.ceil(total_size / CHUNK_SIZE)
              )

              file_record["chunk_count"] = chunk_count

              for index in range(chunk_count):
                  start = index * CHUNK_SIZE
                  end = min(
                      start + CHUNK_SIZE,
                      total_size
                  )

                  chunk_data = data[start:end]

                  chunk_name = (
                      "persistent_chunk_"
                      + str(index)
                      + ".bin"
                  )

                  with open(
                      chunk_name,
                      "wb"
                  ) as chunk_file:
                      chunk_file.write(chunk_data)

                  chunk_hash = sha256(chunk_name)

                  message = await client.send_file(
                      "me",
                      chunk_name,
                      caption=(
                          "PERSISTENT-RDP-CHUNK\n"
                          f"path={file_record['path']}\n"
                          f"chunk={index}\n"
                          f"chunks={chunk_count}\n"
                          f"sha256={chunk_hash}"
                      )
                  )

                  file_record["chunks"].append({
                      "index": index,
                      "size": len(chunk_data),
                      "sha256": chunk_hash,
                      "telegram_message_id": message.id
                  })

                  print(
                      "CHUNK UPLOAD SUCCESS "
                      f"{index + 1}/{chunk_count} "
                      f"message_id={message.id}"
                  )

                  os.remove(chunk_name)

          async def main():
              await client.start()

              print("TELEGRAM CONNECTED")

              files = []

              for root, dirs, filenames in os.walk(
                  STORAGE_ROOT
              ):
                  dirs.sort()
                  filenames.sort()

                  for filename in filenames:
                      local_path = os.path.join(
                          root,
                          filename
                      )

                      files.append(local_path)

              if not files:
                  raise SystemExit(
                      "NO TEST FILES FOUND"
                  )

              print(
                  f"FILE DISCOVERY SUCCESS: {len(files)} files"
              )

              index = {
                  "version": 2,
                  "type": "persistent-rdp-file-index",
                  "updated_at": utc_now(),
                  "storage": {
                      "logical_capacity": "10 TB",
                      "chunk_size": CHUNK_SIZE
                  },
                  "files": []
              }

              for local_path in files:
                  record = build_file_record(
                      local_path
                  )

                  print(
                      f"FILE: {record['path']}"
                  )

                  print(
                      f"SIZE: {record['size']}"
                  )

                  print(
                      f"SHA256: {record['sha256']}"
                  )

                  await upload_file(
                      record,
                      local_path
                  )

                  index["files"].append(record)

              print("FILE UPLOADS SUCCESS")

              with open(
                  INDEX_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      index,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              print("FILE INDEX CREATED")

              index_message = await client.send_file(
                  "me",
                  INDEX_FILE,
                  caption="PERSISTENT-RDP-FILE-INDEX"
              )

              index_message_id = index_message.id

              print(
                  f"INDEX_MESSAGE_ID={index_message_id}"
              )

              found_index_message = None

              async for msg in client.iter_messages(
                  "me",
                  search="PERSISTENT-RDP-FILE-INDEX",
                  limit=50
              ):
                  if msg.id == index_message_id:
                      found_index_message = msg
                      break

              if not found_index_message:
                  raise SystemExit(
                      "FILE INDEX LOOKUP FAILED"
                  )

              print("FILE INDEX LOOKUP SUCCESS")

              restored_index_file = (
                  "file_index_restored.json"
              )

              await client.download_media(
                  found_index_message,
                  file=restored_index_file
              )

              print("FILE INDEX DOWNLOAD SUCCESS")

              with open(
                  restored_index_file,
                  "r",
                  encoding="utf-8"
              ) as f:
                  restored_index = json.load(f)

              if restored_index["version"] != 2:
                  raise SystemExit(
                      "INDEX VERSION FAILED"
                  )

              if len(restored_index["files"]) != len(files):
                  raise SystemExit(
                      "INDEX FILE COUNT FAILED"
                  )

              print("FILE INDEX READ SUCCESS")

              for record in restored_index["files"]:
                  if not record["path"].startswith("/"):
                      raise SystemExit(
                          "PATH VERIFICATION FAILED"
                      )

                  if record["size"] < 0:
                      raise SystemExit(
                          "SIZE VERIFICATION FAILED"
                      )

                  if len(record["sha256"]) != 64:
                      raise SystemExit(
                          "SHA256 RECORD FAILED"
                      )

                  if record["chunk_count"] < 1:
                      raise SystemExit(
                          "CHUNK COUNT FAILED"
                      )

                  if len(record["chunks"]) != record["chunk_count"]:
                      raise SystemExit(
                          "CHUNK RECORD COUNT FAILED"
                      )

              print("FILE RECORD VERIFICATION SUCCESS")

              for record in restored_index["files"]:
                  expected_indexes = list(
                      range(record["chunk_count"])
                  )

                  actual_indexes = [
                      c["index"]
                      for c in record["chunks"]
                  ]

                  if actual_indexes != expected_indexes:
                      raise SystemExit(
                          "CHUNK INDEX FAILED"
                      )

                  for chunk in record["chunks"]:
                      if not chunk.get(
                          "telegram_message_id"
                      ):
                          raise SystemExit(
                              "CHUNK MESSAGE ID FAILED"
                          )

                      if len(chunk["sha256"]) != 64:
                          raise SystemExit(
                              "CHUNK SHA256 FAILED"
                          )

              print("CHUNK METADATA SUCCESS")

              first_record = restored_index["files"][0]

              first_chunk = first_record["chunks"][0]

              first_chunk_message = await client.get_messages(
                  "me",
                  ids=first_chunk["telegram_message_id"]
              )

              if not first_chunk_message:
                  raise SystemExit(
                      "CHUNK LOOKUP FAILED"
                  )

              restored_chunk = "restored_chunk.bin"

              await client.download_media(
                  first_chunk_message,
                  file=restored_chunk
              )

              restored_chunk_hash = sha256(
                  restored_chunk
              )

              if restored_chunk_hash != first_chunk["sha256"]:
                  raise SystemExit(
                      "CHUNK SHA256 FAILED"
                  )

              print("CHUNK DOWNLOAD SUCCESS")
              print("CHUNK SHA256 SUCCESS")

              print("")
              print("================================")
              print("FILE MANAGER TEST SUCCESS")
              print("PERSISTENT STORAGE TEST SUCCESS")
              print("================================")

          with client:
              client.loop.run_until_complete(main())
          PY

      - name: Display storage index
        shell: bash
        run: |
          echo "=============================="
          echo "PERSISTENT STORAGE INDEX"
          echo "=============================="
          cat file_index.json

      - name: Upload storage test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-storage-file-manager-test
          path: |
            file_index.json
            file_index_restored.json
            test_workspace


  # ============================================================
  # SETUP
  # ============================================================

  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:

      - id: mk
        shell: pwsh
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = 1

            if ("${{ inputs.rdp_count }}" -match '^\d+$') {
              $n = [int]"${{ inputs.rdp_count }}"
            }

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{
              id = $i
            }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          $multi = if ($n -gt 1) {
            "1"
          }
          else {
            "0"
          }

          "multi=$multi" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8


  # ============================================================
  # WINDOWS RDP
  # ============================================================

  rdp:
    needs: setup

    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif1990

    steps:

      # --------------------------------------------------------
      # CRD FLAG
      # --------------------------------------------------------

      - name: Set CRD flag
        shell: pwsh
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }


      # --------------------------------------------------------
      # INSTALL CRD
      # --------------------------------------------------------

      - name: Install Chrome Remote Desktop Host
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |
          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {
            $exePath = "$env:TEMP\chromeremotedesktophost.exe"

            try {
              Invoke-WebRequest `
                -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath $exePath `
                -ArgumentList "/silent","/install" `
                -Wait

              Remove-Item `
                $exePath `
                -Force
            }
            catch {
              $msi = "$env:TEMP\chromeremotedesktophost.msi"

              Invoke-WebRequest `
                -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                -OutFile $msi `
                -ErrorAction Stop

              Start-Process `
                msiexec.exe `
                -ArgumentList `
                  "/i", `
                  "`"$msi`"", `
                  "/quiet", `
                  "/norestart" `
                -Wait

              Remove-Item `
                $msi `
                -Force
            }
          }


      # --------------------------------------------------------
      # START CRD
      # --------------------------------------------------------

      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin = "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            throw "crd_pin must be 6-12 digits."
          }

          $starter = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            throw "remoting_start_host.exe not found."
          }

          $code = $null

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {
            $code = (
              [regex]::Match(
                $raw,
                '--code\s*=\s*"?([^"\s]+)'
              )
            ).Groups[1].Value
          }
          elseif ($raw -match '^4\/') {
            $code = $raw
          }

          if (-not $code) {
            throw "Could not detect CRD code."
          }

          $redir = "https://remotedesktop.google.com/_/oauthredirect"

          $name = $Env:COMPUTERNAME

          $args = @(
            "--code=""$code""",
            "--redirect-url=""$redir""",
            "--name=""$name""",
            "--pin=""$pin"""
          )

          Start-Process `
            -FilePath $starter `
            -ArgumentList $args


      # --------------------------------------------------------
      # HOSTNAME + RUNTIME
      # --------------------------------------------------------

      - name: Decide hostname + runtime
        shell: pwsh
        run: |
          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {
            if ("$v" -match '^\d+$') {
              return [int]$v
            }

            return [int]$d
          }

          $runtime = IntOr(
            "${{ inputs.runtime_minutes }}",
            355
          )

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 355
          }

          if ($runtime -gt 360) {
            $runtime = 355
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File `
              -Append `
              $env:GITHUB_ENV


      # --------------------------------------------------------
      # PURGE TAILSCALE DEVICES
      # --------------------------------------------------------

      - name: Purge bullet devices
        if: needs.setup.outputs.multi == '0'
        shell: pwsh
        run: |
          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (-not (Yes("${{ inputs.do_purge }}"))) {
            Write-Host "Purge disabled."
            exit 0
          }

          try {
            $auth = [Convert]::ToBase64String(
              [Text.Encoding]::ASCII.GetBytes(
                "${{ inputs.ts_api_key }}:"
              )
            )

            $tn = [uri]::EscapeDataString(
              "${{ inputs.ts_tailnet }}"
            )

            $list = Invoke-RestMethod `
              -Uri `
                "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
              -Headers @{
                Authorization = "Basic $auth"
              }

            foreach ($d in $list.devices) {
              if ($d.hostname -match '^bullet[0-9]*$') {
                Invoke-RestMethod `
                  -Method Delete `
                  -Uri `
                    "https://api.tailscale.com/api/v2/device/$($d.id)" `
                  -Headers @{
                    Authorization = "Basic $auth"
                  } `
                  -ErrorAction SilentlyContinue
              }
            }
          }
          catch {
            Write-Host "Purge warning: $($_.Exception.Message)"
          }


      # --------------------------------------------------------
      # TAILSCALE
      # --------------------------------------------------------

      - name: Install + Up Tailscale
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

            $dst = "$env:TEMP\tailscale.msi"

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $dst

            Start-Process `
              msiexec.exe `
              -ArgumentList `
                "/i", `
                "`"$dst`"", `
                "/quiet", `
                "/norestart" `
              -Wait

            Remove-Item `
              $dst `
              -Force
          }

          & $ts logout 2>$null | Out-Null

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=true `
            --accept-routes=true

          $ip4 = (
            & $ts ip -4 |
            Select-Object -First 1
          )

          "TAILSCALE_IP=$ip4" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host "TAILSCALE IP: $ip4"


      # --------------------------------------------------------
      # RDP USER
      # --------------------------------------------------------

      - name: Enable RDP user + firewall
        shell: pwsh
        run: |
          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          if ([string]::IsNullOrWhiteSpace($u)) {
            throw "RDP_USER is empty."
          }

          if ([string]::IsNullOrWhiteSpace($p)) {
            throw "RDP_PASS is empty."
          }

          $sec = ConvertTo-SecureString `
            $p `
            -AsPlainText `
            -Force

          if (-not (
            Get-LocalUser `
              -Name $u `
              -ErrorAction SilentlyContinue
          )) {
            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser `
              -Name $u `
              -Password $sec

            Enable-LocalUser `
              -Name $u
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $u `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $u `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Out-Null

          Write-Host "RDP USER READY: $u"


      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Install Python libs
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            --force-reinstall `
            pyautogui `
            pynput `
            pillow


      # --------------------------------------------------------
      # LOCAL PERSISTENT-RDP STORAGE
      # --------------------------------------------------------

      - name: Prepare local persistent storage
        shell: pwsh
        run: |
          $root = "D:\Persistent-RDP"

          if (-not (Test-Path $root)) {
            New-Item `
              -ItemType Directory `
              -Path $root `
              -Force |
              Out-Null
          }

          New-Item `
            -ItemType Directory `
            -Path "$root\Projects\AE" `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$root\Assets\Fonts" `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$root\Persistent-Test" `
            -Force |
            Out-Null

          Write-Host "LOCAL STORAGE: $root"

          Get-Volume -DriveLetter D |
            Format-List DriveLetter,FileSystem,Size,SizeRemaining

          Write-Host "D: STORAGE READY"


      # --------------------------------------------------------
      # RESTORE PERSISTENCE TEST FROM TELEGRAM
      # --------------------------------------------------------

      - name: Restore persistent test files
        shell: pwsh
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python -m pip install telethon

          $script = @'
          import os
          import base64
          import hashlib
          import json
          from telethon import TelegramClient

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION_B64 = os.environ["SESSION_B64"]

          ROOT = r"D:\Persistent-RDP\Persistent-Test"
          INDEX_NAME = "PERSISTENT-RDP-TEST-INDEX"

          os.makedirs(ROOT, exist_ok=True)

          with open("unlim_session.session", "wb") as f:
              f.write(base64.b64decode(SESSION_B64))

          client = TelegramClient(
              "unlim_session",
              API_ID,
              API_HASH
          )

          def sha256(path):
              h = hashlib.sha256()

              with open(path, "rb") as f:
                  while True:
                      data = f.read(1024 * 1024)

                      if not data:
                          break

                      h.update(data)

              return h.hexdigest()

          async def main():
              await client.start()

              print("TELEGRAM CONNECTED")

              index_message = None

              async for msg in client.iter_messages(
                  "me",
                  search=INDEX_NAME,
                  limit=20
              ):
                  if msg.message and INDEX_NAME in msg.message:
                      index_message = msg
                      break

              if not index_message:
                  print(
                      "NO PREVIOUS PERSISTENT TEST FOUND"
                  )
                  return

              print(
                  f"FOUND PERSISTENT INDEX: "
                  f"{index_message.id}"
              )

              index_file = "persistent_test_index.json"

              await client.download_media(
                  index_message,
                  file=index_file
              )

              with open(
                  index_file,
                  "r",
                  encoding="utf-8"
              ) as f:
                  index = json.load(f)

              for record in index.get("files", []):
                  filename = record["name"]

                  message = await client.get_messages(
                      "me",
                      ids=record["message_id"]
                  )

                  if not message:
                      raise RuntimeError(
                          f"Missing Telegram message "
                          f"for {filename}"
                      )

                  destination = os.path.join(
                      ROOT,
                      filename
                  )

                  await client.download_media(
                      message,
                      file=destination
                  )

                  actual = sha256(destination)

                  if actual != record["sha256"]:
                      raise RuntimeError(
                          f"SHA256 FAILED: {filename}"
                      )

                  print(
                      f"RESTORE SUCCESS: {filename}"
                  )

              print("================================")
              print("PERSISTENT TEST RESTORE SUCCESS")
              print("================================")

          with client:
              client.loop.run_until_complete(main())
          '@

          Set-Content `
            -Path "$env:TEMP\restore_persistence.py" `
            -Value $script `
            -Encoding UTF8

          python "$env:TEMP\restore_persistence.py"


      # --------------------------------------------------------
      # TEST LOCAL STORAGE
      # --------------------------------------------------------

      - name: Test local storage
        shell: pwsh
        run: |
          $root = "D:\Persistent-RDP"

          $testDir = "$root\Persistent-RDP-Test"

          New-Item `
            -ItemType Directory `
            -Path $testDir `
            -Force |
            Out-Null

          $testFile = "$testDir\runner-test.txt"

          Set-Content `
            -Path $testFile `
            -Value "Persistent-RDP test $(Get-Date -Format o)" `
            -Encoding UTF8

          if (-not (Test-Path $testFile)) {
            throw "LOCAL STORAGE WRITE TEST FAILED."
          }

          $content = Get-Content `
            -Path $testFile `
            -Raw

          Write-Host "LOCAL STORAGE WRITE SUCCESS"
          Write-Host "LOCAL STORAGE READ SUCCESS"
          Write-Host "TEST CONTENT: $content"


      # --------------------------------------------------------
      # DISPLAY STORAGE STATUS
      # --------------------------------------------------------

      - name: Display storage status
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PERSISTENT-RDP LOCAL STORAGE"
          Write-Host "=========================================="

          Write-Host "Drive: D:"
          Write-Host "Path: D:\Persistent-RDP"

          Get-Volume -DriveLetter D |
            Format-List DriveLetter,FileSystem,Size,SizeRemaining

          if (Test-Path "D:\Persistent-RDP") {
            Write-Host "D:\Persistent-RDP READY"
          }
          else {
            throw "D:\Persistent-RDP missing."
          }

          Write-Host ""
          Write-Host "Storage tree:"

          Get-ChildItem `
            "D:\Persistent-RDP" `
            -Recurse `
            -Force |
            Select-Object FullName,Length,LastWriteTime


      # --------------------------------------------------------
      # RUSTDESK
      # --------------------------------------------------------

      - name: Install RustDesk
        shell: pwsh
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rdExe)) {
            $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"

            $installerPath = "$env:TEMP\rustdesk.msi"

            Invoke-WebRequest `
              -Uri $rdUrl `
              -OutFile $installerPath

            Start-Process `
              msiexec.exe `
              -ArgumentList `
                "/i", `
                "`"$installerPath`"", `
                "/quiet", `
                "/norestart" `
              -Wait

            Remove-Item `
              $installerPath `
              -Force
          }


      # --------------------------------------------------------
      # RUSTDESK PORTS
      # --------------------------------------------------------

      - name: Open RustDesk ports
        shell: pwsh
        run: |
          for ($p = 21115; $p -le 21119; $p++) {
            $name = "APP-PORT-TCP-$p"

            netsh advfirewall firewall delete rule `
              name=$name 2>$null

            netsh advfirewall firewall add rule `
              name=$name `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$p
          }


      # --------------------------------------------------------
      # LAUNCH RUSTDESK
      # --------------------------------------------------------

      - name: Launch RustDesk
        shell: pwsh
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"

          if (Test-Path $rdExe) {
            Start-Process `
              -FilePath $rdExe `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 5
          }


      # --------------------------------------------------------
      # KEEP ALIVE
      # --------------------------------------------------------

      - name: Keep alive
        shell: pwsh
        run: |
          $mins = [int]"${{ env.RUNTIME_MINUTES }}"

          $end = (
            Get-Date
          ).AddMinutes($mins)

          while (
            (Get-Date) -lt $end
          ) {
            Write-Host (
              "Heartbeat " +
              (Get-Date).ToString("HH:mm:ss")
            )

            Start-Sleep -Seconds 60
          }


      # --------------------------------------------------------
      # SAVE PERSISTENCE TEST TO TELEGRAM
      # --------------------------------------------------------

      - name: Save persistence test to Telegram
        if: always()
        shell: pwsh
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python -m pip install telethon

          $script = @'
          import os
          import base64
          import hashlib
          import json
          from telethon import TelegramClient

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION_B64 = os.environ["SESSION_B64"]

          ROOT = r"D:\Persistent-RDP\Persistent-Test"
          INDEX_NAME = "PERSISTENT-RDP-TEST-INDEX"

          with open("unlim_session.session", "wb") as f:
              f.write(base64.b64decode(SESSION_B64))

          client = TelegramClient(
              "unlim_session",
              API_ID,
              API_HASH
          )

          def sha256(path):
              h = hashlib.sha256()

              with open(path, "rb") as f:
                  while True:
                      data = f.read(1024 * 1024)

                      if not data:
                          break

                      h.update(data)

              return h.hexdigest()

          async def main():
              await client.start()

              print("TELEGRAM CONNECTED")

              if not os.path.isdir(ROOT):
                  print(
                      "PERSISTENT TEST DIRECTORY EMPTY"
                  )
                  return

              files = []

              for name in sorted(
                  os.listdir(ROOT)
              ):
                  path = os.path.join(
                      ROOT,
                      name
                  )

                  if os.path.isfile(path):
                      files.append(path)

              print(
                  f"FILES TO SAVE: {len(files)}"
              )

              records = []

              for path in files:
                  name = os.path.basename(path)
                  file_hash = sha256(path)
                  size = os.path.getsize(path)

                  print(
                      f"UPLOADING: {name}"
                  )

                  print(
                      f"SIZE: {size}"
                  )

                  print(
                      f"SHA256: {file_hash}"
                  )

                  message = await client.send_file(
                      "me",
                      path,
                      caption=(
                          "PERSISTENT-RDP-TEST-FILE\n"
                          f"name={name}\n"
                          f"sha256={file_hash}"
                      )
                  )

                  records.append({
                      "name": name,
                      "size": size,
                      "sha256": file_hash,
                      "message_id": message.id
                  })

                  print(
                      f"UPLOAD SUCCESS: "
                      f"{name} "
                      f"message_id={message.id}"
                  )

              with open(
                  "persistent_test_index.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      {
                          "version": 1,
                          "type":
                              "persistent-rdp-test",
                          "files": records
                      },
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              index_message = await client.send_file(
                  "me",
                  "persistent_test_index.json",
                  caption=INDEX_NAME
              )

              print(
                  f"INDEX SAVED: "
                  f"{index_message.id}"
              )

              print("================================")
              print("PERSISTENT TEST SAVE SUCCESS")
              print("================================")

          with client:
              client.loop.run_until_complete(main())
          '@

          Set-Content `
            -Path "$env:TEMP\save_persistence.py" `
            -Value $script `
            -Encoding UTF8

          python "$env:TEMP\save_persistence.py"


      # --------------------------------------------------------
      # STOP / NEXT
      # --------------------------------------------------------

      - name: Dispatch next or stop
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cycles = 0

          if ("${{ inputs.cycles }}" -match '^\d+$') {
            $cycles = [int]"${{ inputs.cycles }}"
          }

          if ($cycles -gt 0) {
            $next = $cycles - 1

            Write-Host "Next cycle: $next"
          }
          else {
            Write-Host "No cycles configured. Done."
          }
