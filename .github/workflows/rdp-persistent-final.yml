import os
import base64
import hashlib
import json
import math
import asyncio
import shutil

from datetime import datetime, timezone

from telethon import TelegramClient
from telethon.sessions import SQLiteSession


ROOT = r"D:\Persistent-RDP"

SYNC_ROOT = os.path.join(
    ROOT,
    "_sync"
)

SESSION_BASE = os.path.join(
    SYNC_ROOT,
    "unlim_session"
)

SESSION_FILE = (
    SESSION_BASE +
    ".session"
)

INDEX_FILE = os.path.join(
    SYNC_ROOT,
    "file_index.json"
)

CHUNK_SIZE = 4 * 1024 * 1024

INDEX_CAPTION = (
    "PERSISTENT-RDP-FILE-INDEX-V4"
)

CHUNK_PREFIX = (
    "PERSISTENT-RDP-CHUNK-V4"
)


def required_env(name):

    value = os.environ.get(
        name,
        ""
    ).strip()

    if not value:

        raise RuntimeError(
            name +
            " environment variable is missing."
        )

    return value


API_ID_RAW = required_env(
    "API_ID"
)

API_HASH = required_env(
    "API_HASH"
)

SESSION_B64 = required_env(
    "SESSION_B64"
)

try:

    API_ID = int(
        API_ID_RAW
    )

except ValueError:

    raise RuntimeError(
        "API_ID must be numeric."
    )


def utc_now():

    return datetime.now(
        timezone.utc
    ).isoformat()


def sha256(path):

    h = hashlib.sha256()

    with open(
        path,
        "rb"
    ) as f:

        while True:

            data = f.read(
                1024 * 1024
            )

            if not data:

                break

            h.update(
                data
            )

    return h.hexdigest()


def safe_path(relative_path):

    relative_path = (
        relative_path
        .replace(
            "/",
            os.sep
        )
        .replace(
            "\\",
            os.sep
        )
        .lstrip(
            os.sep
        )
    )

    destination = os.path.abspath(
        os.path.join(
            ROOT,
            relative_path
        )
    )

    root_abs = os.path.abspath(
        ROOT
    )

    if not (
        destination == root_abs
        or
        destination.startswith(
            root_abs + os.sep
        )
    ):

        raise RuntimeError(
            "Unsafe restore path: "
            + relative_path
        )

    return destination


def discover_files():

    result = []

    for current, dirs, files in os.walk(
        ROOT
    ):

        dirs[:] = sorted(
            d for d in dirs
            if d != "_sync"
            and d != "$RECYCLE.BIN"
            and d != "System Volume Information"
        )

        for name in sorted(
            files
        ):

            full = os.path.join(
                current,
                name
            )

            try:

                if os.path.islink(
                    full
                ):

                    continue

                size = os.path.getsize(
                    full
                )

                relative = os.path.relpath(
                    full,
                    ROOT
                ).replace(
                    "\\",
                    "/"
                )

                result.append({
                    "path":
                        "/" + relative,
                    "name":
                        name,
                    "size":
                        size,
                    "sha256":
                        sha256(
                            full
                        )
                })

            except Exception as e:

                print(
                    "DISCOVERY SKIP:",
                    full,
                    e
                )

    return result


def save_index(index):

    temp = (
        INDEX_FILE +
        ".tmp"
    )

    with open(
        temp,
        "w",
        encoding="utf-8"
    ) as f:

        json.dump(
            index,
            f,
            indent=2,
            ensure_ascii=False
        )

    os.replace(
        temp,
        INDEX_FILE
    )


async def find_latest_index(
    client
):

    found = None

    async for msg in client.iter_messages(
        "me",
        search=INDEX_CAPTION,
        limit=100
    ):

        if msg.file:

            found = msg

            break

    return found


async def download_index(
    client,
    message
):

    temp = (
        INDEX_FILE +
        ".download"
    )

    if os.path.exists(
        temp
    ):

        os.remove(
            temp
        )

    await client.download_media(
        message,
        file=temp
    )

    with open(
        temp,
        "r",
        encoding="utf-8"
    ) as f:

        index = json.load(
            f
        )

    os.remove(
        temp
    )

    return index


async def upload_index(
    client,
    index
):

    save_index(
        index
    )

    message = (
        await client.send_file(
            "me",
            INDEX_FILE,
            caption=INDEX_CAPTION
        )
    )

    print(
        "INDEX UPLOAD SUCCESS:",
        message.id
    )

    return message


async def upload_file(
    client,
    local_path,
    relative_path,
    old_record=None
):

    file_hash = sha256(
        local_path
    )

    size = os.path.getsize(
        local_path
    )

    if (
        old_record
        and
        old_record.get(
            "sha256"
        ) == file_hash
        and
        old_record.get(
            "size"
        ) == size
        and
        old_record.get(
            "chunks"
        )
    ):

        print(
            "UNCHANGED:",
            relative_path
        )

        return old_record

    print(
        "UPLOAD:",
        relative_path,
        "SIZE:",
        size
    )

    chunk_count = max(
        1,
        math.ceil(
            size /
            CHUNK_SIZE
        )
    )

    record = {
        "path":
            relative_path,
        "name":
            os.path.basename(
                local_path
            ),
        "size":
            size,
        "sha256":
            file_hash,
        "chunk_size":
            CHUNK_SIZE,
        "chunk_count":
            chunk_count,
        "chunks":
            [],
        "updated_at":
            utc_now()
    }

    with open(
        local_path,
        "rb"
    ) as f:

        for index in range(
            chunk_count
        ):

            data = f.read(
                CHUNK_SIZE
            )

            temp_name = os.path.join(
                SYNC_ROOT,
                "upload_chunk.bin"
            )

            if os.path.exists(
                temp_name
            ):

                os.remove(
                    temp_name
                )

            with open(
                temp_name,
                "wb"
            ) as out:

                out.write(
                    data
                )

            chunk_hash = sha256(
                temp_name
            )

            caption = (
                CHUNK_PREFIX
                + "\npath="
                + relative_path
                + "\nchunk="
                + str(index)
                + "\nchunks="
                + str(chunk_count)
                + "\nsha256="
                + chunk_hash
            )

            message = (
                await client.send_file(
                    "me",
                    temp_name,
                    caption=caption
                )
            )

            record[
                "chunks"
            ].append({
                "index":
                    index,
                "size":
                    len(data),
                "sha256":
                    chunk_hash,
                "telegram_message_id":
                    message.id
            })

            print(
                "CHUNK UPLOAD:",
                index + 1,
                "/",
                chunk_count,
                "MESSAGE:",
                message.id
            )

            os.remove(
                temp_name
            )

    return record


async def restore_file(
    client,
    record
):

    destination = safe_path(
        record[
            "path"
        ]
    )

    os.makedirs(
        os.path.dirname(
            destination
        ),
        exist_ok=True
    )

    temp = (
        destination +
        ".restore"
    )

    if os.path.exists(
        temp
    ):

        os.remove(
            temp
        )

    print(
        "RESTORE:",
        record[
            "path"
        ]
    )

    with open(
        temp,
        "wb"
    ) as out:

        for chunk in sorted(
            record[
                "chunks"
            ],
            key=lambda x:
                x["index"]
        ):

            message_id = chunk[
                "telegram_message_id"
            ]

            message = (
                await client.get_messages(
                    "me",
                    ids=message_id
                )
            )

            if not message:

                raise RuntimeError(
                    "Telegram message missing: "
                    + str(
                        message_id
                    )
                )

            chunk_file = os.path.join(
                SYNC_ROOT,
                "restore_chunk.bin"
            )

            if os.path.exists(
                chunk_file
            ):

                os.remove(
                    chunk_file
                )

            await client.download_media(
                message,
                file=chunk_file
            )

            actual_hash = sha256(
                chunk_file
            )

            if (
                actual_hash
                != chunk[
                    "sha256"
                ]
            ):

                raise RuntimeError(
                    "CHUNK HASH MISMATCH: "
                    + record[
                        "path"
                    ]
                )

            with open(
                chunk_file,
                "rb"
            ) as f:

                shutil.copyfileobj(
                    f,
                    out
                )

            os.remove(
                chunk_file
            )

    final_hash = sha256(
        temp
    )

    if (
        final_hash
        != record[
            "sha256"
        ]
    ):

        os.remove(
            temp
        )

        raise RuntimeError(
            "FILE HASH MISMATCH: "
            + record[
                "path"
            ]
        )

    os.replace(
        temp,
        destination
    )

    print(
        "RESTORE SUCCESS:",
        record[
            "path"
        ]
    )


async def connect_telegram():

    print(
        "TELEGRAM SESSION PREPARATION"
    )

    os.makedirs(
        SYNC_ROOT,
        exist_ok=True
    )

    # ----------------------------------------------------------
    # Decode the secret session only when there is no local
    # SQLite session yet.
    # ----------------------------------------------------------

    if not os.path.exists(
        SESSION_FILE
    ):

        print(
            "Creating Telegram SQLite session..."
        )

        try:

            session_bytes = (
                base64.b64decode(
                    SESSION_B64,
                    validate=True
                )
            )

        except Exception as e:

            raise RuntimeError(
                "TELEGRAM_SESSION base64 decode failed: "
                + str(e)
            )

        if len(
            session_bytes
        ) < 100:

            raise RuntimeError(
                "TELEGRAM_SESSION decoded data is too small."
            )

        with open(
            SESSION_FILE,
            "wb"
        ) as f:

            f.write(
                session_bytes
            )

        print(
            "TELEGRAM SESSION FILE CREATED"
        )

    else:

        print(
            "EXISTING TELEGRAM SESSION FOUND"
        )

    # ----------------------------------------------------------
    # IMPORTANT:
    #
    # SQLiteSession receives the BASE PATH,
    # not the filename as a normal string session.
    #
    # TelegramClient receives the SQLiteSession OBJECT.
    #
    # This is the fix for:
    # 'str' object has no attribute 'server_address'
    # ----------------------------------------------------------

    session = SQLiteSession(
        SESSION_BASE
    )

    client = TelegramClient(
        session,
        API_ID,
        API_HASH
    )

    await client.connect()

    if not await client.is_user_authorized():

        await client.disconnect()

        raise RuntimeError(
            "Telegram session is not authorized. "
            "The TELEGRAM_SESSION secret is invalid or expired."
        )

    print(
        "TELEGRAM CONNECTED SUCCESSFULLY"
    )

    return client


async def sync_once():

    print("")
    print(
        "================================"
    )
    print(
        "PERSISTENT SYNC START"
    )
    print(
        "================================"
    )

    print(
        "ROOT:",
        ROOT
    )

    os.makedirs(
        ROOT,
        exist_ok=True
    )

    os.makedirs(
        SYNC_ROOT,
        exist_ok=True
    )

    client = await connect_telegram()

    try:

        # ------------------------------------------------------
        # FIND REMOTE INDEX
        # ------------------------------------------------------

        remote_message = (
            await find_latest_index(
                client
            )
        )

        remote_index = None

        if remote_message:

            print(
                "REMOTE INDEX FOUND:",
                remote_message.id
            )

            remote_index = (
                await download_index(
                    client,
                    remote_message
                )
            )

            print(
                "REMOTE INDEX DOWNLOADED"
            )

        else:

            print(
                "NO REMOTE INDEX FOUND"
            )

        # ------------------------------------------------------
        # RESTORE FILES
        # ------------------------------------------------------

        if remote_index:

            remote_files = (
                remote_index.get(
                    "files",
                    []
                )
            )

            print(
                "REMOTE FILE COUNT:",
                len(
                    remote_files
                )
            )

            for record in remote_files:

                try:

                    destination = safe_path(
                        record[
                            "path"
                        ]
                    )

                    need_restore = True

                    if os.path.exists(
                        destination
                    ):

                        try:

                            local_hash = sha256(
                                destination
                            )

                            local_size = (
                                os.path.getsize(
                                    destination
                                )
                            )

                            if (
                                local_hash
                                ==
                                record[
                                    "sha256"
                                ]
                                and
                                local_size
                                ==
                                record[
                                    "size"
                                ]
                            ):

                                need_restore = False

                                print(
                                    "ALREADY CURRENT:",
                                    record[
                                        "path"
                                    ]
                                )

                        except Exception as e:

                            print(
                                "LOCAL CHECK WARNING:",
                                e
                            )

                    if need_restore:

                        await restore_file(
                            client,
                            record
                        )

                except Exception as e:

                    print(
                        "RESTORE FAILED:",
                        record.get(
                            "path",
                            "unknown"
                        ),
                        e
                    )

                    raise

        # ------------------------------------------------------
        # DISCOVER CURRENT LOCAL FILES
        # ------------------------------------------------------

        local_files = discover_files()

        print(
            "LOCAL FILE COUNT:",
            len(
                local_files
            )
        )

        old_map = {}

        if remote_index:

            for record in remote_index.get(
                "files",
                []
            ):

                old_map[
                    record[
                        "path"
                    ]
                ] = record

        new_records = []

        # ------------------------------------------------------
        # UPLOAD NEW OR CHANGED FILES
        # ------------------------------------------------------

        for item in local_files:

            local_path = safe_path(
                item[
                    "path"
                ]
            )

            old_record = old_map.get(
                item[
                    "path"
                ]
            )

            record = await upload_file(
                client,
                local_path,
                item[
                    "path"
                ],
                old_record
            )

            new_records.append(
                record
            )

        # ------------------------------------------------------
        # BUILD NEW INDEX
        # ------------------------------------------------------

        index = {
            "version":
                4,
            "type":
                "persistent-rdp-file-index",
            "updated_at":
                utc_now(),
            "storage": {
                "root":
                    ROOT,
                "chunk_size":
                    CHUNK_SIZE,
                "backend":
                    "telegram"
            },
            "files":
                new_records
        }

        save_index(
            index
        )

        print(
            "LOCAL INDEX CREATED"
        )

        # ------------------------------------------------------
        # UPLOAD INDEX
        # ------------------------------------------------------

        await upload_index(
            client,
            index
        )

        # ------------------------------------------------------
        # VERIFY INDEX
        # ------------------------------------------------------

        verify_message = (
            await find_latest_index(
                client
            )
        )

        if not verify_message:

            raise RuntimeError(
                "INDEX VERIFY FAILED"
            )

        verify_index = (
            await download_index(
                client,
                verify_message
            )
        )

        if (
            verify_index.get(
                "version"
            )
            != 4
        ):

            raise RuntimeError(
                "INDEX VERSION VERIFY FAILED"
            )

        if len(
            verify_index.get(
                "files",
                []
            )
        ) != len(
            new_records
        ):

            raise RuntimeError(
                "INDEX FILE COUNT VERIFY FAILED"
            )

        print(
            "INDEX VERIFY SUCCESS"
        )

        print(
            "================================"
        )

        print(
            "PERSISTENT SYNC SUCCESS"
        )

        print(
            "================================"
        )

    finally:

        await client.disconnect()


async def main():

    await sync_once()


asyncio.run(
    main()
)
