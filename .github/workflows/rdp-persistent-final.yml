                      )

                  files = index.get("files", [])

                  print(
                      f"FILES IN INDEX: {len(files)}"
                  )

                  restored = 0
                  skipped = 0
                  failed = 0

                  for record in files:

                      rel = record["path"]
                      expected_hash = record["sha256"]
                      expected_size = int(
                          record["size"]
                      )

                      target = safe_target(rel)

                      target.parent.mkdir(
                          parents=True,
                          exist_ok=True
                      )

                      if target.exists():

                          try:

                              if (
                                  target.stat().st_size
                                  == expected_size
                                  and
                                  sha256_file(target)
