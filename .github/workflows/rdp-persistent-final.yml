name: RDP + Tailscale + RustDesk + CRD + Google Drive Persistent C-D

on:
  schedule:
    - cron: '0 */5 * * *'

  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet"
        required: true

      ts_api_key:
        description: "Tailscale API key"
        required: true

      ts_authkey:
        description: "Tailscale Auth key"
        required: true

      quick_test:
        description: "Run 5-minute test"
        type: boolean
        default: false

      runtime_minutes:
        description: "Runtime (max 360; default 300)"
        required: false
        default: "300"

      do_purge:
        description: "Purge bullet devices at start"
        required: false
        default: "true"

      cycles:
        description: "0=stop after A; N=handoffs left"
        required: false
        default: "9999"

      rdp_count:
        description: "How many RDP instances (1-10)"
        required: false
        default: "1"

      crd_code:
        description: "Chrome Remote Desktop code/command"
        required: false
        default: ""

      crd_pin:
        description: "CRD PIN"
        required: false
        default: "123456"

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  setup:
    runs-on: ubuntu-latest
    continue-on-error: true

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:

      - id: mk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = [int]"${{ inputs.rdp_count }}"

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{
              id = $i
            }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          if ($n -gt 1) {
            $multi = '1'
          }
          else {
            $multi = '0'
          }

          "multi=$multi" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8


  rdp:
    needs: setup

    runs-on: windows-latest
    continue-on-error: true

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: ${{ secrets.RDP_PASS }}

    steps:

      - name: Set CRD flag early
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }


      - name: Install Chrome Remote Desktop Host
        if: env.CRD_ENABLED == '1'
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $exe =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            $exePath =
              "$env:TEMP\chromeremotedesktophost.exe"

            $ok = $false

            try {
              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile `
                $exePath `
                -ErrorAction SilentlyContinue

              Start-Process `
                -FilePath `
                $exePath `
                -ArgumentList "/silent","/install" `
                -Wait

              Remove-Item `
                $exePath `
                -Force `
                -ErrorAction SilentlyContinue

              $ok = $true
            }
            catch {
              Write-Host `
                "EXE installer failed: $($_.Exception.Message)"
            }

            if (-not $ok) {

              $msi =
                "$env:TEMP\chromeremotedesktophost.msi"

              try {
                Invoke-WebRequest `
                  -Uri `
                  "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                  -OutFile `
                  $msi `
                  -ErrorAction SilentlyContinue

                Start-Process `
                  msiexec.exe `
                  -ArgumentList `
                  "/i",`
                  "`"$msi`"",`
                  "/quiet",`
                  "/norestart" `
                  -Wait

                Remove-Item `
                  $msi `
                  -Force `
                  -ErrorAction SilentlyContinue
              } catch {}
            }
          }


      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin =
            "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            Write-Warning "crd_pin format warning."
          }

          $starter =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            Write-Warning "Chrome Remote Desktop starter not found."
          }

          $isFull = $false
          $code = $null

          if ($raw -match 'remoting_start_host\.exe') {
            $isFull = $true
          }

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {

            $code = (
              [regex]::Match(
                $raw,
                '--code\s*=\s*"?([^"\s]+)'
              )
            ).Groups[1].Value
          }
          elseif ($raw -match '^4\/') {
            $code = $raw
          }

          if ($code) {

            $redir =
              "https://remotedesktop.google.com/_/oauthredirect"

            $name =
              $Env:COMPUTERNAME

            $args = @(
              "--code=""$code""",
              "--redirect-url=""$redir""",
              "--name=""$name""",
              "--pin=""$pin"""
            )

            Start-Process `
              -FilePath $starter `
              -ArgumentList $args `
              -ErrorAction SilentlyContinue
          }
          elseif ($isFull) {

            $tmp =
              "$env:TEMP\crd_full.ps1"

            Set-Content `
              -Path $tmp `
              -Value $raw `
              -Encoding UTF8 `
              -ErrorAction SilentlyContinue

            powershell `
              -ExecutionPolicy Bypass `
              -File $tmp
          }
          else {
            Write-Warning "Could not detect CRD code."
          }


      - name: Verify CRD registration
        if: env.CRD_ENABLED == '1'
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $deadline =
            (Get-Date).AddSeconds(60)

          $ok = $false

          while ((Get-Date) -lt $deadline) {

            $svc =
              Get-Service `
                -Name "Chrome Remote Desktop Service" `
                -ErrorAction SilentlyContinue

            if (
              $svc -and
              $svc.Status -in @(
                'Running',
                'StartPending'
              )
            ) {
              $ok = $true
              break
            }

            Start-Sleep -Seconds 3
          }

          if ($ok) {
            Write-Host "CRD service is running or starting."
          }
          else {
            Write-Warning "CRD service not running yet."
          }


      - name: Decide hostname and runtime
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {
            if ("$v" -match '^\d+$') {
              [int]$v
            }
            else {
              [int]$d
            }
          }

          $runtime =
            IntOr(
              "${{ inputs.runtime_minutes }}",
              300
            )

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 300
          }

          if ($runtime -gt 360) {
            $runtime = 360
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host "Hostname: $hn"
          Write-Host "Runtime: $runtime minutes"


      - name: Purge bullet devices
        if: ${{ needs.setup.outputs.multi == '0' }}
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (Yes("${{ inputs.do_purge }}")) {

            try {

              $auth =
                [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes(
                    "${{ inputs.ts_api_key }}:"
                  )
                )

              $tn =
                [uri]::EscapeDataString(
                  "${{ inputs.ts_tailnet }}"
                )

              $list =
                Invoke-RestMethod `
                  -Uri `
                  "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                  -Headers @{
                    Authorization = "Basic $auth"
                  } `
                  -ErrorAction SilentlyContinue

              foreach ($d in $list.devices) {

                if ($d.hostname -match '^bullet[0-9]*$') {

                  Invoke-RestMethod `
                    -Method Delete `
                    -Uri `
                    "https://api.tailscale.com/api/v2/device/$($d.id)" `
                    -Headers @{
                      Authorization = "Basic $auth"
                    } `
                    -ErrorAction SilentlyContinue
                }
              }
            }
            catch {
              Write-Warning `
                "Purge warning: $($_.Exception.Message)"
            }
          }


      - name: Install + Up Tailscale
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          winget install `
            --id Tailscale.Tailscale `
            -e `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements 2>$null

          Start-Sleep -Seconds 5

          $ts =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            Write-Warning "Tailscale executable path check failed."
          }

          & $ts logout 2>$null |
            Out-Null

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=true `
            --accept-routes=true 2>$null

          $ip4 =
            & $ts ip -4 2>$null |
            Select-Object -First 1

          "TAILSCALE_IP=$ip4" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host "Tailscale IPv4: $ip4"


      - name: Enable RDP user and firewall
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          if ([string]::IsNullOrWhiteSpace($p)) {
            Write-Warning "RDP_PASS secret might be empty."
          }

          $sec =
            ConvertTo-SecureString `
              $p `
              -AsPlainText `
              -Force

          if (
            -not (
              Get-LocalUser `
                -Name $u `
                -ErrorAction SilentlyContinue
            )
          ) {

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires `
              -ErrorAction SilentlyContinue
          }
          else {

            Set-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires `
              -ErrorAction SilentlyContinue

            Enable-LocalUser `
              -Name $u `
              -ErrorAction SilentlyContinue
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $u `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $u `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0 `
            -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Out-Null

          Write-Host "RDP ready."


      - name: Install Python libraries
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          python -m pip install --upgrade pip 2>$null

          python -m pip install `
            --force-reinstall `
            pyautogui `
            pynput `
            pillow 2>$null

          python -c `
            "import pyautogui,pynput,PIL; print('Python libraries OK')" 2>$null


      - name: Install rclone and WinFsp
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $rcloneDir =
            "C:\Tools\rclone"

          $rclone =
            "$rcloneDir\rclone.exe"

          New-Item `
            -ItemType Directory `
            -Path $rcloneDir `
            -Force `
            -ErrorAction SilentlyContinue |
            Out-Null

          if (-not (Test-Path $rclone)) {

            $zip =
              "$env:TEMP\rclone.zip"

            $extract =
              "$env:TEMP\rclone_extract"

            try {
              Invoke-WebRequest `
                -Uri `
                "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
                -OutFile `
                $zip `
                -UseBasicParsing `
                -ErrorAction SilentlyContinue

              Expand-Archive `
                -Path $zip `
                -DestinationPath $extract `
                -Force `
                -ErrorAction SilentlyContinue

              $found =
                Get-ChildItem `
                  $extract `
                  -Recurse `
                  -Filter "rclone.exe" |
                Select-Object -First 1

              if ($found) {
                Copy-Item `
                  $found.FullName `
                  $rclone `
                  -Force `
                  -ErrorAction SilentlyContinue
              }

              Remove-Item `
                $zip `
                -Force `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $extract `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
            } catch {}
          }

          & $rclone version 2>$null

          $winfspPath =
            "C:\Program Files (x86)\WinFsp"

          if (-not (Test-Path $winfspPath)) {

            $msi =
              "$env:TEMP\winfsp.msi"

            try {
              Invoke-WebRequest `
                -Uri `
                "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" `
                -OutFile `
                $msi `
                -UseBasicParsing `
                -ErrorAction SilentlyContinue

              $proc =
                Start-Process `
                  msiexec.exe `
                  -ArgumentList `
                  "/i",`
                  "`"$msi`"",`
                  "/quiet",`
                  "/norestart" `
                  -Wait `
                  -PassThru

              Remove-Item `
                $msi `
                -Force `
                -ErrorAction SilentlyContinue
            } catch {}
          }

          "RCLONE_EXE=$rclone" |
            Out-File `
              -Append `
              $env:GITHUB_ENV


      - name: Prepare Google Drive configuration
        shell: pwsh
        continue-on-error: true
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          DRIVE_TOKEN1: ${{ secrets.DRIVE_TOKEN1 }}
          DRIVE_TOKEN2: ${{ secrets.DRIVE_TOKEN2 }}
          DRIVE_TOKEN3: ${{ secrets.DRIVE_TOKEN3 }}
          DRIVE_TOKEN4: ${{ secrets.DRIVE_TOKEN4 }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone =
            "$env:RCLONE_EXE"

          $configDir =
            "C:\ProgramData\Persistent-RDP\rclone"

          New-Item `
            -ItemType Directory `
            -Path $configDir `
            -Force `
            -ErrorAction SilentlyContinue |
            Out-Null

          $items = @(
            @{
              Secret = "DRIVE_TOKEN"
              Token = $env:DRIVE_TOKEN
              Name = "gdrive_g"
            }
            @{
              Secret = "DRIVE_TOKEN1"
              Token = $env:DRIVE_TOKEN1
              Name = "gdrive_h"
            }
            @{
              Secret = "DRIVE_TOKEN2"
              Token = $env:DRIVE_TOKEN2
              Name = "gdrive_i"
            }
            @{
              Secret = "DRIVE_TOKEN3"
              Token = $env:DRIVE_TOKEN3
              Name = "gdrive_j"
            }
            @{
              Secret = "DRIVE_TOKEN4"
              Token = $env:DRIVE_TOKEN4
              Name = "gdrive_k"
            }
          )

          foreach ($item in $items) {

            if ([string]::IsNullOrWhiteSpace($item.Token)) {
              Write-Warning "$($item.Secret) is missing."
              continue
            }

            try {
              $obj =
                $item.Token.Trim() |
                ConvertFrom-Json

              $token =
                $obj |
                ConvertTo-Json -Compress

              $config =
                "$configDir\$($item.Name).conf"

              @(
                "[$($item.Name)]"
                "type = drive"
                "scope = drive"
                "token = $token"
              ) |
                Set-Content `
                  -Path $config `
                  -Encoding UTF8

              & $rclone `
                --config $config `
                lsd `
                "$($item.Name):" `
                --timeout 60s 2>$null
            } catch {
              Write-Warning "Config processing warning for $($item.Secret)"
            }
          }

          "RCLONE_CONFIG_DIR=$configDir" |
            Out-File `
              -Append `
              $env:GITHUB_ENV


      - name: Prepare D persistent storage
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $rclone =
            "$env:RCLONE_EXE"

          $config =
            "$env:RCLONE_CONFIG_DIR\gdrive_g.conf"

          $dRoot =
            "D:\"

          $remote =
            "gdrive_g:.persistent-rdp/D-storage"

          New-Item `
            -ItemType Directory `
            -Path $dRoot `
            -Force `
            -ErrorAction SilentlyContinue |
            Out-Null

          Write-Host "Preparing D persistent storage..."

          & $rclone `
            --config $config `
            mkdir `
            $remote 2>$null

          Write-Host "Restoring D storage..."

          & $rclone `
            --config $config `
            copy `
            $remote `
            $dRoot `
            --fast-list `
            --no-traverse `
            --transfers 32 `
            --checkers 64 `
            --multi-thread-streams 64 `
            --multi-thread-cutoff 16M `
            --multi-thread-chunk-size 32M `
            --buffer-size 512M `
            --drive-chunk-size 1024M `
            --exclude "/Program Files/**" `
            --exclude "/Program Files (x86)/**" `
            --exclude "/ProgramData/**" `
            --exclude "/Users/**" `
            --exclude "/Windows/**" `
            --exclude "/Common Files/**" `
            --exclude "/`$RECYCLE.BIN/**" `
            --exclude "/System Volume Information/**" `
            --timeout 600s `
            --contimeout 30s `
            --retries 10 `
            --low-level-retries 30 `
            --ignore-errors `
            --stats 10s `
            --stats-one-line 2>$null

          "D_PERSIST_DIR=$dRoot" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host "D persistent storage is ready."


      - name: Link Adobe Settings from D to C (Symlink)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Creating Symlinks for Adobe Settings and Plugins..."

          # إنشاء المجلدات على القرص D إن لم تكن موجودة
          New-Item -ItemType Directory -Path "D:\Adobe_Data\Roaming_Adobe" -Force -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Path "D:\Adobe_Data\Common_Adobe" -Force -ErrorAction SilentlyContinue | Out-Null

          # تنظيف المسارات الافتراضية على C لمنع التعارض
          Remove-Item -Path "$env:APPDATA\Adobe" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Common Files\Adobe" -Recurse -Force -ErrorAction SilentlyContinue

          # إنشاء المجلدات الأب
          New-Item -ItemType Directory -Path "$env:APPDATA" -Force -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Path "C:\Program Files\Common Files" -Force -ErrorAction SilentlyContinue | Out-Null

          # ربط C بـ D باستخدام الوصلات الرمزية
          cmd /c mklink /D "$env:APPDATA\Adobe" "D:\Adobe_Data\Roaming_Adobe"
          cmd /c mklink /D "C:\Program Files\Common Files\Adobe" "D:\Adobe_Data\Common_Adobe"

          Write-Host "Adobe Symlinks established successfully."


      - name: Restore Drive files to local folders (Safe fallback for non-existent drives)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $rclone = "$env:RCLONE_EXE"
          $configDir = "$env:RCLONE_CONFIG_DIR"

          $drives = @(
            @{ Name = "G"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-G"; Remote = "gdrive_g:.persistent-rdp/files" }
            @{ Name = "H"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-H"; Remote = "gdrive_h:.persistent-rdp/files" }
            @{ Name = "I"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-I"; Remote = "gdrive_i:.persistent-rdp/files" }
            @{ Name = "J"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-J"; Remote = "gdrive_j:.persistent-rdp/files" }
            @{ Name = "K"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-K"; Remote = "gdrive_k:.persistent-rdp/files" }
          )

          foreach ($d in $drives) {
            New-Item -ItemType Directory -Path $d.Letter -Force -ErrorAction SilentlyContinue | Out-Null
            $conf = "$configDir\gdrive_$($d.Name.ToLower()).conf"
            if (Test-Path $conf) {
              Write-Host "Restoring Google Drive $($d.Name) files to local folder..."
              & $rclone --config $conf copy "$($d.Name):.persistent-rdp/files" "$($d.Letter)" --transfers 16 --timeout 300s --contimeout 20s --ignore-errors 2>$null
            }
          }
          exit 0


      - name: Create D persistent sync script
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $script =
            "C:\ProgramData\Persistent-RDP\Sync-D.ps1"

          $content = @'
          $ErrorActionPreference = "Continue"

          $rclone =
              "C:\Tools\rclone\rclone.exe"

          $config =
              "C:\ProgramData\Persistent-RDP\rclone\gdrive_g.conf"

          $dRoot =
              "D:\"

          $remote =
              "gdrive_g:.persistent-rdp/D-storage"

          if (
              (Test-Path $rclone) -and
              (Test-Path $config) -and
              (Test-Path $dRoot)
          ) {

              Write-Host "Uploading D:\ with high-speed multi-threading..."

              & $rclone `
                --config $config `
                copy `
                $dRoot `
                $remote `
                --fast-list `
                --transfers 32 `
                --checkers 64 `
                --multi-thread-streams 64 `
                --multi-thread-cutoff 16M `
                --multi-thread-chunk-size 32M `
                --buffer-size 512M `
                --drive-chunk-size 1024M `
                --exclude "/Program Files/**" `
                --exclude "/Program Files (x86)/**" `
                --exclude "/ProgramData/**" `
                --exclude "/Users/**" `
                --exclude "/Windows/**" `
                --exclude "/Common Files/**" `
                --exclude "/\`$RECYCLE.BIN/**" `
                --exclude "/System Volume Information/**" `
                --create-empty-src-dirs `
                --timeout 600s `
                --contimeout 30s `
                --retries 10 `
                --low-level-retries 30 `
                --ignore-errors `
                --stats 10s `
                --stats-one-line 2>$null
          }
          exit 0
          '@

          Set-Content `
            -Path $script `
            -Value $content `
            -Encoding UTF8 `
            -Force


      - name: Install persistent background sync
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $taskName =
            "Persistent-RDP-Periodic-Sync"

          $script =
            "C:\ProgramData\Persistent-RDP\Sync-D.ps1"

          Unregister-ScheduledTask `
            -TaskName $taskName `
            -Confirm:$false `
            -ErrorAction SilentlyContinue

          $action =
            New-ScheduledTaskAction `
              -Execute "powershell.exe" `
              -Argument `
              "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$script`""

          $trigger =
            New-ScheduledTaskTrigger `
              -Once `
              -At (Get-Date).AddMinutes(3) `
              -RepetitionInterval (New-TimeSpan -Minutes 5) `
              -RepetitionDuration (New-TimeSpan -Days 1)

          $settings =
            New-ScheduledTaskSettingsSet `
              -AllowStartIfOnBatteries `
              -DontStopIfGoingOnBatteries `
              -ExecutionTimeLimit ([TimeSpan]::Zero)

          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Trigger $trigger `
            -Settings $settings `
            -RunLevel Highest `
            -Force `
            -ErrorAction SilentlyContinue |
            Out-Null

          Write-Host "Periodic persistence task installed (Every 5 minutes for D:\)."


      - name: Verify persistence
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $required = @(
            "C:\Tools\rclone\rclone.exe"
            "C:\ProgramData\Persistent-RDP\rclone\gdrive_g.conf"
            "C:\ProgramData\Persistent-RDP\Sync-D.ps1"
            "D:\"
          )

          foreach ($path in $required) {

            if (-not (Test-Path $path)) {
              Write-Warning "Persistence path check missing: $path"
            }
          }

          Write-Host "=========================================="
          Write-Host "PERSISTENCE VERIFIED & OPTIMIZED"
          Write-Host "D:\ = full persistent workspace"
          Write-Host "Adobe Configs Symlinked smoothly to D:\"
          Write-Host "=========================================="


      - name: Install RustDesk
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rdExe)) {

            $installer =
              "$env:TEMP\rustdesk.msi"

            try {
              Invoke-WebRequest `
                -Uri `
                "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi" `
                -OutFile `
                $installer `
                -UseBasicParsing `
                -ErrorAction SilentlyContinue

              Start-Process `
                msiexec.exe `
                -ArgumentList `
                "/i",`
                "`"$installer`"",`
                "/quiet",`
                "/norestart" `
                -Wait

              Remove-Item `
                $installer `
                -Force `
                -ErrorAction SilentlyContinue
            } catch {}
          }


      - name: Open RustDesk ports
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          for (
            $p = 21115;
            $p -le 21119;
            $p++
          ) {

            $name =
              "APP-PORT-TCP-$p"

            netsh advfirewall firewall delete rule `
              name=$name `
              2>$null

            netsh advfirewall firewall add rule `
              name=$name `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$p 2>$null
          }

          netsh advfirewall firewall delete rule `
            name="APP-PORT-UDP-21116" `
            2>$null

          netsh advfirewall firewall add rule `
            name="APP-PORT-UDP-21116" `
            dir=in `
            action=allow `
            protocol=UDP `
            localport=21116 2>$null


      - name: Launch RustDesk
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (Test-Path $rdExe) {

            Start-Process `
              -FilePath $rdExe `
              -ErrorAction SilentlyContinue
          }


      - name: Display persistence status
        continue-on-error: true
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PERSISTENT-RDP OPTIMIZED STORAGE"
          Write-Host "=========================================="
          Write-Host "Periodic safe sync: every 5 minutes"
          Write-Host "Pre-shutdown sync: safe guarded"
          Write-Host "=========================================="


      - name: Keep alive with Safe Early Sync
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $mins = [int]"${{ env.RUNTIME_MINUTES }}"
          $end = (Get-Date).AddMinutes($mins)
          $syncScript = "C:\ProgramData\Persistent-RDP\Sync-D.ps1"
          
          $earlySyncTriggered = $false

          while ((Get-Date) -lt $end) {

            $remaining = ($end - (Get-Date)).TotalMinutes

            if (-not $earlySyncTriggered -and $remaining -le 8) {
              Write-Host "=== WARNING: Session ending soon! Running Safe Early Final Sync now ===" -ForegroundColor Yellow
              if (Test-Path $syncScript) {
                & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $syncScript 2>$null
              }
              $earlySyncTriggered = $true
            }

            if ("$env:CRD_ENABLED" -eq '1') {
              $mode = '[CRD+RustDesk/RDP+Fast-Persistence]'
            }
            else {
              $mode = '[RustDesk/RDP+Fast-Persistence]'
            }

            Write-Host (
              "$mode Heartbeat " +
              (Get-Date).ToString("HH:mm:ss") +
              " | ends " +
              $end.ToString("HH:mm:ss") +
              " | Rem: $([math]::Round($remaining, 1))m"
            )

            Start-Sleep -Seconds 60
          }


      - name: Final D persistence sync
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=========================================="
          Write-Host "ABSOLUTE FINAL PERSISTENCE SYNC (D ONLY)"
          Write-Host "=========================================="

          $dScript =
            "C:\ProgramData\Persistent-RDP\Sync-D.ps1"

          if (Test-Path $dScript) {
            Write-Host "Executing Final D sync..."
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $dScript 2>$null
          }

          Write-Host "Final safe persistence sync completed."


      - name: Dispatch next or stop
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"

          $cycles =
            [int]"${{ inputs.cycles }}"

          if ($cycles -le 0) {
            Write-Host "No cycles configured. Done."
            exit 0
          }

          $next =
            $cycles - 1

          if ($next -le 0) {

            $url =
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"

            $headers = @{
              Authorization =
                "Bearer $env:GH_TOKEN"

              Accept =
                "application/vnd.github+json"

              "X-GitHub-Api-Version" =
                "2022-11-28"
            }

            $payload = @{
              ts_tailnet =
                "${{ inputs.ts_tailnet }}"

              ts_api_key =
                "${{ inputs.ts_api_key }}"

              base_prefix =
                "bullet"

              max_count =
                "10"

              dry_run =
                "false"
            }

            $body =
              @{
                ref =
                  "${{ github.ref_name }}"

                inputs =
                  $payload
              } |
              ConvertTo-Json -Depth 20

            try {
              Invoke-RestMethod `
                -Method POST `
                -Uri $url `
                -Headers $headers `
                -ContentType "application/json" `
                -Body $body `
                -ErrorAction SilentlyContinue

              Write-Host "STOP workflow dispatched."
            } catch {
              Write-Warning "Dispatch stop failed silently."
            }
          }
          else {

            $payload = @{
              ts_tailnet =
                "${{ inputs.ts_tailnet }}"

              ts_api_key =
                "${{ inputs.ts_api_key }}"

              ts_authkey =
                "${{ inputs.ts_authkey }}"

              quick_test =
                "${{ inputs.quick_test }}"

              runtime_minutes =
                "300"

              do_purge =
                "true"

              cycles =
                "$next"

              rdp_count =
                "${{ inputs.rdp_count }}"

              crd_code =
                "${{ inputs.crd_code }}"

              crd_pin =
                "${{ inputs.crd_pin }}"
            }

            $url =
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-A.yml/dispatches"

            $headers = @{
              Authorization =
                "Bearer $env:GH_TOKEN"

              Accept =
                "application/vnd.github+json"

              "X-GitHub-Api-Version" =
                "2022-11-28"
            }

            $body =
              @{
                ref =
                  "${{ github.ref_name }}"

                inputs =
                  $payload
              } |
              ConvertTo-Json -Depth 20

            try {
              Invoke-RestMethod `
                -Method POST `
                -Uri $url `
                -Headers $headers `
                -ContentType "application/json" `
                -Body $body `
                -ErrorAction SilentlyContinue

              Write-Host "Next Workflow A dispatched."
            } catch {
              Write-Warning "Dispatch next workflow failed silently."
            }
          }
