name: RDP + Tailscale + RustDesk + Persistent C: Drive (1TB)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet", required: true }
      ts_api_key:         { description: "Tailscale API key", required: true }
      ts_authkey:         { description: "Tailscale Auth key", required: true }
      runtime_minutes:    { description: "Runtime minutes", required: false, default: "355" }

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 370
    env:
      RDP_USER: Yousif185
      RDP_PASS: Yousif1985

    steps:
      # ============================================================
      # 1. تحميل وتثبيت القرص الدائم 1TB
      # ============================================================
      - name: Mount 1TB Persistent Storage
        run: |
          $token = "${{ secrets.PAT_TOKEN }}"
          $owner = "${{ github.repository_owner }}"

          # إنشاء مجلد التخزين الدائم
          $storagePath = "C:\persistent_storage"
          New-Item -ItemType Directory -Path $storagePath -Force

          # استنساخ المستودعات (10 × 100GB = 1TB)
          for ($i=1; $i -le 10; $i++) {
            $repoName = "storage-$("{0:D2}" -f $i)"
            $repoPath = "$storagePath\disk_$("{0:D2}" -f $i)"
            $cloneUrl = "https://$owner`:$token@github.com/$owner/$repoName.git"

            if (Test-Path $repoPath) { Remove-Item -Path $repoPath -Recurse -Force }
            git clone $cloneUrl $repoPath
            cd $repoPath
            git lfs install
            git lfs track "*"
            git add .gitattributes
            git commit -m "Init" --allow-empty
            git push -u origin main
          }

          Write-Host "1TB persistent storage mounted at C:\persistent_storage"

      # ============================================================
      # 2. ربط C:\ بالمجلد الدائم (باستخدام Junction Points)
      # ============================================================
      - name: Link C:\ to Persistent Storage
        run: |
          $storagePath = "C:\persistent_storage"

          # المجلدات التي سنربطها
          $foldersToLink = @(
            "Program Files",
            "Program Files (x86)",
            "ProgramData",
            "Users",
            "Windows"
          )

          # استثناء المجلدات المهمة للنظام (نربطها بشكل آمن)
          foreach ($folder in $foldersToLink) {
            $source = "$storagePath\$folder"
            $target = "C:\$folder"

            # إذا كان المجلد موجوداً في C:\، انقله إلى التخزين الدائم
            if (Test-Path $target) {
              Write-Host "Moving $target to $source..."
              Move-Item -Path $target -Destination $source -Force -ErrorAction SilentlyContinue
            }

            # إنشاء رابط (Junction) من C:\ إلى التخزين الدائم
            if (-not (Test-Path $target)) {
              Write-Host "Creating junction from $target to $source..."
              New-Item -ItemType Junction -Path $target -Target $source -Force
            }
          }

          Write-Host "C: drive is now linked to persistent storage!"

      # ============================================================
      # 3. استعادة الإعدادات والريجستري
      # ============================================================
      - name: Restore Registry & Settings
        run: |
          $storagePath = "C:\persistent_storage"

          # استعادة الريجستري
          $regFiles = @(
            "$storagePath\HKLM.reg",
            "$storagePath\HKCU.reg",
            "$storagePath\HKCR.reg",
            "$storagePath\HKU.reg",
            "$storagePath\HKCC.reg"
          )

          foreach ($regFile in $regFiles) {
            if (Test-Path $regFile) {
              Write-Host "Restoring registry: $regFile"
              reg import $regFile
            }
          }

          # استعادة الاختصارات
          $desktopSource = "$storagePath\Desktop"
          $desktopDest = "C:\Users\$env:RDP_USER\Desktop"
          if (Test-Path $desktopSource) {
            Copy-Item -Path "$desktopSource\*" -Destination $desktopDest -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Registry and shortcuts restored!"

      # ============================================================
      # 4. مزامنة التغييرات (كل 10 دقائق)
      # ============================================================
      - name: Sync Changes to GitHub
        run: |
          $token = "${{ secrets.PAT_TOKEN }}"
          $owner = "${{ github.repository_owner }}"
          $storagePath = "C:\persistent_storage"

          while ($true) {
            Write-Host "Syncing C: drive changes to GitHub..."

            for ($i=1; $i -le 10; $i++) {
              $repoPath = "$storagePath\disk_$("{0:D2}" -f $i)"
              if (Test-Path $repoPath) {
                cd $repoPath
                git add .
                $changes = git status --porcelain
                if ($changes) {
                  Write-Host "Changes detected in disk_$("{0:D2}" -f $i)"
                  git commit -m "Auto-sync $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" --allow-empty
                  git push -u origin main
                }
              }
            }

            Start-Sleep -Seconds 600
          }

      # ============================================================
      # 5. باقي الخطوات (Tailscale, RDP, RustDesk, CRD...)
      # ============================================================
      - name: Install Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $url -OutFile $dst
            Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
            Remove-Item $dst -Force
          }
          & $ts logout | Out-Null
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "bullet-rdp" --accept-dns=true --accept-routes=true
          $ip4 = & $ts ip -4 | Select-Object -First 1
          "TAILSCALE_IP=$ip4" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Tailscale IPv4: $ip4"

      - name: Enable RDP user + firewall
        run: |
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
            Add-LocalGroupMember -Group "Administrators" -Member $u -EA SilentlyContinue
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -EA SilentlyContinue
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          Write-Host "RDP ready. user=$u pass=$p host=bullet-rdp ip=$env:TAILSCALE_IP"

      - name: Install RustDesk
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
            $installerPath = "$env:TEMP\rustdesk.msi"
            Invoke-WebRequest -Uri $rdUrl -OutFile $installerPath
            Start-Process msiexec.exe -ArgumentList "/i","`"$installerPath`"","/quiet","/norestart" -Wait
            Remove-Item $installerPath -Force
          }
          if (-not (Test-Path $rdExe)) { Write-Error "RustDesk not found"; exit 1 }
          Write-Host "RustDesk installed."

      - name: Open RustDesk ports
        run: |
          for ($p=21115; $p -le 21119; $p++) {
            netsh advfirewall firewall delete rule name="APP-PORT-TCP-$p" 2>$null
            netsh advfirewall firewall add rule name="APP-PORT-TCP-$p" dir=in action=allow protocol=TCP localport=$p
          }
          netsh advfirewall firewall delete rule name="APP-PORT-UDP-21116" 2>$null
          netsh advfirewall firewall add rule name="APP-PORT-UDP-21116" dir=in action=allow protocol=UDP localport=21116

      - name: Launch RustDesk + Screenshot
        run: |
          Start-Process -FilePath "C:\Program Files\RustDesk\rustdesk.exe" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          $screenshotPath = "$env:TEMP\rustdesk.png"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()

          $curlResult = curl -F "file=@$screenshotPath" https://store1.gofile.io/uploadFile
          $json = $curlResult | ConvertFrom-Json
          if ($json.status -eq "ok") { "SCREENSHOT_URL=$($json.data.downloadPage)" | Out-File -Append $env:GITHUB_ENV }

      - name: Keep alive
        run: |
          $mins = [int]"${{ inputs.runtime_minutes }}"
          $end = (Get-Date).AddMinutes($mins)
          while ((Get-Date) -lt $end) {
            Write-Host "Heartbeat $(Get-Date) | C: drive is persistent (1TB) | RS URL: $env:SCREENSHOT_URL"
            Start-Sleep -Seconds 60
          }

      - name: Final sync before exit
        if: always()
        run: |
          Write-Host "Final sync before exit..."

          $storagePath = "C:\persistent_storage"
          reg export HKLM "$storagePath\HKLM.reg"
          reg export HKCU "$storagePath\HKCU.reg"
          reg export HKCR "$storagePath\HKCR.reg"
          reg export HKU "$storagePath\HKU.reg"
          reg export HKCC "$storagePath\HKCC.reg"

          Copy-Item -Path "C:\Users\$env:RDP_USER\Desktop\*" -Destination "$storagePath\Desktop\" -Recurse -Force -ErrorAction SilentlyContinue

          $token = "${{ secrets.PAT_TOKEN }}"
          $owner = "${{ github.repository_owner }}"

          for ($i=1; $i -le 10; $i++) {
            $repoPath = "$storagePath\disk_$("{0:D2}" -f $i)"
            if (Test-Path $repoPath) {
              cd $repoPath
              git add .
              $changes = git status --porcelain
              if ($changes) {
                Write-Host "Syncing disk_$("{0:D2}" -f $i)"
                git commit -m "Final sync before exit" --allow-empty
                git push -u origin main
              }
            }
          }

          Write-Host "Final sync completed!"
