name: RDP + Tailscale + RustDesk + (Optional) CRD (A) - Auto-Renew + Google Drive Persistence

on:
  schedule:
    - cron: '0 */5 * * *'

  workflow_dispatch:
    inputs:

      ts_tailnet:
        description: "Tailscale tailnet (e.g. user@gmail.com)"
        required: true
        type: string

      ts_api_key:
        description: "Tailscale API key (device admin, no Bearer)"
        required: true
        type: string

      ts_authkey:
        description: "Tailscale Auth key (reusable or ephemeral)"
        required: true
        type: string

      quick_test:
        description: "Run 5-minute test"
        required: false
        type: boolean
        default: false

      runtime_minutes:
        description: "Runtime (max 360; default 300)"
        required: false
        type: string
        default: "300"

      do_purge:
        description: "Purge bullet* devices at start"
        required: false
        type: string
        default: "true"

      cycles:
        description: "0=stop after A; N=handoffs left including this run"
        required: false
        type: string
        default: "9999"

      rdp_count:
        description: "How many RDP instances (1-10)"
        required: false
        type: string
        default: "1"

      crd_code:
        description: "Optional CRD code/full command"
        required: false
        type: string
        default: ""

      crd_pin:
        description: "CRD PIN (6-12 digits)"
        required: false
        type: string
        default: "123456"


permissions:
  contents: write
  actions: write


defaults:
  run:
    shell: pwsh


jobs:

  # ============================================================
  # SETUP
  # ============================================================

  setup:

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:

      - name: Build matrix
        id: mk
        shell: pwsh
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $countText = "${{ inputs.rdp_count }}"

          if ([string]::IsNullOrWhiteSpace($countText)) {
              $countText = "1"
          }

          $n = 1

          if ($crd.Length -gt 0) {
              $n = 1
          }
          else {
              if ($countText -match '^\d+$') {
                  $n = [int]$countText
              }

              if ($n -lt 1) {
                  $n = 1
              }

              if ($n -gt 10) {
                  $n = 10
              }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
              $inc += @{
                  id = $i
              }
          }

          $json = @{
              include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
              Out-File `
                  $env:GITHUB_OUTPUT `
                  -Append `
                  -Encoding utf8

          if ($n -gt 1) {
              $multi = "1"
          }
          else {
              $multi = "0"
          }

          "multi=$multi" |
              Out-File `
                  $env:GITHUB_OUTPUT `
                  -Append `
                  -Encoding utf8

          Write-Host "Instances: $n"
          Write-Host "Multi: $multi"


  # ============================================================
  # RDP
  # ============================================================

  rdp:

    needs: setup

    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif1990

    steps:

      # ========================================================
      # NORMALIZE INPUTS
      # ========================================================

      - name: Normalize runtime and CRD
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
              "CRD_ENABLED=1" |
                  Out-File `
                      -Append `
                      $env:GITHUB_ENV
          }
          else {
              "CRD_ENABLED=0" |
                  Out-File `
                      -Append `
                      $env:GITHUB_ENV
          }

          function Yes($v) {
              return "$v" -match '^(?i:true|1|yes|on)$'
          }

          $runtimeText = "${{ inputs.runtime_minutes }}"

          if ([string]::IsNullOrWhiteSpace($runtimeText)) {
              $runtimeText = "300"
          }

          if ($runtimeText -match '^\d+$') {
              $runtime = [int]$runtimeText
          }
          else {
              $runtime = 300
          }

          $quick = "${{ inputs.quick_test }}"

          if (Yes($quick)) {
              $runtime = 5
          }

          if (-not (Yes($quick)) -and $runtime -lt 6) {
              $runtime = 300
          }

          if ($runtime -gt 360) {
              $runtime = 360
          }

          if ($runtime -lt 1) {
              $runtime = 1
          }

          "RUNTIME_MINUTES=$runtime" |
              Out-File `
                  -Append `
                  $env:GITHUB_ENV

          Write-Host "CRD_ENABLED=$([int]($crd.Length -gt 0))"
          Write-Host "Runtime: $runtime"


      # ========================================================
      # HOSTNAME
      # ========================================================

      - name: Decide hostname
        run: |

          $countText = "${{ inputs.rdp_count }}"

          if ([string]::IsNullOrWhiteSpace($countText)) {
              $countText = "1"
          }

          if (
              $countText -match '^\d+$' -and
              [int]$countText -gt 1
          ) {
              $hn = "bullet${{ matrix.id }}"
          }
          else {
              $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
              Out-File `
                  -Append `
                  $env:GITHUB_ENV

          Write-Host "Hostname: $hn"


      # ========================================================
      # CRD INSTALL
      # ========================================================

      - name: Install Chrome Remote Desktop Host
        if: env.CRD_ENABLED == '1'
        run: |

          $exe =
              "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

              Write-Host "CRD host not found. Installing..."

              $exePath =
                  "$env:TEMP\chromeremotedesktophost.exe"

              $installed = $false

              try {

                  Invoke-WebRequest `
                      -Uri `
                      "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                      -OutFile `
                      $exePath `
                      -UseBasicParsing `
                      -ErrorAction Stop

                  Start-Process `
                      -FilePath $exePath `
                      -ArgumentList "/silent","/install" `
                      -Wait

                  Remove-Item `
                      $exePath `
                      -Force `
                      -ErrorAction SilentlyContinue

                  $installed = $true

              }
              catch {

                  Write-Warning `
                      "CRD EXE installer failed: $($_.Exception.Message)"

              }

              if (-not $installed) {

                  $msi =
                      "$env:TEMP\chromeremotedesktophost.msi"

                  try {

                      Invoke-WebRequest `
                          -Uri `
                          "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                          -OutFile `
                          $msi `
                          -UseBasicParsing `
                          -ErrorAction Stop

                      Start-Process `
                          msiexec.exe `
                          -ArgumentList `
                          "/i",
                          "`"$msi`"",
                          "/quiet",
                          "/norestart" `
                          -Wait

                      Remove-Item `
                          $msi `
                          -Force `
                          -ErrorAction SilentlyContinue

                  }
                  catch {

                      throw `
                          "CRD MSI fallback failed: $($_.Exception.Message)"

                  }

              }

          }
          else {

              Write-Host "CRD host already installed."

          }


      # ========================================================
      # CRD START
      # ========================================================

      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        run: |

          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin =
              "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {

              throw "crd_pin must contain 6-12 digits."

          }

          $starter =
              "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {

              throw "remoting_start_host.exe not found."

          }

          $code = $null

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {

              $code =
                  [regex]::Match(
                      $raw,
                      '--code\s*=\s*"?([^"\s]+)'
                  ).Groups[1].Value

          }
          elseif ($raw -match '^4\/') {

              $code = $raw

          }

          if ($code) {

              $redir =
                  "https://remotedesktop.google.com/_/oauthredirect"

              $name =
                  $env:COMPUTERNAME

              $args = @(
                  "--code=""$code""",
                  "--redirect-url=""$redir""",
                  "--name=""$name""",
                  "--pin=""$pin"""
              )

              Start-Process `
                  -FilePath $starter `
                  -ArgumentList $args

          }
          elseif ($raw -match 'remoting_start_host\.exe') {

              $tmp =
                  "$env:TEMP\crd_full.ps1"

              Set-Content `
                  -Path $tmp `
                  -Value $raw `
                  -Encoding UTF8

              powershell.exe `
                  -ExecutionPolicy Bypass `
                  -File $tmp

          }
          else {

              throw "Could not detect a valid CRD code or command."

          }

          Write-Host "CRD launch completed."


      # ========================================================
      # CRD VERIFY
      # ========================================================

      - name: Verify CRD registration
        if: env.CRD_ENABLED == '1'
        run: |

          $deadline =
              (Get-Date).AddSeconds(60)

          $ok = $false

          while ((Get-Date) -lt $deadline) {

              $svc =
                  Get-Service `
                      -Name "Chrome Remote Desktop Service" `
                      -ErrorAction SilentlyContinue

              if (
                  $svc -and
                  $svc.Status -in @(
                      "Running",
                      "StartPending"
                  )
              ) {

                  $ok = $true
                  break

              }

              Start-Sleep -Seconds 3

          }

          if ($ok) {

              Write-Host "CRD service is running or starting."

          }
          else {

              Write-Warning "CRD service is not running yet."

          }


      # ========================================================
      # PURGE
      # ========================================================

      - name: Purge bullet devices
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |

          function Yes($v) {
              return "$v" -match '^(?i:true|1|yes|on)$'
          }

          $purge =
              "${{ inputs.do_purge }}"

          if ([string]::IsNullOrWhiteSpace($purge)) {
              $purge = "true"
          }

          if (Yes($purge)) {

              try {

                  if (
                      [string]::IsNullOrWhiteSpace(
                          "${{ inputs.ts_api_key }}"
                      )
                  ) {
                      Write-Warning "Tailscale API key is empty. Skipping purge."
                  }
                  else {

                      $auth =
                          [Convert]::ToBase64String(
                              [Text.Encoding]::ASCII.GetBytes(
                                  "${{ inputs.ts_api_key }}:"
                              )
                          )

                      $tn =
                          [uri]::EscapeDataString(
                              "${{ inputs.ts_tailnet }}"
                          )

                      $list =
                          Invoke-RestMethod `
                              -Uri `
                              "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                              -Headers @{
                                  Authorization = "Basic $auth"
                              }

                      foreach ($d in $list.devices) {

                          if (
                              $d.hostname -match '^bullet[0-9]*$'
                          ) {

                              Write-Host `
                                  "Deleting device: $($d.hostname)"

                              Invoke-RestMethod `
                                  -Method Delete `
                                  -Uri `
                                  "https://api.tailscale.com/api/v2/device/$($d.id)" `
                                  -Headers @{
                                      Authorization = "Basic $auth"
                                  } `
                                  -ErrorAction SilentlyContinue

                          }

                      }

                      Write-Host "Purge completed."

                  }

              }
              catch {

                  Write-Warning `
                      "Purge warning: $($_.Exception.Message)"

              }

          }
          else {

              Write-Host "Purge disabled."

          }


      # ========================================================
      # TAILSCALE
      # ========================================================

      - name: Install + Up Tailscale
        run: |

          $ErrorActionPreference = "Stop"

          if (
              [string]::IsNullOrWhiteSpace(
                  "${{ inputs.ts_authkey }}"
              )
          ) {

              throw "Tailscale Auth key is empty."

          }

          winget install `
              --id Tailscale.Tailscale `
              -e `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements

          Start-Sleep -Seconds 5

          $ts =
              "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {

              throw "Tailscale executable not found."

          }

          & $ts logout 2>$null |
              Out-Null

          & $ts up `
              --authkey "${{ inputs.ts_authkey }}" `
              --hostname "$env:TS_HOSTNAME" `
              --accept-dns=true `
              --accept-routes=true

          if ($LASTEXITCODE -ne 0) {

              throw "Tailscale failed to connect."

          }

          $ip4 =
              & $ts ip -4 |
              Select-Object -First 1

          if (
              [string]::IsNullOrWhiteSpace($ip4)
          ) {

              throw "Could not obtain Tailscale IPv4."

          }

          "TAILSCALE_IP=$ip4" |
              Out-File `
                  -Append `
                  $env:GITHUB_ENV

          Write-Host "Tailscale IPv4: $ip4"


      # ========================================================
      # RDP USER
      # ========================================================

      - name: Enable RDP user + firewall
        run: |

          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          $sec =
              ConvertTo-SecureString `
                  $p `
                  -AsPlainText `
                  -Force

          $existing =
              Get-LocalUser `
                  -Name $u `
                  -ErrorAction SilentlyContinue

          if (-not $existing) {

              New-LocalUser `
                  -Name $u `
                  -Password $sec `
                  -AccountNeverExpires

          }
          else {

              Set-LocalUser `
                  -Name $u `
                  -Password $sec `
                  -AccountNeverExpires

              Enable-LocalUser `
                  -Name $u

          }

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $u `
              -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $u `
              -ErrorAction SilentlyContinue

          Set-ItemProperty `
              "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
              -Name fDenyTSConnections `
              -Value 0

          Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop" |
              Out-Null

          Write-Host "=========================================="
          Write-Host "RDP READY"
          Write-Host "=========================================="
          Write-Host "User: $u"
          Write-Host "Host: $env:TS_HOSTNAME"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "=========================================="


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Install Python libs
        run: |

          python -m pip install `
              --upgrade `
              pip

          python -m pip install `
              --force-reinstall `
              pyautogui `
              pynput `
              pillow

          python -c `
              "import pyautogui, pynput, PIL; print('Python libs OK')"


      # ========================================================
      # RCLONE + WINFSP
      # ========================================================

      - name: Install rclone + WinFsp
        run: |

          $ErrorActionPreference = "Stop"

          # ----------------------------------------------------
          # RCLONE
          # ----------------------------------------------------

          $rcloneDir =
              "C:\Tools\rclone"

          $rcloneExe =
              "$rcloneDir\rclone.exe"

          New-Item `
              -ItemType Directory `
              -Path $rcloneDir `
              -Force |
              Out-Null

          if (-not (Test-Path $rcloneExe)) {

              Write-Host "Downloading rclone..."

              $zip =
                  "$env:TEMP\rclone.zip"

              $extract =
                  "$env:TEMP\rclone_extract"

              Invoke-WebRequest `
                  -Uri `
                  "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
                  -OutFile `
                  $zip `
                  -UseBasicParsing `
                  -ErrorAction Stop

              Expand-Archive `
                  -Path $zip `
                  -DestinationPath $extract `
                  -Force

              $found =
                  Get-ChildItem `
                      $extract `
                      -Recurse `
                      -Filter "rclone.exe" |
                  Select-Object -First 1

              if (-not $found) {
                  throw "rclone.exe was not found."
              }

              Copy-Item `
                  $found.FullName `
                  $rcloneExe `
                  -Force

              Remove-Item `
                  $zip `
                  -Force `
                  -ErrorAction SilentlyContinue

              Remove-Item `
                  $extract `
                  -Recurse `
                  -Force `
                  -ErrorAction SilentlyContinue

          }

          if (-not (Test-Path $rcloneExe)) {
              throw "rclone installation failed."
          }

          & $rcloneExe version

          if ($LASTEXITCODE -ne 0) {
              throw "rclone executable test failed."
          }


          # ----------------------------------------------------
          # WINFSP
          # ----------------------------------------------------

          $winfspPath =
              "C:\Program Files (x86)\WinFsp"

          $winfspMsi =
              "$env:TEMP\winfsp-2.1.25156.msi"

          if (-not (Test-Path $winfspPath)) {

              Write-Host "Downloading WinFsp 2.1.25156..."

              $winfspUrl =
                  "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi"

              Invoke-WebRequest `
                  -Uri `
                  $winfspUrl `
                  -OutFile `
                  $winfspMsi `
                  -UseBasicParsing `
                  -ErrorAction Stop

              if (-not (Test-Path $winfspMsi)) {
                  throw "WinFsp MSI was not downloaded."
              }

              $size =
                  (Get-Item $winfspMsi).Length

              if ($size -lt 1000000) {
                  throw "WinFsp MSI appears invalid."
              }

              $proc =
                  Start-Process `
                      msiexec.exe `
                      -ArgumentList `
                      "/i",
                      "`"$winfspMsi`"",
                      "/quiet",
                      "/norestart" `
                      -Wait `
                      -PassThru

              if ($proc.ExitCode -ne 0) {

                  throw `
                      "WinFsp installation failed. Exit code: $($proc.ExitCode)"

              }

              Remove-Item `
                  $winfspMsi `
                  -Force `
                  -ErrorAction SilentlyContinue

          }

          if (-not (Test-Path $winfspPath)) {
              throw "WinFsp installation verification failed."
          }

          Write-Host "=========================================="
          Write-Host "rclone + WinFsp READY"
          Write-Host "=========================================="


      # ========================================================
      # GOOGLE DRIVE CONFIG
      # ========================================================

      - name: Prepare Google Drive persistence
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: |

          $ErrorActionPreference = "Stop"

          $rclone =
              "C:\Tools\rclone\rclone.exe"

          if (-not (Test-Path $rclone)) {
              throw "rclone.exe missing."
          }

          if (
              [string]::IsNullOrWhiteSpace(
                  $env:DRIVE_TOKEN
              )
          ) {
              throw "DRIVE_TOKEN secret is missing."
          }

          $user =
              $env:RDP_USER

          $profile =
              "C:\Users\$user"

          $configDir =
              "$profile\AppData\Roaming\rclone"

          $config =
              "$configDir\rclone.conf"

          New-Item `
              -ItemType Directory `
              -Path $configDir `
              -Force |
              Out-Null

          try {

              $tokenObject =
                  $env:DRIVE_TOKEN.Trim() |
                  ConvertFrom-Json

          }
          catch {

              throw `
                  "DRIVE_TOKEN is not valid JSON."

          }

          if (
              [string]::IsNullOrWhiteSpace(
                  "$($tokenObject.access_token)"
              )
          ) {
              throw "DRIVE_TOKEN does not contain access_token."
          }

          $tokenJson =
              $tokenObject |
              ConvertTo-Json -Compress

          $configText = @"
[gdrive]
type = drive
scope = drive
token = $tokenJson
"@

          Set-Content `
              -Path $config `
              -Value $configText `
              -Encoding UTF8

          icacls `
              $configDir `
              /grant "${user}:(OI)(CI)F" `
              /T `
              /C |
              Out-Null

          Write-Host "Testing Google Drive..."

          & $rclone `
              --config $config `
              lsd `
              gdrive: `
              --timeout 60s

          if ($LASTEXITCODE -ne 0) {
              throw "Google Drive authentication failed."
          }

          & $rclone `
              --config $config `
              mkdir `
              "gdrive:.persistent-rdp"

          & $rclone `
              --config $config `
              mkdir `
              "gdrive:.persistent-rdp/files"

          if ($LASTEXITCODE -ne 0) {
              throw "Google Drive persistent folder creation failed."
          }

          "RCLONE_EXE=$rclone" |
              Out-File `
                  -Append `
                  $env:GITHUB_ENV

          "RCLONE_CONFIG=$config" |
              Out-File `
                  -Append `
                  $env:GITHUB_ENV

          "RDP_PROFILE=$profile" |
              Out-File `
                  -Append `
                  $env:GITHUB_ENV

          Write-Host "Google Drive configuration prepared."


      # ========================================================
      # CREATE PERSISTENCE SCRIPTS
      # ========================================================

      - name: Install persistence at RDP user logon
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: |

          $ErrorActionPreference = "Stop"

          $user =
              $env:RDP_USER

          $pass =
              $env:RDP_PASS

          $profile =
              "C:\Users\$user"

          $config =
              "$profile\AppData\Roaming\rclone\rclone.conf"

          $rclone =
              "C:\Tools\rclone\rclone.exe"

          $persistDir =
              "C:\ProgramData\Persistent-RDP"

          New-Item `
              -ItemType Directory `
              -Path $persistDir `
              -Force |
              Out-Null


          # ----------------------------------------------------
          # DRIVE MOUNT
          # ----------------------------------------------------

          $mountScript =
              "$persistDir\Start-PersistentDrive.ps1"

          @"
`$ErrorActionPreference = "Continue"

`$rclone = "$rclone"
`$config = "$config"
`$log = "C:\ProgramData\Persistent-RDP\rclone-mount.log"

Start-Sleep -Seconds 3

Get-Process rclone -ErrorAction SilentlyContinue |
    Where-Object {
        `$_.Path -eq `$rclone
    } |
    Stop-Process -Force -ErrorAction SilentlyContinue

Start-Sleep -Seconds 2

if (-not (Test-Path "G:\")) {

    `$args = @(
        "--config",
        `$config,
        "mount",
        "gdrive:.persistent-rdp/files",
        "G:",
        "--network-mode",
        "--volname",
        "Persistent-RDP",
        "--vfs-cache-mode",
        "full",
        "--vfs-cache-max-size",
        "10G",
        "--dir-cache-time",
        "30s",
        "--poll-interval",
        "30s",
        "--transfers",
        "4",
        "--checkers",
        "8",
        "--timeout",
        "1m",
        "--contimeout",
        "10s",
        "--log-file",
        `$log,
        "--log-level",
        "INFO"
    )

    Start-Process `
        -FilePath `$rclone `
        -ArgumentList `$args `
        -WindowStyle Hidden
}
"@ |
              Set-Content `
                  -Path $mountScript `
                  -Encoding UTF8


          # ----------------------------------------------------
          # MONITOR
          # ----------------------------------------------------

          $monitorScript =
              "$persistDir\Start-PersistentMonitor.ps1"

          @"
`$ErrorActionPreference = "Continue"

`$rclone = "$rclone"
`$config = "$config"
`$userRoot = "$profile"
`$remoteRoot = "gdrive:.persistent-rdp/files"

function Is-Excluded([string]`$path) {

    return (
        `$path.IndexOf(
            "\AppData\",
            [System.StringComparison]::OrdinalIgnoreCase
        ) -ge 0
    )
}

function Relative([string]`$path) {

    return (
        `$path.Substring(
            `$userRoot.Length
        ).TrimStart("\").Replace("\","/")
    )
}

function Upload([string]`$path) {

    if (-not (Test-Path -LiteralPath `$path -PathType Leaf)) {
        return
    }

    if (Is-Excluded `$path) {
        return
    }

    try {

        `$relative = Relative `$path

        if ([string]::IsNullOrWhiteSpace(`$relative)) {
            return
        }

        `$remote = "`$remoteRoot/`$relative"

        Write-Host "PERSIST: `$relative"

        & `$rclone `
            --config `$config `
            copyto `
            `$path `
            `$remote `
            --timeout 300s `
            --retries 3 `
            --low-level-retries 10

        if (`$LASTEXITCODE -eq 0) {
            Write-Host "SAVED: `$relative"
        }

    }
    catch {

        Write-Warning `
            "Upload error: `$(`$_.Exception.Message)"

    }
}

function Delete-Remote([string]`$path) {

    if (Is-Excluded `$path) {
        return
    }

    try {

        `$relative =
            Relative `$path

        `$remote =
            "`$remoteRoot/`$relative"

        & `$rclone `
            --config `$config `
            deletefile `
            `$remote `
            --timeout 120s `
            --retries 3 `
            --low-level-retries 10 |
            Out-Null

    }
    catch {}

}

`$watcher =
    New-Object System.IO.FileSystemWatcher

`$watcher.Path =
    `$userRoot

`$watcher.IncludeSubdirectories =
    `$true

`$watcher.NotifyFilter =
    [System.IO.NotifyFilters]::FileName `
    -bor
    [System.IO.NotifyFilters]::DirectoryName `
    -bor
    [System.IO.NotifyFilters]::LastWrite `
    -bor
    [System.IO.NotifyFilters]::Size

`$watcher.EnableRaisingEvents =
    `$true

Register-ObjectEvent `
    `$watcher `
    Created `
    -Action {
        Upload `$Event.SourceEventArgs.FullPath
    } |
    Out-Null

Register-ObjectEvent `
    `$watcher `
    Changed `
    -Action {

        Start-Sleep -Milliseconds 700

        Upload `$Event.SourceEventArgs.FullPath

    } |
    Out-Null

Register-ObjectEvent `
    `$watcher `
    Renamed `
    -Action {
        Upload `$Event.SourceEventArgs.FullPath
    } |
    Out-Null

Register-ObjectEvent `
    `$watcher `
    Deleted `
    -Action {
        Delete-Remote `$Event.SourceEventArgs.FullPath
    } |
    Out-Null

Write-Host "=========================================="
Write-Host "PERSISTENT-RDP MONITOR ACTIVE"
Write-Host "Watching: `$userRoot"
Write-Host "Excluded: AppData"
Write-Host "=========================================="

while (`$true) {
    Start-Sleep -Seconds 10
}
"@ |
              Set-Content `
                  -Path $monitorScript `
                  -Encoding UTF8


          # ----------------------------------------------------
          # RESTORE
          # ----------------------------------------------------

          $restoreScript =
              "$persistDir\Restore-PersistentFiles.ps1"

          @"
`$ErrorActionPreference = "Continue"

`$rclone = "$rclone"
`$config = "$config"
`$userRoot = "$profile"
`$remoteRoot = "gdrive:.persistent-rdp/files"
`$mountScript = "$mountScript"
`$monitorScript = "$monitorScript"

if (Test-Path `$rclone) {

    & `$rclone `
        --config `$config `
        copy `
        `$remoteRoot `
        `$userRoot `
        --create-empty-src-dirs `
        --timeout 300s `
        --retries 3 `
