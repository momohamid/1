                      skipped
                  )
                  print(
                      "FAILED:",
                      failed
                  )
                  print("==============================")

                  if failed:
                      raise RuntimeError(
                          "Some persistent files failed to restore."
                      )

          import asyncio
          asyncio.run(restore())
