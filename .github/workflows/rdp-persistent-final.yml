name: RDP + Tailscale + RustDesk + (Optional) CRD (A) - Auto-Renew + Google Drive Persistence

on:
  schedule:
    - cron: '0 */5 * * *'

  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true

      ts_api_key:
        description: "Tailscale API key (device admin, no Bearer)"
        required: true

      ts_authkey:
        description: "Tailscale Auth key (reusable or ephemeral)"
        required: true

      quick_test:
        description: "Run 5-minute test"
        type: boolean
        default: false

      runtime_minutes:
        description: "Runtime (max 360; default 300 when not test)"
        required: false
        default: "300"

      do_purge:
        description: "Purge bullet* devices at start (single instance only)"
        required: false
        default: "true"

      cycles:
        description: "0=stop after A; N=handoffs left incl this run"
        required: false
        default: "9999"

      rdp_count:
        description: "How many RDP instances (1-10) [ignored if CRD provided]"
        required: false
        default: "1"

      crd_code:
        description: >-
          Paste raw CRD code (4/0AV...), full PowerShell command, or text/URL containing --code="4/...".
          If provided -> single instance; CRD launches first.
        required: false
        default: ""

      crd_pin:
        description: "CRD PIN (6–12 digits). Used when launching CRD to avoid interactive prompt."
        required: false
        default: "123456"

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:
      - id: mk
        shell: pwsh
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = [int]"${{ inputs.rdp_count }}"

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{
              id = $i
            }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          $multi =
            if ($n -gt 1) {
              '1'
            }
            else {
              '0'
            }

          "multi=$multi" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup

    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif1990

    steps:

      - name: Set CRD flag early
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File -Append $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File -Append $env:GITHUB_ENV
          }

      - name: Install Chrome Remote Desktop Host (if missing)
        if: env.CRD_ENABLED == '1'
        run: |
          $exe =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            $exePath =
              "$env:TEMP\chromeremotedesktophost.exe"

            $ok = $false

            try {
              Invoke-WebRequest `
                -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath $exePath `
                -ArgumentList "/silent","/install" `
                -Wait

              Remove-Item $exePath -Force -ErrorAction SilentlyContinue
              $ok = $true
            }
            catch {
              Write-Host "EXE installer failed: $($_.Exception.Message)"
            }

            if (-not $ok) {

              $msi =
                "$env:TEMP\chromeremotedesktophost.msi"

              try {
                Invoke-WebRequest `
                  -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                  -OutFile $msi `
                  -ErrorAction Stop

                Start-Process `
                  msiexec.exe `
                  -ArgumentList "/i","`"$msi`"","/quiet","/norestart" `
                  -Wait

                Remove-Item $msi -Force -ErrorAction SilentlyContinue
              }
              catch {
                Write-Error "CRD MSI fallback failed: $($_.Exception.Message)"
                exit 1
              }
            }
          }

      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin = "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            Write-Error "crd_pin must be 6–12 digits."
            exit 1
          }

          $starter =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            Write-Error "remoting_start_host.exe not found."
            exit 1
          }

          $isFull = $false
          $code = $null

          if ($raw -match 'remoting_start_host\.exe') {
            $isFull = $true
          }

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {
            $code =
              ([regex]::Match(
                $raw,
                '--code\s*=\s*"?([^"\s]+)'
              )).Groups[1].Value
          }
          elseif ($raw -match '^4\/') {
            $code = $raw
          }

          if ($code) {

            $redir =
              "https://remotedesktop.google.com/_/oauthredirect"

            $name =
              $Env:COMPUTERNAME

            $args = @(
              "--code=`"$code`"",
              "--redirect-url=`"$redir`"",
              "--name=`"$name`"",
              "--pin=`"$pin`""
            )

            Start-Process `
              -FilePath $starter `
              -ArgumentList $args
          }
          elseif ($isFull) {

            $tmp =
              "$env:TEMP\crd_full.ps1"

            Set-Content `
              -Path $tmp `
              -Value $raw `
              -Encoding UTF8

            powershell `
              -ExecutionPolicy Bypass `
              -File $tmp
          }
          else {
            Write-Error "Could not detect CRD code."
            exit 1
          }

      - name: Verify CRD registration
        if: env.CRD_ENABLED == '1'
        run: |
          $svcName =
            "Chrome Remote Desktop Service"

          $deadline =
            (Get-Date).AddSeconds(60)

          $ok = $false

          while ((Get-Date) -lt $deadline) {

            $svc =
              Get-Service `
                -Name $svcName `
                -ErrorAction SilentlyContinue

            if (
              $svc -and
              $svc.Status -in 'Running','StartPending'
            ) {
              $ok = $true
              break
            }

            Start-Sleep -Seconds 3
          }

          if ($ok) {
            Write-Host "CRD service is running or starting."
          }
          else {
            Write-Warning "CRD service not running yet."
          }

      - name: Decide hostname + runtime
        run: |
          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File -Append $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {
            if ("$v" -match '^\d+$') {
              [int]$v
            }
            else {
              [int]$d
            }
          }

          $runtime =
            IntOr("${{ inputs.runtime_minutes }}",300)

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 300
          }

          if ($runtime -gt 360) {
            $runtime = 360
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File -Append $env:GITHUB_ENV

          Write-Host "Hostname: $hn | Runtime: $runtime"

      - name: Purge bullet devices
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |
          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (Yes("${{ inputs.do_purge }}")) {

            try {

              $auth =
                [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes(
                    "${{ inputs.ts_api_key }}:"
                  )
                )

              $tn =
                [uri]::EscapeDataString(
                  "${{ inputs.ts_tailnet }}"
                )

              $list =
                Invoke-RestMethod `
                  -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                  -Headers @{ Authorization = "Basic $auth" }

              foreach ($d in $list.devices) {

                if ($d.hostname -match '^bullet[0-9]*$') {

                  Invoke-RestMethod `
                    -Method Delete `
                    -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" `
                    -Headers @{ Authorization = "Basic $auth" } `
                    -ErrorAction SilentlyContinue
                }
              }

              Write-Host "Purged bullet devices."
            }
            catch {
              Write-Host "Purge warning: $($_.Exception.Message)"
            }
          }
          else {
            Write-Host "Purge disabled."
          }

      - name: Install + Up Tailscale
        run: |
          winget install `
            --id Tailscale.Tailscale `
            -e `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Start-Sleep -Seconds 5

          $ts =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $ts) {

            & $ts logout | Out-Null

            & $ts up `
              --authkey "${{ inputs.ts_authkey }}" `
              --hostname "$env:TS_HOSTNAME" `
              --accept-dns=true `
              --accept-routes=true

            $ip4 =
              & $ts ip -4 |
              Select-Object -First 1

            "TAILSCALE_IP=$ip4" |
              Out-File -Append $env:GITHUB_ENV

            Write-Host "Tailscale IPv4: $ip4"
          }
          else {
            Write-Error "Tailscale not found."
            exit 1
          }

      - name: Enable RDP user + firewall
        run: |
          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          $sec =
            ConvertTo-SecureString `
              $p `
              -AsPlainText `
              -Force

          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires
          }
          else {

            Set-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

            Enable-LocalUser -Name $u
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $u `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $u `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Out-Null

          Write-Host "RDP ready."
          Write-Host "User: $u"
          Write-Host "Host: $env:TS_HOSTNAME"
          Write-Host "IP: $env:TAILSCALE_IP"

      - name: Create complete Yousif190 persistent profile paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $user = $env:RDP_USER
          $root = "C:\Users\$user"

          $paths = @(
            $root,
            "$root\Desktop",
            "$root\Documents",
            "$root\Downloads",
            "$root\Pictures",
            "$root\Videos",
            "$root\Music",
            "$root\Favorites",
            "$root\Links",
            "$root\Saved Games",
            "$root\Searches",
            "$root\Contacts",
            "$root\AppData",
            "$root\AppData\Local",
            "$root\AppData\LocalLow",
            "$root\AppData\Local\Temp",
            "$root\AppData\Local\Packages",
            "$root\AppData\Local\Microsoft",
            "$root\AppData\Local\Programs",
            "$root\AppData\Local\Programs\Common",
            "$root\AppData\Roaming",
            "$root\AppData\Roaming\Microsoft",
            "$root\AppData\Roaming\Microsoft\Windows",
            "$root\AppData\Roaming\Microsoft\Windows\Start Menu",
            "$root\AppData\Roaming\Microsoft\Windows\Start Menu\Programs",
            "$root\AppData\Roaming\Microsoft\Windows\Recent",
            "$root\AppData\Roaming\Microsoft\Windows\SendTo",
            "$root\AppData\Roaming\Microsoft\Windows\Templates",
            "$root\AppData\Roaming\Microsoft\Windows\Network Shortcuts",
            "$root\AppData\Roaming\Microsoft\Windows\Printer Shortcuts",
            "$root\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup",
            "$root\AppData\Roaming\Adobe",
            "$root\AppData\Roaming\Adobe\After Effects",
            "$root\AppData\Roaming\Adobe\After Effects\Auto-Save",
            "$root\AppData\Roaming\Adobe\After Effects\Presets",
            "$root\AppData\Roaming\Adobe\After Effects\Scripts",
            "$root\AppData\Roaming\Adobe\After Effects\Plug-ins",
            "$root\AppData\Local\Adobe",
            "$root\AppData\Local\Adobe\After Effects",
            "$root\AppData\Local\Adobe\After Effects\Auto-Save",
            "$root\AppData\Local\Adobe\After Effects\Cache",
            "$root\AppData\Local\Temp\Persistent-RDP",
            "$root\Projects",
            "$root\Projects\AE",
            "$root\Assets",
            "$root\Assets\Fonts",
            "$root\Assets\Plugins"
          )

          foreach ($path in $paths) {
            New-Item `
              -ItemType Directory `
              -Path $path `
              -Force |
              Out-Null
          }

          Write-Host "Complete Yousif190 profile created."

      - name: Install Python libs
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            --force-reinstall `
            pyautogui `
            pynput `
            pillow

          python -c "import pyautogui, pynput, PIL; print('Python libs OK')"

      - name: Install rclone + WinFsp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rcloneDir = "C:\Tools\rclone"
          $rcloneExe = "$rcloneDir\rclone.exe"

          New-Item `
            -ItemType Directory `
            -Path $rcloneDir `
            -Force |
            Out-Null

          if (-not (Test-Path $rcloneExe)) {

            $zip =
              "$env:TEMP\rclone.zip"

            $extract =
              "$env:TEMP\rclone_extract"

            Invoke-WebRequest `
              -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
              -OutFile $zip `
              -UseBasicParsing `
              -ErrorAction Stop

            Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force

            $found =
              Get-ChildItem `
                $extract `
                -Recurse `
                -Filter "rclone.exe" |
              Select-Object -First 1

            if (-not $found) {
              throw "rclone.exe was not found."
            }

            Copy-Item `
              $found.FullName `
              $rcloneExe `
              -Force

            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          }

          & $rcloneExe version

          if ($LASTEXITCODE -ne 0) {
            throw "rclone executable test failed."
          }

          $winfspPath =
            "C:\Program Files (x86)\WinFsp"

          $winfspMsi =
            "$env:TEMP\winfsp-2.1.25156.msi"

          if (-not (Test-Path $winfspPath)) {

            Invoke-WebRequest `
              -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" `
              -OutFile $winfspMsi `
              -UseBasicParsing `
              -ErrorAction Stop

            $proc =
              Start-Process `
                msiexec.exe `
                -ArgumentList "/i","`"$winfspMsi`"","/quiet","/norestart" `
                -Wait `
                -PassThru

            if ($proc.ExitCode -ne 0) {
              throw "WinFsp installation failed. MSI exit code: $($proc.ExitCode)"
            }

            Remove-Item $winfspMsi -Force -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $winfspPath)) {
            throw "WinFsp installation verification failed."
          }

          "RCLONE_EXE=$rcloneExe" |
            Out-File -Append $env:GITHUB_ENV

          Write-Host "rclone + WinFsp READY"

      - name: Prepare Google Drive persistence - 5 drives
        shell: pwsh
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          DRIVE_TOKEN1: ${{ secrets.DRIVE_TOKEN1 }}
          DRIVE_TOKEN2: ${{ secrets.DRIVE_TOKEN2 }}
          DRIVE_TOKEN3: ${{ secrets.DRIVE_TOKEN3 }}
          DRIVE_TOKEN4: ${{ secrets.DRIVE_TOKEN4 }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone =
            "C:\Tools\rclone\rclone.exe"

          $configDir =
            "C:\ProgramData\Persistent-RDP\rclone"

          New-Item `
            -ItemType Directory `
            -Path $configDir `
            -Force |
            Out-Null

          $driveDefinitions = @(
            @{
              Secret = "DRIVE_TOKEN"
              Token = $env:DRIVE_TOKEN
              Remote = "gdrive_g"
              Letter = "G:"
            },
            @{
              Secret = "DRIVE_TOKEN1"
              Token = $env:DRIVE_TOKEN1
              Remote = "gdrive_h"
              Letter = "H:"
            },
            @{
              Secret = "DRIVE_TOKEN2"
              Token = $env:DRIVE_TOKEN2
              Remote = "gdrive_i"
              Letter = "I:"
            },
            @{
              Secret = "DRIVE_TOKEN3"
              Token = $env:DRIVE_TOKEN3
              Remote = "gdrive_j"
              Letter = "J:"
            },
            @{
              Secret = "DRIVE_TOKEN4"
              Token = $env:DRIVE_TOKEN4
              Remote = "gdrive_k"
              Letter = "K:"
            }
          )

          foreach ($item in $driveDefinitions) {

            if ([string]::IsNullOrWhiteSpace($item.Token)) {
              throw "$($item.Secret) secret is missing."
            }

            $tokenObject =
              $item.Token.Trim() |
              ConvertFrom-Json

            if (-not $tokenObject.access_token) {
              throw "$($item.Secret) does not contain access_token."
            }

            $config =
              "$configDir\$($item.Remote).conf"

            $tokenJson =
              $tokenObject |
              ConvertTo-Json -Compress

            @"
[$($item.Remote)]
type = drive
scope = drive
token = $tokenJson
"@ |
              Set-Content `
                -Path $config `
                -Encoding UTF8

            & $rclone `
              --config $config `
              lsd `
              "$($item.Remote):" `
              --timeout 60s

            if ($LASTEXITCODE -ne 0) {
              throw "Google Drive authentication failed for $($item.Secret)."
            }

            & $rclone `
              --config $config `
              mkdir `
              "$($item.Remote):.persistent-rdp"

            & $rclone `
              --config $config `
              mkdir `
              "$($item.Remote):.persistent-rdp/files"
          }

          "RCLONE_CONFIG_DIR=$configDir" |
            Out-File -Append $env:GITHUB_ENV

          Write-Host "Five Google Drive configs created."

      - name: Create real rclone.conf for Yousif190 and five drives
        shell: pwsh
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          DRIVE_TOKEN1: ${{ secrets.DRIVE_TOKEN1 }}
          DRIVE_TOKEN2: ${{ secrets.DRIVE_TOKEN2 }}
          DRIVE_TOKEN3: ${{ secrets.DRIVE_TOKEN3 }}
          DRIVE_TOKEN4: ${{ secrets.DRIVE_TOKEN4 }}
        run: |
          $ErrorActionPreference = "Stop"

          $userRoot =
            "C:\Users\$env:RDP_USER"

          $rcloneAppData =
            "$userRoot\AppData\Roaming\rclone"

          $configDir =
            "C:\ProgramData\Persistent-RDP\rclone"

          New-Item `
            -ItemType Directory `
            -Path $rcloneAppData `
            -Force |
            Out-Null

          $realConfig =
            "$rcloneAppData\rclone.conf"

          $tokens = @(
            @{
              Name = "gdrive_g"
              Token = $env:DRIVE_TOKEN
            },
            @{
              Name = "gdrive_h"
              Token = $env:DRIVE_TOKEN1
            },
            @{
              Name = "gdrive_i"
              Token = $env:DRIVE_TOKEN2
            },
            @{
              Name = "gdrive_j"
              Token = $env:DRIVE_TOKEN3
            },
            @{
              Name = "gdrive_k"
              Token = $env:DRIVE_TOKEN4
            }
          )

          $lines =
            New-Object System.Collections.Generic.List[string]

          foreach ($item in $tokens) {

            if ([string]::IsNullOrWhiteSpace($item.Token)) {
              throw "Missing token for $($item.Name)."
            }

            $obj =
              $item.Token.Trim() |
              ConvertFrom-Json

            if (-not $obj.access_token) {
              throw "Token for $($item.Name) has no access_token."
            }

            $tokenJson =
              $obj |
              ConvertTo-Json -Compress

            [void]$lines.Add("[$($item.Name)]")
            [void]$lines.Add("type = drive")
            [void]$lines.Add("scope = drive")
            [void]$lines.Add("token = $tokenJson")
            [void]$lines.Add("")
          }

          $lines |
            Set-Content `
              -Path $realConfig `
              -Encoding UTF8

          Copy-Item `
            $realConfig `
            "$configDir\rclone.conf" `
            -Force

          foreach ($name in @(
            "gdrive_g",
            "gdrive_h",
            "gdrive_i",
            "gdrive_j",
            "gdrive_k"
          )) {

            $source =
              "$configDir\$name.conf"

            $destination =
              "$rcloneAppData\$name.conf"

            if (Test-Path $source) {
              Copy-Item `
                $source `
                $destination `
                -Force
            }
          }

          Write-Host "REAL rclone.conf created."
          Write-Host "All five individual .conf files copied."
          Write-Host $rcloneAppData

      # ========================================================
      # OPEN FIVE POWERSHELL WINDOWS AND MOUNT FIVE DRIVES
      # ========================================================

      - name: Start five persistent PowerShell drive windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $rclone =
            "C:\Tools\rclone\rclone.exe"

          $config =
            "C:\Users\$env:RDP_USER\AppData\Roaming\rclone\rclone.conf"

          $drives = @(
            @{
              Remote = "gdrive_g:.persistent-rdp/files"
              Letter = "G:"
            },
            @{
              Remote = "gdrive_h:.persistent-rdp/files"
              Letter = "H:"
            },
            @{
              Remote = "gdrive_i:.persistent-rdp/files"
              Letter = "I:"
            },
            @{
              Remote = "gdrive_j:.persistent-rdp/files"
              Letter = "J:"
            },
            @{
              Remote = "gdrive_k:.persistent-rdp/files"
              Letter = "K:"
            }
          )

          foreach ($drive in $drives) {

            $command =
              "& '$rclone' --config '$config' mount $($drive.Remote) $($drive.Letter) --network-mode --vfs-cache-mode full --dir-cache-time 30s --poll-interval 30s --transfers 4 --checkers 8 --timeout 1m; Write-Host 'Drive $($drive.Letter) process ended. Window kept open.'; while (`$true) { Start-Sleep 60 }"

            Start-Process `
              powershell.exe `
              -ArgumentList `
                "-NoProfile",
                "-ExecutionPolicy",
                "Bypass",
                "-NoExit",
                "-Command",
                $command

            Start-Sleep -Seconds 2
          }

          Write-Host "Five PowerShell windows started."
          Write-Host "G: H: I: J: K:"

      # ========================================================
      # PERSISTENCE LOGON SCRIPT
      # ========================================================

      - name: Install five-drive persistence at RDP user logon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $user =
            $env:RDP_USER

          $pass =
            $env:RDP_PASS

          $persistDir =
            "C:\ProgramData\Persistent-RDP"

          $configDir =
            "$persistDir\rclone"

          $rclone =
            "C:\Tools\rclone\rclone.exe"

          $userRoot =
            "C:\Users\$user"

          $userRclone =
            "$userRoot\AppData\Roaming\rclone"

          New-Item `
            -ItemType Directory `
            -Path $persistDir `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $userRclone `
            -Force |
            Out-Null

          $mountScript =
            "$persistDir\Start-PersistentDrives.ps1"

          @"
`$ErrorActionPreference = "Continue"

`$rclone = "$rclone"
`$config = "$userRclone\rclone.conf"

`$drives = @(
    @{
        Remote = "gdrive_g:.persistent-rdp/files"
        Letter = "G:"
    },
    @{
        Remote = "gdrive_h:.persistent-rdp/files"
        Letter = "H:"
    },
    @{
        Remote = "gdrive_i:.persistent-rdp/files"
        Letter = "I:"
    },
    @{
        Remote = "gdrive_j:.persistent-rdp/files"
        Letter = "J:"
    },
    @{
        Remote = "gdrive_k:.persistent-rdp/files"
        Letter = "K:"
    }
)

Start-Sleep -Seconds 5

foreach (`$drive in `$drives) {

    `$command = "& '`$rclone' --config '`$config' mount `$(`$drive.Remote) `$(`$drive.Letter) --network-mode --vfs-cache-mode full --dir-cache-time 30s --poll-interval 30s --transfers 4 --checkers 8 --timeout 1m"

    Start-Process powershell.exe -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-NoExit","-Command",`$command

    Start-Sleep -Seconds 2
}
"@ |
            Set-Content `
              -Path $mountScript `
              -Encoding UTF8

          $restoreScript =
            "$persistDir\Restore-PersistentFiles.ps1"

          @"
`$ErrorActionPreference = "Continue"

`$rclone = "$rclone"
`$config = "$configDir\gdrive_g.conf"
`$userRoot = "$userRoot"
`$remoteRoot = "gdrive_g:.persistent-rdp/files"

if (
    (Test-Path `$rclone) -and
    (Test-Path `$config)
) {

    Write-Host "Restoring persistent files..."

    & `$rclone `
        --config `$config `
        copy `
        `$remoteRoot `
        `$userRoot `
        --create-empty-src-dirs `
        --timeout 300s `
        --retries 3 `
        --low-level-retries 10
}

Start-Process `
    powershell.exe `
    -ArgumentList `
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "`"$mountScript`""

Write-Host "Persistent-RDP initialization completed."
"@ |
            Set-Content `
              -Path $restoreScript `
              -Encoding UTF8

          Unregister-ScheduledTask `
            -TaskName "Persistent-RDP-Logon" `
            -Confirm:$false `
            -ErrorAction SilentlyContinue

          $action =
            New-ScheduledTaskAction `
              -Execute "powershell.exe" `
              -Argument `
              "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$restoreScript`""

          $trigger =
            New-ScheduledTaskTrigger `
              -AtLogOn `
              -User $user

          $settings =
            New-ScheduledTaskSettingsSet `
              -AllowStartIfOnBatteries `
              -DontStopIfGoingOnBatteries `
              -ExecutionTimeLimit ([TimeSpan]::Zero)

          Register-ScheduledTask `
            -TaskName "Persistent-RDP-Logon" `
            -Action $action `
            -Trigger $trigger `
            -User $user `
            -Password $pass `
            -RunLevel Limited `
            -Settings $settings `
            -Force |
            Out-Null

          Write-Host "PERSISTENCE INSTALLED."

      - name: Verify persistence setup
        run: |
          $task =
            Get-ScheduledTask `
              -TaskName "Persistent-RDP-Logon" `
              -ErrorAction SilentlyContinue

          if (-not $task) {
            Write-Error "Persistent-RDP logon task was not created."
            exit 1
          }

          $required = @(
            "C:\Tools\rclone\rclone.exe",
            "C:\Program Files (x86)\WinFsp",
            "C:\Users\$env:RDP_USER\AppData",
            "C:\Users\$env:RDP_USER\AppData\Local",
            "C:\Users\$env:RDP_USER\AppData\LocalLow",
            "C:\Users\$env:RDP_USER\AppData\Roaming",
            "C:\Users\$env:RDP_USER\AppData\Roaming\rclone",
            "C:\Users\$env:RDP_USER\AppData\Roaming\rclone\rclone.conf",
            "C:\Users\$env:RDP_USER\AppData\Roaming\rclone\gdrive_g.conf",
            "C:\Users\$env:RDP_USER\AppData\Roaming\rclone\gdrive_h.conf",
            "C:\Users\$env:RDP_USER\AppData\Roaming\rclone\gdrive_i.conf",
            "C:\Users\$env:RDP_USER\AppData\Roaming\rclone\gdrive_j.conf",
            "C:\Users\$env:RDP_USER\AppData\Roaming\rclone\gdrive_k.conf",
            "C:\ProgramData\Persistent-RDP\rclone\rclone.conf",
            "C:\ProgramData\Persistent-RDP\rclone\gdrive_g.conf",
            "C:\ProgramData\Persistent-RDP\rclone\gdrive_h.conf",
            "C:\ProgramData\Persistent-RDP\rclone\gdrive_i.conf",
            "C:\ProgramData\Persistent-RDP\rclone\gdrive_j.conf",
            "C:\ProgramData\Persistent-RDP\rclone\gdrive_k.conf"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              Write-Error "Missing required path: $path"
              exit 1
            }
          }

          Write-Host "All five configs verified."
          Write-Host "Yousif190 profile verified."

      - name: Install RustDesk
        run: |
          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rdExe)) {

            $installerPath =
              "$env:TEMP\rustdesk.msi"

            Invoke-WebRequest `
              -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi" `
              -OutFile $installerPath `
              -UseBasicParsing `
              -ErrorAction Stop

            Start-Process `
              msiexec.exe `
              -ArgumentList "/i","`"$installerPath`"","/quiet","/norestart" `
              -Wait

            Remove-Item `
              $installerPath `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $rdExe)) {
            throw "RustDesk installation failed."
          }

      - name: Open RustDesk ports
        run: |
          for ($p = 21115; $p -le 21119; $p++) {

            $name =
              "APP-PORT-TCP-$p"

            netsh advfirewall firewall delete rule `
              name=$name `
              2>$null

            netsh advfirewall firewall add rule `
              name=$name `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$p
          }

          $udpName =
            "APP-PORT-UDP-21116"

          netsh advfirewall firewall delete rule `
            name=$udpName `
            2>$null

          netsh advfirewall firewall add rule `
            name=$udpName `
            dir=in `
            action=allow `
            protocol=UDP `
            localport=21116

      - name: Launch RustDesk + Screenshot
        run: |
          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          Start-Process `
            -FilePath $rdExe `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          $screenshotPath =
            "$env:TEMP\rustdesk_${{ matrix.id }}.png"

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds =
            [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap =
            New-Object System.Drawing.Bitmap `
              $bounds.Width,$bounds.Height

          $graphics =
            [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $bitmap.Save(
            $screenshotPath,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          try {

            $curlResult =
              curl `
                -F "file=@$screenshotPath" `
                https://store1.gofile.io/uploadFile

            $json =
              $curlResult |
              ConvertFrom-Json

            if ($json.status -eq "ok") {

              "SCREENSHOT_URL=$($json.data.downloadPage)" |
                Out-File `
                  -Append `
                  $env:GITHUB_ENV
            }
          }
          catch {
            Write-Warning "Screenshot upload failed."
          }

      - name: Display Google Drive persistence status
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PERSISTENT-RDP STORAGE"
          Write-Host "=========================================="
          Write-Host "G: = gdrive_g"
          Write-Host "H: = gdrive_h"
          Write-Host "I: = gdrive_i"
          Write-Host "J: = gdrive_j"
          Write-Host "K: = gdrive_k"
          Write-Host ""
          Write-Host "User: C:\Users\Yousif190"
          Write-Host "AppData: C:\Users\Yousif190\AppData"
          Write-Host "Roaming: C:\Users\Yousif190\AppData\Roaming"
          Write-Host "rclone.conf: C:\Users\Yousif190\AppData\Roaming\rclone\rclone.conf"
          Write-Host "gdrive_g.conf"
          Write-Host "gdrive_h.conf"
          Write-Host "gdrive_i.conf"
          Write-Host "gdrive_j.conf"
          Write-Host "gdrive_k.conf"
          Write-Host ""
          Write-Host "Five PowerShell mount windows started."
          Write-Host "=========================================="

      - name: Keep alive
        run: |
          $mins =
            [int]"${{ env.RUNTIME_MINUTES }}"

          $end =
            (Get-Date).AddMinutes($mins)

          while ((Get-Date) -lt $end) {

            $mode =
              if ("$env:CRD_ENABLED" -eq '1') {
                '[CRD+RustDesk/RDP+Persistence]'
              }
              else {
                '[RustDesk/RDP+Persistence]'
              }

            Write-Host (
              "$mode Heartbeat " +
              (Get-Date).ToString("HH:mm:ss") +
              " ends at " +
              $end.ToString("HH:mm:ss") +
              " | Drives: G:H:I:J:K:"
            )

            Start-Sleep -Seconds 60
          }

      - name: Final Google Drive sync
        if: always()
        shell: pwsh
        run: |
          $rclone =
            "$env:RCLONE_EXE"

          $config =
            "$env:RCLONE_CONFIG_DIR\gdrive_g.conf"

          if (
            (Test-Path $rclone) -and
            (Test-Path $config)
          ) {

            Write-Host "Final persistence sync starting..."

            $userRoot =
              "C:\Users\$env:RDP_USER"

            if (-not (Test-Path $userRoot)) {
              $userRoot =
                "$env:USERPROFILE"
            }

            & $rclone `
              --config $config `
              copy `
              $userRoot `
              "gdrive_g:.persistent-rdp/files" `
              --create-empty-src-dirs `
              --timeout 300s `
              --retries 3 `
              --low-level-retries 10 `
              --exclude "AppData\Local\Temp/**" `
              --exclude "AppData\Local\Adobe\After Effects\Cache/**"

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Final persistence sync completed."
            }
            else {
              Write-Warning "Final persistence sync returned exit code $LASTEXITCODE."
            }
          }
          else {
            Write-Host "rclone/config unavailable; skipping final sync."
          }

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $cycles =
            [int]"${{ inputs.cycles }}"

          if ($cycles -gt 0) {

            $next =
              $cycles - 1

            if ($next -le 0) {

              $url =
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"

              $hdr = @{
                Authorization =
                  "Bearer $env:GH_TOKEN"

                Accept =
                  "application/vnd.github+json"

                "X-GitHub-Api-Version" =
                  "2022-11-28"
              }

              $payload = @{
                ts_tailnet =
                  "${{ inputs.ts_tailnet }}"

                ts_api_key =
                  "${{ inputs.ts_api_key }}"

                base_prefix =
                  "bullet"

                max_count =
                  "10"

                dry_run =
                  "false"
              }

              $body =
                @{
                  ref =
                    "${{ github.ref_name }}"

                  inputs =
                    $payload
                } |
                ConvertTo-Json -Depth 20

              Invoke-RestMethod `
                -Method POST `
                -Uri $url `
                -Headers $hdr `
                -ContentType "application/json" `
                -Body $body `
                -ErrorAction Stop

              Write-Host "STOP workflow dispatched."
            }
            else {

              $payload = @{
                ts_tailnet =
                  "${{ inputs.ts_tailnet }}"

                ts_api_key =
                  "${{ inputs.ts_api_key }}"

                ts_authkey =
                  "${{ inputs.ts_authkey }}"

                quick_test =
                  "${{ inputs.quick_test }}"

                runtime_minutes =
                  "300"

                do_purge =
                  "true"

                cycles =
                  "$next"

                rdp_count =
                  "${{ inputs.rdp_count }}"

                crd_code =
                  "${{ inputs.crd_code }}"

                crd_pin =
                  "${{ inputs.crd_pin }}"
              }

              $url2 =
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-A.yml/dispatches"

              $hdr2 = @{
                Authorization =
                  "Bearer $env:GH_TOKEN"

                Accept =
                  "application/vnd.github+json"

                "X-GitHub-Api-Version" =
                  "2022-11-28"
              }

              $body2 =
                @{
                  ref =
                    "${{ github.ref_name }}"

                  inputs =
                    $payload
                } |
                ConvertTo-Json -Depth 20

              Invoke-RestMethod `
                -Method POST `
                -Uri $url2 `
                -Headers $hdr2 `
                -ContentType "application/json" `
                -Body $body2 `
                -ErrorAction Stop

              Write-Host "Workflow A self-renew dispatched."
            }
          }
          else {
            Write-Host "No cycles configured. Done."
          }
