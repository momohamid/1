name: RDP + Tailscale + RustDesk + Telegram Persistent Storage + Jottacloud Sync (FINAL)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet"
        required: true
        type: string

      ts_api_key:
        description: "Tailscale API key"
        required: true
        type: string

      ts_authkey:
        description: "Tailscale Auth key"
        required: true
        type: string

      quick_test:
        description: "Run 5-minute test"
        required: false
        type: boolean
        default: false

      runtime_minutes:
        description: "Runtime in minutes (maximum 360)"
        required: false
        type: string
        default: "355"

      do_purge:
        description: "Purge bullet devices at start"
        required: false
        type: boolean
        default: true

      cycles:
        description: "0 = stop after A; N = handoffs left"
        required: false
        type: string
        default: "0"

      rdp_count:
        description: "Number of RDP instances"
        required: false
        type: string
        default: "1"

      crd_code:
        description: "Chrome Remote Desktop code"
        required: false
        type: string
        default: ""

      crd_pin:
        description: "Chrome Remote Desktop PIN"
        required: false
        type: string
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  # ============================================================
  # TELEGRAM STORAGE TEST
  # ============================================================

  telegram-test:
    runs-on: ubuntu-latest

    steps:

      - name: Install Telethon
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install telethon

      - name: Create test files
        shell: bash
        run: |
          mkdir -p test_workspace/Projects/AE
          mkdir -p test_workspace/Assets/Fonts

          echo "Persistent-RDP test $(date -u)" \
            > test_workspace/Projects/AE/project.txt

          echo "Persistent-RDP asset $(date -u)" \
            > test_workspace/Assets/Fonts/test-font.txt

          find test_workspace -type f -print

      - name: Telegram persistent storage test
        shell: bash
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}

        run: |
          python3 - <<'PY'
          import os
          import base64
          import hashlib
          import json
          import math
          from datetime import datetime, timezone
          from telethon import TelegramClient

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          session_b64 = os.environ["SESSION_B64"]

          with open("unlim_session.session", "wb") as f:
              f.write(base64.b64decode(session_b64))

          client = TelegramClient(
              "unlim_session",
              api_id,
              api_hash
          )

          STORAGE_ROOT = "test_workspace"
          INDEX_FILE = "file_index.json"
          CHUNK_SIZE = 1024 * 1024

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest()

          def utc_now():
              return datetime.now(timezone.utc).isoformat()

          async def main():
              await client.start()

              print("TELEGRAM CONNECTED")

              files = []

              for root, dirs, filenames in os.walk(STORAGE_ROOT):
                  dirs.sort()
                  filenames.sort()

                  for filename in filenames:
                      files.append(
                          os.path.join(root, filename)
                      )

              if not files:
                  raise SystemExit("NO TEST FILES FOUND")

              index = {
                  "version": 2,
                  "type": "persistent-rdp-file-index",
                  "updated_at": utc_now(),
                  "storage": {
                      "logical_capacity": "10 TB",
                      "chunk_size": CHUNK_SIZE
                  },
                  "files": []
              }

              for local_path in files:
                  relative_path = os.path.relpath(
                      local_path,
                      STORAGE_ROOT
                  ).replace("\\", "/")

                  size = os.path.getsize(local_path)
                  file_hash = sha256(local_path)

                  chunk_count = max(
                      1,
                      math.ceil(size / CHUNK_SIZE)
                  )

                  record = {
                      "path": "/" + relative_path,
                      "name": os.path.basename(local_path),
                      "size": size,
                      "sha256": file_hash,
                      "chunk_size": CHUNK_SIZE,
                      "chunk_count": chunk_count,
                      "chunks": [],
                      "created_at": utc_now()
                  }

                  with open(local_path, "rb") as f:
                      for index_no in range(chunk_count):

                          data = f.read(CHUNK_SIZE)

                          chunk_name = (
                              "persistent_chunk_"
                              + str(index_no)
                              + ".bin"
                          )

                          with open(
                              chunk_name,
                              "wb"
                          ) as cf:
                              cf.write(data)

                          chunk_hash = sha256(chunk_name)

                          message = await client.send_file(
                              "me",
                              chunk_name,
                              caption=(
                                  "PERSISTENT-RDP-CHUNK\n"
                                  f"path={record['path']}\n"
                                  f"chunk={index_no}\n"
                                  f"chunks={chunk_count}\n"
                                  f"sha256={chunk_hash}"
                              )
                          )

                          record["chunks"].append({
                              "index": index_no,
                              "size": len(data),
                              "sha256": chunk_hash,
                              "telegram_message_id": message.id
                          })

                          os.remove(chunk_name)

                  index["files"].append(record)

              with open(
                  INDEX_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      index,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              index_message = await client.send_file(
                  "me",
                  INDEX_FILE,
                  caption="PERSISTENT-RDP-FILE-INDEX"
              )

              print(
                  "INDEX_MESSAGE_ID="
                  + str(index_message.id)
              )

              found = await client.get_messages(
                  "me",
                  ids=index_message.id
              )

              if not found:
                  raise SystemExit(
                      "FILE INDEX LOOKUP FAILED"
                  )

              restored = "file_index_restored.json"

              await client.download_media(
                  found,
                  file=restored
              )

              with open(
                  restored,
                  "r",
                  encoding="utf-8"
              ) as f:
                  restored_index = json.load(f)

              if restored_index["version"] != 2:
                  raise SystemExit(
                      "INDEX VERSION FAILED"
                  )

              print("FILE INDEX READ SUCCESS")
              print("PERSISTENT STORAGE TEST SUCCESS")

          with client:
              client.loop.run_until_complete(main())
          PY

      - name: Display storage index
        shell: bash
        run: |
          cat file_index.json

      - name: Upload storage test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-storage-file-manager-test
          path: |
            file_index.json
            file_index_restored.json
            test_workspace


  # ============================================================
  # SETUP
  # ============================================================

  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:

      - id: mk
        shell: pwsh
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = 1

            if ("${{ inputs.rdp_count }}" -match '^\d+$') {
              $n = [int]"${{ inputs.rdp_count }}"
            }

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{
              id = $i
            }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          $multi = if ($n -gt 1) {
            "1"
          }
          else {
            "0"
          }

          "multi=$multi" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8


  # ============================================================
  # WINDOWS RDP
  # ============================================================

  rdp:
    needs: setup

    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif1990

    steps:

      # ========================================================
      # CRD
      # ========================================================

      - name: Set CRD flag
        shell: pwsh
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }


      - name: Install Chrome Remote Desktop Host
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |

          $exe =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            $exePath =
              "$env:TEMP\chromeremotedesktophost.exe"

            try {

              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile `
                $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath `
                $exePath `
                -ArgumentList `
                "/silent","/install" `
                -Wait

              Remove-Item `
                $exePath `
                -Force

            }
            catch {

              $msi =
                "$env:TEMP\chromeremotedesktophost.msi"

              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                -OutFile `
                $msi `
                -ErrorAction Stop

              Start-Process `
                msiexec.exe `
                -ArgumentList `
                "/i",
                "`"$msi`"",
                "/quiet",
                "/norestart" `
                -Wait

              Remove-Item `
                $msi `
                -Force
            }
          }


      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |

          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin =
            "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            throw "crd_pin must be 6-12 digits."
          }

          $starter =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            throw "remoting_start_host.exe not found."
          }

          $code = $null

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {

            $code = (
              [regex]::Match(
                $raw,
                '--code\s*=\s*"?([^"\s]+)'
              )
            ).Groups[1].Value

          }
          elseif ($raw -match '^4\/') {
            $code = $raw
          }

          if (-not $code) {
            throw "Could not detect CRD code."
          }

          $redir =
            "https://remotedesktop.google.com/_/oauthredirect"

          $name =
            $Env:COMPUTERNAME

          $args = @(
            "--code=""$code""",
            "--redirect-url=""$redir""",
            "--name=""$name""",
            "--pin=""$pin"""
          )

          Start-Process `
            -FilePath `
            $starter `
            -ArgumentList `
            $args


      # ========================================================
      # HOSTNAME / RUNTIME
      # ========================================================

      - name: Decide hostname + runtime
        shell: pwsh
        run: |

          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {

            if ("$v" -match '^\d+$') {
              return [int]$v
            }

            return [int]$d
          }

          $runtime = IntOr(
            "${{ inputs.runtime_minutes }}",
            355
          )

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 355
          }

          if ($runtime -gt 360) {
            $runtime = 355
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File `
              -Append `
              $env:GITHUB_ENV


      # ========================================================
      # PURGE
      # ========================================================

      - name: Purge bullet devices
        if: needs.setup.outputs.multi == '0'
        shell: pwsh
        run: |

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (-not (Yes("${{ inputs.do_purge }}"))) {
            Write-Host "Purge disabled."
            exit 0
          }

          try {

            $auth =
              [Convert]::ToBase64String(
                [Text.Encoding]::ASCII.GetBytes(
                  "${{ inputs.ts_api_key }}:"
                )
              )

            $tn =
              [uri]::EscapeDataString(
                "${{ inputs.ts_tailnet }}"
              )

            $list =
              Invoke-RestMethod `
                -Uri `
                "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                -Headers @{
                  Authorization =
                    "Basic $auth"
                }

            foreach ($d in $list.devices) {

              if ($d.hostname -match '^bullet[0-9]*$') {

                Invoke-RestMethod `
                  -Method Delete `
                  -Uri `
                  "https://api.tailscale.com/api/v2/device/$($d.id)" `
                  -Headers @{
                    Authorization =
                      "Basic $auth"
                  } `
                  -ErrorAction SilentlyContinue
              }
            }
          }
          catch {
            Write-Host `
              "Purge warning: $($_.Exception.Message)"
          }


      # ========================================================
      # TAILSCALE
      # ========================================================

      - name: Install + Up Tailscale
        shell: pwsh
        run: |

          $ts =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {

            $url =
              "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

            $dst =
              "$env:TEMP\tailscale.msi"

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $dst

            Start-Process `
              msiexec.exe `
              -ArgumentList `
              "/i",
              "`"$dst`"",
              "/quiet",
              "/norestart" `
              -Wait

            Remove-Item `
              $dst `
              -Force
          }

          & $ts logout 2>$null |
            Out-Null

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=true `
            --accept-routes=true

          $ip4 = (
            & $ts ip -4 |
            Select-Object -First 1
          )

          "TAILSCALE_IP=$ip4" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host `
            "TAILSCALE IP: $ip4"


      # ========================================================
      # RDP USER
      # ========================================================

      - name: Enable RDP user + firewall
        shell: pwsh
        run: |

          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          $sec =
            ConvertTo-SecureString `
              $p `
              -AsPlainText `
              -Force

          $existing =
            Get-LocalUser `
              -Name $u `
              -ErrorAction SilentlyContinue

          if (-not $existing) {

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires `
              -PasswordNeverExpires

          }
          else {

            Set-LocalUser `
              -Name $u `
              -Password $sec

            Enable-LocalUser `
              -Name $u
          }

          $admin =
            Get-LocalGroupMember `
              -Group "Administrators" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match "\\$([regex]::Escape($u))$"
              }

          if (-not $admin) {

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $u `
              -ErrorAction SilentlyContinue
          }

          $rdp =
            Get-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match "\\$([regex]::Escape($u))$"
              }

          if (-not $rdp) {

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $u `
              -ErrorAction SilentlyContinue
          }

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Set-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name UserAuthentication `
            -Value 0

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Enable-NetFirewallRule `
            -ErrorAction SilentlyContinue

          netsh advfirewall firewall set rule `
            group="remote desktop" `
            new enable=Yes

          Write-Host "RDP USER READY"
          Write-Host "RDP FIREWALL READY"


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Install Python libs
        shell: pwsh
        run: |

          python -m pip install --upgrade pip

          python -m pip install `
            --force-reinstall `
            telethon `
            pyautogui `
            pynput `
            pillow


      # ========================================================
      # JOTTACLOUD DESKTOP
      # ========================================================

      - name: Download Jottacloud Desktop
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "JOTTACLOUD DESKTOP DOWNLOAD"
          Write-Host "=========================================="

          $installer =
            "$env:TEMP\jottacloud-setup.exe"

          $urls = @(
            "https://desktop.jottacloud.com/download/windows",
            "https://jottacloud.com/en/download"
          )

          $downloaded = $false

          foreach ($url in $urls) {

            try {

              Write-Host "Trying: $url"

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $installer `
                -UseBasicParsing `
                -MaximumRedirection 10 `
                -ErrorAction Stop

              if (Test-Path $installer) {

                $size =
                  (Get-Item $installer).Length

                Write-Host `
                  "Downloaded size: $size bytes"

                if ($size -gt 100000) {

                  $downloaded = $true
                  break
                }
              }

            }
            catch {

              Write-Host `
                "Download attempt failed:"
              Write-Host `
                $_.Exception.Message
            }
          }

          if (-not $downloaded) {

            throw `
              "Unable to download the official Jottacloud Windows installer."
          }

          "JOTTA_INSTALLER=$installer" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "JOTTACLOUD INSTALLER READY"


      - name: Install Jottacloud Desktop
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $installer =
            $env:JOTTA_INSTALLER

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "INSTALLING JOTTACLOUD DESKTOP"
          Write-Host "=========================================="

          $ext =
            [IO.Path]::GetExtension($installer)

          if ($ext -ieq ".msi") {

            $p =
              Start-Process `
                msiexec.exe `
                -ArgumentList `
                  "/i",
                  "`"$installer`"",
                  "/quiet",
                  "/norestart" `
                -Wait `
                -PassThru

            if (
              $p.ExitCode -ne 0 -and
              $p.ExitCode -ne 3010
            ) {

              throw `
                "Jottacloud MSI installation failed: $($p.ExitCode)"
            }

          }
          else {

            $p =
              Start-Process `
                -FilePath $installer `
                -ArgumentList `
                  "/S",
                  "/quiet",
                  "/norestart" `
                -Wait `
                -PassThru

            if (
              $p.ExitCode -ne 0
            ) {

              Write-Host `
                "Installer returned $($p.ExitCode)."

              Write-Host `
                "Continuing to locate the installed application..."
            }
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "JOTTACLOUD INSTALLATION STEP COMPLETE"


      # ========================================================
      # FIND JOTTACLOUD DESKTOP
      # ========================================================

      - name: Locate Jottacloud Desktop
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "LOCATING JOTTACLOUD DESKTOP"
          Write-Host "=========================================="

          $names = @(
            "jottacloud.exe",
            "Jottacloud.exe",
            "jotta.exe",
            "Jotta.exe"
          )

          $roots = @(
            $env:ProgramFiles,
            ${env:ProgramFiles(x86)},
            $env:LOCALAPPDATA,
            $env:APPDATA
          )

          $found = $null

          foreach ($root in $roots) {

            if (
              -not $root -or
              -not (Test-Path $root)
            ) {
              continue
            }

            foreach ($name in $names) {

              try {

                $result =
                  Get-ChildItem `
                    -Path $root `
                    -Filter $name `
                    -File `
                    -Recurse `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                if ($result) {

                  $found =
                    $result.FullName

                  break
                }

              }
              catch {
              }
            }

            if ($found) {
              break
            }
          }

          if (-not $found) {

            $uninstallRoots = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
            )

            foreach ($reg in $uninstallRoots) {

              try {

                $apps =
                  Get-ItemProperty `
                    $reg `
                    -ErrorAction SilentlyContinue |
                    Where-Object {
                      $_.DisplayName -match "Jottacloud"
                    }

                foreach ($app in $apps) {

                  if (
                    $app.InstallLocation -and
                    (Test-Path $app.InstallLocation)
                  ) {

                    foreach ($name in $names) {

                      $candidate =
                        Join-Path `
                          $app.InstallLocation `
                          $name

                      if (Test-Path $candidate) {

                        $found = $candidate
                        break
                      }
                    }
                  }

                  if ($found) {
                    break
                  }
                }

              }
              catch {
              }

              if ($found) {
                break
              }
            }
          }

          if (-not $found) {

            Write-Host ""
            Write-Host "Jottacloud-related installed programs:"

            Get-ItemProperty `
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.DisplayName -match "Jottacloud"
              } |
              Select-Object `
                DisplayName,
                DisplayVersion,
                InstallLocation

            Get-ItemProperty `
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.DisplayName -match "Jottacloud"
              } |
              Select-Object `
                DisplayName,
                DisplayVersion,
                InstallLocation

            throw `
              "Jottacloud Desktop executable was not found after installation."
          }

          Write-Host ""
          Write-Host "JOTTACLOUD FOUND:"
          Write-Host $found

          "JOTTA_EXE=$found" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8


      # ========================================================
      # START JOTTACLOUD
      # ========================================================

      - name: Start Jottacloud Desktop
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          if (
            -not $env:JOTTA_EXE -or
            -not (Test-Path $env:JOTTA_EXE)
          ) {

            throw `
              "Jottacloud executable is unavailable."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "STARTING JOTTACLOUD"
          Write-Host "=========================================="

          $existing =
            Get-Process `
              -Name "jottacloud","jotta" `
              -ErrorAction SilentlyContinue

          if (-not $existing) {

            Start-Process `
              -FilePath $env:JOTTA_EXE `
              -WorkingDirectory `
              (Split-Path $env:JOTTA_EXE)

            Start-Sleep `
              -Seconds 15
          }

          $running =
            Get-Process `
              -Name "jottacloud","jotta" `
              -ErrorAction SilentlyContinue

          if (-not $running) {

            throw `
              "Jottacloud Desktop did not remain running."
          }

          Write-Host ""
          Write-Host "JOTTACLOUD DESKTOP RUNNING"


      # ========================================================
      # JOTTACLOUD STARTUP
      # ========================================================

      - name: Configure Jottacloud automatic startup
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "JOTTACLOUD STARTUP"
          Write-Host "=========================================="

          $startup =
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup"

          New-Item `
            -ItemType Directory `
            -Path $startup `
            -Force |
            Out-Null

          $shortcut =
            Join-Path `
              $startup `
              "Jottacloud.lnk"

          $ws =
            New-Object `
              -ComObject WScript.Shell

          $sc =
            $ws.CreateShortcut($shortcut)

          $sc.TargetPath =
            $env:JOTTA_EXE

          $sc.WorkingDirectory =
            Split-Path $env:JOTTA_EXE

          $sc.WindowStyle = 7

          $sc.Save()

          Write-Host `
            "Jottacloud startup shortcut created."


      # ========================================================
      # WAIT FOR NORMAL JOTTACLOUD SYNC ROOT
      # ========================================================

      - name: Detect normal Jottacloud Sync Folder
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "WAITING FOR JOTTACLOUD SYNC"
          Write-Host "=========================================="

          $possible = @(
            "$env:USERPROFILE\Jottacloud",
            "$env:USERPROFILE\JottaCloud",
            "$env:USERPROFILE\Jottacloud\Sync",
            "$env:USERPROFILE\JottaCloud\Sync"
          )

          $sync = $null

          for (
            $attempt = 1;
            $attempt -le 24;
            $attempt++
          ) {

            foreach ($path in $possible) {

              if (
                Test-Path $path -PathType Container
              ) {

                $sync = $path
                break
              }
            }

            if ($sync) {
              break
            }

            Write-Host `
              "Waiting for Sync Folder... attempt $attempt/24"

            Start-Sleep `
              -Seconds 5
          }

          if ($sync) {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "JOTTACLOUD SYNC FOLDER FOUND"
            Write-Host "=========================================="
            Write-Host $sync

            "JOTTA_SYNC_FOLDER=$sync" |
              Out-File `
                $env:GITHUB_ENV `
                -Append `
                -Encoding utf8

          }
          else {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "SYNC FOLDER NOT FOUND YET"
            Write-Host "=========================================="

            Write-Host `
              "The Jottacloud Desktop setup/login may still be waiting."

            "JOTTA_SYNC_FOLDER=" |
              Out-File `
                $env:GITHUB_ENV `
                -Append `
                -Encoding utf8
          }


      # ========================================================
      # JOTTACLOUD SYNC TEST
      # ========================================================

      - name: Test Jottacloud normal Sync
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "JOTTACLOUD NORMAL SYNC TEST"
          Write-Host "=========================================="

          if (
            -not $env:JOTTA_SYNC_FOLDER
          ) {

            Write-Host `
              "Sync folder not detected."

            Write-Host `
              "Skipping test without failing the RDP."

            exit 0
          }

          if (
            -not (
              Test-Path `
                $env:JOTTA_SYNC_FOLDER `
                -PathType Container
            )
          ) {

            Write-Host `
              "Sync folder disappeared."

            exit 0
          }

          $test =
            Join-Path `
              $env:JOTTA_SYNC_FOLDER `
              "Persistent-RDP-Test"

          New-Item `
            -ItemType Directory `
            -Path $test `
            -Force |
            Out-Null

          $file =
            Join-Path `
              $test `
              "session-test.txt"

          Set-Content `
            -Path $file `
            -Value `
              "Persistent-RDP Jottacloud test $(Get-Date -Format o)" `
            -Encoding UTF8

          Write-Host ""
          Write-Host "TEST FILE:"
          Write-Host $file

          Get-Content `
            $file

          Write-Host ""
          Write-Host "JOTTACLOUD SYNC TEST FILE CREATED"


      # ========================================================
      # JOTTACLOUD STATUS
      # ========================================================

      - name: Display Jottacloud status
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "JOTTACLOUD STATUS"
          Write-Host "=========================================="

          Get-Process `
            -Name "jottacloud","jotta" `
            -ErrorAction SilentlyContinue |
            Select-Object `
              Id,
              ProcessName,
              StartTime,
              CPU

          if ($env:JOTTA_SYNC_FOLDER) {

            Write-Host ""
            Write-Host "SYNC FOLDER:"
            Write-Host `
              $env:JOTTA_SYNC_FOLDER

            Write-Host ""
            Write-Host "SYNC CONTENT:"

            Get-ChildItem `
              $env:JOTTA_SYNC_FOLDER `
              -Force `
              -ErrorAction SilentlyContinue |
              Select-Object `
                Name,
                Length,
                LastWriteTime
          }


      # ========================================================
      # JOTTACLOUD WATCHDOG
      # ========================================================

      - name: Create Jottacloud watchdog
        shell: pwsh
        run: |

          $watchdog =
            "$env:TEMP\jottacloud_watchdog.ps1"

          @"
          while (`$true) {

              try {

                  `$running =
                    Get-Process `
                      -Name "jottacloud","jotta" `
                      -ErrorAction SilentlyContinue

                  if (-not `$running) {

                      if (
                          Test-Path "$env:JOTTA_EXE"
                      ) {

                          Start-Process `
                            -FilePath "$env:JOTTA_EXE" `
                            -WorkingDirectory `
                            (Split-Path "$env:JOTTA_EXE")

                          Start-Sleep `
                            -Seconds 10
                      }
                  }

              }
              catch {

                  Write-Host `
                    "Jottacloud watchdog error: `$(`$_.Exception.Message)"
              }

              Start-Sleep `
                -Seconds 30
          }
          "@ |
            Set-Content `
              -Path $watchdog `
              -Encoding UTF8

          Start-Process `
            powershell.exe `
            -ArgumentList `
              "-NoProfile",
              "-ExecutionPolicy",
              "Bypass",
              "-File",
              "`"$watchdog`"" `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "JOTTACLOUD WATCHDOG STARTED"
          Write-Host "CHECK INTERVAL: 30 SECONDS"


      # ========================================================
      # RUSTDESK
      # ========================================================

      - name: Install RustDesk
        shell: pwsh
        run: |

          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rdExe)) {

            $rdUrl =
              "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"

            $installerPath =
              "$env:TEMP\rustdesk.msi"

            Invoke-WebRequest `
              -Uri $rdUrl `
              -OutFile $installerPath

            Start-Process `
              msiexec.exe `
              -ArgumentList `
              "/i",
              "`"$installerPath`"",
              "/quiet",
              "/norestart" `
              -Wait

            Remove-Item `
              $installerPath `
              -Force
          }


      - name: Open RustDesk ports
        shell: pwsh
        run: |

          for ($p = 21115; $p -le 21119; $p++) {

            $name =
              "APP-PORT-TCP-$p"

            netsh advfirewall firewall delete rule `
              name=$name 2>$null

            netsh advfirewall firewall add rule `
              name=$name `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$p
          }


      - name: Launch RustDesk
        shell: pwsh
        run: |

          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (Test-Path $rdExe) {

            Start-Process `
              -FilePath $rdExe `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 5
          }


      # ========================================================
      # DISPLAY STORAGE STATUS
      # ========================================================

      - name: Display Jottacloud storage status
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PERSISTENT STORAGE"
          Write-Host "=========================================="

          if ($env:JOTTA_SYNC_FOLDER) {

            Write-Host ""
            Write-Host "JOTTACLOUD SYNC:"
            Write-Host `
              $env:JOTTA_SYNC_FOLDER

            Write-Host ""
            Write-Host "FILES:"

            Get-ChildItem `
              $env:JOTTA_SYNC_FOLDER `
              -Force `
              -ErrorAction SilentlyContinue |
              Select-Object `
                Name,
                Length,
                LastWriteTime
          }
          else {

            Write-Host `
              "Jottacloud Sync Folder is not available yet."
          }


      # ========================================================
      # KEEP ALIVE
      # ========================================================

      - name: Keep alive
        shell: pwsh
        run: |

          $mins =
            [int]"${{ env.RUNTIME_MINUTES }}"

          $end =
            (Get-Date).AddMinutes($mins)

          while (
            (Get-Date) -lt $end
          ) {

            Write-Host ""
            Write-Host (
              "Heartbeat " +
              (Get-Date).ToString("HH:mm:ss")
            )

            Write-Host `
              "Jottacloud background sync is running."

            $running =
              Get-Process `
                -Name "jottacloud","jotta" `
                -ErrorAction SilentlyContinue

            if ($running) {

              Write-Host `
                "Jottacloud: RUNNING"

            }
            else {

              Write-Host `
                "Jottacloud: NOT RUNNING - watchdog will restart it."
            }

            Start-Sleep `
              -Seconds 60
          }


      # ========================================================
      # FINAL JOTTACLOUD CHECK
      # ========================================================

      - name: Final Jottacloud sync check
        if: always()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FINAL JOTTACLOUD CHECK"
          Write-Host "=========================================="

          $running =
            Get-Process `
              -Name "jottacloud","jotta" `
              -ErrorAction SilentlyContinue

          if ($running) {

            Write-Host `
              "Jottacloud is still running."

          }
          else {

            Write-Host `
              "Jottacloud process is not running."
          }

          if ($env:JOTTA_SYNC_FOLDER) {

            Write-Host ""
            Write-Host "Sync folder:"
            Write-Host `
              $env:JOTTA_SYNC_FOLDER

            Write-Host ""
            Write-Host "Recent files:"

            Get-ChildItem `
              $env:JOTTA_SYNC_FOLDER `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 20 `
                FullName,
                Length,
                LastWriteTime
          }


      # ========================================================
      # STOP / NEXT
      # ========================================================

      - name: Dispatch next or stop
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          $cycles = 0

          if ("${{ inputs.cycles }}" -match '^\d+$') {

            $cycles =
              [int]"${{ inputs.cycles }}"
          }

          if ($cycles -gt 0) {

            $next =
              $cycles - 1

            Write-Host `
              "Next cycle: $next"

          }
          else {

            Write-Host `
              "No cycles configured. Done."
          }
