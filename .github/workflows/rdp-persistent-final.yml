      # FINAL STORAGE STATUS
      # ========================================================

      - name: Final storage verification
        if: always()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host `
            "=========================================="

          Write-Host `
            "FINAL STORAGE VERIFICATION"

          Write-Host `
            "=========================================="

          if (
            Test-Path `
              "D:\Persistent-RDP"
          ) {

            $files =
              Get-ChildItem `
                "D:\Persistent-RDP" `
                -Recurse `
                -File `
                -Force `
                -ErrorAction SilentlyContinue

            Write-Host `
              "LOCAL PERSISTENT FILE COUNT:" `
              $files.Count

            $total =
              (
                $files |
                Measure-Object `
                  -Property Length `
                  -Sum
              ).Sum

            if (
              $null -eq $total
            ) {

              $total = 0

            }

            Write-Host `
              "LOCAL PERSISTENT BYTES:" `
              $total

          }
          else {

            Write-Host `
              "D:\Persistent-RDP does not exist."

          }


      # ========================================================
      # STOP / NEXT
      # ========================================================

      - name: Dispatch next or stop
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          $cycles = 0

          if (
            "${{ inputs.cycles }}"
            -match '^\d+$'
          ) {

            $cycles =
              [int]"${{ inputs.cycles }}"

          }

          if (
            $cycles -gt 0
          ) {

            $next =
              $cycles - 1

            Write-Host `
              "Next cycle: $next"

            Write-Host `
              "Automatic handoff is configured externally."

          }
          else {

            Write-Host `
              "No cycles configured. Done."

          }
