name: RDP + Tailscale + RustDesk + Telegram Persistent Storage (FINAL)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet"
        required: true
        type: string

      ts_api_key:
        description: "Tailscale API key"
        required: true
        type: string

      ts_authkey:
        description: "Tailscale Auth key"
        required: true
        type: string

      quick_test:
        description: "Run 5-minute test"
        required: false
        type: boolean
        default: false

      runtime_minutes:
        description: "Runtime in minutes (maximum 360)"
        required: false
        type: string
        default: "355"

      do_purge:
        description: "Purge bullet devices at start"
        required: false
        type: boolean
        default: true

      cycles:
        description: "0 = stop after A; N = handoffs left"
        required: false
        type: string
        default: "0"

      rdp_count:
        description: "Number of RDP instances"
        required: false
        type: string
        default: "1"

      crd_code:
        description: "Chrome Remote Desktop code"
        required: false
        type: string
        default: ""

      crd_pin:
        description: "Chrome Remote Desktop PIN"
        required: false
        type: string
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  telegram-test:
    runs-on: ubuntu-latest

    steps:

      - name: Install Telethon
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install telethon

      - name: Create test files
        shell: bash
        run: |
          mkdir -p test_workspace/Projects/AE
          mkdir -p test_workspace/Assets/Fonts

          echo "Persistent-RDP test $(date -u)" \
            > test_workspace/Projects/AE/project.txt

          echo "Persistent-RDP asset $(date -u)" \
            > test_workspace/Assets/Fonts/test-font.txt

          find test_workspace -type f -print

      - name: Telegram persistent storage test
        shell: bash
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}

        run: |
          python3 - <<'PY'
          import os
          import base64
          import hashlib
          import json
          import math
          from datetime import datetime, timezone
          from telethon import TelegramClient

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          session_b64 = os.environ["SESSION_B64"]

          with open("unlim_session.session", "wb") as f:
              f.write(base64.b64decode(session_b64))

          client = TelegramClient(
              "unlim_session",
              api_id,
              api_hash
          )

          STORAGE_ROOT = "test_workspace"
          INDEX_FILE = "file_index.json"
          CHUNK_SIZE = 1024 * 1024

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest()

          def utc_now():
              return datetime.now(timezone.utc).isoformat()

          async def main():
              await client.start()

              print("TELEGRAM CONNECTED")

              files = []

              for root, dirs, filenames in os.walk(STORAGE_ROOT):
                  dirs.sort()
                  filenames.sort()

                  for filename in filenames:
                      files.append(
                          os.path.join(root, filename)
                      )

              if not files:
                  raise SystemExit("NO TEST FILES FOUND")

              index = {
                  "version": 2,
                  "type": "persistent-rdp-file-index",
                  "updated_at": utc_now(),
                  "storage": {
                      "logical_capacity": "10 TB",
                      "chunk_size": CHUNK_SIZE
                  },
                  "files": []
              }

              for local_path in files:
                  relative_path = os.path.relpath(
                      local_path,
                      STORAGE_ROOT
                  ).replace("\\", "/")

                  size = os.path.getsize(local_path)
                  file_hash = sha256(local_path)

                  chunk_count = max(
                      1,
                      math.ceil(size / CHUNK_SIZE)
                  )

                  record = {
                      "path": "/" + relative_path,
                      "name": os.path.basename(local_path),
                      "size": size,
                      "sha256": file_hash,
                      "chunk_size": CHUNK_SIZE,
                      "chunk_count": chunk_count,
                      "chunks": [],
                      "created_at": utc_now()
                  }

                  with open(local_path, "rb") as f:
                      for index_no in range(chunk_count):

                          data = f.read(CHUNK_SIZE)

                          chunk_name = (
                              "persistent_chunk_"
                              + str(index_no)
                              + ".bin"
                          )

                          with open(
                              chunk_name,
                              "wb"
                          ) as cf:
                              cf.write(data)

                          chunk_hash = sha256(chunk_name)

                          message = await client.send_file(
                              "me",
                              chunk_name,
                              caption=(
                                  "PERSISTENT-RDP-CHUNK\n"
                                  f"path={record['path']}\n"
                                  f"chunk={index_no}\n"
                                  f"chunks={chunk_count}\n"
                                  f"sha256={chunk_hash}"
                              )
                          )

                          record["chunks"].append({
                              "index": index_no,
                              "size": len(data),
                              "sha256": chunk_hash,
                              "telegram_message_id": message.id
                          })

                          os.remove(chunk_name)

                  index["files"].append(record)

              with open(
                  INDEX_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      index,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              index_message = await client.send_file(
                  "me",
                  INDEX_FILE,
                  caption="PERSISTENT-RDP-FILE-INDEX"
              )

              print(
                  "INDEX_MESSAGE_ID="
                  + str(index_message.id)
              )

              found = await client.get_messages(
                  "me",
                  ids=index_message.id
              )

              if not found:
                  raise SystemExit(
                      "FILE INDEX LOOKUP FAILED"
                  )

              restored = "file_index_restored.json"

              await client.download_media(
                  found,
                  file=restored
              )

              with open(
                  restored,
                  "r",
                  encoding="utf-8"
              ) as f:
                  restored_index = json.load(f)

              if restored_index["version"] != 2:
                  raise SystemExit(
                      "INDEX VERSION FAILED"
                  )

              print("FILE INDEX READ SUCCESS")
              print("PERSISTENT STORAGE TEST SUCCESS")

          with client:
              client.loop.run_until_complete(main())
          PY

      - name: Display storage index
        shell: bash
        run: |
          cat file_index.json

      - name: Upload storage test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-storage-file-manager-test
          path: |
            file_index.json
            file_index_restored.json
            test_workspace


  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:

      - id: mk
        shell: pwsh
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = 1

            if ("${{ inputs.rdp_count }}" -match '^\d+$') {
              $n = [int]"${{ inputs.rdp_count }}"
            }

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{
              id = $i
            }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          $multi = if ($n -gt 1) {
            "1"
          }
          else {
            "0"
          }

          "multi=$multi" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8


  rdp:
    needs: setup

    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif@1990

    steps:

      - name: Set CRD flag
        shell: pwsh
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }


      - name: Install Chrome Remote Desktop Host
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |

          $exe =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            $exePath =
              "$env:TEMP\chromeremotedesktophost.exe"

            try {

              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile `
                $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath `
                $exePath `
                -ArgumentList `
                "/silent","/install" `
                -Wait

              Remove-Item `
                $exePath `
                -Force

            }
            catch {

              $msi =
                "$env:TEMP\chromeremotedesktophost.msi"

              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                -OutFile `
                $msi `
                -ErrorAction Stop

              Start-Process `
                msiexec.exe `
                -ArgumentList `
                "/i",
                "`"$msi`"",
                "/quiet",
                "/norestart" `
                -Wait

              Remove-Item `
                $msi `
                -Force
            }
          }


      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |

          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin =
            "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            throw "crd_pin must be 6-12 digits."
          }

          $starter =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            throw "remoting_start_host.exe not found."
          }

          $code = $null

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {

            $code = (
              [regex]::Match(
                $raw,
                '--code\s*=\s*"?([^"\s]+)'
              )
            ).Groups[1].Value

          }
          elseif ($raw -match '^4\/') {
            $code = $raw
          }

          if (-not $code) {
            throw "Could not detect CRD code."
          }

          $redir =
            "https://remotedesktop.google.com/_/oauthredirect"

          $name =
            $Env:COMPUTERNAME

          $args = @(
            "--code=""$code""",
            "--redirect-url=""$redir""",
            "--name=""$name""",
            "--pin=""$pin"""
          )

          Start-Process `
            -FilePath `
            $starter `
            -ArgumentList `
            $args


      - name: Decide hostname + runtime
        shell: pwsh
        run: |

          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {

            if ("$v" -match '^\d+$') {
              return [int]$v
            }

            return [int]$d
          }

          $runtime = IntOr(
            "${{ inputs.runtime_minutes }}",
            355
          )

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 355
          }

          if ($runtime -gt 360) {
            $runtime = 355
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File `
              -Append `
              $env:GITHUB_ENV


      - name: Purge bullet devices
        if: needs.setup.outputs.multi == '0'
        shell: pwsh
        run: |

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (-not (Yes("${{ inputs.do_purge }}"))) {
            Write-Host "Purge disabled."
            exit 0
          }

          try {

            $auth =
              [Convert]::ToBase64String(
                [Text.Encoding]::ASCII.GetBytes(
                  "${{ inputs.ts_api_key }}:"
                )
              )

            $tn =
              [uri]::EscapeDataString(
                "${{ inputs.ts_tailnet }}"
              )

            $list =
              Invoke-RestMethod `
                -Uri `
                "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                -Headers @{
                  Authorization =
                    "Basic $auth"
                }

            foreach ($d in $list.devices) {

              if ($d.hostname -match '^bullet[0-9]*$') {

                Invoke-RestMethod `
                  -Method Delete `
                  -Uri `
                  "https://api.tailscale.com/api/v2/device/$($d.id)" `
                  -Headers @{
                    Authorization =
                      "Basic $auth"
                  } `
                  -ErrorAction SilentlyContinue
              }
            }
          }
          catch {
            Write-Host `
              "Purge warning: $($_.Exception.Message)"
          }


      - name: Install + Up Tailscale
        shell: pwsh
        run: |

          $ts =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {

            $url =
              "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

            $dst =
              "$env:TEMP\tailscale.msi"

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $dst

            Start-Process `
              msiexec.exe `
              -ArgumentList `
              "/i",
              "`"$dst`"",
              "/quiet",
              "/norestart" `
              -Wait

            Remove-Item `
              $dst `
              -Force
          }

          & $ts logout 2>$null |
            Out-Null

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=true `
            --accept-routes=true

          $ip4 = (
            & $ts ip -4 |
            Select-Object -First 1
          )

          "TAILSCALE_IP=$ip4" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host `
            "TAILSCALE IP: $ip4"


      # ========================================================
      # RDP USER + FIREWALL — FIXED
      # ========================================================

      - name: Enable RDP user + firewall
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          Write-Host "========================================"
          Write-Host "CONFIGURING RDP USER"
          Write-Host "========================================"

          # ----------------------------------------------------
          # Create / update local user
          # ----------------------------------------------------

          $sec = ConvertTo-SecureString `
            $p `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $u `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            Write-Host "Creating user: $u"

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -Description "Persistent-RDP User" `
              -PasswordNeverExpires `
              -AccountNeverExpires |
              Out-Null

          }
          else {

            Write-Host "User already exists: $u"

            Set-LocalUser `
              -Name $u `
              -Password $sec

            Enable-LocalUser `
              -Name $u
          }

          # ----------------------------------------------------
          # Administrator group
          # ----------------------------------------------------

          try {

            $adminMembers =
              Get-LocalGroupMember `
                -Group "Administrators" `
                -ErrorAction Stop

            $alreadyAdmin =
              $adminMembers |
              Where-Object {
                $_.Name -match "\\$([regex]::Escape($u))$"
              }

            if (-not $alreadyAdmin) {

              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member $u `
                -ErrorAction Stop
            }

          }
          catch {

            Write-Host `
              "Administrator membership warning: $($_.Exception.Message)"

            net localgroup Administrators $u /add 2>$null
          }

          # ----------------------------------------------------
          # Remote Desktop Users group
          # ----------------------------------------------------

          try {

            $rdMembers =
              Get-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -ErrorAction Stop

            $alreadyRdp =
              $rdMembers |
              Where-Object {
                $_.Name -match "\\$([regex]::Escape($u))$"
              }

            if (-not $alreadyRdp) {

              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member $u `
                -ErrorAction Stop
            }

          }
          catch {

            Write-Host `
              "Remote Desktop Users membership warning: $($_.Exception.Message)"

            net localgroup "Remote Desktop Users" $u /add 2>$null
          }

          # ----------------------------------------------------
          # Enable Remote Desktop
          # ----------------------------------------------------

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Type DWord `
            -Value 0

          # ----------------------------------------------------
          # Enable RDP service
          # ----------------------------------------------------

          try {

            Set-Service `
              -Name TermService `
              -StartupType Automatic `
              -ErrorAction Stop

            Start-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue

          }
          catch {

            Write-Host `
              "TermService warning: $($_.Exception.Message)"
          }

          # ----------------------------------------------------
          # Firewall
          # ----------------------------------------------------

          netsh advfirewall firewall set rule `
            group="remote desktop" `
            new enable=Yes 2>$null

          netsh advfirewall firewall delete rule `
            name="Persistent-RDP-3389" 2>$null

          netsh advfirewall firewall add rule `
            name="Persistent-RDP-3389" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            profile=any

          # ----------------------------------------------------
          # Verify RDP registry
          # ----------------------------------------------------

          $rdpState =
            Get-ItemPropertyValue `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections"

          if ($rdpState -ne 0) {
            throw "RDP registry configuration failed."
          }

          # ----------------------------------------------------
          # Verify port listener
          # ----------------------------------------------------

          Write-Host ""
          Write-Host "RDP LISTENER STATUS:"

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Format-Table `
              LocalAddress,
              LocalPort,
              State,
              OwningProcess

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP CONFIGURATION COMPLETE"
          Write-Host "========================================"
          Write-Host "Username : $u"
          Write-Host "Password : $p"
          Write-Host "Port     : 3389"
          Write-Host "========================================"


      - name: Install Python libs
        shell: pwsh
        run: |

          python -m pip install --upgrade pip

          python -m pip install `
            --force-reinstall `
            telethon `
            pyautogui `
            pynput `
            pillow


      - name: Prepare persistent D storage
        shell: pwsh
        run: |

          $root =
            "D:\Persistent-RDP"

          $dirs = @(
            $root,
            "$root\Desktop",
            "$root\Documents",
            "$root\Downloads",
            "$root\Pictures",
            "$root\Videos",
            "$root\Users",
            "$root\AppData",
            "$root\ProgramData",
            "$root\ProgramFiles",
            "$root\ProgramFiles-x86",
            "$root\Projects",
            "$root\Projects\AE",
            "$root\Assets",
            "$root\Assets\Fonts",
            "$root\Plugins"
          )

          foreach ($d in $dirs) {

            New-Item `
              -ItemType Directory `
              -Path $d `
              -Force |
              Out-Null
          }

          Write-Host "===================================="
          Write-Host "D: PERSISTENT STORAGE READY"
          Write-Host "===================================="

          Get-Volume `
            -DriveLetter D |
            Format-List `
              DriveLetter,
              FileSystem,
              Size,
              SizeRemaining


      - name: Restore and start Persistent-RDP Sync
        shell: pwsh
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}

        run: |

          $root =
            "D:\Persistent-RDP"

          $script =
            "$env:TEMP\persistent_rdp_sync.py"

          @'
          import os
          import json
          import base64
          import hashlib
          import time
          from datetime import datetime, timezone
          from telethon import TelegramClient

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION_B64 = os.environ["SESSION_B64"]

          ROOT = r"D:\Persistent-RDP"

          INDEX_LOCAL = os.path.join(
              ROOT,
              "persistent_index.json"
          )

          CHUNK_SIZE = 4 * 1024 * 1024

          SESSION_FILE = os.path.join(
              os.environ["TEMP"],
              "unlim_session.session"
          )

          with open(SESSION_FILE, "wb") as f:
              f.write(
                  base64.b64decode(SESSION_B64)
              )

          client = TelegramClient(
              os.path.join(
                  os.environ["TEMP"],
                  "unlim_session"
              ),
              API_ID,
              API_HASH
          )

          def sha256(path):

              h = hashlib.sha256()

              with open(path, "rb") as f:

                  while True:

                      data = f.read(
                          4 * 1024 * 1024
                      )

                      if not data:
                          break

                      h.update(data)

              return h.hexdigest()

          def now():

              return datetime.now(
                  timezone.utc
              ).isoformat()

          def build_index():

              records = []

              for root, dirs, files in os.walk(
                  ROOT
              ):

                  dirs[:] = [
                      d for d in dirs
                      if d not in (
                          ".sync",
                          "TelegramCache"
                      )
                  ]

                  for name in files:

                      path = os.path.join(
                          root,
                          name
                      )

                      try:

                          size = os.path.getsize(
                              path
                          )

                          records.append({
                              "path":
                                  os.path.relpath(
                                      path,
                                      ROOT
                                  ).replace(
                                      "\\",
                                      "/"
                                  ),
                              "size": size,
                              "sha256":
                                  sha256(path)
                          })

                      except Exception as e:

                          print(
                              "SKIP:",
                              path,
                              e
                          )

              return records

          async def find_index():

              async for msg in client.iter_messages(
                  "me",
                  search="PERSISTENT-RDP-MASTER-INDEX",
                  limit=20
              ):

                  if msg.file:
                      return msg

              return None

          async def download_index():

              msg = await find_index()

              if not msg:
                  return None

              temp = os.path.join(
                  os.environ["TEMP"],
                  "persistent_master_index.json"
              )

              await client.download_media(
                  msg,
                  file=temp
              )

              with open(
                  temp,
                  "r",
                  encoding="utf-8"
              ) as f:

                  return json.load(f)

          async def restore_file(record):

              target = os.path.join(
                  ROOT,
                  record["path"].replace(
                      "/",
                      os.sep
                  )
              )

              if os.path.exists(target):

                  try:

                      if (
                          os.path.getsize(target)
                          == record["size"]
                          and
                          sha256(target)
                          == record["sha256"]
                      ):
                          return

                  except Exception:
                      pass

              os.makedirs(
                  os.path.dirname(target),
                  exist_ok=True
              )

              output = target + ".restore"

              with open(
                  output,
                  "wb"
              ) as out:

                  for chunk in record["chunks"]:

                      msg_id = chunk[
                          "telegram_message_id"
                      ]

                      msg = await client.get_messages(
                          "me",
                          ids=msg_id
                      )

                      if not msg:
                          raise RuntimeError(
                              "Missing Telegram chunk "
                              + str(msg_id)
                          )

                      temp = os.path.join(
                          os.environ["TEMP"],
                          "restore_chunk.bin"
                      )

                      await client.download_media(
                          msg,
                          file=temp
                      )

                      if (
                          sha256(temp)
                          != chunk["sha256"]
                      ):
                          raise RuntimeError(
                              "Chunk SHA256 mismatch"
                          )

                      with open(
                          temp,
                          "rb"
                      ) as f:

                          while True:

                              data = f.read(
                                  4 * 1024 * 1024
                              )

                              if not data:
                                  break

                              out.write(data)

              os.replace(
                  output,
                  target
              )

          async def restore():

              print(
                  "================================"
              )

              print(
                  "PERSISTENT-RDP RESTORE START"
              )

              old = await download_index()

              if not old:

                  print(
                      "NO PREVIOUS MASTER INDEX"
                  )

                  return

              for record in old.get(
                  "files",
                  []
              ):

                  try:

                      await restore_file(
                          record
                      )

                  except Exception as e:

                      print(
                          "RESTORE FAILED:",
                          record.get("path"),
                          e
                      )

              print(
                  "PERSISTENT-RDP RESTORE COMPLETE"
              )

          async def upload_file(
              path,
              relative
          ):

              size = os.path.getsize(path)

              chunks = []

              with open(
                  path,
                  "rb"
              ) as f:

                  index = 0

                  while True:

                      data = f.read(
                          CHUNK_SIZE
                      )

                      if not data:
                          break

                      temp = os.path.join(
                          os.environ["TEMP"],
                          "persistent_upload.bin"
                      )

                      with open(
                          temp,
                          "wb"
                      ) as out:

                          out.write(data)

                      h = sha256(temp)

                      msg = await client.send_file(
                          "me",
                          temp,
                          caption=(
                              "PERSISTENT-RDP-CHUNK\n"
                              f"path=/{relative}\n"
                              f"chunk={index}\n"
                              f"sha256={h}"
                          )
                      )

                      chunks.append({
                          "index": index,
                          "size": len(data),
                          "sha256": h,
                          "telegram_message_id":
                              msg.id
                      })

                      os.remove(temp)

                      index += 1

              return chunks

          async def sync():

              print(
                  "================================"
              )

              print(
                  "PERSISTENT-RDP SYNC START"
              )

              old = await download_index()

              old_map = {}

              if old:

                  for r in old.get(
                      "files",
                      []
                  ):

                      old_map[
                          r["path"]
                      ] = r

              current = build_index()

              new_records = []

              for item in current:

                  relative = item["path"]

                  previous = old_map.get(
                      relative
                  )

                  if (
                      previous
                      and
                      previous.get("size")
                      == item["size"]
                      and
                      previous.get("sha256")
                      == item["sha256"]
                  ):

                      new_records.append(
                          previous
                      )

                      continue

                  print(
                      "UPLOAD:",
                      relative
                  )

                  path = os.path.join(
                      ROOT,
                      relative.replace(
                          "/",
                          os.sep
                      )
                  )

                  chunks = await upload_file(
                      path,
                      relative
                  )

                  new_records.append({
                      "path": relative,
                      "size": item["size"],
                      "sha256": item["sha256"],
                      "chunk_size":
                          CHUNK_SIZE,
                      "chunk_count":
                          len(chunks),
                      "chunks":
                          chunks,
                      "updated_at":
                          now()
                  })

              master = {
                  "version": 3,
                  "type":
                      "persistent-rdp-master-index",
                  "updated_at":
                      now(),
                  "root":
                      "D:\\Persistent-RDP",
                  "files":
                      new_records
              }

              with open(
                  INDEX_LOCAL,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      master,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              await client.send_file(
                  "me",
                  INDEX_LOCAL,
                  caption=
                  "PERSISTENT-RDP-MASTER-INDEX"
              )

              print(
                  "PERSISTENT-RDP SYNC COMPLETE"
              )

          async def main():

              await client.start()

              print(
                  "TELEGRAM CONNECTED"
              )

              await restore()

              await sync()

              print(
                  "INITIAL PERSISTENCE READY"
              )

          with client:

              client.loop.run_until_complete(
                  main()
              )

          '@ |
            Set-Content `
              -Path $script `
              -Encoding UTF8

          python $script

          $runner =
            "$env:TEMP\persistent_rdp_sync_loop.ps1"

          @"
          while (`$true) {

              try {

                  python "$script"

                  Write-Host `
                    "PERSISTENT SYNC FINISHED"

              }
              catch {

                  Write-Host `
                    "PERSISTENT SYNC ERROR: `$(`$_.Exception.Message)"
              }

              Start-Sleep -Seconds 300
          }
          "@ |
            Set-Content `
              -Path $runner `
              -Encoding UTF8

          Start-Process `
            powershell.exe `
            -ArgumentList `
              "-NoProfile",
              "-ExecutionPolicy",
              "Bypass",
              "-File",
              "`"$runner`"" `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "========================================"
          Write-Host
