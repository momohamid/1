          $script = @'
          import os
          import base64
          import json
          import hashlib
          import math
          from pathlib import Path
          from datetime import datetime, timezone
          from telethon import TelegramClient

          ROOT = Path(r"D:\Persistent-RDP")
          SYNC = ROOT / "_sync"
          INDEX = SYNC / "telegram_index.json"

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION_B64 = os.environ["SESSION_B64"]

          SESSION = Path(
              os.environ["TEMP"]
          ) / "unlim_session.session"

          SESSION.write_bytes(
              base64.b64decode(SESSION_B64)
          )

          CHUNK_SIZE = 1024 * 1024

          EXCLUDED_DIRS = {
              "_sync",
              "System Volume Information",
              "$RECYCLE.BIN"
          }

          def now():
              return datetime.now(
                  timezone.utc
              ).isoformat()

          def sha256_file(path):

              h = hashlib.sha256()

              with open(path, "rb") as f:

                  while True:

                      data = f.read(
                          4 * 1024 * 1024
                      )

                      if not data:
                          break

                      h.update(data)

              return h.hexdigest()

          def discover():

              result = []

              for path in ROOT.rglob("*"):

                  if not path.is_file():
                      continue

                  relative_parts = path.relative_to(
                      ROOT
                  ).parts

                  if relative_parts and \
                     relative_parts[0] in EXCLUDED_DIRS:
                      continue

                  if path.name.endswith(
                      ".restore.tmp"
                  ):
                      continue

                  if path.name.endswith(
                      ".upload.tmp"
                  ):
                      continue

                  result.append(path)

              return sorted(result)

          def make_record(path):

              rel = (
                  path.relative_to(ROOT)
                  .as_posix()
              )

              size = path.stat().st_size

              return {
                  "path": "/" + rel,
                  "name": path.name,
                  "size": size,
                  "sha256": sha256_file(path),
                  "chunk_size": CHUNK_SIZE,
                  "chunk_count": max(
                      1,
                      math.ceil(
                          size / CHUNK_SIZE
                      )
                  ),
                  "chunks": [],
                  "updated_at": now()
              }

          def load_old_index():

              if not INDEX.exists():
                  return {
                      "version": 3,
                      "type":
                        "persistent-rdp-file-index",
                      "updated_at": now(),
                      "storage": {
                          "logical_capacity":
                              "10 TB",
                          "chunk_size":
                              CHUNK_SIZE
                      },
                      "files": []
                  }

              try:

                  with open(
                      INDEX,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      data = json.load(f)

                  if data.get("type") != \
                     "persistent-rdp-file-index":
                      raise RuntimeError(
                          "Wrong index type"
                      )

                  return data

              except Exception as e:

                  print(
                      "OLD INDEX READ WARNING:",
                      str(e)
                  )

                  return {
                      "version": 3,
                      "type":
                        "persistent-rdp-file-index",
                      "updated_at": now(),
                      "storage": {
                          "logical_capacity":
                              "10 TB",
                          "chunk_size":
                              CHUNK_SIZE
                      },
                      "files": []
                  }

          def atomic_write_json(path, data):

              tmp = Path(
                  str(path) + ".tmp"
              )

              with open(
                  tmp,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              os.replace(
                  tmp,
                  path
              )

          async def upload_file(
              client,
              record,
              path
          ):

              total = path.stat().st_size

              count = max(
                  1,
                  math.ceil(
                      total / CHUNK_SIZE
                  )
              )

              record["chunk_count"] = count
              record["chunks"] = []

              with open(path, "rb") as f:

                  for index in range(count):

                      data = f.read(
                          CHUNK_SIZE
                      )

                      tmp = Path(
                          str(SYNC)
                          + "\\upload_"
                          + str(os.getpid())
                          + "_"
                          + str(index)
                          + ".tmp"
                      )

                      with open(
                          tmp,
                          "wb"
                      ) as out:
                          out.write(data)

                      chunk_hash = \
                          sha256_file(tmp)

                      caption = (
                          "PERSISTENT-RDP-CHUNK\n"
                          f"path={record['path']}\n"
                          f"chunk={index}\n"
                          f"chunks={count}\n"
                          f"sha256={chunk_hash}"
                      )

                      message = await client.send_file(
                          "me",
                          str(tmp),
                          caption=caption
                      )

                      record["chunks"].append({
                          "index": index,
                          "size": len(data),
                          "sha256":
                              chunk_hash,
                          "telegram_message_id":
                              message.id
                      })

                      tmp.unlink(
                          missing_ok=True
                      )

                      print(
                          "UPLOAD CHUNK:",
                          record["path"],
                          index + 1,
                          "/",
                          count
                      )

          async def save_index(
              client,
              index
          ):

              backup = (
                  SYNC /
                  "telegram_index.previous.json"
              )

              if INDEX.exists():

                  try:

                      backup.write_bytes(
                          INDEX.read_bytes()
                      )

                  except Exception:
                      pass

              atomic_write_json(
                  INDEX,
                  index
              )

              message = await client.send_file(
                  "me",
                  str(INDEX),
                  caption="PERSISTENT-RDP-INDEX"
              )

              index["telegram_index_message_id"] = \
                  message.id

              atomic_write_json(
                  INDEX,
                  index
              )

              print(
                  "INDEX UPLOADED:",
                  message.id
              )

          async def sync():

              SYNC.mkdir(
                  parents=True,
                  exist_ok=True
              )

              client = TelegramClient(
                  str(SESSION.with_suffix("")),
                  API_ID,
                  API_HASH
              )

              async with client:

                  await client.start()

                  print(
                      "TELEGRAM SYNC CONNECTED"
                  )

                  old = load_old_index()

                  old_map = {
                      x["path"]: x
                      for x in old.get(
                          "files",
                          []
                      )
                  }

                  paths = discover()

                  print(
                      "LOCAL FILES:",
                      len(paths)
                  )

                  new_files = []

                  uploaded = 0
                  unchanged = 0

                  for path in paths:

                      record = make_record(
                          path
                      )

                      old_record = old_map.get(
                          record["path"]
                      )

                      if (
                          old_record
                          and
                          old_record.get(
                              "sha256"
                          )
                          == record["sha256"]
                          and
                          int(
                              old_record.get(
                                  "size",
                                  -1
                              )
                          )
                          == record["size"]
                          and
                          old_record.get(
                              "chunks"
                          )
                      ):

                          record["chunks"] = \
                              old_record["chunks"]

                          record["chunk_count"] = \
                              old_record[
                                  "chunk_count"
                              ]

                          unchanged += 1

                          print(
                              "UNCHANGED:",
                              record["path"]
                          )

                      else:

                          print(
                              "CHANGED/NEW:",
                              record["path"]
                          )

                          await upload_file(
                              client,
                              record,
                              path
                          )

                          uploaded += 1

                      new_files.append(
                          record
                      )

                  index = {
                      "version": 3,
                      "type":
                        "persistent-rdp-file-index",
                      "updated_at": now(),
                      "storage": {
                          "logical_capacity":
                              "10 TB",
                          "chunk_size":
                              CHUNK_SIZE
                      },
                      "files": new_files
                  }

                  await save_index(
                      client,
                      index
                  )

                  print("")
                  print(
                      "================================"
                  )
                  print(
                      "PERSISTENT SYNC COMPLETE"
                  )
                  print(
                      "FILES:",
                      len(new_files)
                  )
                  print(
                      "UPLOADED:",
                      uploaded
                  )
                  print(
                      "UNCHANGED:",
                      unchanged
                  )
                  print(
                      "================================"
                  )

          import asyncio
          asyncio.run(sync())
          '@

