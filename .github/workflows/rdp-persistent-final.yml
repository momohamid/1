name: RDP + Persistent VM Snapshot

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet"
        required: true
      ts_api_key:
        description: "Tailscale API key"
        required: true
      ts_authkey:
        description: "Tailscale Auth key"
        required: true
      runtime_minutes:
        description: "Runtime minutes"
        required: false
        default: "355"

permissions:
  contents: write
  actions: write
  packages: write

defaults:
  run:
    shell: powershell

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 370
    env:
      RDP_USER: Yousif185
      RDP_PASS: Yousif1985

    steps:
      - name: Restore VM Snapshot
        run: |
          $snapshotFile = "C:\vm_snapshot.tar.gz"
          $snapshotUrl = "https://github.com/${{ github.repository }}/releases/download/snapshot/vm_snapshot.tar.gz"

          try {
            Write-Host "Downloading VM snapshot..."
            Invoke-WebRequest -Uri $snapshotUrl -OutFile $snapshotFile -ErrorAction Stop
            Write-Host "Snapshot downloaded. Extracting..."
            tar -xzf $snapshotFile -C C:\
            Write-Host "VM snapshot restored successfully!"
          } catch {
            Write-Host "No snapshot found. Starting fresh VM."
          }

      - name: Install Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $url -OutFile $dst
            Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
            Remove-Item $dst -Force
          }
          & $ts logout | Out-Null
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "bullet-rdp" --accept-dns=true --accept-routes=true
          $ip4 = & $ts ip -4 | Select-Object -First 1
          "TAILSCALE_IP=$ip4" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Tailscale IPv4: $ip4"

      - name: Enable RDP user + firewall
        run: |
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          Write-Host "RDP ready. user=$u pass=$p host=bullet-rdp ip=$env:TAILSCALE_IP"

      - name: Install RustDesk
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
            $installerPath = "$env:TEMP\rustdesk.msi"
            Invoke-WebRequest -Uri $rdUrl -OutFile $installerPath
            Start-Process msiexec.exe -ArgumentList "/i","`"$installerPath`"","/quiet","/norestart" -Wait
            Remove-Item $installerPath -Force
          }
          Write-Host "RustDesk installed."

      - name: Launch RustDesk
        run: |
          Start-Process -FilePath "C:\Program Files\RustDesk\rustdesk.exe" -ErrorAction SilentlyContinue

      - name: Keep alive
        run: |
          $mins = [int]"${{ inputs.runtime_minutes }}"
          $end = (Get-Date).AddMinutes($mins)
          while ((Get-Date) -lt $end) {
            Write-Host "Heartbeat $(Get-Date) | VM Snapshot Active"
            Start-Sleep -Seconds 60
          }

      - name: Create VM Snapshot
        if: always()
        run: |
          Write-Host "Creating VM snapshot..."
          $snapshotFile = "C:\vm_snapshot.tar.gz"
          
          # ضغط القرص C: بالكامل (باستثناء الملفات المؤقتة)
          tar -czf $snapshotFile --exclude="C:\Windows\Temp" --exclude="C:\Users\*\AppData\Local\Temp" C:\
          
          Write-Host "Uploading snapshot to GitHub Releases..."
          
          # إنشاء Release جديد (إن لم يكن موجوداً)
          $releaseUrl = "https://api.github.com/repos/${{ github.repository }}/releases"
          $headers = @{
            Authorization = "Bearer ${{ github.token }}"
            Accept = "application/vnd.github.v3+json"
          }
          
          try {
            $releases = Invoke-RestMethod -Method GET -Uri $releaseUrl -Headers $headers
            $snapshotRelease = $releases | Where-Object { $_.tag_name -eq "snapshot" } | Select-Object -First 1
          } catch {
            $snapshotRelease = $null
          }
          
          if (-not $snapshotRelease) {
            $body = @{
              tag_name = "snapshot"
              name = "VM Snapshot"
              body = "Full VM snapshot"
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            $snapshotRelease = Invoke-RestMethod -Method POST -Uri $releaseUrl -Headers $headers -Body $body
          }
          
          $uploadUrl = $snapshotRelease.upload_url -replace '{?name,label}', ''
          $fileBytes = [System.IO.File]::ReadAllBytes($snapshotFile)
          $uploadHeaders = @{
            Authorization = "Bearer ${{ github.token }}"
            "Content-Type" = "application/gzip"
          }
          Invoke-RestMethod -Method POST -Uri "$uploadUrl?name=vm_snapshot.tar.gz" -Headers $uploadHeaders -Body $fileBytes
          
          Write-Host "VM snapshot uploaded successfully!"
