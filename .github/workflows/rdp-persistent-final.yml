name: RDP + Tailscale + RustDesk + (Optional) CRD (A) - Auto-Renew + Google Drive Persistence

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin, no Bearer)"
        required: true
      ts_authkey:
        description: "Tailscale Auth key (reusable or ephemeral)"
        required: true
      quick_test:
        description: "Run 5-minute test"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime (max 360; default 300 when not test)"
        required: false
        default: "300"
      do_purge:
        description: "Purge bullet* devices at start (single instance only)"
        required: false
        default: "true"
      cycles:
        description: "0=stop after A; N=handoffs left incl this run"
        required: false
        default: "9999"
      rdp_count:
        description: "How many RDP instances (1-10) [ignored if CRD provided]"
        required: false
        default: "1"
      crd_code:
        description: >-
          Paste raw CRD code (4/0AV...), full PowerShell command, or text/URL containing --code="4/...".
          If provided -> single instance; CRD launches first.
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6–12 digits). Used when launching CRD to avoid interactive prompt."
        required: false
        default: "123456"

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:

      - id: mk
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = [int]"${{ inputs.rdp_count }}"

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{
              id = $i
            }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          $multi = if ($n -gt 1) {
            '1'
          }
          else {
            '0'
          }

          "multi=$multi" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8


  rdp:
    needs: setup

    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif1990

    steps:

      # ========================================================
      # CRD FLAG
      # ========================================================

      - name: Set CRD flag early
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File `
              -Append `
              $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File `
              -Append `
              $env:GITHUB_ENV
          }

          Write-Host "CRD_ENABLED=$([int]($crd.Length -gt 0))"


      # ========================================================
      # CRD INSTALL
      # ========================================================

      - name: Install Chrome Remote Desktop Host (if missing)
        if: env.CRD_ENABLED == '1'
        run: |
          $exe =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            Write-Host `
              "CRD host not found, attempting install..."

            $exePath =
              "$env:TEMP\chromeremotedesktophost.exe"

            $ok = $false

            try {

              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile `
                $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath `
                $exePath `
                -ArgumentList `
                "/silent",
                "/install" `
                -Wait

              Remove-Item `
                $exePath `
                -Force

              $ok = $true

            }
            catch {

              Write-Host `
                "EXE installer failed: $($_.Exception.Message)"
            }

            if (-not $ok) {

              $msi =
                "$env:TEMP\chromeremotedesktophost.msi"

              try {

                Invoke-WebRequest `
                  -Uri `
                  "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                  -OutFile `
                  $msi `
                  -ErrorAction Stop

                Start-Process `
                  msiexec.exe `
                  -ArgumentList `
                  "/i",
                  "`"$msi`"",
                  "/quiet",
                  "/norestart" `
                  -Wait

                Remove-Item `
                  $msi `
                  -Force

              }
              catch {

                Write-Error `
                  "CRD MSI fallback failed: $($_.Exception.Message)"

                exit 1
              }
            }

          }
          else {

            Write-Host `
              "CRD host already installed."
          }


      # ========================================================
      # CRD START
      # ========================================================

      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        run: |

          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin =
            "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {

            Write-Error `
              "crd_pin must be 6–12 digits."

            exit 1
          }

          $starter =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {

            Write-Error `
              "remoting_start_host.exe not found."

            exit 1
          }

          $isFull = $false
          $code = $null

          if (
            $raw -match `
            'remoting_start_host\.exe'
          ) {
            $isFull = $true
          }

          if (
            $raw -match `
            '--code\s*=\s*"?([^"\s]+)'
          ) {

            $code = (
              [regex]::Match(
                $raw,
                '--code\s*=\s*"?([^"\s]+)'
              )
            ).Groups[1].Value

          }
          elseif (
            $raw -match '^4\/'
          ) {

            $code = $raw
          }

          if ($code) {

            $redir =
              "https://remotedesktop.google.com/_/oauthredirect"

            $name =
              $Env:COMPUTERNAME

            $args = @(
              "--code=""$code""",
              "--redirect-url=""$redir""",
              "--name=""$name""",
              "--pin=""$pin"""
            )

            Start-Process `
              -FilePath `
              $starter `
              -ArgumentList `
              $args

          }
          elseif ($isFull) {

            $tmp =
              "$env:TEMP\crd_full.ps1"

            Set-Content `
              -Path $tmp `
              -Value $raw `
              -Encoding UTF8

            powershell `
              -ExecutionPolicy Bypass `
              -File $tmp

          }
          else {

            Write-Error `
              "Could not detect CRD code."

            exit 1
          }

          Write-Host `
            "CRD launch step completed."


      # ========================================================
      # CRD VERIFY
      # ========================================================

      - name: Verify CRD registration
        if: env.CRD_ENABLED == '1'
        run: |

          $svcName =
            "Chrome Remote Desktop Service"

          $deadline =
            (Get-Date).AddSeconds(60)

          $ok = $false

          while (
            (Get-Date) -lt $deadline
          ) {

            $svc =
              Get-Service `
                -Name $svcName `
                -ErrorAction SilentlyContinue

            if (
              $svc -and
              $svc.Status -in
              'Running',
              'StartPending'
            ) {

              $ok = $true
              break
            }

            Start-Sleep `
              -Seconds 3
          }

          if ($ok) {

            Write-Host `
              "CRD service is running or starting."

          }
          else {

            Write-Warning `
              "CRD service not running yet."
          }


      # ========================================================
      # HOSTNAME / RUNTIME
      # ========================================================

      - name: Decide hostname + runtime
        run: |

          if ("${{ inputs.rdp_count }}" -gt 1) {

            $hn =
              "bullet${{ matrix.id }}"

          }
          else {

            $hn =
              "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File `
            -Append `
            $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match `
              '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {

            if (
              "$v" -match '^\d+$'
            ) {

              [int]$v

            }
            else {

              [int]$d
            }
          }

          $runtime =
            IntOr(
              "${{ inputs.runtime_minutes }}",
              300
            )

          if (
            Yes("${{ inputs.quick_test }}")
          ) {

            $runtime = 5
          }

          if (
            -not (
              Yes("${{ inputs.quick_test }}")
            ) -and
            $runtime -lt 6
          ) {

            $runtime = 300
          }

          if ($runtime -gt 360) {

            $runtime = 300
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File `
            -Append `
            $env:GITHUB_ENV

          Write-Host `
            "Hostname: $hn | Runtime: $runtime"


      # ========================================================
      # PURGE
      # ========================================================

      - name: Purge bullet devices
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |

          function Yes($v) {
            "$v" -match `
              '^(?i:true|1|yes|on)$'
          }

          if (
            Yes("${{ inputs.do_purge }}")
          ) {

            try {

              $auth =
                [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes(
                    "${{ inputs.ts_api_key }}:"
                  )
                )

              $tn =
                [uri]::EscapeDataString(
                  "${{ inputs.ts_tailnet }}"
                )

              $list =
                Invoke-RestMethod `
                  -Uri `
                  "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                  -Headers @{
                    Authorization =
                      "Basic $auth"
                  }

              foreach (
                $d in $list.devices
              ) {

                if (
                  $d.hostname -match
                  '^bullet[0-9]*$'
                ) {

                  Invoke-RestMethod `
                    -Method Delete `
                    -Uri `
                    "https://api.tailscale.com/api/v2/device/$($d.id)" `
                    -Headers @{
                      Authorization =
                        "Basic $auth"
                    } `
                    -ErrorAction SilentlyContinue
                }
              }

              Write-Host `
                "Purged bullet devices."

            }
            catch {

              Write-Host `
                "Purge warning: $($_.Exception.Message)"
            }

          }
          else {

            Write-Host `
              "Purge disabled."
          }


      # ========================================================
      # TAILSCALE
      # ========================================================

      - name: Install + Up Tailscale
        run: |

          winget install `
            --id Tailscale.Tailscale `
            -e `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Start-Sleep `
            -Seconds 5

          $ts =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $ts) {

            & $ts logout |
              Out-Null

            & $ts up `
              --authkey "${{ inputs.ts_authkey }}" `
              --hostname "$env:TS_HOSTNAME" `
              --accept-dns=true `
              --accept-routes=true

            $ip4 =
              & $ts ip -4 |
              Select-Object -First 1

            "TAILSCALE_IP=$ip4" |
              Out-File `
              -Append `
              $env:GITHUB_ENV

            Write-Host `
              "Tailscale IPv4: $ip4"

          }
          else {

            Write-Error `
              "Tailscale not found."

            exit 1
          }


      # ========================================================
      # RDP USER
      # ========================================================

      - name: Enable RDP user + firewall
        run: |

          $u =
            $env:RDP_USER

          $p =
            $env:RDP_PASS

          $sec =
            ConvertTo-SecureString `
              $p `
              -AsPlainText `
              -Force

          if (
            -not (
              Get-LocalUser `
                -Name $u `
                -ErrorAction SilentlyContinue
            )
          ) {

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $u

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $u

          }
          else {

            Set-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

            Enable-LocalUser `
              -Name $u

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $u `
              -ErrorAction SilentlyContinue

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $u `
              -ErrorAction SilentlyContinue
          }

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Out-Null

          Write-Host `
            "RDP ready."

          Write-Host `
            "User: $u"

          Write-Host `
            "Host: $env:TS_HOSTNAME"

          Write-Host `
            "IP: $env:TAILSCALE_IP"


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Install Python libs
        run: |

          python -m pip install `
            --upgrade `
            pip

          python -m pip install `
            --force-reinstall `
            pyautogui `
            pynput `
            pillow

          python -c `
            "import pyautogui, pynput, PIL; print('Python libs OK')"


      # ========================================================
      # RCLONE + WINFSP
      # ========================================================

      - name: Install rclone + WinFsp
        shell: pwsh
        run: |

          $rcloneDir =
            "C:\Tools\rclone"

          $rcloneExe =
            "$rcloneDir\rclone.exe"

          New-Item `
            -ItemType Directory `
            -Path $rcloneDir `
            -Force |
            Out-Null

          if (-not (Test-Path $rcloneExe)) {

            $zip =
              "$env:TEMP\rclone.zip"

            Invoke-WebRequest `
              -Uri `
              "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
              -OutFile `
              $zip `
              -UseBasicParsing

            $extract =
              "$env:TEMP\rclone_extract"

            Remove-Item `
              $extract `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force

            $found =
              Get-ChildItem `
                $extract `
                -Recurse `
                -Filter "rclone.exe" |
              Select-Object -First 1

            if (-not $found) {

              throw `
                "rclone.exe was not found after download."
            }

            Copy-Item `
              $found.FullName `
              $rcloneExe `
              -Force

            Remove-Item `
              $zip `
              -Force `
              -ErrorAction SilentlyContinue

            Remove-Item `
              $extract `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $rcloneExe)) {

            throw `
              "rclone installation failed."
          }

          Write-Host `
            "rclone installed."

          $winfsp =
            Get-ChildItem `
              "C:\Program Files (x86)\WinFsp" `
              -ErrorAction SilentlyContinue

          if (-not $winfsp) {

            $msi =
              "$env:TEMP\winfsp.msi"

            Invoke-WebRequest `
              -Uri `
              "https://github.com/winfsp/winfsp/releases/latest/download/winfsp.msi" `
              -OutFile `
              $msi `
              -UseBasicParsing

            Start-Process `
              msiexec.exe `
              -ArgumentList `
              "/i",
              "`"$msi`"",
              "/quiet",
              "/norestart" `
              -Wait

            Remove-Item `
              $msi `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host `
            "WinFsp installation checked."


      # ========================================================
      # GOOGLE DRIVE CONFIG + MOUNT
      # ========================================================

      - name: Connect Google Drive and restore persistent files
        shell: pwsh
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: |

          $rclone =
            "C:\Tools\rclone\rclone.exe"

          if (-not (Test-Path $rclone)) {

            throw `
              "rclone.exe missing."
          }

          if (
            [string]::IsNullOrWhiteSpace(
              $env:DRIVE_TOKEN
            )
          ) {

            throw `
              "DRIVE_TOKEN secret is missing."
          }

          $configDir =
            "$env:APPDATA\rclone"

          $config =
            "$configDir\rclone.conf"

          New-Item `
            -ItemType Directory `
            -Path $configDir `
            -Force |
            Out-Null

          $token =
            $env:DRIVE_TOKEN.Trim()

          try {

            $tokenObject =
              $token |
              ConvertFrom-Json

            if (
              -not $tokenObject.access_token
            ) {

              throw `
                "JSON does not contain access_token."
            }

            $tokenJson =
              $tokenObject |
              ConvertTo-Json `
                -Compress
          }
          catch {

            throw `
              "DRIVE_TOKEN is not valid OAuth JSON: $($_.Exception.Message)"
          }

          @"
          [gdrive]
          type = drive
          scope = drive
          token = $tokenJson
          "@ |
            Set-Content `
              -Path $config `
              -Encoding UTF8

          & $rclone `
            --config $config `
            config show gdrive

          & $rclone `
            --config $config `
            lsd `
            gdrive: `
            --timeout 60s

          if ($LASTEXITCODE -ne 0) {

            throw `
              "Google Drive authentication failed."
          }

          $persistRoot =
            "gdrive:.persistent-rdp"

          & $rclone `
            --config $config `
            mkdir `
            $persistRoot

          $manifestRemote =
            "gdrive:.persistent-rdp/manifest.json"

          $manifestLocal =
            "$env:TEMP\persistent-rdp-manifest.json"

          $userRoot =
            $env:USERPROFILE

          if (
            -not (
              Test-Path $manifestLocal
            )
          ) {

            & $rclone `
              --config $config `
              copyto `
              $manifestRemote `
              $manifestLocal `
              --timeout 120s `
              --retries 3

            if ($LASTEXITCODE -ne 0) {

              Write-Host `
                "No previous manifest found. Starting fresh."

              @{
                version = 1
                files = @()
              } |
                ConvertTo-Json `
                  -Depth 10 |
                Set-Content `
                  $manifestLocal `
                  -Encoding UTF8
            }
          }

          try {

            $manifest =
              Get-Content `
                $manifestLocal `
                -Raw |
              ConvertFrom-Json

          }
          catch {

            $manifest = @{
              version = 1
              files = @()
            }
          }

          if (
            -not $manifest.files
          ) {

            $manifest = @{
              version = 1
              files = @()
            }
          }

          foreach (
            $record in @($manifest.files)
          ) {

            $relative =
              [string]$record.path

            if (
              [string]::IsNullOrWhiteSpace(
                $relative
              )
            ) {
              continue
            }

            $target =
              Join-Path `
                $userRoot `
                $relative

            $remote =
              "gdrive:.persistent-rdp/files/$relative"

            $parent =
              Split-Path `
                $target `
                -Parent

            New-Item `
              -ItemType Directory `
              -Path $parent `
              -Force |
              Out-Null

            Write-Host `
              "RESTORE: $relative"

            & $rclone `
              --config $config `
              copyto `
              $remote `
              $target `
              --timeout 300s `
              --retries 3 `
              --low-level-retries 10

            if ($LASTEXITCODE -ne 0) {

              Write-Warning `
                "Restore failed: $relative"
            }
          }

          # ====================================================
          # CREATE A REAL FILE-EXPLORER DRIVE
          # ====================================================

          $driveLetter =
            "G:"

          Get-Process `
            rclone `
            -ErrorAction SilentlyContinue |
            Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep `
            -Seconds 2

          if (
            Get-PSDrive `
              -Name G `
              -ErrorAction SilentlyContinue
          ) {

            Remove-PSDrive `
              -Name G `
              -Force `
              -ErrorAction SilentlyContinue
          }

          $mountLog =
            "$env:TEMP\rclone-mount.log"

          $mountArgs = @(
            "--config",
            $config,
            "mount",
            "gdrive:",
            $driveLetter,
            "--network-mode",
            "--volname",
            "Google Drive",
            "--vfs-cache-mode",
            "full",
            "--vfs-cache-max-size",
            "20G",
            "--dir-cache-time",
            "30s",
            "--poll-interval",
            "30s",
            "--transfers",
            "4",
            "--checkers",
            "8",
            "--timeout",
            "1m",
            "--contimeout",
            "10s",
            "--log-file",
            $mountLog,
            "--log-level",
            "INFO"
          )

          Start-Process `
            -FilePath $rclone `
            -ArgumentList $mountArgs `
            -WindowStyle Hidden

          $deadline =
            (Get-Date).AddSeconds(45)

          $mounted = $false

          while (
            (Get-Date) -lt $deadline
          ) {

            if (
              Test-Path `
                "G:\"
            ) {

              $mounted = $true
              break
            }

            Start-Sleep `
              -Seconds 2
          }

          if (-not $mounted) {

            Write-Warning `
              "Google Drive mount was not detected yet."

            if (
              Test-Path $mountLog
            ) {

              Get-Content `
                $mountLog `
                -Tail 100
            }
          }
          else {

            Write-Host `
              "=========================================="

            Write-Host `
              "GOOGLE DRIVE MOUNTED AS G:"

            Write-Host `
              "=========================================="
          }

          # Save values for later steps.
          "RCLONE_EXE=$rclone" |
            Out-File `
            -Append `
            $env:GITHUB_ENV

          "RCLONE_CONFIG=$config" |
            Out-File `
            -Append `
            $env:GITHUB_ENV

          "DRIVE_MOUNT=G:" |
            Out-File `
            -Append `
            $env:GITHUB_ENV

          Write-Host `
            "Google Drive persistence initialized."


      # ========================================================
      # START FILE MONITOR
      # ========================================================

      - name: Start user-file persistence monitor
        shell: pwsh
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: |

          $monitor =
            "$env:TEMP\persistent-rdp-monitor.ps1"

          $rclone =
            "$env:RCLONE_EXE"

          $config =
            "$env:RCLONE_CONFIG"

          if (
            -not (Test-Path $rclone)
          ) {

            throw `
              "rclone not available."
          }

          $userRoot =
            $env:USERPROFILE

          $marker =
            "$env:TEMP\persistent-rdp-session-start.txt"

          Get-Date |
            Set-Content `
              $marker `
              -Encoding UTF8

          @'
          param(
              [string]$Rclone,
              [string]$Config,
              [string]$UserRoot,
              [string]$Marker
          )

          $ErrorActionPreference = "Continue"

          $remoteRoot =
              "gdrive:.persistent-rdp/files"

          $manifestRemote =
              "gdrive:.persistent-rdp/manifest.json"

          $manifestLocal =
              "$env:TEMP\persistent-rdp-live-manifest.json"

          $stateLock =
              "$env:TEMP\persistent-rdp-manifest.lock"

          $watchRoots = @(
              "$UserRoot\Desktop",
              "$UserRoot\Documents",
              "$UserRoot\Downloads",
              "$UserRoot\Pictures",
              "$UserRoot\Videos",
              "$UserRoot\Music"
          )

          $excludedParts = @(
              "\AppData\Local\Temp\",
              "\AppData\Local\Microsoft\Edge\User Data\",
              "\AppData\Local\Google\Chrome\User Data\",
              "\AppData\Local\Packages\"
          )

          function Is-Excluded(
              [string]$Path
          ) {

              $full =
                  [System.IO.Path]::GetFullPath(
                      $Path
                  )

              foreach (
                  $part in $excludedParts
              ) {

                  if (
                      $full.IndexOf(
                          $part,
                          [System.StringComparison]::OrdinalIgnoreCase
                      ) -ge 0
                  ) {

                      return $true
                  }
              }

              return $false
          }

          function Relative-Path(
              [string]$Path
          ) {

              return (
                  $Path.Substring(
                      $UserRoot.Length
                  ).TrimStart(
                      "\"
                  ).Replace(
                      "\",
                      "/"
                  )
              )
          }

          function Load-Manifest {

              if (
                  Test-Path $manifestLocal
              ) {

                  try {

                      return (
                          Get-Content `
                              $manifestLocal `
                              -Raw |
                          ConvertFrom-Json
                      )

                  }
                  catch {}
              }

              return @{
                  version = 1
                  files = @()
              }
          }

          function Save-Manifest(
              $Manifest
          ) {

              $json =
                  $Manifest |
                  ConvertTo-Json `
                    -Depth 20

              $json |
                  Set-Content `
                    $manifestLocal `
                    -Encoding UTF8

              & $Rclone `
                  --config $Config `
                  copyto `
                  $manifestLocal `
                  $manifestRemote `
                  --timeout 120s `
                  --retries 3 `
                  --low-level-retries 10 |
                  Out-Null
          }

          function Add-Or-Update-Manifest(
              [string]$Relative,
              [long]$Size
          ) {

              while (
                  Test-Path $stateLock
              ) {

                  Start-Sleep `
                      -Milliseconds 100
              }

              New-Item `
                  -ItemType File `
                  -Path $stateLock `
                  -Force |
                  Out-Null

              try {

                  $manifest =
                      Load-Manifest

                  $arr =
                      @(
                          $manifest.files
                      )

                  $existing =
                      $arr |
                      Where-Object {
                          $_.path -eq $Relative
                      } |
                      Select-Object -First 1

                  if ($existing) {

                      $existing.size =
                          $Size

                      $existing.updated_at =
                          (Get-Date).ToUniversalTime().ToString(
                              "o"
                          )

                  }
                  else {

                      $arr += [PSCustomObject]@{
                          path =
                              $Relative

                          size =
                              $Size

                          created_at =
                              (Get-Date).ToUniversalTime().ToString(
                                  "o"
                              )

                          updated_at =
                              (Get-Date).ToUniversalTime().ToString(
                                  "o"
                              )
                      }
                  }

                  $manifest.files =
                      @($arr)

                  Save-Manifest `
                      $manifest

              }
              finally {

                  Remove-Item `
                      $stateLock `
                      -Force `
                      -ErrorAction SilentlyContinue
              }
          }

          function Upload-File(
              [string]$Path
          ) {

              if (
                  -not (Test-Path -LiteralPath $Path -PathType Leaf)
              ) {
                  return
              }

              if (
                  Is-Excluded $Path
              ) {
                  return
              }

              try {

                  $item =
                      Get-Item `
                          -LiteralPath $Path `
                          -ErrorAction Stop

                  $relative =
                      Relative-Path `
                          $Path

                  if (
                      [string]::IsNullOrWhiteSpace(
                          $relative
                      )
                  ) {
                      return
                  }

                  $remote =
                      "$remoteRoot/$relative"

                  Write-Host `
                      "UPLOAD: $relative"

                  & $Rclone `
                      --config $Config `
                      copyto `
                      $Path `
                      $remote `
                      --timeout 300s `
                      --retries 3 `
                      --low-level-retries 10

                  if (
                      $LASTEXITCODE -eq 0
                  ) {

                      Add-Or-Update-Manifest `
                          $relative `
                          $item.Length

                      Write-Host `
                          "SAVED: $relative"
                  }
                  else {

                      Write-Warning `
                          "Upload failed: $relative"
                  }

              }
              catch {

                  Write-Warning `
                      "Monitor error: $($_.Exception.Message)"
              }
          }

          function Remove-File(
              [string]$Path
          ) {

              if (
                  Is-Excluded $Path
              ) {
                  return
              }

              try {

                  $relative =
                      Relative-Path `
                          $Path

                  $remote =
                      "$remoteRoot/$relative"

                  Write-Host `
                      "DELETE: $relative"

                  & $Rclone `
                      --config $Config `
                      deletefile `
                      $remote `
                      --timeout 120s `
                      --retries 3 `
                      --low-level-retries 10 |
                      Out-Null

                  $manifest =
                      Load-Manifest

                  $manifest.files =
                      @(
                          @(
                              $manifest.files
                          ) |
                          Where-Object {
                              $_.path -ne $relative
                          }
                      )

                  Save-Manifest `
                      $manifest
              }
              catch {

                  Write-Warning `
                      "Delete sync failed: $($_.Exception.Message)"
              }
          }

          $watchers = @()

          foreach (
              $root in $watchRoots
          ) {

              if (
                  -not (Test-Path $root)
              ) {
                  continue
              }

              $watcher =
                  New-Object `
                      System.IO.FileSystemWatcher

              $watcher.Path =
                  $root

              $watcher.IncludeSubdirectories =
                  $true

              $watcher.NotifyFilter =
                  [System.IO.NotifyFilters]::FileName `
                  -bor
                  [System.IO.NotifyFilters]::DirectoryName `
                  -bor
                  [System.IO.NotifyFilters]::LastWrite `
                  -bor
                  [System.IO.NotifyFilters]::Size

              $watcher.EnableRaisingEvents =
                  $true

              $createdAction = {

                  Upload-File `
                      $Event.SourceEventArgs.FullPath
              }

              $changedAction = {

                  Start-Sleep `
                      -Milliseconds 500

                  Upload-File `
                      $Event.SourceEventArgs.FullPath
              }

              $renamedAction = {

                  Upload-File `
                      $Event.SourceEventArgs.FullPath
              }

              $deletedAction = {

                  Remove-File `
                      $Event.SourceEventArgs.FullPath
              }

              Register-ObjectEvent `
                  $watcher `
                  Created `
                  -Action $createdAction |
                  Out-Null

              Register-ObjectEvent `
                  $watcher `
                  Changed `
                  -Action $changedAction |
                  Out-Null

              Register-ObjectEvent `
                  $watcher `
                  Renamed `
                  -Action $renamedAction |
                  Out-Null

              Register-ObjectEvent `
                  $watcher `
                  Deleted `
                  -Action $deletedAction |
                  Out-Null

              $watchers +=
                  $watcher

              Write-Host `
                  "Monitoring: $root"
          }

          Write-Host `
              "========================================"

          Write-Host `
              "PERSISTENT-RDP FILE MONITOR ACTIVE"

          Write-Host `
              "New/changed files are synced to Google Drive."

          Write-Host `
              "========================================"

          while ($true) {

              Start-Sleep `
                  -Seconds 5
          }
          '@ |
            Set-Content `
              -Path $monitor `
              -Encoding UTF8

          Start-Process `
            powershell.exe `
            -ArgumentList `
              "-NoProfile",
              "-ExecutionPolicy",
              "Bypass",
              "-File",
              "`"$monitor`"",
              "-Rclone",
              "`"$rclone`"",
              "-Config",
              "`"$config`"",
              "-UserRoot",
              "`"$userRoot`"",
              "-Marker",
              "`"$marker`"" `
            -WindowStyle Hidden

          Write-Host `
            "FILE MONITOR STARTED."


      # ========================================================
      # RUSTDESK
      # ========================================================

      - name: Install RustDesk
        run: |

          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rdExe)) {

            $rdUrl =
              "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"

            $installerPath =
              "$env:TEMP\rustdesk.msi"

            Invoke-WebRequest `
              -Uri $rdUrl `
              -OutFile $installerPath

            Start-Process `
              msiexec.exe `
              -ArgumentList `
              "/i",
              "`"$installerPath`"",
              "/quiet",
              "/norestart" `
              -Wait

            Remove-Item `
              $installerPath `
              -Force
          }

          if (-not (Test-Path $rdExe)) {

            throw `
              "RustDesk installation failed."
          }


      # ========================================================
      # RUSTDESK PORTS
      # ========================================================

      - name: Open RustDesk ports
        run: |

          for (
            $p = 21115;
            $p -le 21119;
            $p++
          ) {

            $name =
              "APP-PORT-TCP-$p"

            netsh advfirewall firewall delete rule `
              name=$name `
              2>$null

            netsh advfirewall firewall add rule `
              name=$name `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$p
          }

          $udpName =
            "APP-PORT-UDP-21116"

          netsh advfirewall firewall delete rule `
            name=$udpName `
            2>$null

          netsh advfirewall firewall add rule `
            name=$udpName `
            dir=in `
            action=allow `
            protocol=UDP `
            localport=21116


      # ========================================================
      # RUSTDESK + SCREENSHOT
      # ========================================================

      - name: Launch RustDesk + Screenshot
        run: |

          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          Start-Process `
            -FilePath $rdExe `
            -ErrorAction SilentlyContinue

          Start-Sleep `
            -Seconds 5

          $screenshotPath =
            "$env:TEMP\rustdesk_${{ matrix.id }}.png"

          Add-Type `
            -AssemblyName `
            System.Windows.Forms

          Add-Type `
            -AssemblyName `
            System.Drawing

          $bounds =
            [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap =
            New-Object `
              System.Drawing.Bitmap `
              $bounds.Width,
              $bounds.Height

          $graphics =
            [System.Drawing.Graphics]::FromImage(
              $bitmap
            )

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $bitmap.Save(
            $screenshotPath,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          $curlResult =
            curl `
              -F "file=@$screenshotPath" `
              https://store1.gofile.io/uploadFile

          try {

            $json =
              $curlResult |
              ConvertFrom-Json

            if (
              $json.status -eq "ok"
            ) {

              "SCREENSHOT_URL=$($json.data.downloadPage)" |
                Out-File `
                -Append `
                $env:GITHUB_ENV
            }

          }
          catch {

            Write-Warning `
              "Screenshot upload failed."
          }


      # ========================================================
      # STORAGE STATUS
      # ========================================================

      - name: Display Google Drive status
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GOOGLE DRIVE PERSISTENCE"
          Write-Host "=========================================="

          Write-Host `
            "Drive mount: G:"

          Write-Host `
            "Remote: gdrive:"

          Write-Host `
            "Persistent files: gdrive:.persistent-rdp/files"

          if (
            Test-Path "G:\"
          ) {

            Write-Host `
              "G: IS VISIBLE IN FILE EXPLORER"

            Get-ChildItem `
              "G:\" `
              -Force `
              -ErrorAction SilentlyContinue |
              Select-Object `
                -First 20 `
                Name
          }
          else {

            Write-Warning `
              "G: mount is not visible yet."
          }


      # ========================================================
      # KEEP ALIVE
      # ========================================================

      - name: Keep alive
        run: |

          $mins =
            [int]"${{ env.RUNTIME_MINUTES }}"

          $end =
            (Get-Date).AddMinutes(
              $mins
            )

          while (
            (Get-Date) -lt $end
          ) {

            $mode =
              if (
                "$env:CRD_ENABLED" -eq '1'
              ) {
                '[CRD+RustDesk/RDP+Drive]'
              }
              else {
                '[RustDesk/RDP+Drive]'
              }

            Write-Host (
              "$mode Heartbeat " +
              (Get-Date).ToString("HH:mm:ss") +
              " ends at " +
              $end.ToString("HH:mm:ss") +
              " | Google Drive: G: | RS URL: " +
              $env:SCREENSHOT_URL
            )

            Start-Sleep `
              -Seconds 60
          }


      # ========================================================
      # FINAL DRIVE SYNC
      # ========================================================

      - name: Final Google Drive sync
        if: always()
        shell: pwsh
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: |

          $rclone =
            "$env:RCLONE_EXE"

          $config =
            "$env:RCLONE_CONFIG"

          if (
            (Test-Path $rclone) -and
            (Test-Path $config)
          ) {

            Write-Host `
              "Final Google Drive sync starting..."

            $userRoot =
              $env:USERPROFILE

            $folders = @(
              "$userRoot\Desktop",
              "$userRoot\Documents",
              "$userRoot\Downloads",
              "$userRoot\Pictures",
              "$userRoot\Videos",
              "$userRoot\Music"
            )

            foreach (
              $folder in $folders
            ) {

              if (
                Test-Path $folder
              ) {

                $relative =
                  $folder.Substring(
                    $userRoot.Length
                  ).TrimStart(
                    "\"
                  ).Replace(
                    "\",
                    "/"
                  )

                $remote =
                  "gdrive:.persistent-rdp/files/$relative"

                Write-Host `
                  "Final sync: $relative"

                & $rclone `
                  --config $config `
                  copy `
                  $folder `
                  $remote `
                  --timeout 300s `
                  --retries 3 `
                  --low-level-retries 10 `
                  --exclude "AppData/Local/Temp/**" `
                  --exclude "AppData/Local/Microsoft/Edge/User Data/**" `
                  --exclude "AppData/Local/Google/Chrome/User Data/**" `
                  --exclude "AppData/Local/Packages/**"
              }
            }

            Write-Host `
              "Final Google Drive sync completed."

          }
          else {

            Write-Host `
              "rclone/config unavailable; skipping final sync."
          }


      # ========================================================
      # DISPATCH NEXT OR STOP
      # ========================================================

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          $cycles =
            [int]"${{ inputs.cycles }}"

          if ($cycles -gt 0) {

            $next =
              $cycles - 1

            if ($next -le 0) {

              $url =
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"

              $hdr = @{
                Authorization =
                  "Bearer $env:GH_TOKEN"

                Accept =
                  "application/vnd.github+json"
              }

              $payload = @{
                ts_tailnet =
                  "${{ inputs.ts_tailnet }}"

                ts_api_key =
                  "${{ inputs.ts_api_key }}"

                base_prefix =
                  "bullet"

                max_count =
                  "10"

                dry_run =
                  "false"
              }

              $body =
                @{
                  ref =
                    "${{ github.ref_name }}"

                  inputs =
                    $payload
                } |
                ConvertTo-Json `
                  -Depth 20

              Invoke-WebRequest `
                -Method POST `
                -Uri $url `
                -Headers $hdr `
                -Body $body |
                Out-Null

              Write-Host `
                "Dispatched STOP."

            }
            else {

              $payload = @{
                ts_tailnet =
                  "${{ inputs.ts_tailnet }}"

                ts_api_key =
                  "${{ inputs.ts_api_key }}"

                ts_authkey =
                  "${{ inputs.ts_authkey }}"

                quick_test =
                  "${{ inputs.quick_test }}"

                runtime_minutes =
                  "300"

                do_purge =
                  "true"

                cycles =
                  "$next"

                rdp_count =
                  "${{ inputs.rdp_count }}"

                crd_code =
                  "${{ inputs.crd_code }}"

                crd_pin =
                  "${{ inputs.crd_pin }}"
              }

              $url2 =
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-A.yml/dispatches"

              $hdr2 = @{
                Authorization =
                  "Bearer $env:GH_TOKEN"

                Accept =
                  "application/vnd.github+json"
              }

              $body2 =
                @{
                  ref =
                    "${{ github.ref_name }}"

                  inputs =
                    $payload
                } |
                ConvertTo-Json `
                  -Depth 20

              Invoke-WebRequest `
                -Method POST `
                -Uri $url2 `
                -Headers $hdr2 `
                -Body $body2 |
                Out-Null

              Write-Host `
                "Dispatched Workflow A self-renew."
            }

          }
          else {

            Write-Host `
              "No cycles configured. Done."
          }
