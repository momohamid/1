name: RDP + Tailscale + RustDesk + CRD + Google Drive Persistent C-D

on:
  schedule:
    - cron: '0 */5 * * *'

  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet"
        required: true

      ts_api_key:
        description: "Tailscale API key"
        required: true

      ts_authkey:
        description: "Tailscale Auth key"
        required: true

      quick_test:
        description: "Run 5-minute test"
        type: boolean
        default: false

      runtime_minutes:
        description: "Runtime (max 360; default 300)"
        required: false
        default: "300"

      do_purge:
        description: "Purge bullet devices at start"
        required: false
        default: "true"

      cycles:
        description: "0=stop after A; N=handoffs left"
        required: false
        default: "9999"

      rdp_count:
        description: "How many RDP instances (1-10)"
        required: false
        default: "1"

      crd_code:
        description: "Chrome Remote Desktop code/command"
        required: false
        default: ""

      crd_pin:
        description: "CRD PIN"
        required: false
        default: "123456"

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:

      - id: mk
        shell: pwsh
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = [int]"${{ inputs.rdp_count }}"

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{
              id = $i
            }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          if ($n -gt 1) {
            $multi = '1'
          }
          else {
            $multi = '0'
          }

          "multi=$multi" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8


  rdp:
    needs: setup

    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif1990

    steps:

      - name: Set CRD flag early
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }


      - name: Install Chrome Remote Desktop Host
        if: env.CRD_ENABLED == '1'
        run: |
          $exe =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            $exePath =
              "$env:TEMP\chromeremotedesktophost.exe"

            $ok = $false

            try {
              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile `
                $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath `
                $exePath `
                -ArgumentList "/silent","/install" `
                -Wait

              Remove-Item `
                $exePath `
                -Force `
                -ErrorAction SilentlyContinue

              $ok = $true
            }
            catch {
              Write-Host `
                "EXE installer failed: $($_.Exception.Message)"
            }

            if (-not $ok) {

              $msi =
                "$env:TEMP\chromeremotedesktophost.msi"

              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                -OutFile `
                $msi `
                -ErrorAction Stop

              Start-Process `
                msiexec.exe `
                -ArgumentList `
                "/i",`
                "`"$msi`"",`
                "/quiet",`
                "/norestart" `
                -Wait

              Remove-Item `
                $msi `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }


      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin =
            "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            throw "crd_pin must contain 6-12 digits."
          }

          $starter =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            throw "Chrome Remote Desktop starter not found."
          }

          $isFull = $false
          $code = $null

          if ($raw -match 'remoting_start_host\.exe') {
            $isFull = $true
          }

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {

            $code = (
              [regex]::Match(
                $raw,
                '--code\s*=\s*"?([^"\s]+)'
              )
            ).Groups[1].Value
          }
          elseif ($raw -match '^4\/') {
            $code = $raw
          }

          if ($code) {

            $redir =
              "https://remotedesktop.google.com/_/oauthredirect"

            $name =
              $Env:COMPUTERNAME

            $args = @(
              "--code=""$code""",
              "--redirect-url=""$redir""",
              "--name=""$name""",
              "--pin=""$pin"""
            )

            Start-Process `
              -FilePath $starter `
              -ArgumentList $args
          }
          elseif ($isFull) {

            $tmp =
              "$env:TEMP\crd_full.ps1"

            Set-Content `
              -Path $tmp `
              -Value $raw `
              -Encoding UTF8

            powershell `
              -ExecutionPolicy Bypass `
              -File $tmp
          }
          else {
            throw "Could not detect CRD code."
          }


      - name: Verify CRD registration
        if: env.CRD_ENABLED == '1'
        run: |
          $deadline =
            (Get-Date).AddSeconds(60)

          $ok = $false

          while ((Get-Date) -lt $deadline) {

            $svc =
              Get-Service `
                -Name "Chrome Remote Desktop Service" `
                -ErrorAction SilentlyContinue

            if (
              $svc -and
              $svc.Status -in @(
                'Running',
                'StartPending'
              )
            ) {
              $ok = $true
              break
            }

            Start-Sleep -Seconds 3
          }

          if ($ok) {
            Write-Host "CRD service is running or starting."
          }
          else {
            Write-Warning "CRD service not running yet."
          }


      - name: Decide hostname and runtime
        run: |
          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {
            if ("$v" -match '^\d+$') {
              [int]$v
            }
            else {
              [int]$d
            }
          }

          $runtime =
            IntOr(
              "${{ inputs.runtime_minutes }}",
              300
            )

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 300
          }

          if ($runtime -gt 360) {
            $runtime = 360
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host "Hostname: $hn"
          Write-Host "Runtime: $runtime minutes"


      - name: Purge bullet devices
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |
          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (Yes("${{ inputs.do_purge }}")) {

            try {

              $auth =
                [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes(
                    "${{ inputs.ts_api_key }}:"
                  )
                )

              $tn =
                [uri]::EscapeDataString(
                  "${{ inputs.ts_tailnet }}"
                )

              $list =
                Invoke-RestMethod `
                  -Uri `
                  "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                  -Headers @{
                    Authorization = "Basic $auth"
                  }

              foreach ($d in $list.devices) {

                if ($d.hostname -match '^bullet[0-9]*$') {

                  Invoke-RestMethod `
                    -Method Delete `
                    -Uri `
                    "https://api.tailscale.com/api/v2/device/$($d.id)" `
                    -Headers @{
                      Authorization = "Basic $auth"
                    } `
                    -ErrorAction SilentlyContinue
                }
              }
            }
            catch {
              Write-Warning `
                "Purge warning: $($_.Exception.Message)"
            }
          }


      - name: Install + Up Tailscale
        run: |
          winget install `
            --id Tailscale.Tailscale `
            -e `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Start-Sleep -Seconds 5

          $ts =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale not found."
          }

          & $ts logout |
            Out-Null

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=true `
            --accept-routes=true

          $ip4 =
            & $ts ip -4 |
            Select-Object -First 1

          "TAILSCALE_IP=$ip4" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host "Tailscale IPv4: $ip4"


      - name: Enable RDP user and firewall
        run: |
          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          if ([string]::IsNullOrWhiteSpace($p)) {
            throw "RDP_PASS secret is missing."
          }

          $sec =
            ConvertTo-SecureString `
              $p `
              -AsPlainText `
              -Force

          if (
            -not (
              Get-LocalUser `
                -Name $u `
                -ErrorAction SilentlyContinue
            )
          ) {

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires
          }
          else {

            Set-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

            Enable-LocalUser `
              -Name $u
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $u `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $u `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Out-Null

          Write-Host "RDP ready."


      - name: Create user profile directories
        run: |
          $ErrorActionPreference = "Stop"

          $root =
            "C:\Users\$env:RDP_USER"

          $paths = @(
            $root
            "$root\Desktop"
            "$root\Documents"
            "$root\Downloads"
            "$root\Pictures"
            "$root\Videos"
            "$root\Music"
            "$root\Favorites"
            "$root\Links"
            "$root\Saved Games"
            "$root\Searches"
            "$root\Contacts"
            "$root\AppData"
            "$root\AppData\Local"
            "$root\AppData\LocalLow"
            "$root\AppData\Roaming"
            "$root\AppData\Roaming\Adobe"
            "$root\AppData\Roaming\Adobe\After Effects"
            "$root\AppData\Roaming\Adobe\After Effects\Auto-Save"
            "$root\AppData\Roaming\Adobe\After Effects\Presets"
            "$root\AppData\Roaming\Adobe\After Effects\Scripts"
            "$root\AppData\Roaming\Adobe\After Effects\Plug-ins"
            "$root\AppData\Local\Adobe"
            "$root\AppData\Local\Adobe\After Effects"
            "$root\AppData\Local\Adobe\After Effects\Auto-Save"
            "$root\AppData\Local\Adobe\After Effects\Cache"
            "$root\Projects"
            "$root\Projects\AE"
            "$root\Assets"
            "$root\Assets\Fonts"
            "$root\Assets\Plugins"
            "C:\Program Files\Adobe"
            "C:\Program Files\Common Files\Adobe"
            "C:\Program Files\Common Files\Adobe\Plug-Ins"
          )

          foreach ($path in $paths) {
            New-Item `
              -ItemType Directory `
              -Path $path `
              -Force |
              Out-Null
          }


      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            --force-reinstall `
            pyautogui `
            pynput `
            pillow

          python -c `
            "import pyautogui,pynput,PIL; print('Python libraries OK')"


      - name: Install rclone and WinFsp
        run: |
          $ErrorActionPreference = "Stop"

          $rcloneDir =
            "C:\Tools\rclone"

          $rclone =
            "$rcloneDir\rclone.exe"

          New-Item `
            -ItemType Directory `
            -Path $rcloneDir `
            -Force |
            Out-Null

          if (-not (Test-Path $rclone)) {

            $zip =
              "$env:TEMP\rclone.zip"

            $extract =
              "$env:TEMP\rclone_extract"

            Invoke-WebRequest `
              -Uri `
              "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
              -OutFile `
              $zip `
              -UseBasicParsing `
              -ErrorAction Stop

            Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force

            $found =
              Get-ChildItem `
                $extract `
                -Recurse `
                -Filter "rclone.exe" |
              Select-Object -First 1

            if (-not $found) {
              throw "rclone.exe was not found."
            }

            Copy-Item `
              $found.FullName `
              $rclone `
              -Force

            Remove-Item `
              $zip `
              -Force `
              -ErrorAction SilentlyContinue

            Remove-Item `
              $extract `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          & $rclone version

          $winfspPath =
            "C:\Program Files (x86)\WinFsp"

          if (-not (Test-Path $winfspPath)) {

            $msi =
              "$env:TEMP\winfsp.msi"

            Invoke-WebRequest `
              -Uri `
              "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" `
              -OutFile `
              $msi `
              -UseBasicParsing `
              -ErrorAction Stop

            $proc =
              Start-Process `
                msiexec.exe `
                -ArgumentList `
                "/i",`
                "`"$msi`"",`
                "/quiet",`
                "/norestart" `
                -Wait `
                -PassThru

            if ($proc.ExitCode -ne 0) {
              throw "WinFsp installation failed: $($proc.ExitCode)"
            }

            Remove-Item `
              $msi `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $winfspPath)) {
            throw "WinFsp verification failed."
          }

          "RCLONE_EXE=$rclone" |
            Out-File `
              -Append `
              $env:GITHUB_ENV


      - name: Prepare Google Drive configuration
        shell: pwsh
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          DRIVE_TOKEN1: ${{ secrets.DRIVE_TOKEN1 }}
          DRIVE_TOKEN2: ${{ secrets.DRIVE_TOKEN2 }}
          DRIVE_TOKEN3: ${{ secrets.DRIVE_TOKEN3 }}
          DRIVE_TOKEN4: ${{ secrets.DRIVE_TOKEN4 }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone =
            "$env:RCLONE_EXE"

          $configDir =
            "C:\ProgramData\Persistent-RDP\rclone"

          New-Item `
            -ItemType Directory `
            -Path $configDir `
            -Force |
            Out-Null

          $items = @(
            @{
              Secret = "DRIVE_TOKEN"
              Token = $env:DRIVE_TOKEN
              Name = "gdrive_g"
            }
            @{
              Secret = "DRIVE_TOKEN1"
              Token = $env:DRIVE_TOKEN1
              Name = "gdrive_h"
            }
            @{
              Secret = "DRIVE_TOKEN2"
              Token = $env:DRIVE_TOKEN2
              Name = "gdrive_i"
            }
            @{
              Secret = "DRIVE_TOKEN3"
              Token = $env:DRIVE_TOKEN3
              Name = "gdrive_j"
            }
            @{
              Secret = "DRIVE_TOKEN4"
              Token = $env:DRIVE_TOKEN4
              Name = "gdrive_k"
            }
          )

          foreach ($item in $items) {

            if ([string]::IsNullOrWhiteSpace($item.Token)) {
              throw "$($item.Secret) is missing."
            }

            $obj =
              $item.Token.Trim() |
              ConvertFrom-Json

            if (-not $obj.access_token) {
              throw "$($item.Secret) has no access_token."
            }

            $token =
              $obj |
              ConvertTo-Json -Compress

            $config =
              "$configDir\$($item.Name).conf"

            @(
              "[$($item.Name)]"
              "type = drive"
              "scope = drive"
              "token = $token"
            ) |
              Set-Content `
                -Path $config `
                -Encoding UTF8

            & $rclone `
              --config $config `
              lsd `
              "$($item.Name):" `
              --timeout 60s

            if ($LASTEXITCODE -ne 0) {
              throw "$($item.Secret) authentication failed."
            }
          }

          "RCLONE_CONFIG_DIR=$configDir" |
            Out-File `
              -Append `
              $env:GITHUB_ENV


      - name: Restore persistent C files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $rclone =
            "$env:RCLONE_EXE"

          $config =
            "$env:RCLONE_CONFIG_DIR\gdrive_g.conf"

          $remote =
            "gdrive_g:.persistent-rdp/C-storage"

          Write-Host "=========================================="
          Write-Host "FAST & OPTIMIZED C RESTORE TO ORIGINAL PATHS"
          Write-Host "=========================================="

          if (-not (Test-Path $rclone)) {
            throw "rclone.exe not found."
          }

          if (-not (Test-Path $config)) {
            throw "Google Drive configuration not found."
          }

          Write-Host "Ensuring remote C-storage directory exists..."
          & $rclone --config $config mkdir $remote

          & $rclone --config $config lsf $remote --max-depth 1 2>$null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Restoring persistent C files to original system paths..."

            & $rclone `
              --config $config `
              copy `
              $remote `
              "C:\" `
              --fast-list `
              --no-traverse `
              --transfers 32 `
              --checkers 64 `
              --multi-thread-streams 64 `
              --multi-thread-cutoff 16M `
              --multi-thread-chunk-size 32M `
              --buffer-size 512M `
              --drive-chunk-size 1024M `
              --exclude "/Windows/**" `
              --exclude "/Windows.old/**" `
              --exclude "/WindowsAzure/**" `
              --exclude "/ProgramData/Microsoft/WindowsDefender/**" `
              --exclude "/`$Recycle.Bin/**" `
              --exclude "/System Volume Information/**" `
              --exclude "/pagefile.sys" `
              --exclude "/swapfile.sys" `
              --exclude "/hiberfil.sys" `
              --exclude "/DumpStack.log.tmp" `
              --exclude "/Recovery/**" `
              --timeout 600s `
              --contimeout 30s `
              --retries 10 `
              --low-level-retries 30 `
              --stats 10s `
              --stats-one-line
          } else {
            Write-Host "Remote C-storage directory is empty or does not exist yet. Skipping restore safely."
          }

          Write-Host "C persistent restore finished safely."


      - name: Prepare D persistent storage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $rclone =
            "$env:RCLONE_EXE"

          $config =
            "$env:RCLONE_CONFIG_DIR\gdrive_g.conf"

          $dRoot =
            "D:\"

          $remote =
            "gdrive_g:.persistent-rdp/D-storage"

          New-Item `
            -ItemType Directory `
            -Path $dRoot `
            -Force |
            Out-Null

          Write-Host "Preparing D persistent storage..."

          & $rclone `
            --config $config `
            mkdir `
            $remote

          Write-Host "Restoring D storage..."

          & $rclone --config $config lsf $remote --max-depth 1 2>$null

          if ($LASTEXITCODE -eq 0) {
            & $rclone `
              --config $config `
              copy `
              $remote `
              $dRoot `
              --fast-list `
              --no-traverse `
              --transfers 32 `
              --checkers 64 `
              --multi-thread-streams 64 `
              --multi-thread-cutoff 16M `
              --multi-thread-chunk-size 32M `
              --buffer-size 512M `
              --drive-chunk-size 1024M `
              --timeout 600s `
              --contimeout 30s `
              --retries 10 `
              --low-level-retries 30 `
              --stats 10s `
              --stats-one-line
          } else {
            Write-Host "Remote D-storage directory does not exist yet. Skipping restore safely."
          }

          "D_PERSIST_DIR=$dRoot" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host "D persistent storage is ready."


      - name: Restore Drive files to local folders (Safe fallback for non-existent drives)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $rclone = "$env:RCLONE_EXE"
          $configDir = "$env:RCLONE_CONFIG_DIR"

          $drives = @(
            @{ Name = "G"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-G"; Remote = "gdrive_g:.persistent-rdp/files" }
            @{ Name = "H"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-H"; Remote = "gdrive_h:.persistent-rdp/files" }
            @{ Name = "I"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-I"; Remote = "gdrive_i:.persistent-rdp/files" }
            @{ Name = "J"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-J"; Remote = "gdrive_j:.persistent-rdp/files" }
            @{ Name = "K"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-K"; Remote = "gdrive_k:.persistent-rdp/files" }
          )

          foreach ($d in $drives) {
            New-Item -ItemType Directory -Path $d.Letter -Force | Out-Null
            $conf = "$configDir\gdrive_$($d.Name.ToLower()).conf"
            if (Test-Path $conf) {
              Write-Host "Checking remote folder for Google Drive $($d.Name)..."
              $null = & $rclone --config $conf lsf "$($d.Name):.persistent-rdp/files" --max-depth 1 2>&1
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Restoring Google Drive $($d.Name) files to local folder: $($d.Letter)"
                & $rclone --config $conf copy "$($d.Name):.persistent-rdp/files" "$($d.Letter)" --transfers 16 --timeout 300s --contimeout 20s
              } else {
                Write-Host "Remote directory for Drive $($d.Name) does not exist yet. Skipping restore safely."
              }
            }
          }
          exit 0


      - name: Record C session start
        shell: pwsh
        run: |
          $start =
            (Get-Date).ToUniversalTime()

          "C_SESSION_START=$($start.ToString('o'))" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          New-Item -ItemType Directory -Path "C:\ProgramData\Persistent-RDP" -Force | Out-Null
          Set-Content -Path "C:\ProgramData\Persistent-RDP\SessionStart.txt" -Value "$($start.ToString('o'))" -Encoding UTF8 -Force

          Write-Host "C persistence session started at:"
          Write-Host $start


      - name: Create C persistence sync script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $persistDir =
            "C:\ProgramData\Persistent-RDP"

          $script =
            "$persistDir\Sync-C-NewFiles.ps1"

          $content = @'
          $ErrorActionPreference = "Continue"

          $rclone =
              "C:\Tools\rclone\rclone.exe"

          $config =
              "C:\ProgramData\Persistent-RDP\rclone\gdrive_g.conf"

          $remote =
              "gdrive_g:.persistent-rdp/C-storage"

          $sessionStartText = $env:C_SESSION_START

          if ([string]::IsNullOrWhiteSpace($sessionStartText) -and (Test-Path "C:\ProgramData\Persistent-RDP\SessionStart.txt")) {
              $sessionStartText = (Get-Content "C:\ProgramData\Persistent-RDP\SessionStart.txt" -Raw).Trim()
          }

          if ([string]::IsNullOrWhiteSpace($sessionStartText)) {
              Write-Warning "C_SESSION_START missing. Using 24 hours fallback to ensure no plugin/file is lost."
              $sessionStart = (Get-Date).AddDays(-1).ToUniversalTime()
          } else {
              $sessionStart = [DateTime]::Parse($sessionStartText).ToUniversalTime()
          }

          if (
              -not (Test-Path $rclone) -or
              -not (Test-Path $config)
          ) {
              Write-Warning "rclone/config missing."
              exit 0
          }

          $excludedRoots = @(
              "C:\Windows"
              "C:\Windows.old"
              "C:\WindowsAzure"
              "C:\ProgramData\Microsoft\WindowsDefender"
              "C:\$Recycle.Bin"
              "C:\System Volume Information"
              "C:\Recovery"
          )

          $filesList =
              "C:\ProgramData\Persistent-RDP\C-files-to-sync.txt"

          $tempList =
              "C:\ProgramData\Persistent-RDP\C-files-to-sync.tmp"

          Remove-Item `
              $tempList `
              -Force `
              -ErrorAction SilentlyContinue

          $found =
              New-Object System.Collections.Generic.List[string]

          Write-Host "Scanning C: for new/modified persistent files (optimized)..."

          $scanRoots = @(
              "C:\Users\Yousif190",
              "C:\Program Files",
              "C:\Program Files (x86)",
              "C:\ProgramData"
          )

          foreach ($rootTarget in $scanRoots) {
              if (Test-Path $rootTarget) {
                  Get-ChildItem -Path $rootTarget -File -Force -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                      $full = $_.FullName
                      $skip = $false
                      foreach ($root in $excludedRoots) {
                          if ($full.Equals($root, [System.StringComparison]::OrdinalIgnoreCase) -or $full.StartsWith($root + "\", [System.StringComparison]::OrdinalIgnoreCase)) {
                              $skip = $true; break
                          }
                      }
                      if ($skip) { return }

                      if ($_.CreationTimeUtc -ge $sessionStart -or $_.LastWriteTimeUtc -ge $sessionStart) {
                          $relative = $full.Substring(3).Replace('\','/')
                          [void]$found.Add($relative)
                      }
                  }
              }
          }

          if ($found.Count -eq 0) {
              Write-Host "No new or modified C files found."
              exit 0
          }

          $found |
              Sort-Object -Unique |
              Set-Content `
                -Path $tempList `
                -Encoding UTF8

          Move-Item `
              -Path $tempList `
              -Destination $filesList `
              -Force

          Write-Host "Files selected for high-speed upload: $($found.Count)"

          & $rclone `
              --config $config `
              copy `
              "C:\" `
              $remote `
              --files-from $filesList `
              --fast-list `
              --no-traverse `
              --transfers 32 `
              --checkers 64 `
              --multi-thread-streams 64 `
              --multi-thread-cutoff 16M `
              --multi-thread-chunk-size 32M `
              --buffer-size 512M `
              --drive-chunk-size 1024M `
              --exclude "/Windows/**" `
              --exclude "/Windows.old/**" `
              --exclude "/WindowsAzure/**" `
              --exclude "/ProgramData/Microsoft/WindowsDefender/**" `
              --exclude "/`$Recycle.Bin/**" `
              --exclude "/System Volume Information/**" `
              --exclude "/Recovery/**" `
              --exclude "/pagefile.sys" `
              --exclude "/swapfile.sys" `
              --exclude "/hiberfil.sys" `
              --exclude "/DumpStack.log.tmp" `
              --timeout 600s `
              --contimeout 30s `
              --retries 10 `
              --low-level-retries 30 `
              --stats 10s `
              --stats-one-line

          if ($LASTEXITCODE -eq 0) {
              Write-Host "C incremental persistence sync completed successfully."
          }
          else {
              Write-Warning "C sync returned exit code $LASTEXITCODE."
          }
          '@

          Set-Content `
            -Path $script `
            -Value $content `
            -Encoding UTF8 `
            -Force

          Write-Host "Created optimized C incremental persistence script."


      - name: Create D persistent sync script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script =
            "C:\ProgramData\Persistent-RDP\Sync-D.ps1"

          $content = @'
          $ErrorActionPreference = "Continue"

          $rclone =
              "C:\Tools\rclone\rclone.exe"

          $config =
              "C:\ProgramData\Persistent-RDP\rclone\gdrive_g.conf"

          $dRoot =
              "D:\"

          $remote =
              "gdrive_g:.persistent-rdp/D-storage"

          if (
              (Test-Path $rclone) -and
              (Test-Path $config) -and
              (Test-Path $dRoot)
          ) {

              Write-Host "Uploading D:\ with high-speed multi-threading..."

              & $rclone `
                --config $config `
                copy `
                $dRoot `
                $remote `
                --fast-list `
                --transfers 32 `
                --checkers 64 `
                --multi-thread-streams 64 `
                --multi-thread-cutoff 16M `
                --multi-thread-chunk-size 32M `
                --buffer-size 512M `
                --drive-chunk-size 1024M `
                --create-empty-src-dirs `
                --timeout 600s `
                --contimeout 30s `
                --retries 10 `
                --low-level-retries 30 `
                --stats 10s `
                --stats-one-line

              if ($LASTEXITCODE -eq 0) {
                  Write-Host "D persistence sync completed successfully."
              }
              else {
                  Write-Warning "D sync returned exit code $LASTEXITCODE."
              }
          }
          else {
              Write-Warning "D persistence prerequisites missing."
          }
          '@

          Set-Content `
            -Path $script `
            -Value $content `
            -Encoding UTF8 `
            -Force


      - name: Create combined persistence sync script
        shell: pwsh
        run: |
          $script =
            "C:\ProgramData\Persistent-RDP\Sync-All.ps1"

          $content = @'
          Write-Host "=========================================="
          Write-Host "PERSISTENT-RDP FAST INCREMENTAL SYNC"
          Write-Host "=========================================="

          & "C:\ProgramData\Persistent-RDP\Sync-C-NewFiles.ps1"

          & "C:\ProgramData\Persistent-RDP\Sync-D.ps1"

          Write-Host "=========================================="
          Write-Host "SYNC FINISHED SUCCESSFULLY"
          Write-Host "=========================================="
          '@

          Set-Content `
            -Path $script `
            -Value $content `
            -Encoding UTF8 `
            -Force


      - name: Install persistent background sync
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $taskName =
            "Persistent-RDP-Periodic-Sync"

          $script =
            "C:\ProgramData\Persistent-RDP\Sync-All.ps1"

          Unregister-ScheduledTask `
            -TaskName $taskName `
            -Confirm:$false `
            -ErrorAction SilentlyContinue

          $action =
            New-ScheduledTaskAction `
              -Execute "powershell.exe" `
              -Argument `
              "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$script`""

          $trigger =
            New-ScheduledTaskTrigger `
              -Once `
              -At (Get-Date).AddMinutes(3) `
              -RepetitionInterval (New-TimeSpan -Minutes 5) `
              -RepetitionDuration (New-TimeSpan -Days 1)

          $settings =
            New-ScheduledTaskSettingsSet `
              -AllowStartIfOnBatteries `
              -DontStopIfGoingOnBatteries `
              -ExecutionTimeLimit ([TimeSpan]::Zero)

          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Trigger $trigger `
            -Settings $settings `
            -RunLevel Highest `
            -Force |
            Out-Null

          Write-Host "Periodic persistence task installed (Every 5 minutes)."


      - name: Create persistent user logon sync
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $taskName =
            "Persistent-RDP-Logon"

          $script =
            "C:\ProgramData\Persistent-RDP\Sync-All.ps1"

          Unregister-ScheduledTask `
            -TaskName $taskName `
            -Confirm:$false `
            -ErrorAction SilentlyContinue

          $action =
            New-ScheduledTaskAction `
              -Execute "powershell.exe" `
              -Argument `
              "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$script`""

          $trigger =
            New-ScheduledTaskTrigger `
              -AtLogOn `
              -User $env:RDP_USER

          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Trigger $trigger `
            -RunLevel Highest `
            -Force |
            Out-Null

          Write-Host "Persistent logon sync installed."


      - name: Verify persistence
        run: |
          $required = @(
            "C:\Tools\rclone\rclone.exe"
            "C:\ProgramData\Persistent-RDP\rclone\gdrive_g.conf"
            "C:\ProgramData\Persistent-RDP\Sync-C-NewFiles.ps1"
            "C:\ProgramData\Persistent-RDP\Sync-D.ps1"
            "C:\ProgramData\Persistent-RDP\Sync-All.ps1"
            "D:\"
          )

          foreach ($path in $required) {

            if (-not (Test-Path $path)) {
              throw "Missing persistence path: $path"
            }
          }

          Write-Host "=========================================="
          Write-Host "PERSISTENCE VERIFIED & OPTIMIZED"
          Write-Host "D:\ = full persistent workspace"
          Write-Host "C:\ = new/modified files persisted to original paths"
          Write-Host "Safe high-speed multi-thread transfer enabled"
          Write-Host "=========================================="


      - name: Install RustDesk
        run: |
          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rdExe)) {

            $installer =
              "$env:TEMP\rustdesk.msi"

            Invoke-WebRequest `
              -Uri `
              "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi" `
              -OutFile `
              $installer `
              -UseBasicParsing `
              -ErrorAction Stop

            Start-Process `
              msiexec.exe `
              -ArgumentList `
              "/i",`
              "`"$installer`"",`
              "/quiet",`
              "/norestart" `
              -Wait

            Remove-Item `
              $installer `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $rdExe)) {
            throw "RustDesk installation failed."
          }


      - name: Open RustDesk ports
        run: |
          for (
            $p = 21115;
            $p -le 21119;
            $p++
          ) {

            $name =
              "APP-PORT-TCP-$p"

            netsh advfirewall firewall delete rule `
              name=$name `
              2>$null

            netsh advfirewall firewall add rule `
              name=$name `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$p
          }

          netsh advfirewall firewall delete rule `
            name="APP-PORT-UDP-21116" `
            2>$null

          netsh advfirewall firewall add rule `
            name="APP-PORT-UDP-21116" `
            dir=in `
            action=allow `
            protocol=UDP `
            localport=21116


      - name: Launch RustDesk
        run: |
          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (Test-Path $rdExe) {

            Start-Process `
              -FilePath $rdExe `
              -ErrorAction SilentlyContinue
          }


      - name: Display persistence status
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PERSISTENT-RDP OPTIMIZED STORAGE"
          Write-Host "=========================================="
          Write-Host "Periodic safe sync: every 5 minutes"
          Write-Host "Pre-shutdown sync: safe guarded"
          Write-Host "=========================================="


      - name: Keep alive with Safe Early Sync
        run: |
          $mins = [int]"${{ env.RUNTIME_MINUTES }}"
          $end = (Get-Date).AddMinutes($mins)
          $syncScript = "C:\ProgramData\Persistent-RDP\Sync-All.ps1"
          
          $earlySyncTriggered = $false

          while ((Get-Date) -lt $end) {

            $remaining = ($end - (Get-Date)).TotalMinutes

            if (-not $earlySyncTriggered -and $remaining -le 8) {
              Write-Host "=== WARNING: Session ending soon! Running Safe Early Final Sync now ===" -ForegroundColor Yellow
              if (Test-Path $syncScript) {
                & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $syncScript
              }
              $earlySyncTriggered = $true
            }

            if ("$env:CRD_ENABLED" -eq '1') {
              $mode = '[CRD+RustDesk/RDP+Fast-Persistence]'
            }
            else {
              $mode = '[RustDesk/RDP+Fast-Persistence]'
            }

            Write-Host (
              "$mode Heartbeat " +
              (Get-Date).ToString("HH:mm:ss") +
              " | ends " +
              $end.ToString("HH:mm:ss") +
              " | Rem: $([math]::Round($remaining, 1))m"
            )

            Start-Sleep -Seconds 60
          }


      - name: Final C and D persistence sync
        if: always()
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "ABSOLUTE FINAL PERSISTENCE SYNC"
          Write-Host "=========================================="

          $cScript =
            "C:\ProgramData\Persistent-RDP\Sync-C-NewFiles.ps1"

          $dScript =
            "C:\ProgramData\Persistent-RDP\Sync-D.ps1"

          if (Test-Path $cScript) {
            Write-Host "Executing Final C sync..."
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $cScript
          }

          if (Test-Path $dScript) {
            Write-Host "Executing Final D sync..."
            & powershell.exe -NoProfile -ExecutionProfile Bypass -File $dScript
          }

          Write-Host "Final safe persistence sync completed."


      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $cycles =
            [int]"${{ inputs.cycles }}"

          if ($cycles -le 0) {
            Write-Host "No cycles configured. Done."
            exit 0
          }

          $next =
            $cycles - 1

          if ($next -le 0) {

            $url =
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"

            $headers = @{
              Authorization =
                "Bearer $env:GH_TOKEN"

              Accept =
                "application/vnd.github+json"

              "X-GitHub-Api-Version" =
                "2022-11-28"
            }

            $payload = @{
              ts_tailnet =
                "${{ inputs.ts_tailnet }}"

              ts_api_key =
                "${{ inputs.ts_api_key }}"

              base_prefix =
                "bullet"

              max_count =
                "10"

              dry_run =
                "false"
            }

            $body =
              @{
                ref =
                  "${{ github.ref_name }}"

                inputs =
                  $payload
              } |
              ConvertTo-Json -Depth 20

            Invoke-RestMethod `
              -Method POST `
              -Uri $url `
              -Headers $headers `
              -ContentType "application/json" `
              -Body $body

            Write-Host "STOP workflow dispatched."
          }
          else {

            $payload = @{
              ts_tailnet =
                "${{ inputs.ts_tailnet }}"

              ts_api_key =
                "${{ inputs.ts_api_key }}"

              ts_authkey =
                "${{ inputs.ts_authkey }}"

              quick_test =
                "${{ inputs.quick_test }}"

              runtime_minutes =
                "300"

              do_purge =
                "true"

              cycles =
                "$next"

              rdp_count =
                "${{ inputs.rdp_count }}"

              crd_code =
                "${{ inputs.crd_code }}"

              crd_pin =
                "${{ inputs.crd_pin }}"
            }

            $url =
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-A.yml/dispatches"

            $headers = @{
              Authorization =
                "Bearer $env:GH_TOKEN"

              Accept =
                "application/vnd.github+json"

              "X-GitHub-Api-Version" =
                "2022-11-28"
            }

            $body =
              @{
                ref =
                  "${{ github.ref_name }}"

                inputs =
                  $payload
              } |
              ConvertTo-Json -Depth 20

            Invoke-RestMethod `
              -Method POST `
              -Uri $url `
              -Headers $headers `
              -ContentType "application/json" `
              -Body $body

            Write-Host "Next Workflow A dispatched."
          }
