name: RDP + Tailscale + RustDesk + Telegram Persistent Storage (FINAL)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet"
        required: true
        type: string

      ts_api_key:
        description: "Tailscale API key"
        required: true
        type: string

      ts_authkey:
        description: "Tailscale Auth key"
        required: true
        type: string

      quick_test:
        description: "Run 5-minute test"
        required: false
        type: boolean
        default: false

      runtime_minutes:
        description: "Runtime in minutes (maximum 360)"
        required: false
        type: string
        default: "355"

      do_purge:
        description: "Purge bullet devices at start"
        required: false
        type: boolean
        default: true

      cycles:
        description: "0 = stop after A; N = handoffs left"
        required: false
        type: string
        default: "0"

      rdp_count:
        description: "Number of RDP instances"
        required: false
        type: string
        default: "1"

      crd_code:
        description: "Chrome Remote Desktop code"
        required: false
        type: string
        default: ""

      crd_pin:
        description: "Chrome Remote Desktop PIN"
        required: false
        type: string
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  # ============================================================
  # TELEGRAM STORAGE TEST
  # ============================================================

  telegram-test:
    runs-on: ubuntu-latest

    steps:

      - name: Install Telethon
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install telethon

      - name: Create test files
        shell: bash
        run: |
          mkdir -p test_workspace/Projects/AE
          mkdir -p test_workspace/Assets/Fonts

          echo "Persistent-RDP test $(date -u)" > test_workspace/Projects/AE/project.txt
          echo "Persistent-RDP asset $(date -u)" > test_workspace/Assets/Fonts/test-font.txt

          find test_workspace -type f -print

      - name: Telegram persistent storage test
        shell: bash
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}

        run: |
          python3 - <<'PY'
          import os
          import base64
          import hashlib
          import json
          import math
          from datetime import datetime, timezone
          from telethon import TelegramClient

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          session_b64 = os.environ["SESSION_B64"]

          with open("unlim_session.session", "wb") as f:
              f.write(base64.b64decode(session_b64))

          client = TelegramClient("unlim_session", api_id, api_hash)

          STORAGE_ROOT = "test_workspace"
          INDEX_FILE = "file_index.json"
          CHUNK_SIZE = 1024 * 1024

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest()

          def utc_now():
              return datetime.now(timezone.utc).isoformat()

          async def main():
              await client.start()

              print("TELEGRAM CONNECTED")

              files = []

              for root, dirs, filenames in os.walk(STORAGE_ROOT):
                  dirs.sort()
                  filenames.sort()

                  for filename in filenames:
                      files.append(os.path.join(root, filename))

              if not files:
                  raise SystemExit("NO TEST FILES FOUND")

              index = {
                  "version": 2,
                  "type": "persistent-rdp-file-index",
                  "updated_at": utc_now(),
                  "storage": {
                      "logical_capacity": "10 TB",
                      "chunk_size": CHUNK_SIZE
                  },
                  "files": []
              }

              for local_path in files:
                  relative_path = os.path.relpath(
                      local_path,
                      STORAGE_ROOT
                  ).replace("\\", "/")

                  size = os.path.getsize(local_path)
                  file_hash = sha256(local_path)

                  chunk_count = max(
                      1,
                      math.ceil(size / CHUNK_SIZE)
                  )

                  record = {
                      "path": "/" + relative_path,
                      "name": os.path.basename(local_path),
                      "size": size,
                      "sha256": file_hash,
                      "chunk_size": CHUNK_SIZE,
                      "chunk_count": chunk_count,
                      "chunks": [],
                      "created_at": utc_now()
                  }

                  with open(local_path, "rb") as f:
                      for index_no in range(chunk_count):
                          data = f.read(CHUNK_SIZE)

                          chunk_name = (
                              "persistent_chunk_"
                              + str(index_no)
                              + ".bin"
                          )

                          with open(chunk_name, "wb") as cf:
                              cf.write(data)

                          chunk_hash = sha256(chunk_name)

                          message = await client.send_file(
                              "me",
                              chunk_name,
                              caption=(
                                  "PERSISTENT-RDP-CHUNK\n"
                                  f"path={record['path']}\n"
                                  f"chunk={index_no}\n"
                                  f"chunks={chunk_count}\n"
                                  f"sha256={chunk_hash}"
                              )
                          )

                          record["chunks"].append({
                              "index": index_no,
                              "size": len(data),
                              "sha256": chunk_hash,
                              "telegram_message_id": message.id
                          })

                          os.remove(chunk_name)

                  index["files"].append(record)

              with open(INDEX_FILE, "w", encoding="utf-8") as f:
                  json.dump(
                      index,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              index_message = await client.send_file(
                  "me",
                  INDEX_FILE,
                  caption="PERSISTENT-RDP-FILE-INDEX"
              )

              print("INDEX_MESSAGE_ID=" + str(index_message.id))

              found = await client.get_messages(
                  "me",
                  ids=index_message.id
              )

              if not found:
                  raise SystemExit("FILE INDEX LOOKUP FAILED")

              restored = "file_index_restored.json"

              await client.download_media(
                  found,
                  file=restored
              )

              with open(restored, "r", encoding="utf-8") as f:
                  restored_index = json.load(f)

              if restored_index["version"] != 2:
                  raise SystemExit("INDEX VERSION FAILED")

              print("FILE INDEX READ SUCCESS")
              print("PERSISTENT STORAGE TEST SUCCESS")

          with client:
              client.loop.run_until_complete(main())
          PY

      - name: Display storage index
        shell: bash
        run: |
          cat file_index.json

      - name: Upload storage test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-storage-file-manager-test
          path: |
            file_index.json
            file_index_restored.json
            test_workspace


  # ============================================================
  # SETUP
  # ============================================================

  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:

      - id: mk
        shell: pwsh
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = 1

            if ("${{ inputs.rdp_count }}" -match '^\d+$') {
              $n = [int]"${{ inputs.rdp_count }}"
            }

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{
              id = $i
            }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          $multi = if ($n -gt 1) {
            "1"
          }
          else {
            "0"
          }

          "multi=$multi" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8


  # ============================================================
  # WINDOWS RDP
  # ============================================================

  rdp:
    needs: setup

    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif1990

    steps:

      # ========================================================
      # CRD
      # ========================================================

      - name: Set CRD flag
        shell: pwsh
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }


      - name: Install Chrome Remote Desktop Host
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |

          $exe =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            $exePath =
              "$env:TEMP\chromeremotedesktophost.exe"

            try {

              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile `
                $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath `
                $exePath `
                -ArgumentList `
                "/silent","/install" `
                -Wait

              Remove-Item `
                $exePath `
                -Force

            }
            catch {

              $msi =
                "$env:TEMP\chromeremotedesktophost.msi"

              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                -OutFile `
                $msi `
                -ErrorAction Stop

              Start-Process `
                msiexec.exe `
                -ArgumentList `
                "/i",
                "`"$msi`"",
                "/quiet",
                "/norestart" `
                -Wait

              Remove-Item `
                $msi `
                -Force
            }
          }


      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        shell: pwsh
        run: |

          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin =
            "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            throw "crd_pin must be 6-12 digits."
          }

          $starter =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            throw "remoting_start_host.exe not found."
          }

          $code = $null

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {

            $code = (
              [regex]::Match(
                $raw,
                '--code\s*=\s*"?([^"\s]+)'
              )
            ).Groups[1].Value

          }
          elseif ($raw -match '^4\/') {
            $code = $raw
          }

          if (-not $code) {
            throw "Could not detect CRD code."
          }

          $redir =
            "https://remotedesktop.google.com/_/oauthredirect"

          $name =
            $Env:COMPUTERNAME

          $args = @(
            "--code=""$code""",
            "--redirect-url=""$redir""",
            "--name=""$name""",
            "--pin=""$pin"""
          )

          Start-Process `
            -FilePath `
            $starter `
            -ArgumentList `
            $args


      # ========================================================
      # HOSTNAME / RUNTIME
      # ========================================================

      - name: Decide hostname + runtime
        shell: pwsh
        run: |

          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {

            if ("$v" -match '^\d+$') {
              return [int]$v
            }

            return [int]$d
          }

          $runtime = IntOr(
            "${{ inputs.runtime_minutes }}",
            355
          )

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 355
          }

          if ($runtime -gt 360) {
            $runtime = 355
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File `
              -Append `
              $env:GITHUB_ENV


      # ========================================================
      # PURGE
      # ========================================================

      - name: Purge bullet devices
        if: needs.setup.outputs.multi == '0'
        shell: pwsh
        run: |

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (-not (Yes("${{ inputs.do_purge }}"))) {
            Write-Host "Purge disabled."
            exit 0
          }

          try {

            $auth =
              [Convert]::ToBase64String(
                [Text.Encoding]::ASCII.GetBytes(
                  "${{ inputs.ts_api_key }}:"
                )
              )

            $tn =
              [uri]::EscapeDataString(
                "${{ inputs.ts_tailnet }}"
              )

            $list =
              Invoke-RestMethod `
                -Uri `
                "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                -Headers @{
                  Authorization =
                    "Basic $auth"
                }

            foreach ($d in $list.devices) {

              if ($d.hostname -match '^bullet[0-9]*$') {

                Invoke-RestMethod `
                  -Method Delete `
                  -Uri `
                  "https://api.tailscale.com/api/v2/device/$($d.id)" `
                  -Headers @{
                    Authorization =
                      "Basic $auth"
                  } `
                  -ErrorAction SilentlyContinue
              }
            }
          }
          catch {
            Write-Host `
              "Purge warning: $($_.Exception.Message)"
          }


      # ========================================================
      # TAILSCALE
      # ========================================================

      - name: Install + Up Tailscale
        shell: pwsh
        run: |

          $ts =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {

            $url =
              "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

            $dst =
              "$env:TEMP\tailscale.msi"

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $dst

            Start-Process `
              msiexec.exe `
              -ArgumentList `
              "/i",
              "`"$dst`"",
              "/quiet",
              "/norestart" `
              -Wait

            Remove-Item `
              $dst `
              -Force
          }

          & $ts logout 2>$null |
            Out-Null

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=true `
            --accept-routes=true

          $ip4 = (
            & $ts ip -4 |
            Select-Object -First 1
          )

          "TAILSCALE_IP=$ip4" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host "TAILSCALE IP: $ip4"


      # ========================================================
      # RDP USER
      # ========================================================

      - name: Enable RDP user + firewall
        shell: pwsh
        run: |

          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          $sec =
            ConvertTo-SecureString `
              $p `
              -AsPlainText `
              -Force

          $existing =
            Get-LocalUser `
              -Name $u `
              -ErrorAction SilentlyContinue

          if (-not $existing) {

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires `
              -PasswordNeverExpires:$true

          }
          else {

            Set-LocalUser `
              -Name $u `
              -Password $sec

            Enable-LocalUser `
              -Name $u
          }

          $admin =
            Get-LocalGroupMember `
              -Group "Administrators" `
              -ErrorAction SilentlyContinue

          if (-not ($admin.Name -match "\\$([regex]::Escape($u))$")) {

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $u `
              -ErrorAction SilentlyContinue
          }

          $rdpUsers =
            Get-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -ErrorAction SilentlyContinue

          if (-not ($rdpUsers.Name -match "\\$([regex]::Escape($u))$")) {

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $u `
              -ErrorAction SilentlyContinue
          }

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Set-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name UserAuthentication `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes

          Write-Host "RDP USER READY"
          Write-Host "RDP FIREWALL READY"


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Install Python libs
        shell: pwsh
        run: |

          python -m pip install --upgrade pip

          python -m pip install `
            --force-reinstall `
            telethon `
            pyautogui `
            pynput `
            pillow


      # ========================================================
      # MAXIMIZE D STORAGE
      # ========================================================

      - name: Maximize D storage
        shell: pwsh
        run: |

          $disk = Get-Disk -Number 1 -ErrorAction Stop

          if ($disk.PartitionStyle -eq "RAW") {
            Initialize-Disk `
              -Number 1 `
              -PartitionStyle GPT `
              -ErrorAction Stop

            $partition =
              New-Partition `
                -DiskNumber 1 `
                -UseMaximumSize `
                -DriveLetter D
          }
          else {

            $partition =
              Get-Partition `
                -DiskNumber 1 `
                -DriveLetter D `
                -ErrorAction Stop
          }

          $partition =
            Get-Partition `
              -DiskNumber 1 `
              -DriveLetter D `
              -ErrorAction Stop

          $supported =
            Get-PartitionSupportedSize `
              -DiskNumber 1 `
              -PartitionNumber $partition.PartitionNumber

          if ($partition.Size -lt $supported.SizeMax) {

            Resize-Partition `
              -DiskNumber 1 `
              -PartitionNumber $partition.PartitionNumber `
              -Size $supported.SizeMax
          }

          $volume =
            Get-Volume `
              -DriveLetter D `
              -ErrorAction Stop

          if ($volume.FileSystem -ne "NTFS") {

            Format-Volume `
              -DriveLetter D `
              -FileSystem NTFS `
              -NewFileSystemLabel "Persistent-RDP" `
              -Confirm:$false
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "D STORAGE MAXIMIZED"
          Write-Host "========================================"

          Get-Disk -Number 1 |
            Format-Table `
              Number,
              FriendlyName,
              Size,
              PartitionStyle

          Get-Partition `
            -DiskNumber 1 |
            Format-Table `
              DiskNumber,
              PartitionNumber,
              DriveLetter,
              Size,
              Type

          Get-Volume `
            -DriveLetter D |
            Format-Table `
              DriveLetter,
              FileSystemLabel,
              FileSystem,
              Size,
              SizeRemaining


      # ========================================================
      # PREPARE D
      # ========================================================

      - name: Prepare persistent D storage
        shell: pwsh
        run: |

          $root =
            "D:\Persistent-RDP"

          $dirs = @(
            $root,
            "$root\Desktop",
            "$root\Documents",
            "$root\Downloads",
            "$root\Pictures",
            "$root\Videos",
            "$root\Users",
            "$root\AppData",
            "$root\ProgramData",
            "$root\ProgramFiles",
            "$root\ProgramFiles-x86",
            "$root\Projects",
            "$root\Projects\AE",
            "$root\Assets",
            "$root\Assets\Fonts",
            "$root\Plugins"
          )

          foreach ($d in $dirs) {

            New-Item `
              -ItemType Directory `
              -Path $d `
              -Force |
              Out-Null
          }

          Write-Host "===================================="
          Write-Host "D: PERSISTENT STORAGE READY"
          Write-Host "===================================="

          Get-Volume `
            -DriveLetter D |
            Format-List `
              DriveLetter,
              FileSystem,
              Size,
              SizeRemaining


      # ========================================================
      # TELEGRAM RESTORE + SYNC ENGINE
      # ========================================================

      - name: Restore and start Persistent-RDP Sync
        shell: pwsh
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}

        run: |

          $root =
            "D:\Persistent-RDP"

          $script =
            "$env:TEMP\persistent_rdp_sync.py"

          @'
          import os
          import json
          import base64
          import hashlib
          import time
          from datetime import datetime, timezone
          from telethon import TelegramClient

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION_B64 = os.environ["SESSION_B64"]

          ROOT = r"D:\Persistent-RDP"

          INDEX_LOCAL = os.path.join(
              ROOT,
              "persistent_index.json"
          )

          CHUNK_SIZE = 4 * 1024 * 1024

          SESSION_FILE = os.path.join(
              os.environ["TEMP"],
              "unlim_session.session"
          )

          with open(SESSION_FILE, "wb") as f:
              f.write(base64.b64decode(SESSION_B64))

          client = TelegramClient(
              os.path.join(
                  os.environ["TEMP"],
                  "unlim_session"
              ),
              API_ID,
              API_HASH
          )

          def sha256(path):
              h = hashlib.sha256()

              with open(path, "rb") as f:
                  while True:
                      data = f.read(4 * 1024 * 1024)

                      if not data:
                          break

                      h.update(data)

              return h.hexdigest()

          def now():
              return datetime.now(
                  timezone.utc
              ).isoformat()

          def build_index(old_map=None):

              records = []

              if old_map is None:
                  old_map = {}

              for root, dirs, files in os.walk(ROOT):

                  dirs[:] = [
                      d for d in dirs
                      if d not in (
                          ".sync",
                          "TelegramCache"
                      )
                  ]

                  for name in files:

                      path = os.path.join(
                          root,
                          name
                      )

                      try:

                          stat = os.stat(path)
                          relative = os.path.relpath(
                              path,
                              ROOT
                          ).replace("\\", "/")

                          previous = old_map.get(relative)

                          if (
                              previous
                              and
                              previous.get("size") == stat.st_size
                              and
                              previous.get("mtime") == stat.st_mtime
                          ):

                              records.append(previous)
                              continue

                          records.append({
                              "path": relative,
                              "size": stat.st_size,
                              "mtime": stat.st_mtime,
                              "sha256": sha256(path)
                          })

                      except Exception as e:

                          print(
                              "SKIP:",
                              path,
                              e
                          )

              return records

          async def find_index():

              async for msg in client.iter_messages(
                  "me",
                  search="PERSISTENT-RDP-MASTER-INDEX",
                  limit=20
              ):

                  if msg.file:
                      return msg

              return None

          async def download_index():

              msg = await find_index()

              if not msg:
                  return None

              temp = os.path.join(
                  os.environ["TEMP"],
                  "persistent_master_index.json"
              )

              await client.download_media(
                  msg,
                  file=temp
              )

              with open(
                  temp,
                  "r",
                  encoding="utf-8"
              ) as f:

                  return json.load(f)

          async def restore_file(record):

              target = os.path.join(
                  ROOT,
                  record["path"].replace(
                      "/",
                      os.sep
                  )
              )

              if os.path.exists(target):

                  try:

                      if (
                          os.path.getsize(target)
                          == record["size"]
                          and
                          sha256(target)
                          == record["sha256"]
                      ):
                          return

                  except Exception:
                      pass

              os.makedirs(
                  os.path.dirname(target),
                  exist_ok=True
              )

              output = target + ".restore"

              with open(
                  output,
                  "wb"
              ) as out:

                  for chunk in record["chunks"]:

                      msg_id = chunk[
                          "telegram_message_id"
                      ]

                      msg = await client.get_messages(
                          "me",
                          ids=msg_id
                      )

                      if not msg:
                          raise RuntimeError(
                              "Missing Telegram chunk "
                              + str(msg_id)
                          )

                      temp = os.path.join(
                          os.environ["TEMP"],
                          "restore_chunk.bin"
                      )

                      await client.download_media(
                          msg,
                          file=temp
                      )

                      if (
                          sha256(temp)
                          != chunk["sha256"]
                      ):
                          raise RuntimeError(
                              "Chunk SHA256 mismatch"
                          )

                      with open(
                          temp,
                          "rb"
                      ) as f:

                          while True:

                              data = f.read(
                                  4 * 1024 * 1024
                              )

                              if not data:
                                  break

                              out.write(data)

              os.replace(
                  output,
                  target
              )

          async def restore():

              print("================================")
              print("PERSISTENT-RDP RESTORE START")

              old = await download_index()

              if not old:

                  print(
                      "NO PREVIOUS MASTER INDEX"
                  )

                  return

              for record in old.get(
                  "files",
                  []
              ):

                  try:

                      await restore_file(
                          record
                      )

                  except Exception as e:

                      print(
                          "RESTORE FAILED:",
                          record.get("path"),
                          e
                      )

              print(
                  "PERSISTENT-RDP RESTORE COMPLETE"
              )

          async def upload_file(
              path,
              relative
          ):

              chunks = []

              with open(
                  path,
                  "rb"
              ) as f:

                  index = 0

                  while True:

                      data = f.read(
                          CHUNK_SIZE
                      )

                      if not data:
                          break

                      temp = os.path.join(
                          os.environ["TEMP"],
                          "persistent_upload.bin"
                      )

                      with open(
                          temp,
                          "wb"
                      ) as out:

                          out.write(data)

                      h = sha256(temp)

                      msg = await client.send_file(
                          "me",
                          temp,
                          caption=(
                              "PERSISTENT-RDP-CHUNK\n"
                              f"path=/{relative}\n"
                              f"chunk={index}\n"
                              f"sha256={h}"
                          )
                      )

                      chunks.append({
                          "index": index,
                          "size": len(data),
                          "sha256": h,
                          "telegram_message_id":
                              msg.id
                      })

                      os.remove(temp)

                      index += 1

              return chunks

          async def sync():

              print("================================")
              print("PERSISTENT-RDP SYNC START")

              old = await download_index()

              old_map = {}

              if old:

                  for r in old.get(
                      "files",
                      []
                  ):

                      old_map[
                          r["path"]
                      ] = r

              current = build_index(
                  old_map
              )

              new_records = []

              for item in current:

                  relative = item["path"]

                  previous = old_map.get(
                      relative
                  )

                  if (
                      previous
                      and
                      previous.get("size")
                      == item["size"]
                      and
                      previous.get("sha256")
                      == item["sha256"]
                      and
                      previous.get("mtime")
                      == item["mtime"]
                  ):

                      new_records.append(
                          previous
                      )

                      continue

                  print(
                      "UPLOAD:",
                      relative
                  )

                  path = os.path.join(
                      ROOT,
                      relative.replace(
                          "/",
                          os.sep
                      )
                  )

                  chunks = await upload_file(
                      path,
                      relative
                  )

                  new_records.append({
                      "path": relative,
                      "size": item["size"],
                      "mtime": item["mtime"],
                      "sha256": item["sha256"],
                      "chunk_size":
                          CHUNK_SIZE,
                      "chunk_count":
                          len(chunks),
                      "chunks":
                          chunks,
                      "updated_at":
                          now()
                  })

              master = {
                  "version": 3,
                  "type":
                      "persistent-rdp-master-index",
                  "updated_at":
                      now(),
                  "root":
                      "D:\\Persistent-RDP",
                  "files":
                      new_records
              }

              with open(
                  INDEX_LOCAL,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      master,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              await client.send_file(
                  "me",
                  INDEX_LOCAL,
                  caption="PERSISTENT-RDP-MASTER-INDEX"
              )

              print(
                  "PERSISTENT-RDP SYNC COMPLETE"
              )

          async def main():

              await client.start()

              print(
                  "TELEGRAM CONNECTED"
              )

              await restore()

              await sync()

              print(
                  "INITIAL PERSISTENCE READY"
              )

          with client:

              client.loop.run_until_complete(
                  main()
              )

          '@ |
            Set-Content `
              -Path $script `
              -Encoding UTF8

          python $script

          $runner =
            "$env:TEMP\persistent_rdp_sync_loop.ps1"

          @"
          while (`$true) {

              try {

                  python "$script"

                  Write-Host "PERSISTENT SYNC FINISHED"

              }
              catch {

                  Write-Host "PERSISTENT SYNC ERROR: `$(`$_.Exception.Message)"
              }

              Start-Sleep -Seconds 30
          }
          "@ |
            Set-Content `
              -Path $runner `
              -Encoding UTF8

          Start-Process `
            powershell.exe `
            -ArgumentList `
              "-NoProfile",
              "-ExecutionPolicy",
              "Bypass",
              "-File",
              "`"$runner`"" `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PERSISTENT-RDP RESTORE + SYNC READY"
          Write-Host "BACKGROUND SYNC: EVERY 30 SECONDS"
          Write-Host "========================================"


      # ========================================================
      # VERIFY D
      # ========================================================

      - name: Verify persistent D storage
        shell: pwsh
        run: |

          $root =
            "D:\Persistent-RDP"

          if (-not (Test-Path $root)) {
            throw "Persistent storage missing."
          }

          $test =
            "$root\Persistent-RDP-Test"

          New-Item `
            -ItemType Directory `
            -Path $test `
            -Force |
            Out-Null

          $file =
            "$test\runner-test.txt"

          Set-Content `
            -Path $file `
            -Value "Persistent-RDP test $(Get-Date -Format o)" `
            -Encoding UTF8

          if (-not (Test-Path $file)) {
            throw "D WRITE FAILED."
          }

          Get-Content $file

          Write-Host ""
          Write-Host "D: WRITE SUCCESS"
          Write-Host "D: PERSISTENT-RDP READY"

          Get-Volume `
            -DriveLetter D |
            Format-List `
              DriveLetter,
              FileSystem,
              Size,
              SizeRemaining


      # ========================================================
      # RUSTDESK
      # ========================================================

      - name: Install RustDesk
        shell: pwsh
        run: |

          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rdExe)) {

            $rdUrl =
              "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"

            $installerPath =
              "$env:TEMP\rustdesk.msi"

            Invoke-WebRequest `
              -Uri $rdUrl `
              -OutFile $installerPath

            Start-Process `
              msiexec.exe `
              -ArgumentList `
              "/i",
              "`"$installerPath`"",
              "/quiet",
              "/norestart" `
              -Wait

            Remove-Item `
              $installerPath `
              -Force
          }


      - name: Open RustDesk ports
        shell: pwsh
        run: |

          for ($p = 21115; $p -le 21119; $p++) {

            $name =
              "APP-PORT-TCP-$p"

            netsh advfirewall firewall delete rule `
              name=$name 2>$null

            netsh advfirewall firewall add rule `
              name=$name `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$p
          }


      - name: Launch RustDesk
        shell: pwsh
        run: |

          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (Test-Path $rdExe) {

            Start-Process `
              -FilePath $rdExe `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 5
          }


      # ========================================================
      # DISPLAY STORAGE STATUS
      # ========================================================

      - name: Display storage status
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PERSISTENT-RDP STORAGE"
          Write-Host "=========================================="

          Write-Host "Drive: D:"
          Write-Host "Path: D:\Persistent-RDP"

          Get-Volume `
            -DriveLetter D |
            Format-List `
              DriveLetter,
              FileSystem,
              Size,
              SizeRemaining

          Write-Host ""
          Write-Host "Persistent folders:"

          Get-ChildItem `
            "D:\Persistent-RDP" `
            -Force |
            Select-Object `
              Name,
              Length,
              LastWriteTime


      # ========================================================
      # KEEP ALIVE
      # ========================================================

      - name: Keep alive
        shell: pwsh
        run: |

          $mins = 355

          if ("${{ env.RUNTIME_MINUTES }}" -match '^\d+$') {
            $mins = [int]"${{ env.RUNTIME_MINUTES }}"
          }

          if ($mins -lt 1) {
            $mins = 355
          }

          if ($mins -gt 360) {
            $mins = 360
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PERSISTENT-RDP KEEP ALIVE"
          Write-Host "RUNTIME: $mins MINUTES"
          Write-Host "========================================"

          $end = (Get-Date).AddMinutes($mins)

          while ((Get-Date) -lt $end) {

            $remaining = $end - (Get-Date)

            Write-Host (
              "Heartbeat: " +
              (Get-Date).ToString("HH:mm:ss") +
              " | Remaining: " +
              $remaining.ToString("hh\:mm\:ss")
            )

            Write-Host "Persistent-RDP background sync is running."

            Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "KEEP ALIVE FINISHED"
          Write-Host "Starting final sync..."
          Write-Host "========================================"


      # ========================================================
      # FINAL SYNC
      # ========================================================

      - name: Final Persistent-RDP sync
        if: always()
        shell: pwsh
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}

        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "FINAL PERSISTENT-RDP SYNC"
          Write-Host "========================================"

          $script =
            "$env:TEMP\persistent_rdp_sync.py"

          if (Test-Path $script) {

            python $script

          }
          else {

            Write-Host "Sync script not found."
          }


      # ========================================================
      # STOP / NEXT
      # ========================================================

      - name: Dispatch next or stop
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          $cycles = 0

          if ("${{ inputs.cycles }}" -match '^\d+$') {
            $cycles = [int]"${{ inputs.cycles }}"
          }

          if ($cycles -gt 0) {

            $next = $cycles - 1

            Write-Host "Next cycle: $next"

          }
          else {

            Write-Host "No cycles configured. Done."
          }
