name: RDP + Tailscale + RustDesk + (Optional) CRD (A) - Auto-Renew

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin, no Bearer)"
        required: true
      ts_authkey:
        description: "Tailscale Auth key (reusable or ephemeral)"
        required: true
      quick_test:
        description: "Run 5-minute test"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime (max 360; default 300 when not test)"
        required: false
        default: "300"
      do_purge:
        description: "Purge bullet* devices at start (single instance only)"
        required: false
        default: "true"
      cycles:
        description: "0=stop after A; N=handoffs left incl this run"
        required: false
        default: "9999"
      rdp_count:
        description: "How many RDP instances (1-10) [ignored if CRD provided]"
        required: false
        default: "1"
      crd_code:
        description: >-
          Paste raw CRD code (4/0AV...), full PowerShell command, or text/URL containing --code="4/...".
          If provided -> single instance; CRD launches first.
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6–12 digits). Used when launching CRD to avoid interactive prompt."
        required: false
        default: "123456"

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi:  ${{ steps.mk.outputs.multi }}

    steps:

      - id: mk
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = [int]"${{ inputs.rdp_count }}"

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{
              id = $i
            }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          $multi = if ($n -gt 1) {
            '1'
          }
          else {
            '0'
          }

          "multi=$multi" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8


  rdp:
    needs: setup

    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif1990

    steps:

      # ========================================================
      # RESTORE OLD GITHUB BACKUP
      # ========================================================

      - name: Restore backup from latest release
        run: |
          $repo = "${{ github.repository }}"
          $url = "https://api.github.com/repos/$repo/releases/latest"

          $release = Invoke-RestMethod `
            -Uri $url `
            -Headers @{
              Authorization = "Bearer ${{ github.token }}"
            } `
            -ErrorAction SilentlyContinue

          if ($release -and $release.assets) {

            $asset =
              $release.assets |
              Where-Object {
                $_.name -like "backup-*.zip"
              } |
              Select-Object -First 1

            if ($asset) {

              $zip = "$env:TEMP\backup.zip"

              Invoke-WebRequest `
                -Uri $asset.browser_download_url `
                -OutFile $zip

              Expand-Archive `
                -Path $zip `
                -DestinationPath "C:\Restore" `
                -Force

              $map = @{
                "Desktop"   = "$env:USERPROFILE\Desktop"
                "Documents" = "$env:USERPROFILE\Documents"
                "Downloads" = "$env:USERPROFILE\Downloads"
                "AppData"   = "$env:APPDATA"
                "ProgramData" = "C:\ProgramData"
              }

              foreach ($f in $map.Keys) {

                $src = "C:\Restore\$f"

                if (Test-Path $src) {

                  robocopy `
                    $src `
                    $map[$f] `
                    /E `
                    /COPY:DAT `
                    /R:3 `
                    /W:10 `
                    /NFL `
                    /NDL `
                    /NJH `
                    /NJS |
                    Out-Null
                }
              }

              Write-Host `
                "Backup restored from $($release.tag_name)"

            }
            else {
              Write-Host "No backup asset found."
            }

          }
          else {
            Write-Host `
              "No previous release found; starting fresh."
          }


      # ========================================================
      # CRD
      # ========================================================

      - name: Set CRD flag early (safe read)
        run: |

          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {

            "CRD_ENABLED=1" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }
          else {

            "CRD_ENABLED=0" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }

          Write-Host `
            "CRD_ENABLED=$([int]($crd.Length -gt 0))"


      - name: Install Chrome Remote Desktop Host (if missing)
        if: env.CRD_ENABLED == '1'
        run: |

          $exe =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            Write-Host `
              "CRD host not found, attempting install..."

            $exePath =
              "$env:TEMP\chromeremotedesktophost.exe"

            $ok = $false

            try {

              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile `
                $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath `
                $exePath `
                -ArgumentList `
                "/silent",
                "/install" `
                -Wait

              Remove-Item `
                $exePath `
                -Force

              $ok = $true

            }
            catch {

              Write-Host `
                "EXE installer failed: $($_.Exception.Message)"
            }

            if (-not $ok) {

              $msi =
                "$env:TEMP\chromeremotedesktophost.msi"

              try {

                Invoke-WebRequest `
                  -Uri `
                  "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                  -OutFile `
                  $msi `
                  -ErrorAction Stop

                Start-Process `
                  msiexec.exe `
                  -ArgumentList `
                  "/i",
                  "`"$msi`"",
                  "/quiet",
                  "/norestart" `
                  -Wait

                Remove-Item `
                  $msi `
                  -Force

              }
              catch {

                Write-Error `
                  "CRD MSI fallback failed: $($_.Exception.Message)"

                exit 1
              }
            }

          }
          else {

            Write-Host `
              "CRD host already installed."
          }


      - name: Run Chrome Remote Desktop (accept raw code / full cmd / url) with PIN
        if: env.CRD_ENABLED == '1'
        run: |

          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin =
            "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {

            Write-Error `
              "crd_pin must be 6–12 digits."

            exit 1
          }

          $starter =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {

            Write-Error `
              "remoting_start_host.exe not found."

            exit 1
          }

          $isFull = $false
          $code = $null

          if (
            $raw -match `
            'remoting_start_host\.exe'
          ) {
            $isFull = $true
          }

          if (
            $raw -match `
            '--code\s*=\s*"?([^"\s]+)'
          ) {

            $code =
              (
                [regex]::Match(
                  $raw,
                  '--code\s*=\s*"?([^"\s]+)'
                )
              ).Groups[1].Value
          }
          elseif ($raw -match '^4\/') {

            $code = $raw
          }

          if ($code) {

            $redir =
              "https://remotedesktop.google.com/_/oauthredirect"

            $name =
              $Env:COMPUTERNAME

            $args = @(
              "--code=""$code""",
              "--redirect-url=""$redir""",
              "--name=""$name""",
              "--pin=""$pin"""
            )

            Start-Process `
              -FilePath $starter `
              -ArgumentList $args

          }
          elseif ($isFull) {

            $tmp =
              "$env:TEMP\crd_full.ps1"

            Set-Content `
              -Path $tmp `
              -Value $raw `
              -Encoding UTF8

            powershell `
              -ExecutionPolicy Bypass `
              -File $tmp

          }
          else {

            Write-Error `
              "Could not detect CRD code."

            exit 1
          }

          Write-Host `
            "CRD launch step completed with PIN."


      - name: Verify CRD registration (service + recent logs)
        if: env.CRD_ENABLED == '1'
        run: |

          $svcName =
            "Chrome Remote Desktop Service"

          $deadline =
            (Get-Date).AddSeconds(60)

          $ok = $false

          while (
            (Get-Date) -lt $deadline
          ) {

            $svc =
              Get-Service `
                -Name $svcName `
                -ErrorAction SilentlyContinue

            if (
              $svc -and
              $svc.Status -in
              'Running',
              'StartPending'
            ) {

              $ok = $true
              break
            }

            Start-Sleep `
              -Seconds 3
          }

          if ($ok) {

            Write-Host `
              "[$svcName] status: Running or starting."
          }
          else {

            Write-Warning `
              "[$svcName] not running yet."
          }

          $logDir =
            "$env:ProgramData\Google\Chrome Remote Desktop"

          if (Test-Path $logDir) {

            Get-ChildItem `
              $logDir `
              -Filter "host*.log" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 2 |
              ForEach-Object {

                Write-Host `
                  "----- LOG: $($_.FullName) -----"

                Get-Content `
                  $_.FullName `
                  -Tail 200
              }

          }
          else {

            Write-Host `
              "CRD log directory not found: $logDir"
          }


      # ========================================================
      # HOSTNAME / RUNTIME
      # ========================================================

      - name: Decide hostname + runtime
        run: |

          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match `
              '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {

            if ("$v" -match '^\d+$') {
              [int]$v
            }
            else {
              [int]$d
            }
          }

          $runtime =
            IntOr(
              "${{ inputs.runtime_minutes }}",
              300
            )

          if (
            Yes("${{ inputs.quick_test }}")
          ) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 300
          }

          if ($runtime -gt 360) {
            $runtime = 300
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host `
            "Hostname: $hn | Runtime: $runtime"


      # ========================================================
      # PURGE
      # ========================================================

      - name: Purge bullet* devices (single-instance only)
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |

          function Yes($v) {
            "$v" -match `
              '^(?i:true|1|yes|on)$'
          }

          if (
            Yes("${{ inputs.do_purge }}")
          ) {

            try {

              $auth =
                [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes(
                    "${{ inputs.ts_api_key }}:"
                  )
                )

              $tn =
                [uri]::EscapeDataString(
                  "${{ inputs.ts_tailnet }}"
                )

              $list =
                Invoke-RestMethod `
                  -Uri `
                  "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                  -Headers @{
                    Authorization =
                      "Basic $auth"
                  }

              foreach ($d in $list.devices) {

                if (
                  $d.hostname -match
                  '^bullet[0-9]*$'
                ) {

                  Invoke-RestMethod `
                    -Method Delete `
                    -Uri `
                    "https://api.tailscale.com/api/v2/device/$($d.id)" `
                    -Headers @{
                      Authorization =
                        "Basic $auth"
                    } `
                    -ErrorAction SilentlyContinue
                }
              }

              Write-Host `
                "Purged bullet* devices (if any)."

            }
            catch {

              Write-Host `
                "Purge warning: $($_.Exception.Message)"
            }

          }
          else {

            Write-Host `
              "Purge disabled."
          }


      # ========================================================
      # TAILSCALE
      # ========================================================

      - name: Install + Up Tailscale (fast)
        run: |

          winget install `
            --id Tailscale.Tailscale `
            -e `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Start-Sleep `
            -Seconds 5

          $ts =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $ts) {

            & $ts logout |
              Out-Null

            & $ts up `
              --authkey "${{ inputs.ts_authkey }}" `
              --hostname "$env:TS_HOSTNAME" `
              --accept-dns=true `
              --accept-routes=true

            $ip4 =
              & $ts ip -4 |
              Select-Object -First 1

            "TAILSCALE_IP=$ip4" |
              Out-File `
                -Append `
                $env:GITHUB_ENV

            Write-Host `
              "Tailscale IPv4: $ip4"

          }
          else {

            Write-Error `
              "Tailscale not found after winget install"

            exit 1
          }


      # ========================================================
      # RDP
      # ========================================================

      - name: Enable RDP user + firewall
        run: |

          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          $sec =
            ConvertTo-SecureString `
              $p `
              -AsPlainText `
              -Force

          if (
            -not (
              Get-LocalUser `
                -Name $u `
                -EA SilentlyContinue
            )
          ) {

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $u

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $u

          }
          else {

            Set-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

            Enable-LocalUser `
              -Name $u

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $u `
              -EA SilentlyContinue

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $u `
              -EA SilentlyContinue
          }

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Out-Null

          Write-Host `
            "RDP ready. user=$u host=$env:TS_HOSTNAME ip=$env:TAILSCALE_IP"


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Install Python libs (pyautogui/pynput/pillow)
        run: |

          python -m pip install `
            --upgrade pip

          python -m pip install `
            --force-reinstall `
            pyautogui `
            pynput `
            pillow

          python -c `
            "import pyautogui, pynput, PIL; print('Python libs OK')"


      # ========================================================
      # RCLONE + DRIVE
      # ========================================================

      - name: Install rclone + WinFsp
        shell: pwsh
        run: |

          Write-Host "Installing rclone..."

          winget install `
            --id Rclone.Rclone `
            -e `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "Installing WinFsp..."

          winget install `
            --id WinFsp.WinFsp `
            -e `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          $rclone =
            "$env:ProgramFiles\rclone\rclone.exe"

          if (-not (Test-Path $rclone)) {

            $rclone =
              "$env:ChocolateyInstall\bin\rclone.exe"
          }

          if (-not (Test-Path $rclone)) {

            $rclone =
              (Get-Command rclone `
                -ErrorAction SilentlyContinue).Source
          }

          if (-not $rclone) {

            throw `
              "rclone.exe was not found after installation."
          }

          "RCLONE_EXE=$rclone" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host `
            "rclone: $rclone"


      # ========================================================
      # DRIVE CONFIG + RESTORE
      # ========================================================

      - name: Connect Drive and restore previous session files
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        shell: pwsh
        run: |

          if (
            [string]::IsNullOrWhiteSpace(
              $env:DRIVE_TOKEN
            )
          ) {

            throw `
              "DRIVE_TOKEN secret is missing."
          }

          $configDir =
            "$env:APPDATA\rclone"

          New-Item `
            -ItemType Directory `
            -Path $configDir `
            -Force |
            Out-Null

          $config =
            "$configDir\rclone.conf"

          @"
          [drive]
          type = drive
          scope = drive
          token = $env:DRIVE_TOKEN
          "@ |
            Set-Content `
              -Path $config `
              -Encoding UTF8

          $rclone =
            $env:RCLONE_EXE

          if (-not (Test-Path $rclone)) {
            throw "rclone executable missing."
          }

          & $rclone `
            --config "$config" `
            lsd drive: |
            Out-Host

          $mount =
            "R:"

          if (Test-Path "$mount\") {

            Write-Host `
              "R: already exists."

          }
          else {

            Write-Host `
              "Mounting Drive as R:"

            Start-Process `
              -FilePath $rclone `
              -ArgumentList @(
                "mount",
                "drive:",
                "$mount",
                "--config",
                "$config",
                "--network-mode",
                "--vfs-cache-mode",
                "full",
                "--dir-cache-time",
                "10s",
                "--poll-interval",
                "30s",
                "--vfs-cache-max-age",
                "1h",
                "--vfs-write-back",
                "5s"
              ) `
              -WindowStyle Hidden

            $deadline =
              (Get-Date).AddSeconds(60)

            while (
              -not (Test-Path "$mount\")
              -and
              (Get-Date) -lt $deadline
            ) {

              Start-Sleep `
                -Seconds 2
            }
          }

          if (-not (Test-Path "$mount\")) {

            throw `
              "Drive could not be mounted as R:."
          }

          Write-Host `
            "========================================"

          Write-Host `
            "DRIVE MOUNTED SUCCESSFULLY"

          Write-Host `
            "File Explorer drive: R:"

          Write-Host `
            "========================================"

          $state =
            "R:\Persistent-RDP"

          New-Item `
            -ItemType Directory `
            -Path $state `
            -Force |
            Out-Null

          $manifest =
            "$state\session-files.txt"

          if (Test-Path $manifest) {

            Write-Host `
              "Restoring files from previous sessions..."

            Get-Content $manifest |
            ForEach-Object {

              $line =
                $_.Trim()

              if (
                [string]::IsNullOrWhiteSpace($line)
              ) {
                return
              }

              $parts =
                $line.Split("|",2)

              if ($parts.Count -ne 2) {
                return
              }

              $relative =
                $parts[0]

              $source =
                $parts[1]

              $destination =
                "C:\$relative"

              if (Test-Path $source) {

                $parent =
                  Split-Path `
                    $destination `
                    -Parent

                New-Item `
                  -ItemType Directory `
                  -Path $parent `
                  -Force |
                  Out-Null

                Copy-Item `
                  -Path $source `
                  -Destination $destination `
                  -Force `
                  -ErrorAction SilentlyContinue

                Write-Host `
                  "RESTORED: $destination"
              }
            }
          }
          else {

            Write-Host `
              "No previous Drive session files found."
          }


      # ========================================================
      # SESSION FILE WATCHER
      # ========================================================

      - name: Start session-only C drive watcher
        shell: pwsh
        run: |

          $root =
            "R:\Persistent-RDP"

          $filesDir =
            "$root\files"

          $list =
            "$root\session-files.txt"

          New-Item `
            -ItemType Directory `
            -Path $filesDir `
            -Force |
            Out-Null

          if (-not (Test-Path $list)) {

            New-Item `
              -ItemType File `
              -Path $list `
              -Force |
              Out-Null
          }

          $watcherScript =
            "$env:TEMP\drive_session_watcher.ps1"

          @"
          `$root = 'R:\Persistent-RDP'
          `$filesDir = 'R:\Persistent-RDP\files'
          `$list = 'R:\Persistent-RDP\session-files.txt'

          New-Item -ItemType Directory -Path `$filesDir -Force | Out-Null

          function Save-ChangedFile(`$path) {

              try {

                  if (
                      [string]::IsNullOrWhiteSpace(`$path)
                  ) {
                      return
                  }

                  if (
                      -not (Test-Path -LiteralPath `$path -PathType Leaf)
                  ) {
                      return
                  }

                  `$full =
                      [System.IO.Path]::GetFullPath(`$path)

                  if (
                      -not `$full.StartsWith(
                          'C:\',
                          [System.StringComparison]::OrdinalIgnoreCase
                      )
                  ) {
                      return
                  }

                  if (
                      `$full.StartsWith(
                          'C:\Windows\',
                          [System.StringComparison]::OrdinalIgnoreCase
                      )
                  ) {
                      return
                  }

                  if (
                      `$full.StartsWith(
                          'C:\Program Files\',
                          [System.StringComparison]::OrdinalIgnoreCase
                      )
                  ) {
                      return
                  }

                  if (
                      `$full.StartsWith(
                          'C:\Program Files (x86)\',
                          [System.StringComparison]::OrdinalIgnoreCase
                      )
                  ) {
                      return
                  }

                  if (
                      `$full.StartsWith(
                          'C:\Restore\',
                          [System.StringComparison]::OrdinalIgnoreCase
                      )
                  ) {
                      return
                  }

                  `$relative =
                      `$full.Substring(3)

                  `$remote =
                      Join-Path `
                        `$filesDir `
                        `$relative

                  `$parent =
                      Split-Path `
                        `$remote `
                        -Parent

                  New-Item `
                    -ItemType Directory `
                    -Path `$parent `
                    -Force |
                    Out-Null

                  Copy-Item `
                    -LiteralPath `$full `
                    -Destination `$remote `
                    -Force `
                    -ErrorAction SilentlyContinue

                  if (
                      Test-Path -LiteralPath `$remote
                  ) {

                      `$entry =
                          `$relative + '|' + `$remote

                      Add-Content `
                        -Path `$list `
                        -Value `$entry `
                        -Encoding UTF8

                      Write-Host `
                        "DRIVE SAVE: `$full"
                  }

              }
              catch {
                  Write-Host `
                    "WATCHER: `$(`$_.Exception.Message)"
              }
          }

          `$watcher =
              New-Object System.IO.FileSystemWatcher

          `$watcher.Path = 'C:\'
          `$watcher.IncludeSubdirectories = `$true
          `$watcher.Filter = '*.*'
          `$watcher.NotifyFilter =
              [System.IO.NotifyFilters]::FileName `
              -bor [System.IO.NotifyFilters]::LastWrite `
              -bor [System.IO.NotifyFilters]::Size `
              -bor [System.IO.NotifyFilters]::CreationTime

          `$watcher.EnableRaisingEvents = `$true

          Register-ObjectEvent `
              -InputObject `$watcher `
              -EventName Created `
              -Action {
                  Save-ChangedFile `$Event.SourceEventArgs.FullPath
              } |
              Out-Null

          Register-ObjectEvent `
              -InputObject `$watcher `
              -EventName Changed `
              -Action {
                  Save-ChangedFile `$Event.SourceEventArgs.FullPath
              } |
              Out-Null

          while (`$true) {

              Start-Sleep -Seconds 5
          }
          "@ |
            Set-Content `
              -Path $watcherScript `
              -Encoding UTF8

          Start-Process `
            powershell.exe `
            -ArgumentList @(
              "-NoProfile",
              "-ExecutionPolicy",
              "Bypass",
              "-File",
              "`"$watcherScript`""
            ) `
            -WindowStyle Hidden

          Write-Host `
            "========================================"

          Write-Host `
            "SESSION-ONLY DRIVE WATCHER STARTED"

          Write-Host `
            "Files created/changed after this point will be saved."

          Write-Host `
            "========================================"


      # ========================================================
      # RUSTDESK
      # ========================================================

      - name: Install RustDesk (fast)
        run: |

          winget install `
            --id RustDesk.RustDesk `
            -e `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Start-Sleep `
            -Seconds 5

          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (Test-Path $rdExe) {

            Start-Process `
              -FilePath $rdExe `
              -ErrorAction SilentlyContinue

            Write-Host `
              "RustDesk installed and launched."
          }
          else {

            Write-Error `
              "RustDesk not found after winget install"

            exit 1
          }


      - name: Open RustDesk ports (TCP 21115-21119, UDP 21116)
        run: |

          for (
            $p = 21115;
            $p -le 21119;
            $p++
          ) {

            $name =
              "APP-PORT-TCP-$p"

            netsh advfirewall firewall delete rule `
              name=$name 2>$null

            netsh advfirewall firewall add rule `
              name=$name `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$p
          }

          $udpName =
            "APP-PORT-UDP-21116"

          netsh advfirewall firewall delete rule `
            name=$udpName 2>$null

          netsh advfirewall firewall add rule `
            name=$udpName `
            dir=in `
            action=allow `
            protocol=UDP `
            localport=21116


      - name: Launch RustDesk (foreground) + Screenshot to Gofile
        run: |

          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          Start-Process `
            -FilePath $rdExe `
            -ErrorAction SilentlyContinue

          Start-Sleep `
            -Seconds 5

          $screenshotPath =
            "$env:TEMP\rustdesk_${{ matrix.id }}.png"

          Add-Type `
            -AssemblyName System.Windows.Forms

          Add-Type `
            -AssemblyName System.Drawing

          $bounds =
            [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap =
            New-Object System.Drawing.Bitmap `
              $bounds.Width,
              $bounds.Height

          $graphics =
            [System.Drawing.Graphics]::FromImage(
              $bitmap
            )

          $graphics.CopyFromScreen(
            $bounds.Location,
            [System.Drawing.Point]::Empty,
            $bounds.Size
          )

          $bitmap.Save(
            $screenshotPath,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          $curlResult =
            curl `
              -F "file=@$screenshotPath" `
              https://store1.gofile.io/uploadFile

          $json =
            $curlResult |
            ConvertFrom-Json

          if ($json.status -eq "ok") {

            "SCREENSHOT_URL=$($json.data.downloadPage)" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }


      # ========================================================
      # KEEP ALIVE
      # ========================================================

      - name: Keep alive (to ${{ env.RUNTIME_MINUTES }} mins)
        run: |

          $mins =
            [int]"${{ env.RUNTIME_MINUTES }}"

          $end =
            (Get-Date).AddMinutes($mins)

          while (
            (Get-Date) -lt $end
          ) {

            $mode =
              if (
                "$env:CRD_ENABLED" -eq '1'
              ) {
                '[CRD+RustDesk/RDP]'
              }
              else {
                '[RustDesk/RDP]'
              }

            Write-Host (
              "$mode Heartbeat " +
              (Get-Date).ToString("HH:mm:ss") +
              " ends at " +
              $end.ToString("HH:mm:ss") +
              " | RS URL: " +
              $env:SCREENSHOT_URL
            )

            Start-Sleep `
              -Seconds 60
          }


      # ========================================================
      # FINAL DRIVE SYNC
      # ========================================================

      - name: Final Drive sync
        if: always()
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "FINAL DRIVE SYNC"
          Write-Host "========================================"

          if (
            [string]::IsNullOrWhiteSpace(
              $env:DRIVE_TOKEN
            )
          ) {

            Write-Host `
              "DRIVE_TOKEN missing; skipping Drive sync."

            exit 0
          }

          $rclone =
            $env:RCLONE_EXE

          if (
            -not $rclone -or
            -not (Test-Path $rclone)
          ) {

            $rclone =
              (Get-Command rclone `
                -ErrorAction SilentlyContinue).Source
          }

          if (-not $rclone) {

            Write-Host `
              "rclone not available."

            exit 0
          }

          $configDir =
            "$env:APPDATA\rclone"

          $config =
            "$configDir\rclone.conf"

          New-Item `
            -ItemType Directory `
            -Path $configDir `
            -Force |
            Out-Null

          @"
          [drive]
          type = drive
          scope = drive
          token = $env:DRIVE_TOKEN
          "@ |
            Set-Content `
              -Path $config `
              -Encoding UTF8

          if (Test-Path "R:\Persistent-RDP\files") {

            & $rclone copy `
              "R:\Persistent-RDP\files" `
              "drive:Persistent-RDP/files" `
              --config "$config" `
              --transfers 4 `
              --checkers 8 `
              --fast-list `
              --create-empty-src-dirs

            Write-Host `
              "Drive upload complete."
          }

          if (Test-Path "R:\Persistent-RDP\session-files.txt") {

            & $rclone copyto `
              "R:\Persistent-RDP\session-files.txt" `
              "drive:Persistent-RDP/session-files.txt" `
              --config "$config"
          }

          Write-Host `
            "FINAL DRIVE SYNC COMPLETE"


      # ========================================================
      # BACKUP ALL USER DATA
      # ========================================================

      - name: Backup all user data (upload to release)
        if: always()
        run: |

          $backupDir =
            "$env:TEMP\backup_full"

          New-Item `
            -ItemType Directory `
            -Path $backupDir `
            -Force

          $folders = @(
            "$env:USERPROFILE\Desktop",
            "$env:USERPROFILE\Documents",
            "$env:USERPROFILE\Downloads",
            "$env:APPDATA",
            "C:\ProgramData\RustDesk"
          )

          foreach ($f in $folders) {

            if (Test-Path $f) {

              $target =
                "$backupDir\$(
                  [System.IO.Path]::GetFileName($f)
                )"

              robocopy `
                $f `
                $target `
                /E `
                /COPY:DAT `
                /R:3 `
                /W:10 `
                /NFL `
                /NDL `
                /NJH `
                /NJS |
                Out-Null
            }
          }

          $zipName =
            "backup-$(Get-Date -Format 'yyyyMMdd-HHmmss').zip"

          $zipPath =
            "$env:TEMP\$zipName"

          Compress-Archive `
            -Path "$backupDir\*" `
            -DestinationPath $zipPath `
            -Force

          $releases =
            Invoke-RestMethod `
              -Uri `
              "https://api.github.com/repos/${{ github.repository }}/releases" `
              -Headers @{
                Authorization =
                  "Bearer ${{ github.token }}"
              }

          foreach ($r in $releases) {

            if (
              $r.tag_name -like "backup-*"
            ) {

              Invoke-RestMethod `
                -Method Delete `
                -Uri `
                "https://api.github.com/repos/${{ github.repository }}/releases/$($r.id)" `
                -Headers @{
                  Authorization =
                    "Bearer ${{ github.token }}"
                } `
                -ErrorAction SilentlyContinue
            }
          }

          $tag =
            "backup-$(Get-Date -Format 'yyyyMMdd-HHmmss')"

          $body =
            @{
              tag_name = $tag
              name = $tag
              draft = $false
              prerelease = $false
            } |
            ConvertTo-Json

          $release =
            Invoke-RestMethod `
              -Method Post `
              -Uri `
              "https://api.github.com/repos/${{ github.repository }}/releases" `
              -Headers @{
                Authorization =
                  "Bearer ${{ github.token }}"
              } `
              -Body $body `
              -ContentType `
              "application/json"

          $uploadUrl =
            $release.upload_url `
            -replace `
            "{?name,label}",
            "?name=$zipName"

          curl `
            -X POST `
            -H "Authorization: Bearer ${{ github.token }}" `
            -H "Content-Type: application/zip" `
            --data-binary "@$zipPath" `
            "$uploadUrl"

          Write-Host `
            "Backup uploaded to $tag"


      # ========================================================
      # NEXT / STOP
      # ========================================================

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          $cycles =
            [int]"${{ inputs.cycles }}"

          if ($cycles -gt 0) {

            $next =
              $cycles - 1

            if ($next -le 0) {

              $url =
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"

              $hdr = @{
                Authorization =
                  "Bearer $env:GH_TOKEN"

                Accept =
                  "application/vnd.github+json"
              }

              $payload = @{
                ts_tailnet =
                  "${{ inputs.ts_tailnet }}"

                ts_api_key =
                  "${{ inputs.ts_api_key }}"

                base_prefix =
                  "bullet"

                max_count =
                  "10"

                dry_run =
                  "false"
              }

              $body =
                @{
                  ref =
                    "${{ github.ref_name }}"

                  inputs =
                    $payload
                } |
                ConvertTo-Json `
                  -Depth 20

              Invoke-WebRequest `
                -Method POST `
                -Uri $url `
                -Headers $hdr `
                -Body $body |
                Out-Null

              Write-Host `
                "Dispatched STOP."

            }
            else {

              $payload = @{
                ts_tailnet =
                  "${{ inputs.ts_tailnet }}"

                ts_api_key =
                  "${{ inputs.ts_api_key }}"

                ts_authkey =
                  "${{ inputs.ts_authkey }}"

                quick_test =
                  "${{ inputs.quick_test }}"

                runtime_minutes =
                  "300"

                do_purge =
                  "true"

                cycles =
                  "$next"

                rdp_count =
                  "${{ inputs.rdp_count }}"

                crd_code =
                  "${{ inputs.crd_code }}"

                crd_pin =
                  "${{ inputs.crd_pin }}"
              }

              $url2 =
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-A.yml/dispatches"

              $hdr2 = @{
                Authorization =
                  "Bearer $env:GH_TOKEN"

                Accept =
                  "application/vnd.github+json"
              }

              $body2 =
                @{
                  ref =
                    "${{ github.ref_name }}"

                  inputs =
                    $payload
                } |
                ConvertTo-Json `
                  -Depth 20

              Invoke-WebRequest `
                -Method POST `
                -Uri $url2 `
                -Headers $hdr2 `
                -Body $body2 |
                Out-Null

              Write-Host `
                "Dispatched Workflow A (self-renew) with cycles=$next"
            }

          }
          else {

            Write-Host `
              "No cycles configured. Done."
          }
