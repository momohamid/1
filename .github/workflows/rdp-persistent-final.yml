                                      "ALREADY VALID:",
                                      rel
                                  )

                                  skipped += 1
                                  continue

                          except Exception:
                              pass

                      tmp = Path(
                          str(target) + ".restore.tmp"
                      )

                      if tmp.exists():
                          tmp.unlink()

                      print(
                          "RESTORING:",
                          rel
                      )

                      chunks = sorted(
                          record.get("chunks", []),
                          key=lambda x: x["index"]
                      )

                      if not chunks:
                          print(
                              "FAILED: NO CHUNKS",
                              rel
                          )

                          failed += 1
                          continue

                      try:

                          with open(
                              tmp,
                              "wb"
                          ) as out:

                              for chunk in chunks:

                                  mid = int(
                                      chunk[
                                          "telegram_message_id"
                                      ]
                                  )

                                  expected_chunk_hash = \
                                      chunk["sha256"]

                                  cm = await client.get_messages(
