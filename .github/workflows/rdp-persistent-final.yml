name: RDP + Tailscale + RustDesk + CRD + Google Drive Persistent C-D

on:
  schedule:
    - cron: '0 */5 * * *'

  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet"
        required: true

      ts_api_key:
        description: "Tailscale API key"
        required: true

      ts_authkey:
        description: "Tailscale Auth key"
        required: true

      quick_test:
        description: "Run 5-minute test"
        type: boolean
        default: false

      runtime_minutes:
        description: "Runtime (max 360; default 300)"
        required: false
        default: "300"

      do_purge:
        description: "Purge bullet devices at start"
        required: false
        default: "true"

      cycles:
        description: "0=stop after A; N=handoffs left"
        required: false
        default: "9999"

      rdp_count:
        description: "How many RDP instances (1-10)"
        required: false
        default: "1"

      crd_code:
        description: "Chrome Remote Desktop code/command"
        required: false
        default: ""

      crd_pin:
        description: "CRD PIN"
        required: false
        default: "123456"

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:

      - id: mk
        shell: pwsh
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = [int]"${{ inputs.rdp_count }}"

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{
              id = $i
            }
          }

          $json = @{
            include = $inc
          } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          if ($n -gt 1) {
            $multi = '1'
          }
          else {
            $multi = '0'
          }

          "multi=$multi" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8


  rdp:
    needs: setup

    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: Yousif190
      RDP_PASS: Yousif1990

    steps:

      - name: Set CRD flag early
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File `
                -Append `
                $env:GITHUB_ENV
          }


      - name: Install Chrome Remote Desktop Host
        if: env.CRD_ENABLED == '1'
        run: |
          $exe =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            $exePath =
              "$env:TEMP\chromeremotedesktophost.exe"

            $ok = $false

            try {
              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile `
                $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath `
                $exePath `
                -ArgumentList "/silent","/install" `
                -Wait

              Remove-Item `
                $exePath `
                -Force `
                -ErrorAction SilentlyContinue

              $ok = $true
            }
            catch {
              Write-Host `
                "EXE installer failed: $($_.Exception.Message)"
            }

            if (-not $ok) {

              $msi =
                "$env:TEMP\chromeremotedesktophost.msi"

              Invoke-WebRequest `
                -Uri `
                "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                -OutFile `
                $msi `
                -ErrorAction Stop

              Start-Process `
                msiexec.exe `
                -ArgumentList `
                "/i",`
                "`"$msi`"",`
                "/quiet",`
                "/norestart" `
                -Wait

              Remove-Item `
                $msi `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }


      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin =
            "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            throw "crd_pin must contain 6-12 digits."
          }

          $starter =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            throw "Chrome Remote Desktop starter not found."
          }

          $isFull = $false
          $code = $null

          if ($raw -match 'remoting_start_host\.exe') {
            $isFull = $true
          }

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {

            $code = (
              [regex]::Match(
                $raw,
                '--code\s*=\s*"?([^"\s]+)'
              )
            ).Groups[1].Value
          }
          elseif ($raw -match '^4\/') {
            $code = $raw
          }

          if ($code) {

            $redir =
              "https://remotedesktop.google.com/_/oauthredirect"

            $name =
              $Env:COMPUTERNAME

            $args = @(
              "--code=""$code""",
              "--redirect-url=""$redir""",
              "--name=""$name""",
              "--pin=""$pin"""
            )

            Start-Process `
              -FilePath $starter `
              -ArgumentList $args
          }
          elseif ($isFull) {

            $tmp =
              "$env:TEMP\crd_full.ps1"

            Set-Content `
              -Path $tmp `
              -Value $raw `
              -Encoding UTF8

            powershell `
              -ExecutionPolicy Bypass `
              -File $tmp
          }
          else {
            throw "Could not detect CRD code."
          }


      - name: Verify CRD registration
        if: env.CRD_ENABLED == '1'
        run: |
          $deadline =
            (Get-Date).AddSeconds(60)

          $ok = $false

          while ((Get-Date) -lt $deadline) {

            $svc =
              Get-Service `
                -Name "Chrome Remote Desktop Service" `
                -ErrorAction SilentlyContinue

            if (
              $svc -and
              $svc.Status -in @(
                'Running',
                'StartPending'
              )
            ) {
              $ok = $true
              break
            }

            Start-Sleep -Seconds 3
          }

          if ($ok) {
            Write-Host "CRD service is running or starting."
          }
          else {
            Write-Warning "CRD service not running yet."
          }


      - name: Decide hostname and runtime
        run: |
          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {
            if ("$v" -match '^\d+$') {
              [int]$v
            }
            else {
              [int]$d
            }
          }

          $runtime =
            IntOr(
              "${{ inputs.runtime_minutes }}",
              300
            )

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 300
          }

          if ($runtime -gt 360) {
            $runtime = 360
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host "Hostname: $hn"
          Write-Host "Runtime: $runtime minutes"


      - name: Purge bullet devices
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |
          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (Yes("${{ inputs.do_purge }}")) {

            try {

              $auth =
                [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes(
                    "${{ inputs.ts_api_key }}:"
                  )
                )

              $tn =
                [uri]::EscapeDataString(
                  "${{ inputs.ts_tailnet }}"
                )

              $list =
                Invoke-RestMethod `
                  -Uri `
                  "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                  -Headers @{
                    Authorization = "Basic $auth"
                  }

              foreach ($d in $list.devices) {

                if ($d.hostname -match '^bullet[0-9]*$') {

                  Invoke-RestMethod `
                    -Method Delete `
                    -Uri `
                    "https://api.tailscale.com/api/v2/device/$($d.id)" `
                    -Headers @{
                      Authorization = "Basic $auth"
                    } `
                    -ErrorAction SilentlyContinue
                }
              }
            }
            catch {
              Write-Warning `
                "Purge warning: $($_.Exception.Message)"
            }
          }


      - name: Install + Up Tailscale
        run: |
          winget install `
            --id Tailscale.Tailscale `
            -e `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Start-Sleep -Seconds 5

          $ts =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale not found."
          }

          & $ts logout |
            Out-Null

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=true `
            --accept-routes=true

          $ip4 =
            & $ts ip -4 |
            Select-Object -First 1

          "TAILSCALE_IP=$ip4" |
            Out-File `
              -Append `
              $env:GITHUB_ENV

          Write-Host "Tailscale IPv4: $ip4"


      - name: Enable RDP user and firewall
        run: |
          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          if ([string]::IsNullOrWhiteSpace($p)) {
            throw "RDP_PASS secret is missing."
          }

          $sec =
            ConvertTo-SecureString `
              $p `
              -AsPlainText `
              -Force

          if (
            -not (
              Get-LocalUser `
                -Name $u `
                -ErrorAction SilentlyContinue
            )
          ) {

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires
          }
          else {

            Set-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

            Enable-LocalUser `
              -Name $u
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $u `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $u `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Out-Null

          Write-Host "RDP ready."


      - name: Create user profile directories
        run: |
          $ErrorActionPreference = "Stop"

          $root =
            "C:\Users\$env:RDP_USER"

          $paths = @(
            $root
            "$root\Desktop"
            "$root\Documents"
            "$root\Downloads"
            "$root\Pictures"
            "$root\Videos"
            "$root\Music"
            "$root\Favorites"
            "$root\Links"
            "$root\Saved Games"
            "$root\Searches"
            "$root\Contacts"
            "$root\AppData"
            "$root\AppData\Local"
            "$root\AppData\LocalLow"
            "$root\AppData\Roaming"
            "$root\AppData\Roaming\Adobe"
            "$root\AppData\Roaming\Adobe\After Effects"
            "$root\AppData\Roaming\Adobe\After Effects\Auto-Save"
            "$root\AppData\Roaming\Adobe\After Effects\Presets"
            "$root\AppData\Roaming\Adobe\After Effects\Scripts"
            "$root\AppData\Roaming\Adobe\After Effects\Plug-ins"
            "$root\AppData\Local\Adobe"
            "$root\AppData\Local\Adobe\After Effects"
            "$root\AppData\Local\Adobe\After Effects\Auto-Save"
            "$root\AppData\Local\Adobe\After Effects\Cache"
            "$root\Projects"
            "$root\Projects\AE"
            "$root\Assets"
            "$root\Assets\Fonts"
            "$root\Assets\Plugins"
          )

          foreach ($path in $paths) {
            New-Item `
              -ItemType Directory `
              -Path $path `
              -Force |
              Out-Null
          }


      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            --force-reinstall `
            pyautogui `
            pynput `
            pillow

          python -c `
            "import pyautogui,pynput,PIL; print('Python libraries OK')"


      - name: Install rclone and WinFsp
        run: |
          $ErrorActionPreference = "Stop"

          $rcloneDir =
            "C:\Tools\rclone"

          $rclone =
            "$rcloneDir\rclone.exe"

          New-Item `
            -ItemType Directory `
            -Path $rcloneDir `
            -Force |
            Out-Null

          if (-not (Test-Path $rclone)) {

            $zip =
              "$env:TEMP\rclone.zip"

            $extract =
              "$env:TEMP\rclone_extract"

            Invoke-WebRequest `
              -Uri `
              "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
              -OutFile `
              $zip `
              -UseBasicParsing `
              -ErrorAction Stop

            Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force

            $found =
              Get-ChildItem `
                $extract `
                -Recurse `
                -Filter "rclone.exe" |
              Select-Object -First 1

            if (-not $found) {
              throw "rclone.exe was not found."
            }

            Copy-Item `
              $found.FullName `
              $rclone `
              -Force

            Remove-Item `
              $zip `
              -Force `
              -ErrorAction SilentlyContinue

            Remove-Item `
              $extract `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          & $rclone version

          $winfspPath =
            "C:\Program Files (x86)\WinFsp"

          if (-not (Test-Path $winfspPath)) {

            $msi =
              "$env:TEMP\winfsp.msi"

            Invoke-WebRequest `
              -Uri `
              "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" `
              -OutFile `
              $msi `
              -UseBasicParsing `
              -ErrorAction Stop

            $proc =
              Start-Process `
                msiexec.exe `
                -ArgumentList `
                "/i",`
                "`"$msi`"",`
                "/quiet",`
                "/norestart" `
                -Wait `
                -PassThru

            if ($proc.ExitCode -ne 0) {
              throw "WinFsp installation failed: $($proc.ExitCode)"
            }

            Remove-Item `
              $msi `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $winfspPath)) {
            throw "WinFsp verification failed."
          }

          "RCLONE_EXE=$rclone" |
            Out-File `
              -Append `
              $env:GITHUB_ENV


      - name: Prepare Google Drive configuration
        shell: pwsh
        env:
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          DRIVE_TOKEN1: ${{ secrets.DRIVE_TOKEN1 }}
          DRIVE_TOKEN2: ${{ secrets.DRIVE_TOKEN2 }}
          DRIVE_TOKEN3: ${{ secrets.DRIVE_TOKEN3 }}
          DRIVE_TOKEN4: ${{ secrets.DRIVE_TOKEN4 }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone =
            "$env:RCLONE_EXE"

          $configDir =
            "C:\ProgramData\Persistent-RDP\rclone"

          New-Item `
            -ItemType Directory `
            -Path $configDir `
            -Force |
            Out-Null

          $items = @(
            @{ Secret = "DRIVE_TOKEN"; Token = $env:DRIVE_TOKEN; Name = "gdrive_g" }
            @{ Secret = "DRIVE_TOKEN1"; Token = $env:DRIVE_TOKEN1; Name = "gdrive_h" }
            @{ Secret = "DRIVE_TOKEN2"; Token = $env:DRIVE_TOKEN2; Name = "gdrive_i" }
            @{ Secret = "DRIVE_TOKEN3"; Token = $env:DRIVE_TOKEN3; Name = "gdrive_j" }
            @{ Secret = "DRIVE_TOKEN4"; Token = $env:DRIVE_TOKEN4; Name = "gdrive_k" }
          )

          foreach ($item in $items) {

            if ([string]::IsNullOrWhiteSpace($item.Token)) {
              throw "$($item.Secret) is missing."
            }

            $obj =
              $item.Token.Trim() |
              ConvertFrom-Json

            if (-not $obj.access_token) {
              throw "$($item.Secret) has no access_token."
            }

            $token =
              $obj |
              ConvertTo-Json -Compress

            $config =
              "$configDir\$($item.Name).conf"

            @(
              "[$($item.Name)]"
              "type = drive"
              "scope = drive"
              "token = $token"
            ) |
              Set-Content `
                -Path $config `
                -Encoding UTF8
          }

          "RCLONE_CONFIG_DIR=$configDir" |
            Out-File `
              -Append `
              $env:GITHUB_ENV


      - name: Prepare D persistent storage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rclone = "$env:RCLONE_EXE"
          $config = "$env:RCLONE_CONFIG_DIR\gdrive_g.conf"
          $dRoot = "D:\Persistent-RDP"
          $remote = "gdrive_g:.persistent-rdp/D-storage"

          New-Item -ItemType Directory -Path $dRoot -Force | Out-Null
          Write-Host "Restoring D storage with optimized speed..."

          & $rclone --config $config copy $remote $dRoot `
            --transfers 8 `
            --checkers 16 `
            --drive-chunk-size 64M `
            --buffer-size 128M `
            --timeout 120s `
            --stats 5s

          "D_PERSIST_DIR=$dRoot" | Out-File -Append $env:GITHUB_ENV


      - name: Restore persistent C files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_EXE"
          $config = "$env:RCLONE_CONFIG_DIR\gdrive_g.conf"
          $userProfile = "C:\Users\$env:RDP_USER"
          $remote = "gdrive_g:.persistent-rdp/C-storage"

          Write-Host "Restoring User Profile persistent C files..."

          & $rclone --config $config copy "$remote/UserProfile" $userProfile `
            --transfers 8 `
            --checkers 16 `
            --drive-chunk-size 64M `
            --buffer-size 128M `
            --timeout 120s `
            --stats 5s

          Write-Host "C restore finished."


      - name: Restore Drive files to local folders
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $rclone = "$env:RCLONE_EXE"
          $configDir = "$env:RCLONE_CONFIG_DIR"

          $drives = @(
            @{ Name = "gdrive_g"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-G" }
            @{ Name = "gdrive_h"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-H" }
            @{ Name = "gdrive_i"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-I" }
            @{ Name = "gdrive_j"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-J" }
            @{ Name = "gdrive_k"; Letter = "C:\Users\$env:RDP_USER\Documents\Drive-K" }
          )

          foreach ($d in $drives) {
            New-Item -ItemType Directory -Path $d.Letter -Force | Out-Null
            $conf = "$configDir\$($d.Name).conf"

            if (Test-Path $conf) {
              $check = & $rclone --config $conf lsf "$($d.Name):.persistent-rdp/files" 2>&1
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Restoring $($d.Name)..."
                & $rclone --config $conf copy "$($d.Name):.persistent-rdp/files" "$($d.Letter)" --transfers 8 --timeout 120s
              } else {
                Write-Host "No files found on $($d.Name), skipping."
              }
            }
          }
          exit 0


      - name: Record C session start
        shell: pwsh
        run: |
          $start = (Get-Date).ToUniversalTime()
          "C_SESSION_START=$($start.ToString('o'))" | Out-File -Append $env:GITHUB_ENV


      - name: Create C persistence sync script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $persistDir = "C:\ProgramData\Persistent-RDP"
          $script = "$persistDir\Sync-C-NewFiles.ps1"

          $content = @'
          $ErrorActionPreference = "Continue"
          $rclone = "C:\Tools\rclone\rclone.exe"
          $config = "C:\ProgramData\Persistent-RDP\rclone\gdrive_g.conf"
          $userProfile = "C:\Users\Yousif190"
          $remote = "gdrive_g:.persistent-rdp/C-storage/UserProfile"

          if ((Test-Path $rclone) -and (Test-Path $config) -and (Test-Path $userProfile)) {
              Write-Host "Syncing User Profile changes to Google Drive..."
              & $rclone --config $config copy $userProfile $remote `
                --transfers 8 `
                --checkers 16 `
                --drive-chunk-size 64M `
                --buffer-size 128M `
                --exclude "/AppData/Local/Temp/**" `
                --exclude "/AppData/Local/Microsoft/**" `
                --exclude "/AppData/Local/Google/**" `
                --timeout 120s
          }
          '@

          Set-Content -Path $script -Value $content -Encoding UTF8 -Force


      - name: Create D persistent sync script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = "C:\ProgramData\Persistent-RDP\Sync-D.ps1"

          $content = @'
          $ErrorActionPreference = "Continue"
          $rclone = "C:\Tools\rclone\rclone.exe"
          $config = "C:\ProgramData\Persistent-RDP\rclone\gdrive_g.conf"
          $dRoot = "D:\Persistent-RDP"
          $remote = "gdrive_g:.persistent-rdp/D-storage"

          if ((Test-Path $rclone) -and (Test-Path $config) -and (Test-Path $dRoot)) {
              Write-Host "Syncing D:\Persistent-RDP..."
              & $rclone --config $config copy $dRoot $remote `
                --transfers 8 `
                --checkers 16 `
                --drive-chunk-size 64M `
                --buffer-size 128M `
                --timeout 120s
          }
          '@

          Set-Content -Path $script -Value $content -Encoding UTF8 -Force


      - name: Create combined persistence sync script
        shell: pwsh
        run: |
          $script = "C:\ProgramData\Persistent-RDP\Sync-All.ps1"
          $content = @'
          & "C:\ProgramData\Persistent-RDP\Sync-C-NewFiles.ps1"
          & "C:\ProgramData\Persistent-RDP\Sync-D.ps1"
          '@
          Set-Content -Path $script -Value $content -Encoding UTF8 -Force


      - name: Install persistent background sync
        shell: pwsh
        run: |
          $taskName = "Persistent-RDP-Periodic-Sync"
          $script = "C:\ProgramData\Persistent-RDP\Sync-All.ps1"

          Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue

          $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$script`""
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(3) -RepetitionInterval (New-TimeSpan -Minutes 5) -RepetitionDuration (New-TimeSpan -Days 1)
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit ([TimeSpan]::Zero)

          Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Settings $settings -RunLevel Highest -Force | Out-Null


      - name: Install RustDesk
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            $installer = "$env:TEMP\rustdesk.msi"
            Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi" -OutFile $installer -UseBasicParsing -ErrorAction Stop
            Start-Process msiexec.exe -ArgumentList "/i","`"$installer`"","/quiet","/norestart" -Wait
            Remove-Item $installer -Force -ErrorAction SilentlyContinue
          }


      - name: Open RustDesk ports
        run: |
          for ($p = 21115; $p -le 21119; $p++) {
            netsh advfirewall firewall delete rule name="APP-PORT-TCP-$p" 2>$null
            netsh advfirewall firewall add rule name="APP-PORT-TCP-$p" dir=in action=allow protocol=TCP localport=$p
          }
          netsh advfirewall firewall delete rule name="APP-PORT-UDP-21116" 2>$null
          netsh advfirewall firewall add rule name="APP-PORT-UDP-21116" dir=in action=allow protocol=UDP localport=21116


      - name: Launch RustDesk
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (Test-Path $rdExe) {
            Start-Process -FilePath $rdExe -ErrorAction SilentlyContinue
          }


      - name: Keep alive with Safe Early Sync
        run: |
          $mins = [int]"${{ env.RUNTIME_MINUTES }}"
          $end = (Get-Date).AddMinutes($mins)
          $syncScript = "C:\ProgramData\Persistent-RDP\Sync-All.ps1"
          $earlySyncTriggered = $false

          while ((Get-Date) -lt $end) {
            $remaining = ($end - (Get-Date)).TotalMinutes
            if (-not $earlySyncTriggered -and $remaining -le 5) {
              if (Test-Path $syncScript) {
                & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $syncScript
              }
              $earlySyncTriggered = $true
            }
            Start-Sleep -Seconds 60
          }


      - name: Final C and D persistence sync
        if: always()
        shell: pwsh
        run: |
          $cScript = "C:\ProgramData\Persistent-RDP\Sync-C-NewFiles.ps1"
          $dScript = "C:\ProgramData\Persistent-RDP\Sync-D.ps1"
          if (Test-Path $cScript) { & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $cScript }
          if (Test-Path $dScript) { & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $dScript }


      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cycles = [int]"${{ inputs.cycles }}"
          if ($cycles -le 0) { exit 0 }
          $next = $cycles - 1

          if ($next -le 0) {
            $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            $payload = @{ ts_tailnet = "${{ inputs.ts_tailnet }}"; ts_api_key = "${{ inputs.ts_api_key }}"; base_prefix = "bullet"; max_count = "10"; dry_run = "false" }
            $body = @{ ref = "${{ github.ref_name }}"; inputs = $payload } | ConvertTo-Json -Depth 20
            Invoke-RestMethod -Method POST -Uri $url -Headers $headers -ContentType "application/json" -Body $body
          } else {
            $payload = @{
              ts_tailnet = "${{ inputs.ts_tailnet }}"
              ts_api_key = "${{ inputs.ts_api_key }}"
              ts_authkey = "${{ inputs.ts_authkey }}"
              quick_test = "${{ inputs.quick_test }}"
              runtime_minutes = "300"
              do_purge = "true"
              cycles = "$next"
              rdp_count = "${{ inputs.rdp_count }}"
              crd_code = "${{ inputs.crd_code }}"
              crd_pin = "${{ inputs.crd_pin }}"
            }
            $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-A.yml/dispatches"
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            $body = @{ ref = "${{ github.ref_name }}"; inputs = $payload } | ConvertTo-Json -Depth 20
            Invoke-RestMethod -Method POST -Uri $url -Headers $headers -ContentType "application/json" -Body $body
          }
