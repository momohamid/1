      # --------------------------------------------------------
      # INITIAL PERSISTENT SYNC
      # --------------------------------------------------------

      - name: Initial Persistent Sync
        shell: pwsh

        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_B64: ${{ secrets.TELEGRAM_SESSION }}

        run: |

          if ([string]::IsNullOrWhiteSpace($env:API_ID)) {
            throw "TELEGRAM_API_ID secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:API_HASH)) {
            throw "TELEGRAM_API_HASH secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:SESSION_B64)) {
            throw "TELEGRAM_SESSION secret is missing."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "INITIAL PERSISTENT SYNC"
          Write-Host "=========================================="

          python `
            "D:\Persistent-RDP\_sync\sync.py"


      # --------------------------------------------------------
      # TEST LOCAL STORAGE
      # --------------------------------------------------------

      - name: Test local storage
        shell: pwsh
        run: |

          $root =
            "D:\Persistent-RDP"

          $testDir =
            "$root\Persistent-RDP-Test"

          New-Item `
            -ItemType Directory `
            -Path $testDir `
            -Force |
            Out-Null

          $testFile =
            "$testDir\runner-test.txt"

          Set-Content `
            -Path $testFile `
            -Value `
              "Persistent-RDP test $(Get-Date -Format o)" `
            -Encoding UTF8

          if (-not (Test-Path $testFile)) {

            throw `
              "LOCAL STORAGE WRITE TEST FAILED."

          }

          $content =
            Get-Content `
              -Path $testFile `
              -Raw

          Write-Host `
            "LOCAL STORAGE WRITE SUCCESS"

          Write-Host `
            "LOCAL STORAGE READ SUCCESS"

          Write-Host `
            "TEST CONTENT: $content"


      # --------------------------------------------------------
      # DISPLAY STORAGE STATUS
      # --------------------------------------------------------

      - name: Display storage status
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PERSISTENT-RDP LOCAL STORAGE"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Drive: D:"
          Write-Host "Path: D:\Persistent-RDP"

          Get-Volume `
            -DriveLetter D |
            Format-List `
              DriveLetter,
              FileSystem,
              Size,
              SizeRemaining

          if (Test-Path "D:\Persistent-RDP") {

            Write-Host `
              "D:\Persistent-RDP READY"

          }
          else {

            throw `
              "D:\Persistent-RDP missing."

          }

          Write-Host ""
          Write-Host "Storage tree:"

          Get-ChildItem `
            "D:\Persistent-RDP" `
            -Recurse `
            -Force |
            Select-Object `
              FullName,
              Length,
              LastWriteTime


      # --------------------------------------------------------
      # RUSTDESK
      # --------------------------------------------------------

      - name: Install RustDesk
        shell: pwsh
        run: |

          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rdExe)) {

            $rdUrl =
              "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"

            $installerPath =
              "$env:TEMP\rustdesk.msi"

            Invoke-WebRequest `
              -Uri $rdUrl `
              -OutFile $installerPath

            Start-Process `
              msiexec.exe `
              -ArgumentList `
                "/i",
                "`"$installerPath`"",
                "/quiet",
                "/norestart" `
              -Wait

            Remove-Item `
              $installerPath `
              -Force

          }


      # --------------------------------------------------------
      # RUSTDESK PORTS
      # --------------------------------------------------------

      - name: Open RustDesk ports
        shell: pwsh
        run: |

          for ($p = 21115; $p -le 21119; $p++) {

            $name =
              "APP-PORT-TCP-$p"

            netsh advfirewall firewall delete rule `
              name=$name 2>$null

            netsh advfirewall firewall add rule `
              name=$name `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$p

          }


      # --------------------------------------------------------
      # LAUNCH RUSTDESK
      # --------------------------------------------------------

      - name: Launch RustDesk
        shell: pwsh
        run: |

          $rdExe =
            "C:\Program Files\RustDesk\rustdesk.exe"

          if (Test-Path $rdExe) {

            Start-Process `
              -FilePath $rdExe `
              -ErrorAction SilentlyContinue

            Start-Sleep `
              -Seconds 5

          }


      # --------------------------------------------------------
      # KEEP ALIVE
      # --------------------------------------------------------

      - name: Keep alive
        shell: pwsh
        run: |

          $mins =
            [int]"${{ env.RUNTIME_MINUTES }}"

          $end =
            (Get-Date).AddMinutes($mins)

          while (
            (Get-Date) -lt $end
          ) {

            Write-Host (
              "Heartbeat " +
              (Get-Date).ToString("HH:mm:ss")
            )

            Start-Sleep `
              -Seconds 60

          }


      # --------------------------------------------------------
      # STOP / NEXT
      # --------------------------------------------------------

      - name: Dispatch next or stop
        if: always()
        shell: pwsh

        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          $cycles = 0

          if ("${{ inputs.cycles }}" -match '^\d+$') {

            $cycles =
              [int]"${{ inputs.cycles }}"

          }

          if ($cycles -gt 0) {

            $next =
              $cycles - 1

            Write-Host `
              "Next cycle: $next"

          }
          else {

            Write-Host `
              "No cycles configured. Done."

          }
