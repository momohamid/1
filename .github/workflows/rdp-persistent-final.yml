        --exclude "AppData/**"
}

Start-Process `
    powershell.exe `
    -ArgumentList `
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "`"`$mountScript`"" `
    -WindowStyle Hidden

Start-Sleep -Seconds 8

Start-Process `
    powershell.exe `
    -ArgumentList `
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "`"`$monitorScript`"" `
    -WindowStyle Hidden

Write-Host "Persistent-RDP logon initialization completed."
"@ |
              Set-Content `
                  -Path $restoreScript `
                  -Encoding UTF8


          # ----------------------------------------------------
          # SCHEDULED TASK
          # ----------------------------------------------------

          Unregister-ScheduledTask `
              -TaskName "Persistent-RDP-Logon" `
              -Confirm:$false `
              -ErrorAction SilentlyContinue

          $action =
              New-ScheduledTaskAction `
                  -Execute "powershell.exe" `
                  -Argument `
                  "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$restoreScript`""

          $trigger =
              New-ScheduledTaskTrigger `
                  -AtLogOn `
                  -User $user

          $principal =
              New-ScheduledTaskPrincipal `
                  -UserId $user `
                  -LogonType Password `
                  -RunLevel Limited

          $settings =
              New-ScheduledTaskSettingsSet `
                  -AllowStartIfOnBatteries `
                  -DontStopIfGoingOnBatteries `
                  -ExecutionTimeLimit ([TimeSpan]::Zero)

          Register-ScheduledTask `
              -TaskName "Persistent-RDP-Logon" `
              -Action $action `
              -Trigger $trigger `
              -Principal $principal `
              -Settings $settings `
              -Password $pass `
              -Force |
              Out-Null

          Write-Host "=========================================="
          Write-Host "PERSISTENCE INSTALLED"
          Write-Host "=========================================="
          Write-Host "User: $user"
          Write-Host "Drive: G:"
          Write-Host "Restore: at RDP login"
          Write-Host "Monitor: at RDP login"
          Write-Host "Scope: C:\Users\$user except AppData"
          Write-Host "=========================================="


      # ========================================================
      # VERIFY PERSISTENCE
      # ========================================================

      - name: Verify persistence setup
        run: |

          $task =
              Get-ScheduledTask `
                  -TaskName "Persistent-RDP-Logon" `
                  -ErrorAction SilentlyContinue

          if (-not $task) {

              throw `
                  "Persistent-RDP-Logon task was not created."

          }

          if (-not (Test-Path "C:\Tools\rclone\rclone.exe")) {
              throw "rclone missing."
          }

          if (-not (Test-Path "C:\Program Files (x86)\WinFsp")) {
              throw "WinFsp missing."
          }

          if (-not (Test-Path "C:\ProgramData\Persistent-RDP\Restore-PersistentFiles.ps1")) {
              throw "Restore script missing."
          }

          Write-Host "Persistent-RDP task exists."
          Write-Host "rclone OK."
          Write-Host "WinFsp OK."
          Write-Host "Restore script OK."


      # ========================================================
      # RUSTDESK
      # ========================================================

      - name: Install RustDesk
        run: |

          $rdExe =
              "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rdExe)) {

              $rdUrl =
                  "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"

              $installerPath =
                  "$env:TEMP\rustdesk.msi"

              Invoke-WebRequest `
                  -Uri $rdUrl `
                  -OutFile $installerPath `
                  -UseBasicParsing `
                  -ErrorAction Stop

              Start-Process `
                  msiexec.exe `
                  -ArgumentList `
                  "/i",
                  "`"$installerPath`"",
                  "/quiet",
                  "/norestart" `
                  -Wait

              Remove-Item `
                  $installerPath `
                  -Force `
                  -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $rdExe)) {
              throw "RustDesk installation failed."
          }


      # ========================================================
      # RUSTDESK PORTS
      # ========================================================

      - name: Open RustDesk ports
        run: |

          for ($p = 21115; $p -le 21119; $p++) {

              $name =
                  "APP-PORT-TCP-$p"

              netsh advfirewall firewall delete rule `
                  name=$name `
                  2>$null

              netsh advfirewall firewall add rule `
                  name=$name `
                  dir=in `
                  action=allow `
                  protocol=TCP `
                  localport=$p
          }

          $udpName =
              "APP-PORT-UDP-21116"

          netsh advfirewall firewall delete rule `
              name=$udpName `
              2>$null

          netsh advfirewall firewall add rule `
              name=$udpName `
              dir=in `
              action=allow `
              protocol=UDP `
              localport=21116


      # ========================================================
      # RUSTDESK + SCREENSHOT
      # ========================================================

      - name: Launch RustDesk + Screenshot
        run: |

          $rdExe =
              "C:\Program Files\RustDesk\rustdesk.exe"

          Start-Process `
              -FilePath $rdExe `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          $screenshotPath =
              "$env:TEMP\rustdesk_${{ matrix.id }}.png"

          Add-Type `
              -AssemblyName `
              System.Windows.Forms

          Add-Type `
              -AssemblyName `
              System.Drawing

          $bounds =
              [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          $bitmap =
              New-Object `
                  System.Drawing.Bitmap `
                  $bounds.Width,
                  $bounds.Height

          $graphics =
              [System.Drawing.Graphics]::FromImage(
                  $bitmap
              )

          $graphics.CopyFromScreen(
              $bounds.Location,
              [System.Drawing.Point]::Empty,
              $bounds.Size
          )

          $bitmap.Save(
              $screenshotPath,
              [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          try {

              $curlResult =
                  curl `
                      -F "file=@$screenshotPath" `
                      https://store1.gofile.io/uploadFile

              $json =
                  $curlResult |
                  ConvertFrom-Json

              if ($json.status -eq "ok") {

                  "SCREENSHOT_URL=$($json.data.downloadPage)" |
                      Out-File `
                          -Append `
                          $env:GITHUB_ENV

                  Write-Host `
                      "Screenshot uploaded."

              }
              else {

                  Write-Warning `
                      "Screenshot upload returned non-ok status."

              }

          }
          catch {

              Write-Warning `
                  "Screenshot upload failed: $($_.Exception.Message)"

          }


      # ========================================================
      # STORAGE STATUS
      # ========================================================

      - name: Display Google Drive persistence status
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PERSISTENT-RDP STORAGE"
          Write-Host "=========================================="
          Write-Host "Drive: G:"
          Write-Host "Backend: Google Drive + rclone + WinFsp"
          Write-Host "Remote: .persistent-rdp/files"
          Write-Host "Profile: C:\Users\$env:RDP_USER"
          Write-Host "Restore: RDP user logon"
          Write-Host "Monitor: RDP user logon"
          Write-Host "Excluded: AppData"
          Write-Host "=========================================="


      # ========================================================
      # KEEP ALIVE
      # ========================================================

      - name: Keep alive
        run: |

          $mins =
              [int]"${{ env.RUNTIME_MINUTES }}"

          $end =
              (Get-Date).AddMinutes($mins)

          while ((Get-Date) -lt $end) {

              if ("$env:CRD_ENABLED" -eq "1") {

                  $mode =
                      "[CRD+RustDesk/RDP+Persistence]"

              }
              else {

                  $mode =
                      "[RustDesk/RDP+Persistence]"

              }

              Write-Host (
                  "$mode Heartbeat " +
                  (Get-Date).ToString("HH:mm:ss") +
                  " ends at " +
                  $end.ToString("HH:mm:ss") +
                  " | Persistent Drive: G:"
              )

              Start-Sleep -Seconds 60
          }


      # ========================================================
      # FINAL SAFETY SYNC
      # ========================================================

      - name: Final Google Drive sync
        if: always()
        run: |

          $rclone =
              "$env:RCLONE_EXE"

          $config =
              "$env:RCLONE_CONFIG"

          if (
              (Test-Path $rclone) -and
              (Test-Path $config)
          ) {

              Write-Host "Final persistence sync starting..."

              $userRoot =
                  "$env:RDP_PROFILE"

              if (
                  [string]::IsNullOrWhiteSpace($userRoot) -or
                  -not (Test-Path $userRoot)
              ) {

                  $userRoot =
                      "C:\Users\$env:RDP_USER"

              }

              if (Test-Path $userRoot) {

                  & $rclone `
                      --config $config `
                      copy `
                      $userRoot `
                      "gdrive:.persistent-rdp/files" `
                      --create-empty-src-dirs `
                      --timeout 300s `
                      --retries 3 `
                      --low-level-retries 10 `
                      --exclude "AppData/**"

                  if ($LASTEXITCODE -eq 0) {

                      Write-Host `
                          "Final persistence sync completed."

                  }
                  else {

                      Write-Warning `
                          "Final sync exit code: $LASTEXITCODE"

                  }

              }
              else {

                  Write-Warning `
                      "User profile does not exist. Skipping final sync."

              }

          }
          else {

              Write-Host `
                  "rclone/config unavailable; skipping final sync."

          }


      # ========================================================
      # AUTO RENEW / STOP
      # ========================================================

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          $ErrorActionPreference = "Stop"

          $cyclesText =
              "${{ inputs.cycles }}"

          if ([string]::IsNullOrWhiteSpace($cyclesText)) {
              $cyclesText = "9999"
          }

          if ($cyclesText -match '^\d+$') {
              $cycles = [int]$cyclesText
          }
          else {
              $cycles = 9999
          }

          if ($cycles -le 0) {

              Write-Host "No cycles remaining. Done."
              exit 0

          }

          $next =
              $cycles - 1


          # ----------------------------------------------------
          # STOP
          # ----------------------------------------------------

          if ($next -le 0) {

              $url =
                  "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"

              $headers = @{
                  Authorization =
                      "Bearer $env:GH_TOKEN"

                  Accept =
                      "application/vnd.github+json"

                  "X-GitHub-Api-Version" =
                      "2022-11-28"
              }

              $payload = @{
                  ts_tailnet =
                      "${{ inputs.ts_tailnet }}"

                  ts_api_key =
                      "${{ inputs.ts_api_key }}"

                  base_prefix =
                      "bullet"

                  max_count =
                      "10"

                  dry_run =
                      "false"
              }

              $body =
                  @{
                      ref =
                          "${{ github.ref_name }}"

                      inputs =
                          $payload

                  } |
                  ConvertTo-Json -Depth 20

              Write-Host "Dispatching STOP workflow..."

              Invoke-RestMethod `
                  -Method POST `
                  -Uri $url `
                  -Headers $headers `
                  -ContentType "application/json" `
                  -Body $body `
                  -ErrorAction Stop

              Write-Host "STOP workflow dispatched successfully."

          }


          # ----------------------------------------------------
          # SELF RENEW
          # ----------------------------------------------------

          else {

              $quick =
                  "${{ inputs.quick_test }}"

              if ([string]::IsNullOrWhiteSpace($quick)) {
                  $quick = "false"
              }

              $rdpCount =
                  "${{ inputs.rdp_count }}"

              if ([string]::IsNullOrWhiteSpace($rdpCount)) {
                  $rdpCount = "1"
              }

              $crdCode = @'
          ${{ inputs.crd_code }}
          '@.Trim()

              $crdPin =
                  "${{ inputs.crd_pin }}"

              if ([string]::IsNullOrWhiteSpace($crdPin)) {
                  $crdPin = "123456"
              }

              $payload = @{
                  ts_tailnet =
                      "${{ inputs.ts_tailnet }}"

                  ts_api_key =
                      "${{ inputs.ts_api_key }}"

                  ts_authkey =
                      "${{ inputs.ts_authkey }}"

                  quick_test =
                      $quick

                  runtime_minutes =
                      "300"

                  do_purge =
                      "true"

                  cycles =
                      "$next"

                  rdp_count =
                      $rdpCount

                  crd_code =
                      $crdCode

                  crd_pin =
                      $crdPin
              }

              $url2 =
                  "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-A.yml/dispatches"

              $headers2 = @{
                  Authorization =
                      "Bearer $env:GH_TOKEN"

                  Accept =
                      "application/vnd.github+json"

                  "X-GitHub-Api-Version" =
                      "2022-11-28"
              }

              $body2 =
                  @{
                      ref =
                          "${{ github.ref_name }}"

                      inputs =
                          $payload

                  } |
                  ConvertTo-Json -Depth 20

              Write-Host `
                  "Dispatching Workflow A self-renew..."

              Invoke-RestMethod `
                  -Method POST `
                  -Uri $url2 `
                  -Headers $headers2 `
                  -ContentType "application/json" `
                  -Body $body2 `
                  -ErrorAction Stop

              Write-Host `
                  "Workflow A self-renew dispatched successfully."

          }
